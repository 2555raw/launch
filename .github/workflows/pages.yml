# Publishes ARCHIVE 2011 to GitHub Pages at pandemik.online.
#
# This repository holds several projects; archive-2011/ is the one published.
# The piece is static — no build step, no dependencies, no assets beyond the six
# source files — so the folder is uploaded as it stands. archive-2011/CNAME is
# what tells Pages which domain it is answering on, which also means Pages serves
# it from the root and every relative path in the page resolves.
#
# Pages has to be switched on for the repository first, under
# Settings > Pages > Source: GitHub Actions. The workflow token cannot create
# the site itself.
name: Deploy ARCHIVE 2011 to Pages

on:
  push:
    branches: [claude/modest-lamport-0e2nfg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: archive-2011
      - id: deployment
        uses: actions/deploy-pages@v4
