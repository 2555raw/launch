# Publishes the Payence site to GitHub Pages.
#
# This repository holds several projects; Payence lives in payence/ and is the
# one published. Pages serves a project site from /<repo>, so the export is
# built with that prefix or every asset under _next/ 404s, and .nojekyll is
# needed because Jekyll drops directories starting with an underscore.
name: Deploy Payence to Pages

on:
  push:
    branches: [claude/500capital-custom-colors-s1kac3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payence
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: payence/package-lock.json

      - run: npm ci

      - name: Work out the base path
        id: base
        run: |
          # A custom domain serves the site from the root, so the prefix must be
          # empty; without a domain, Pages serves it from /<repo> and the prefix
          # is required or every asset under _next/ 404s. public/CNAME is what
          # Pages reads to know the domain, so it decides this too.
          if [ -f public/CNAME ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Custom domain: $(cat public/CNAME), building from the root"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "No custom domain, building for /${{ github.event.repository.name }}"
          fi

      - name: Build the static export
        run: npm run build:pages
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - run: touch out/.nojekyll

      # Pages has to be switched on for the repository first, under
      # Settings > Pages > Source: GitHub Actions. Doing it from here with
      # `enablement: true` fails: the workflow token cannot create the site.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: payence/out
      - id: deployment
        uses: actions/deploy-pages@v4
