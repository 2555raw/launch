# Publishes the static site to GitHub Pages.
# Pages can only serve from the repository root or /docs on its own, and the
# site lives in blendify-site, so this workflow uploads that folder instead.
name: Deploy site to Pages

on:
  push:
    branches:
      - claude/blendify-site-structure-0o27v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blendify-site
      - id: deployment
        uses: actions/deploy-pages@v4
