# Publishes Meadow to GitHub Pages, at 2555raw.github.io/launch.
#
# This repository holds several projects and Pages serves one of them; it used
# to carry a mirror of ARCHIVE 2011, whose real home (pandemik.online) is on
# Railway and is unaffected. meadow-site/ is static — the swap runs in the
# visitor's browser and wallet — so the folder is uploaded as it stands. Every
# path in the page is relative, so it works from the /launch/ subpath.
#
# Pages has to be switched on for the repository by hand, under
# Settings > Pages > Source: GitHub Actions. Doing it from here with
# `enablement: true` does not work: the workflow token comes back
# "Create Pages site failed ... Resource not accessible by integration".
name: Deploy Meadow to Pages

on:
  push:
    branches: [claude/festive-hypatia-lrpawm]
    paths: [meadow-site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: meadow-site
      - id: deployment
        uses: actions/deploy-pages@v4
