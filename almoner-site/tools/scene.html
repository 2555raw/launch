<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1600, H = 1000, SS = 2;                       // render at 2x, downsample on save
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(SS); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
camera.position.set(0.6, 0.4, 12.5);

// ---------- backdrop: a soft studio gradient (cream-yellow -> mint -> pale sky) ----------
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false,
  uniforms: {},
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec2 vUv;
    float blob(vec2 p, vec2 c, float r){ return exp(-dot(p-c,p-c)/(r*r)); }
    void main(){
      vec2 p = vUv;
      vec3 base = mix(vec3(.976,.945,.80), vec3(.86,.93,.90), smoothstep(.15,.62,p.x));
      base = mix(base, vec3(.83,.90,.95), smoothstep(.55,1.,p.x));
      base = mix(base, vec3(.99,.86,.38), .75*blob(p, vec2(.14,.2), .36));
      base = mix(base, vec3(1.,.985,.93), .65*blob(p, vec2(.08,.86), .28));
      base = mix(base, vec3(.72,.90,.80), .55*blob(p, vec2(.6,.5), .24));
      base = mix(base, vec3(.98,.96,.84), .45*blob(p, vec2(.52,.18), .2));
      base = mix(base, vec3(.70,.83,.94), .65*blob(p, vec2(.88,.75), .32));
      gl_FragColor = vec4(base,1.);
    }`
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(70, 44), bgMat);
bg.position.z = -10; scene.add(bg);

// ---------- environment for reflections ----------
const pmrem = new THREE.PMREMGenerator(renderer);
// photo-studio environment: pale room plus warm and cool softboxes, so the glass catches crisp highlights
const env = new THREE.Scene();
env.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.MeshBasicMaterial({ color: '#c9d6cf', side: THREE.BackSide })));
const box = (w, h, color, k, pos, look) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(...look); env.add(m); };
box(14, 3, '#fff1c2', 6, [-8, 7, 6], [0, 0, 0]);     // warm key strip, top left
box(3, 16, '#ffffff', 5, [10, 0, 4], [0, 0, 0]);     // tall white strip, right
box(10, 2, '#d6ecff', 4, [4, -8, 7], [0, 0, 0]);     // cool bounce, bottom
box(6, 6, '#fff8e6', 3, [0, 2, 14], [0, 0, 0]);      // soft fill behind camera
scene.environment = pmrem.fromScene(env, 0.02).texture;

// ---------- glass ribbons: thin twisted bands along smooth curves ----------
function ribbon(points, width, twist, segs = 420, thick = 0.035) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'centripetal');
  const frames = curve.computeFrenetFrames(segs, false);
  const pos = [], nor = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, P = curve.getPointAt(t);
    const N = frames.normals[i], B = frames.binormals[i];
    const a = twist(t);
    const dir = N.clone().multiplyScalar(Math.cos(a)).add(B.clone().multiplyScalar(Math.sin(a)));
    const w = width(t);
    const n = new THREE.Vector3().crossVectors(frames.tangents[i], dir).normalize();
    for (const side of [-1, 1]) for (const face of [-1, 1]) {
      const v = P.clone().add(dir.clone().multiplyScalar(side * w)).add(n.clone().multiplyScalar(face * thick));
      pos.push(v.x, v.y, v.z); nor.push(n.x * face, n.y * face, n.z * face);
    }
  }
  for (let i = 0; i < segs; i++) {
    const o = i * 4, q = o + 4;
    idx.push(o, q, o + 2, q, q + 2, o + 2);         // back face
    idx.push(o + 1, o + 3, q + 1, q + 1, o + 3, q + 3); // front face
    idx.push(o, o + 1, q, q, o + 1, q + 1);         // edge -
    idx.push(o + 2, q + 2, o + 3, o + 3, q + 2, q + 3); // edge +
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const glass = (tint, opts = {}) => new THREE.MeshPhysicalMaterial({
  color: tint, transmission: 1, thickness: 0.6, roughness: 0.06, metalness: 0, ior: 1.45,
  iridescence: 0.35, iridescenceIOR: 1.3, clearcoat: 1, clearcoatRoughness: 0.04,
  attenuationColor: new THREE.Color(tint), attenuationDistance: 9, side: THREE.DoubleSide,
  envMapIntensity: 1.0, specularIntensity: 1, transparent: true, opacity: 1, ...opts
});
const rod = (points, r, mat) => {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'centripetal');
  return new THREE.Mesh(new THREE.TubeGeometry(curve, 600, r, 24, false), mat);
};
const ease = t => Math.sin(Math.PI * t);

// big soft sheet sweeping from bottom left up and folding at the right (the wide translucent plane)
scene.add(new THREE.Mesh(ribbon(
  [[-9.5, -9.0, -1.8], [-6.2, -4.2, -1.5], [-3.6, -0.6, -1.2], [-0.6, 1.9, -0.8], [2.4, 1.6, -0.6], [3.9, 0.3, -0.4], [4.6, -2.6, -0.8], [6.5, -4.4, -1.4], [9.5, -7.5, -1.8]],
  t => 0.25 + 1.55 * Math.pow(ease(t), 0.8), t => 0.35 + 1.25 * t, 520, 0.02),
  glass('#f7fbf5', { roughness: 0.55, thickness: 0.6, iridescence: 0.1, opacity: 0.38, envMapIntensity: 0.6 })));

// thin upper edge: a glass rod rising from lower left, arcing over the top and dropping on the right
const upper = [[-7.0, -9.0, 0.0], [-5.3, -4.6, 0.2], [-3.4, -0.4, 0.4], [-1.2, 2.55, 0.6], [1.7, 2.75, 0.5], [3.6, 1.6, 0.4], [4.25, -0.6, 0.3], [4.2, -2.6, 0.1], [4.6, -7.5, -0.2]];
scene.add(rod(upper, 0.045, glass('#fff3b0', { roughness: 0.14, thickness: 0.3, iridescence: 0.6, envMapIntensity: 2.2, transmission: 0.85 })));

// lower wave: crosses the edge, flattens across the middle and twists into a fold on the right
scene.add(new THREE.Mesh(ribbon(
  [[-10.0, -7.5, 0.8], [-6.4, -3.9, 0.9], [-3.9, -1.0, 1.0], [-1.3, 0.75, 1.1], [1.2, 0.85, 1.1], [2.8, 0.25, 1.0], [3.7, -0.35, 0.9], [4.55, 0.4, 0.8], [4.75, 2.1, 0.6], [4.2, 6.5, 0.3]],
  t => 0.04 + 0.2 * Math.pow(ease(Math.min(1, t * 1.15)), 2.2), t => 1.3 + 2.6 * Math.pow(t, 2.2)),
  glass('#e3f5ea', { iridescence: 0.6, opacity: 0.7 })));
scene.add(rod([[-10.0, -7.5, 0.8], [-6.4, -3.9, 0.9], [-3.9, -1.0, 1.0], [-1.3, 0.75, 1.1], [1.2, 0.85, 1.1], [2.8, 0.25, 1.0], [3.7, -0.35, 0.9], [4.55, 0.4, 0.8], [4.75, 2.1, 0.6], [4.2, 6.5, 0.3]], 0.03, glass('#dff5e8', { roughness: 0.14, thickness: 0.3, iridescence: 0.7, envMapIntensity: 2.2, transmission: 0.85 })));

// faint second sheet in the far upper right
scene.add(new THREE.Mesh(ribbon(
  [[0.2, 8.0, -2.8], [1.5, 4.4, -2.5], [3.2, 2.4, -2.2], [4.9, 0.4, -2.0], [5.6, -2.6, -2.2], [7.4, -4.5, -2.6], [10.5, -7.5, -3.0]],
  t => 0.4 + 1.1 * ease(t), t => 0.9 + 0.5 * t, 360, 0.02),
  glass('#f1f7fc', { roughness: 0.55, thickness: 0.6, opacity: 0.32, envMapIntensity: 0.6 })));

// soft studio lights: warm key from the left, cool rim from the right
const key = new THREE.DirectionalLight('#fff3c4', 5.5); key.position.set(-3, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight('#cfe6ff', 4.5); rim.position.set(7, 3, 5); scene.add(rim);
scene.add(new THREE.HemisphereLight('#fffbe8', '#cfe3ea', 0.6));

renderer.render(scene, camera);
renderer.render(scene, camera);
window.__done = true;
</script>
</body></html>
