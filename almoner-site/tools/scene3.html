<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
// Glossy folded sheets with glowing rims, in the Corody palette:
// violet #49345f, petrol #31688E, green #35B779, yellow #FDE725.
const W = 2560, H = 1600;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);
camera.position.set(0, 0, 14);

// backdrop: deep violet top-left, petrol to the right, a green glow low in the middle
const bg = new THREE.Mesh(new THREE.PlaneGeometry(60, 38), new THREE.ShaderMaterial({
  depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec2 vUv;
    float b(vec2 p, vec2 c, float r){ return exp(-dot(p-c,p-c)/(r*r)); }
    void main(){ vec2 p = vUv;
      vec3 c = mix(vec3(.985,.95,.74), vec3(.86,.94,.88), smoothstep(.1,.55,p.x));
      c = mix(c, vec3(.78,.88,.93), smoothstep(.5,1.,p.x));
      c = mix(c, vec3(1.,.92,.36), .6*b(p, vec2(.1,.2), .3));
      c = mix(c, vec3(1.,1.,.97), .6*b(p, vec2(.3,.85), .25));
      c = mix(c, vec3(.70,.88,.80), .45*b(p, vec2(.55,.3), .22));
      gl_FragColor = vec4(c,1.); }`
}));
bg.position.z = -12; scene.add(bg);

// glossy sheet shader: two-tone body by height, diffuse + sharp specular + glowing fresnel rim
const sheet = (top, bottom, rim, rimPow = 3.0, rimGain = 1.4) => new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms: { rad: { value: 6 }, cTop: { value: new THREE.Color(top) }, cBot: { value: new THREE.Color(bottom) }, cRim: { value: new THREE.Color(rim) }, rp: { value: rimPow }, rg: { value: rimGain } },
  vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vW; varying vec2 vL;
    void main(){ vL = position.xy; vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 cTop, cBot, cRim; uniform float rp, rg, rad; varying vec3 vN; varying vec3 vV; varying vec3 vW; varying vec2 vL;
    void main(){
      vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N; vec3 V = normalize(vV);
      vec3 L = normalize(vec3(-.45,.75,.55)), L2 = normalize(vec3(.7,.2,.6));
      float h = clamp((vW.y + 9.) / 13., 0., 1.); float hx = clamp((vW.x + 10.) / 20., 0., 1.);
      vec3 body = mix(cBot, cTop, pow(h, .8)); body = mix(body, body * vec3(1.03, 1.02, .97), .3 * (1. - hx));
      float d = .78 + .3 * max(dot(N,L),0.);
      float rr = clamp(length(vL) / rad, 0., 1.);
      body *= mix(.74, 1.06, smoothstep(.1, .98, rr));          // volume: deep centre, luminous toward the edge
      vec3 col = body * d + body * .25 * max(dot(N,L2),0.);
      col += cRim * smoothstep(.82, 1., rr) * .35;
      float s1 = pow(max(dot(reflect(-L,N),V),0.), 18.), s2 = pow(max(dot(reflect(-L2,N),V),0.), 12.);
      col += vec3(1.,.98,.92) * s1 * .35 + cRim * s2 * .18;
      float f = pow(1. - max(dot(N,V),0.), rp);
      col += cRim * pow(1. - max(dot(N,V),0.), 1.8) * .28;
      col = mix(col, cRim * 1.25, clamp(f * rg, 0., 1.));
      gl_FragColor = vec4(col, 1.);
    }`
});

// thick rounded slab: an extruded disc with a deep bevel; the bevel turns edge-on and glows
const slab = (r, mat, pos, rot, scale = [1, 1, 1]) => {
  const shape = new THREE.Shape(); shape.absarc(0, 0, r, 0, Math.PI * 2, false);
  const g = new THREE.ExtrudeGeometry(shape, { depth: 0.15, bevelEnabled: true, bevelThickness: 0.55, bevelSize: 0.5, bevelSegments: 24, curveSegments: 220 });
  g.center(); g.computeVertexNormals();
  mat.uniforms.rad.value = r + 0.5;
  const m = new THREE.Mesh(g, mat); m.position.set(...pos); m.rotation.set(...rot); m.scale.set(...scale); scene.add(m); return m;
};
// back: big violet slab across the top
slab(9.5, sheet('#e4eff6', '#b4cfe0', '#ffffff', 5.0, 1.7), [-3.5, 9.6, -7], [.35, -.15, 0], [1.25, 1, 1]);
// left: violet fold entering from the left edge
slab(6.5, sheet('#e1f2df', '#9fd1b2', '#FDE725', 5.0, 1.6), [-12.5, 0.5, -4.5], [0, .55, 0], [1, 1.1, 1]);
// main slab: petrol body with a green rim, its top arc crossing the middle of the frame
slab(6.4, sheet('#e2f5ea', '#a6dcc0', '#FDE725', 5.0, 2.0), [-1.4, -7.25, -1.5], [-.55, .12, .1], [1.35, 1, 1]);
// lower right slab with a yellow-green rim
slab(4.6, sheet('#fff6b8', '#e9d24a', '#ffffff', 5.0, 2.0), [5.4, -8.6, 1.2], [-.5, -.1, -.05], [1.25, 1, 1]);
// small violet fold lower left for depth
slab(3.2, sheet('#d3e6f1', '#93b8d0', '#ffffff', 5.0, 1.6), [-8.2, -7.4, .6], [-.45, .2, .2], [1.2, 1, 1]);

renderer.render(scene, camera);
window.__done = true;
</script>
</body></html>
