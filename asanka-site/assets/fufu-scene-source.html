<script>
  const NS = 'http://www.w3.org/2000/svg';
  let seed = 11;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const add = (id, tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); document.getElementById(id).appendChild(el); };
  // hair texture
  for (let i = 0; i < 260; i++) {
    const x = 620 + rand() * 210, y = 240 + rand() * 110;
    add('hairTex', 'circle', { cx: x, cy: y, r: .8 + rand() * 1.4 });
  }
  // wood grain
  for (let i = 0; i < 26; i++) {
    const y = 660 + i * 13 + rand() * 6, w = 40 + rand() * 30;
    add('grain', 'path', { d: `M0 ${y} C 400 ${y - w / 6} 900 ${y + w / 5} 1600 ${y - 4}` });
  }
  // oil beads on the soup
  for (let i = 0; i < 60; i++) {
    const a = rand() * Math.PI * 2, d = Math.sqrt(rand());
    const x = 820 + Math.cos(a) * 236 * d, y = 806 + Math.sin(a) * 46 * d;
    add('oil', 'ellipse', { cx: x, cy: y, rx: 2 + rand() * 6, ry: 1 + rand() * 2.4, fill: '#FFC36B', opacity: .35 + rand() * .4 });
  }
  // rice grains
  const G = ['#F59A5E', '#EE7440', '#D4491F', '#F8B27A', '#C23D1B'];
  for (let i = 0; i < 520; i++) {
    const a = rand() * Math.PI * 2, d = Math.sqrt(rand());
    const x = 1338 + Math.cos(a) * 140 * d, y = 828 + Math.sin(a) * 50 * d;
    add('grains', 'ellipse', { cx: x, cy: y, rx: 5, ry: 2, fill: G[i % 5], transform: `rotate(${rand() * 180 - 90} ${x} ${y})` });
  }
</script>
