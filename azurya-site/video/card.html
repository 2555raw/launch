<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/fonts.css">
<style>
  /* Title cards for the film, in the site's own type and palette, so the cut
     between a title and the page is not a change of typeface mid-sentence.
     One card per frame, driven by the hash: #kind=word&text=... */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }

  body {
    /* the page's own light theme: a wash of the brand salmon, near-black ink */
    --ground: #ffece6;
    --ink:    #2e1410;
    --muted:  #6b332a;
    --accent: #b4442f;
    background: var(--ground);
    color: var(--ink);
    font-family: "Familjen Grotesk", system-ui, sans-serif;
    display: grid;
    place-items: center;
    text-align: center;
  }

  /* the bookends invert, so the film opens and closes on the night theme */
  body.dark {
    --ground: #17100e;
    --ink:    #ffece6;
    --muted:  #d8a99e;
    --accent: #ff9683;
  }

  .wrap { padding: 0 120px; }

  .word {
    font-size: 88px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.0;
  }

  .word .accent { color: var(--accent); }

  .line {
    font-size: 58px;
    font-weight: 700;
    letter-spacing: -0.032em;
    line-height: 1.08;
    max-width: 19ch;
    margin: 0 auto;
  }

  .kicker {
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 14px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .mark { font-size: 96px; font-weight: 700; letter-spacing: -0.03em; }
  .mark svg { width: 78px; height: 78px; vertical-align: -8px; margin-right: 14px; color: var(--accent); }
  .rule { width: 96px; height: 4px; background: var(--accent); margin: 36px auto 0; }

  .meta {
    margin-top: 40px;
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 18px;
    letter-spacing: 0.08em;
    color: var(--muted);
    line-height: 2;
  }

  .fig {
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 132px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .fig .unit { font-size: 54px; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap" id="wrap"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="mk">
        <path fill-rule="evenodd" d="M22.4 12 C 20.4 7.6 15.4 4.4 10.4 4.4 C 8.4 4.4 6.7 5.0 5.4 6.0 L 1.2 2.4 L 5.2 12 L 1.2 21.6 L 5.4 18.0 C 6.7 19.0 8.4 19.6 10.4 19.6 C 15.4 19.6 20.4 16.4 22.4 12 Z M19.0 10.3 a1.2 1.2 0 1 0 0.01 0 Z"/>
      </g>
    </defs>
  </svg>

<script>
  const q = new URLSearchParams(location.hash.slice(1));
  const kind = q.get('kind') || 'word';
  const text = q.get('text') || '';
  const kicker = q.get('kicker') || '';
  const meta = q.get('meta') || '';
  if (q.get('dark') === '1') document.body.classList.add('dark');

  const mark = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#mk"/></svg>';

  const html = {
    logo:  () => `<div class="mark">${mark}Salmya</div><div class="rule"></div>`,
    word:  () => `${kicker ? `<div class="kicker">${kicker}</div>` : ''}<div class="word">${text}</div>`,
    line:  () => `${kicker ? `<div class="kicker">${kicker}</div>` : ''}<div class="line">${text}</div>`,
    fig:   () => `${kicker ? `<div class="kicker">${kicker}</div>` : ''}<div class="fig">${text}</div>`,
    outro: () => `<div class="mark">${mark}Salmya</div><div class="rule"></div>
      <div class="meta">${meta.replace(/\|/g, '<br>')}</div>`,
  };
  document.getElementById('wrap').innerHTML = (html[kind] || html.word)();
</script>
</body>
</html>
