<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dendra pixel backgrounds</title></head>
<body style="margin:0;background:#000">
<!--
  Paints the site's pixel-art backgrounds: a New York skyline at dusk for the
  hero and the same city by day for the feature panels. Everything is drawn
  pixel by pixel at native resolution and seeded, so it can be regenerated or
  tweaked. render.mjs calls:
    window.paintNight() -> PNG data URL, 640x360
    window.paintDay()   -> PNG data URL, 400x320
  The site scales them up with `image-rendering: pixelated`.
-->
<script>
'use strict';

/* ---------- basics ---------- */

function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function valueNoise(seed) {
  const r = rng(seed), T = new Float32Array(256 * 256);
  for (let i = 0; i < T.length; i++) T[i] = r();
  const at = (x, y) => T[((y & 255) << 8) | (x & 255)];
  const s = (t) => t * t * (3 - 2 * t);
  return (x, y) => {
    const X = Math.floor(x), Y = Math.floor(y), fx = s(x - X), fy = s(y - Y);
    const a = at(X, Y), b = at(X + 1, Y), c = at(X, Y + 1), d = at(X + 1, Y + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };
}
const fbm = (n, x, y, o = 4) => { let a = 1, f = 1, s = 0, t = 0; for (let i = 0; i < o; i++) { s += a * n(x * f, y * f); t += a; a *= 0.5; f *= 2; } return s / t; };
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bayer = (x, y) => (BAYER[y & 3][x & 3] + 0.5) / 16;

function surface(W, H) {
  const px = new Uint8ClampedArray(W * H * 4);
  const set = (x, y, c) => {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = (y * W + x) * 4; px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; px[i + 3] = 255;
  };
  const get = (x, y) => { x = clamp(x | 0, 0, W - 1); y = clamp(y | 0, 0, H - 1); const i = (y * W + x) * 4; return [px[i], px[i + 1], px[i + 2]]; };
  const rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, c); };
  const toURL = () => {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    c.getContext('2d').putImageData(new ImageData(px, W, H), 0, 0);
    return c.toDataURL('image/png');
  };
  return { W, H, set, get, rect, toURL };
}

/* A dithered gradient: f is a float index into the palette. */
const ditherPick = (pal, f, x, y) => {
  f = clamp(f, 0, pal.length - 1);
  const i = Math.floor(f);
  return pal[Math.min(pal.length - 1, (f - i) > bayer(x, y) ? i + 1 : i)];
};

/* ---------- buildings ---------- */

function windows(S, x0, y0, w, h, p, lit, r, step = 3) {
  for (let y = y0 + 2; y < y0 + h - 1; y += step) {
    const rowOn = r() < 0.85;
    for (let x = x0 + 1; x < x0 + w - 1; x += 2) {
      if (rowOn && r() < p) S.set(x, y, lit[Math.floor(r() * lit.length)]);
    }
  }
}

function tower(S, x, base, w, h, o, r) {
  const top = base - h;
  S.rect(x, top, w, h, o.body);
  // backlit edge on the sun side
  if (o.rim) for (let y = top; y < base; y++) S.set(o.sunLeft ? x : x + w - 1, y, o.rim);
  // setback
  if (w > 10 && r() < 0.4) {
    const sw = w - 4 - Math.floor(r() * 4), sh = 4 + Math.floor(r() * 10);
    S.rect(x + Math.floor((w - sw) / 2), top - sh, sw, sh, o.body);
  }
  // roof gear: antenna or water tower
  const roll = r();
  if (roll < 0.22) {
    const ax = x + 2 + Math.floor(r() * (w - 4)), ah = 3 + Math.floor(r() * 9);
    for (let k = 0; k < ah; k++) S.set(ax, top - 1 - k, o.body);
    if (o.beacon && r() < 0.6) S.set(ax, top - ah - 1, o.beacon);
  } else if (roll < 0.4 && w >= 6) {
    const tx = x + 1 + Math.floor(r() * (w - 5));
    S.rect(tx, top - 4, 4, 3, o.body); S.set(tx, top - 1, o.body); S.set(tx + 3, top - 1, o.body);
    S.set(tx + 1, top - 5, o.body); S.set(tx + 2, top - 5, o.body);
  }
  if (o.lit) windows(S, x, top, w, h, o.p, o.lit, r, o.step || 3);
}

function skyline(S, base, from, to, o, heightAt, seed) {
  const r = rng(seed);
  let x = from;
  while (x < to) {
    const w = o.minW + Math.floor(r() * (o.maxW - o.minW));
    const h = Math.max(6, Math.round(heightAt(x + w / 2) * (0.55 + r() * 0.55)));
    tower(S, x, base, w, h, o, r);
    x += w + (r() < 0.25 ? 1 : 0);
  }
}

/* landmarks, drawn as silhouettes with their own lights */

function oneWTC(S, cx, base, o) {
  const H = 150, top = base - H;
  for (let y = top; y < base; y++) {
    const t = (y - top) / H;
    const hw = Math.round(6 + t * 7);
    for (let x = cx - hw; x <= cx + hw; x++) {
      // the tower's twisted facets: a lighter triangle catching the sky
      const facet = (x - cx) > hw * (1 - 2 * t);
      S.set(x, y, facet ? o.face : o.body);
    }
    if ((y & 3) === 0) for (let x = cx - hw + 1; x < cx + hw; x += 2) if (((x * 7 + y * 3) % 11) < 2) S.set(x, y, o.lit[0]);
  }
  S.rect(cx - 5, top - 3, 11, 3, o.body);
  for (let k = 0; k < 44; k++) S.set(cx, top - 3 - k, k % 9 === 4 ? o.face : o.body);
  S.set(cx, top - 48, o.beacon);
}

function empireState(S, cx, base, o) {
  const tiers = [[42, 58], [34, 34], [26, 24], [18, 14], [12, 9], [8, 6], [4, 6]];
  let y = base;
  tiers.forEach(([w, h], i) => {
    const x = cx - Math.floor(w / 2);
    S.rect(x, y - h, w, h, o.body);
    if (o.rim) for (let k = y - h; k < y; k++) S.set(o.sunLeft ? x : x + w - 1, k, o.rim);
    // vertical window strips, the building's signature
    if (i < 4) for (let k = y - h + 2; k < y - 1; k += 2) for (let s = x + 2; s < x + w - 2; s += 3) if (((s + k * 5) % 7) < 3) S.set(s, k, o.lit[(s + k) % o.lit.length]);
    y -= h;
  });
  // floodlit crown
  S.rect(cx - 3, y + 6, 6, 4, o.crown);
  S.rect(cx - 1, y - 18, 2, 18, o.body);
  for (let k = 0; k < 14; k++) S.set(cx, y - 18 - k, o.body);
  S.set(cx, y - 33, o.beacon);
}

function chrysler(S, cx, base, o) {
  const shaft = 118;
  S.rect(cx - 11, base - shaft, 22, shaft, o.body);
  if (o.rim) for (let k = base - shaft; k < base; k++) S.set(o.sunLeft ? cx - 11 : cx + 10, k, o.rim);
  for (let k = base - shaft + 3; k < base - 2; k += 3) for (let s = cx - 9; s < cx + 9; s += 2) if (((s * 3 + k) % 5) < 2) S.set(s, k, o.lit[(s + k) % o.lit.length]);
  // the terraced crown: stacked arches, each ringed with small lit triangles
  let y = base - shaft;
  [[20, 7], [16, 7], [12, 7], [8, 6], [5, 5]].forEach(([w, h]) => {
    const r = w / 2;
    for (let j = 0; j < h; j++) {
      const t = j / h, hw = Math.round(r * Math.sqrt(1 - t * t));
      for (let x = cx - hw; x < cx + hw; x++) S.set(x, y - j, o.body);
    }
    for (let a = 0; a <= 4; a++) {
      const ang = Math.PI * (0.1 + 0.8 * a / 4);
      S.set(cx + Math.cos(ang) * (r - 2) - 0.5, y - 1 - Math.sin(ang) * (h - 2), o.crown);
    }
    y -= h - 2;
  });
  for (let k = 0; k < 26; k++) S.set(cx, y - k, o.body);
  S.set(cx, y - 27, o.crown);
}

function bridge(S, base, o) {
  const deck = base - 9, towers = [44, 182], top = deck - 64;
  const cable = (x) => {
    // main cable: sags between the towers, drops to the anchorages outside
    const [a, b] = towers;
    if (x < a) return top + 2 + ((a - x) / a) * (deck - top - 6);
    if (x > b) return top + 2 + ((x - b) / (300 - b)) * (deck - top - 6);
    const t = (x - a) / (b - a);
    return top + 2 + 4 * (deck - top - 16) * t * (1 - t);
  };
  // suspenders
  for (let x = 0; x < 300; x += 3) for (let y = Math.round(cable(x)); y < deck; y++) if ((y & 1) === 0) S.set(x, y, o.cableDim);
  // cables (two, slightly apart)
  for (let x = 0; x < 300; x++) { S.set(x, cable(x), o.cable); S.set(x, cable(x) + 1, o.cableDim); }
  // diagonal stays, the bridge's web
  towers.forEach((tx) => {
    for (let k = 0; k < 44; k++) { S.set(tx - 8 - k, top + 8 + k * 1.2, o.cableDim); S.set(tx + 8 + k, top + 8 + k * 1.2, o.cableDim); }
  });
  // towers with twin pointed arches
  towers.forEach((tx) => {
    S.rect(tx - 7, top, 15, base - top, o.body);
    S.rect(tx - 8, top - 2, 17, 3, o.body);
    for (const ax of [tx - 4, tx + 2]) {
      for (let y = top + 12; y < deck - 2; y++) { S.set(ax, y, o.sky(ax, y)); S.set(ax + 1, y, o.sky(ax + 1, y)); }
      S.set(ax, top + 11, o.sky(ax, top + 11));
    }
    for (let y = top + 2; y < base; y++) S.set(tx + 7, y, o.rim);
  });
  // deck and its string of lights
  S.rect(0, deck, 300, 3, o.body);
  for (let x = 2; x < 300; x += 6) S.set(x, deck - 1, o.lamp);
}

/* ---------- night: hero ---------- */

window.paintNight = function () {
  const W = 640, H = 360, HORIZON = 286;
  const S = surface(W, H);
  const SUN = { x: 436, y: 244, r: 38 };
  const sky = ['#070A1E', '#0D1230', '#161A44', '#232357', '#372B66', '#512F6E', '#733674', '#973D72', '#BC4C6C', '#DD6664', '#F28A5E', '#FBB462', '#FFD884'].map(hex);

  // sky, with the gradient bent up around the sun
  const skyAt = (x, y) => {
    const d = Math.hypot((x - SUN.x) * 0.55, (y - SUN.y) * 1.2);
    const f = (y / HORIZON) * 10 + Math.max(0, 1 - d / 190) * 3.2;
    return ditherPick(sky, f, x, y);
  };
  for (let y = 0; y < HORIZON; y++) for (let x = 0; x < W; x++) S.set(x, y, skyAt(x, y));

  // stars in the dark upper sky
  const r = rng(3);
  for (let i = 0; i < 420; i++) {
    const x = Math.floor(r() * W), y = Math.floor(r() * 150);
    if (r() > 1 - y / 170) continue;
    const c = r() < 0.2 ? hex('#FFE9B8') : r() < 0.3 ? hex('#B8C8FF') : hex('#FFFFFF');
    S.set(x, y, mix(S.get(x, y), c, 0.5 + r() * 0.5));
    if (r() < 0.05) { S.set(x - 1, y, mix(S.get(x - 1, y), c, 0.4)); S.set(x + 1, y, mix(S.get(x + 1, y), c, 0.4)); S.set(x, y - 1, mix(S.get(x, y - 1), c, 0.4)); S.set(x, y + 1, mix(S.get(x, y + 1), c, 0.4)); }
  }

  // sun with the retro cut-away bands
  const sunTop = hex('#FFF1A8'), sunBot = hex('#FF6B6B');
  for (let y = SUN.y - SUN.r; y <= SUN.y + SUN.r; y++) {
    const dy = y - SUN.y;
    if (dy > 2) { const band = Math.floor((dy - 2) / 7), gap = 1 + band; if (((dy - 2) % 7) < gap) continue; }
    const hw = Math.floor(Math.sqrt(SUN.r * SUN.r - dy * dy));
    const c = ditherPick([sunTop, hex('#FFD27A'), hex('#FFA15E'), sunBot], (dy + SUN.r) / (2 * SUN.r) * 3, 0, y);
    for (let x = SUN.x - hw; x <= SUN.x + hw; x++) S.set(x, y, c);
  }

  // long flat clouds, lit from below near the sun
  const n = valueNoise(9);
  const cloudBody = [hex('#2A2458'), hex('#5A3470'), hex('#9A4A74'), hex('#D86A6A')];
  const cloudLit = [hex('#6F4D8C'), hex('#B06482'), hex('#EE8A78'), hex('#FFC08A')];
  for (let y = 30; y < 222; y++) {
    const band = Math.sin(clamp((y - 30) / 192) * Math.PI);
    for (let x = 0; x < W; x++) {
      const v = fbm(n, x / 70, y / 9, 5) * band;
      if (v < 0.52 - bayer(x, y) * 0.05) continue;
      const above = fbm(n, x / 70, (y - 2) / 9, 5) * band;
      const tone = clamp((y - 30) / 192 * 3 + Math.max(0, 1 - Math.hypot(x - SUN.x, (y - SUN.y) * 2) / 260) * 1.2, 0, 3);
      const edge = above < 0.52;
      S.set(x, y, ditherPick(edge ? cloudLit : cloudBody, tone, x, y));
    }
  }

  // far skyline: hazy, few lights
  const far = { body: hex('#3A2A62'), minW: 6, maxW: 16, p: 0.05, lit: [hex('#7A5FA0')], sunLeft: false };
  skyline(S, HORIZON, 0, W, far, (x) => 26 + 30 * Math.exp(-((x - 250) ** 2) / 4000) + 40 * Math.exp(-((x - 540) ** 2) / 6000), 21);

  // mid skyline with the landmarks
  const warm = [hex('#FFD27A'), hex('#FFB65C'), hex('#FFE7A8'), hex('#9FD3FF')];
  const mid = { body: hex('#1D1740'), rim: hex('#6A3E78'), beacon: hex('#FF4D4D'), minW: 7, maxW: 20, p: 0.28, lit: warm, sunLeft: false };
  skyline(S, HORIZON, 0, W, mid, (x) => 18 + 55 * Math.exp(-((x - 240) ** 2) / 2600) + 60 * Math.exp(-((x - 560) ** 2) / 5000), 37);
  const lm = { body: hex('#171236'), face: hex('#3A2F6E'), rim: hex('#7A4A80'), beacon: hex('#FF4D4D'), crown: hex('#FFE29A'), lit: warm, sunLeft: false };
  oneWTC(S, 252, HORIZON, lm);
  empireState(S, 530, HORIZON, lm);
  chrysler(S, 596, HORIZON, lm);

  // near waterfront: low blocks and piers
  const near = { body: hex('#0E0B22'), minW: 8, maxW: 22, p: 0.2, lit: warm, sunLeft: false, step: 2 };
  skyline(S, HORIZON, 300, W, near, () => 14, 55);

  // bridge on the left, in front of downtown
  bridge(S, HORIZON, { body: hex('#0B0819'), cable: hex('#3A2C5E'), cableDim: hex('#221A42'), rim: hex('#3B2658'), lamp: hex('#FFD27A'), sky: skyAt });

  // quay
  S.rect(0, HORIZON, W, 2, hex('#0A0816'));

  // water: rippled reflection of everything above, darkened, every other row
  const water = [hex('#05060F'), hex('#0A0B20'), hex('#12123A')];
  for (let y = HORIZON + 2; y < H; y++) {
    const depth = (y - HORIZON) / (H - HORIZON);
    for (let x = 0; x < W; x++) {
      const base = ditherPick(water, 2 - depth * 2.2, x, y);
      if ((y & 1) && depth < 0.75) {
        const wob = Math.round(Math.sin(y * 0.9 + x * 0.05) * (1 + depth * 4));
        const src = S.get(x + wob, HORIZON - (y - HORIZON) * 1.4);
        const bright = (src[0] + src[1] + src[2]) / 765;
        S.set(x, y, mix(base, src, clamp(0.55 - depth * 0.7) * (0.4 + bright)));
      } else S.set(x, y, base);
    }
  }
  // sun glitter on the water
  const gr = rng(5);
  for (let y = HORIZON + 4; y < H - 30; y += 2) {
    const spread = 6 + (y - HORIZON) * 0.9;
    for (let k = 0; k < 3; k++) {
      const x = SUN.x + Math.round((gr() - 0.5) * 2 * spread), len = 2 + Math.floor(gr() * 6);
      for (let i = 0; i < len; i++) S.set(x + i, y, mix(hex('#FFB870'), hex('#FFE6A8'), gr()));
    }
  }

  // fade the bottom into the page's black, dithered
  for (let y = H - 70; y < H; y++) for (let x = 0; x < W; x++) {
    const t = (y - (H - 70)) / 70;
    if (t > bayer(x, y)) S.set(x, y, hex('#000000'));
  }
  return S.toURL();
};

/* ---------- day: panels ---------- */

window.paintDay = function () {
  const W = 400, H = 320, BASE = 236;
  const S = surface(W, H);
  const sky = ['#2C62C8', '#3A74D4', '#4F88DE', '#679CE6', '#82B1EE', '#9EC4F3', '#BBD7F6', '#D6E8F8'].map(hex);
  for (let y = 0; y < BASE; y++) for (let x = 0; x < W; x++) S.set(x, y, ditherPick(sky, (y / BASE) * 7, x, y));

  // puffy clouds
  const n = valueNoise(17);
  for (let y = 12; y < 150; y++) for (let x = 0; x < W; x++) {
    const v = fbm(n, x / 46, y / 16, 5) * Math.sin(clamp((y - 12) / 138) * Math.PI);
    if (v < 0.5) continue;
    const below = fbm(n, x / 46, (y + 3) / 16, 5) * Math.sin(clamp((y - 9) / 138) * Math.PI);
    S.set(x, y, below < 0.5 ? hex('#B9C9E4') : v > 0.62 ? hex('#FFFFFF') : hex('#E8F0FA'));
  }

  const lit = [hex('#1E3A66'), hex('#2B4E80'), hex('#8FB8E8')];
  const far = { body: hex('#8FA6C8'), minW: 6, maxW: 14, p: 0.15, lit: [hex('#A9BCD8')], rim: hex('#B8C9E2'), sunLeft: true };
  skyline(S, BASE, 0, W, far, (x) => 30 + 30 * Math.exp(-((x - 120) ** 2) / 3000), 61);
  const mid = { body: hex('#5E7598'), rim: hex('#9AB0CE'), beacon: hex('#E04848'), minW: 7, maxW: 18, p: 0.4, lit, sunLeft: true };
  skyline(S, BASE, 0, W, mid, (x) => 22 + 40 * Math.exp(-((x - 300) ** 2) / 3000), 67);
  const lm = { body: hex('#4E6488'), face: hex('#7F97BA'), rim: hex('#A7BCD8'), beacon: hex('#E04848'), crown: hex('#E9EEF6'), lit, sunLeft: true };
  empireState(S, 250, BASE, lm);
  chrysler(S, 312, BASE, lm);

  // the park in front: layered tree canopy
  const leaves = [hex('#1F4A22'), hex('#2E6A2C'), hex('#3F8A34'), hex('#62A843'), hex('#8CC45A')];
  const tn = valueNoise(71);
  for (let layer = 0; layer < 3; layer++) {
    const top = BASE - 16 + layer * 22;
    for (let x = 0; x < W; x++) {
      const crest = top - Math.round((fbm(tn, x / 14 + layer * 9, layer * 3, 4) - 0.3) * 30);
      for (let y = crest; y < H; y++) {
        const shade = fbm(tn, x / 5 + layer * 11, y / 5, 3);
        const light = 1.2 + layer * 0.9 - (y - crest) / 18 + (shade - 0.5) * 2.4;
        S.set(x, y, ditherPick(leaves, light, x, y));
      }
    }
  }
  return S.toURL();
};
</script>
</body>
</html>
