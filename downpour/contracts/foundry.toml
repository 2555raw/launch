[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib", "../node_modules"]
remappings = ["solady/=../node_modules/solady/src/", "forge-std/=lib/forge-std/src/"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false
