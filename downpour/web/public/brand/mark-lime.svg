<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The mark in the lime: a ring of eight rounded blocks on a six-by-six grid, a diamond drawn in pixels.
       Blocks meet only at their corners, so the ring reads as one shape with notched joins. -->
  <g fill="#bfff2a">
    <rect x="384" y="128" width="256" height="128" rx="42"/>
    <rect x="256" y="256" width="128" height="128" rx="42"/>
    <rect x="640" y="256" width="128" height="128" rx="42"/>
    <rect x="128" y="384" width="128" height="256" rx="42"/>
    <rect x="768" y="384" width="128" height="256" rx="42"/>
    <rect x="256" y="640" width="128" height="128" rx="42"/>
    <rect x="640" y="640" width="128" height="128" rx="42"/>
    <rect x="384" y="768" width="256" height="128" rx="42"/>
  </g>
</svg>
