<!doctype html><meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: Wpx; height: Hpx; overflow: hidden; }
  body { font-family: "Liberation Sans", system-ui, sans-serif; }

  .stage { position: relative; width: Wpx; height: Hpx; overflow: hidden;
           background: linear-gradient(170deg,#e8f4fd 0%,#f4fbff 30%,#eefaf6 62%,#e9f3fb 100%); }

  /* A real sky, blurred past recognition: the clouds in the reference without
     inventing a photograph that does not exist. */
  .sky { position: absolute; inset: -18%; width: 136%; height: 136%; object-fit: cover;
         /* The top of this frame is sky; the bottom has a person standing in it,
            and at this blur a person is still a person. */
         object-position: center 14%;
         filter: blur(26px) saturate(1.45) brightness(1.2); opacity: .95; }
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; }
  /* Enough white under the headline to read on, not so much that the sky goes. */
  .veil { position: absolute; inset: 0;
          background: radial-gradient(ellipse 46% 40% at 50% 52%, rgba(255,255,255,.9) 0%, rgba(255,255,255,.62) 38%, rgba(255,255,255,0) 72%); }

  /* Coins, turned a little so they read as discs rather than circles. */
  /* A disc, not a circle: rotate3d does nothing without a perspective, which
     is why these were coming out flat. */
  .coin { position: absolute; border-radius: 50%; display: grid; place-items: center;
          box-shadow: 0 30px 50px -16px rgba(24,70,92,.55),
                      inset 0 -14px 26px rgba(255,255,255,.6),
                      inset 0 10px 22px rgba(24,70,92,.22); }
  .coin::after { content: ""; position: absolute; inset: 7%; border-radius: 50%;
                 border: 2px solid rgba(255,255,255,.45); }
  .coin svg { opacity: .85; filter: drop-shadow(0 2px 3px rgba(24,70,92,.28)); }

  .head { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-52%);
          text-align: center; z-index: 8;
          font: 400 HEADpx/1.22 "Bitstream Charter", Georgia, serif; color: #16303c;
          letter-spacing: -.012em; }
  .head .on { color: #1c86b8; }
  .head small { display: block; margin-top: 12px; font: 400 SUBpx/1.3 "Liberation Sans", sans-serif;
                color: #5b7c8b; letter-spacing: .005em; }

  .card {
    position: absolute; width: CARDpx; padding: 15px 19px 12px; border-radius: 18px;
    background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.92);
    box-shadow: 0 30px 54px -24px rgba(24,70,92,.45); backdrop-filter: blur(16px) saturate(1.2);
  }
  .top { display: flex; align-items: flex-start; gap: 12px; }
  .ico { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; margin-top: 2px;
         filter: saturate(1.25) brightness(1.12) contrast(1.06);
         box-shadow: 0 3px 10px rgba(16,58,74,.28), 0 0 0 3px rgba(255,255,255,.95); }
  .who { flex: 1; min-width: 0; }
  .tk { font-size: 21px; font-weight: 700; color: #16303c; line-height: 1.05; }
  .nm { font-size: 12px; color: #6c8794; margin-top: 2px; }
  .fig { text-align: right; flex: none; }
  .px { font-size: 18px; font-weight: 600; color: #16303c; }
  .unit { font-size: 10px; color: #8ba3ae; margin-top: 2px; }
  .lvl, .chg { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 7px;
               font-size: 11px; font-weight: 600; }
  .lvl.high { background: rgba(23,107,153,.22); color: #10506f; }
  .lvl.mid  { background: rgba(59,159,212,.19); color: #1c6d95; }
  .lvl.low  { background: rgba(125,196,231,.24); color: #3583a8; }
  .chg.up   { background: rgba(16,185,129,.18); color: #0b7a5b; }
  .chg.down { background: rgba(239,68,68,.16);  color: #b3352f; }
  .chart { margin-top: 9px; height: 48px; }

  .site { position: absolute; right: 42px; bottom: 26px; z-index: 9;
          font: 400 14px/1 "DejaVu Sans Mono", monospace; letter-spacing: .1em; color: #5b7c8b; }
</style>
<div class="stage">
  <img class="sky" src="SKY">
  GLOWS
  <div class="veil"></div>
  COINS
  CARDS
  <div class="head">HEADLINE<small>SUB</small></div>
  <div class="site">hydropad.site</div>
</div>
