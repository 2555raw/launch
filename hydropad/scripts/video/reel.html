<!doctype html><html><head><meta charset="utf-8"><style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
 body{font-family:"Liberation Sans",system-ui,sans-serif;color:#fff}
 #s{position:relative;width:1080px;height:1920px;overflow:hidden;background:#060f0e}
 .sh{position:absolute;inset:0;opacity:0;overflow:hidden}
 .ph{position:absolute;inset:0;background-size:cover;background-position:center;
     will-change:transform,filter}
 /* type never sits straight on a photograph: a floor of shade under it, and a
    lift at the top so the ticker holds too */
 .sh::after{content:"";position:absolute;inset:0;pointer-events:none;
   background:linear-gradient(180deg,rgba(4,12,10,.62) 0%,rgba(4,12,10,0) 26%,
              rgba(4,12,10,0) 40%,rgba(4,12,10,.9) 86%,rgba(4,12,10,.97) 100%)}
 .cap{position:absolute;left:78px;right:78px;bottom:190px;z-index:2;will-change:transform,opacity,filter}
 .tk{position:absolute;left:78px;top:150px;z-index:2;font-family:"DejaVu Sans Mono",monospace;
     font-size:40px;letter-spacing:.34em;color:#3fd3e0;will-change:transform,opacity}
 .nm{font-size:104px;font-weight:700;letter-spacing:-.022em;line-height:1.02;
     text-shadow:0 6px 34px rgba(0,0,0,.65)}
 .pl{font-size:40px;color:#d6e4de;margin-top:20px;text-shadow:0 3px 18px rgba(0,0,0,.7)}
 .co{font-family:"DejaVu Sans Mono",monospace;font-size:31px;color:#8fb3aa;
     margin-top:26px;letter-spacing:.05em}
 .cl{display:inline-block;margin-top:30px;padding:11px 26px;border:1px solid rgba(63,211,224,.55);
     border-radius:999px;font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:#3fd3e0;
     background:rgba(6,20,18,.45)}
 .end{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
   background:radial-gradient(120% 70% at 50% 15%,rgba(63,211,224,.12),rgba(63,211,224,0) 60%),
              radial-gradient(140% 120% at 50% 100%,#08110f,#0b1512 45%,#060f0e)}
 .mk{width:200px;height:200px;margin:0 auto 52px;display:block}
 .big{font-family:"Liberation Serif",Georgia,serif;font-size:128px;line-height:1}
 .st{font-family:"DejaVu Sans Mono",monospace;font-size:31px;letter-spacing:.26em;color:#6f8c83;margin-top:42px}
</style></head><body><div id="s"></div><script src="photos.js"></script>
<script src="reel.js"></script></body></html>
