<!doctype html><html><head><meta charset="utf-8"><title>Hydropad film</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:576px; overflow:hidden; }
  body { font-family:"Liberation Sans",system-ui,sans-serif; background:#000; }
  #stage { position:relative; width:1024px; height:576px; overflow:hidden; }
  .sc { position:absolute; inset:0; display:grid; place-items:center; opacity:0; will-change:opacity,transform; }
  .light { background:#e9eaea; color:#0b0d0c; }
  .dark  { background:#141414; color:#f3f6f4; }
  .deep  { background:linear-gradient(180deg,#0d1622 0%,#0a1119 100%); color:#eafcff; }
  .grey  { background:#d4d4d4; color:#111; }
  /* the faint grid the reference lays under its dark type scenes */
  .grid::before { content:""; position:absolute; inset:-10%;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:76px 76px; }
  .gridl::before { content:""; position:absolute; inset:-10%;
    background-image:linear-gradient(rgba(0,0,0,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(0,0,0,.055) 1px,transparent 1px);
    background-size:72px 72px; }
  .in { position:relative; text-align:center; }
  .w { display:inline-block; margin-right:.26em; will-change:transform,opacity,filter; }
  .wb { display:block; margin-right:0; }
  h1 { font-size:54px; font-weight:700; letter-spacing:-.02em; line-height:1.18; }
  .big { font-size:72px; font-weight:700; letter-spacing:-.025em; }
  .mono { font-family:"DejaVu Sans Mono",monospace; }
  .cy { color:#12a6d2; }
  .cyl { color:#3fd3e0; }

  /* the pill the site actually uses for the network, reused as the reference
     reuses its own little status capsule */
  .pill { display:inline-flex; align-items:center; gap:14px; background:#fff;
    border-radius:999px; padding:16px 26px; box-shadow:0 18px 40px -18px rgba(0,0,0,.6);
    color:#0b0d0c; will-change:transform,filter,opacity; }
  .pill.on { background:#bdf3e4; }
  .ring { width:44px; height:44px; border-radius:50%; border:4px solid #d9dde0;
    border-top-color:#12a6d2; border-right-color:#12a6d2; }
  .pill b { font-size:21px; font-weight:600; }
  .pill small { display:block; font-size:12px; color:#6a7a74; }

  /* a browser-ish card, the reference's player frame */
  .card { background:#0e1513; border-radius:12px; overflow:hidden;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.75); will-change:transform,opacity; }
  .card .body { display:grid; place-items:center; color:#93a9a0; font-size:17px;
    text-align:center; padding:0 40px; line-height:1.45; }
  .bar { height:4px; background:#2a3431; } .bar i { display:block; height:100%; background:#12a6d2; }

  .note { background:#fdf3c8; border:1px solid #d9c26a; color:#3a3218;
    font-size:15px; padding:6px 10px; position:relative; }
  .note::before,.note::after { content:""; position:absolute; width:7px; height:7px;
    background:#e8b923; border-radius:50%; top:-4px; }
  .note::before { left:-4px; } .note::after { right:-4px; }

  .plate { border-radius:14px; background:#fff; box-shadow:0 22px 50px -22px rgba(0,0,0,.5);
    overflow:hidden; will-change:transform,opacity,filter; }
  .sq { border-radius:22px; background:#fff; display:grid; place-items:center;
    box-shadow:0 14px 34px -14px rgba(0,0,0,.35); will-change:transform,opacity,filter; }
  .glow { text-shadow:0 0 18px rgba(63,211,224,.75),0 0 44px rgba(63,211,224,.4); }
  .mark { will-change:transform,opacity,filter; }
  .radial { position:absolute; inset:0;
    background:radial-gradient(42% 58% at 50% 50%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 70%); }
</style></head><body>
<div id="stage"></div>
<script src="film.js"></script>
</body></html>
