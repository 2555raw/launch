<!doctype html><html><head><meta charset="utf-8"><style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
 body{font-family:"Liberation Sans",system-ui,sans-serif;color:#fff}
 #s{position:relative;width:1920px;height:1080px;overflow:hidden;background:#060f0e}
 .sh{position:absolute;inset:0;opacity:0;overflow:hidden;will-change:transform,opacity}
 .ph{position:absolute;inset:-6%;background-size:cover;background-position:center;
     will-change:transform,filter}
 .sh::after{content:"";position:absolute;inset:0;pointer-events:none;
   background:linear-gradient(90deg,rgba(4,12,10,.88) 0%,rgba(4,12,10,.55) 34%,
              rgba(4,12,10,.05) 62%,rgba(4,12,10,.35) 100%),
              linear-gradient(180deg,rgba(4,12,10,.5) 0%,rgba(4,12,10,0) 22%,
              rgba(4,12,10,0) 62%,rgba(4,12,10,.72) 100%)}
 .cap{position:absolute;left:112px;bottom:190px;z-index:3;max-width:900px}
 .tk{position:absolute;left:112px;top:108px;z-index:3;font-family:"DejaVu Sans Mono",monospace;
     font-size:30px;letter-spacing:.4em;color:#3fd3e0;will-change:transform,opacity}
 .nm{font-size:116px;font-weight:700;letter-spacing:-.025em;line-height:.98;
     text-shadow:0 8px 40px rgba(0,0,0,.7);will-change:transform,opacity,filter}
 .pl{font-size:36px;color:#dbe8e2;margin-top:22px;text-shadow:0 3px 18px rgba(0,0,0,.75);
     will-change:transform,opacity}
 .row{display:flex;align-items:center;gap:22px;margin-top:30px}
 .cl{display:inline-block;padding:11px 26px;border:1px solid rgba(63,211,224,.6);
     border-radius:999px;font-size:23px;letter-spacing:.2em;text-transform:uppercase;
     color:#3fd3e0;background:rgba(6,20,18,.5);will-change:transform,opacity}
 .co{font-family:"DejaVu Sans Mono",monospace;font-size:27px;color:#a8c8bf;letter-spacing:.04em;
     white-space:pre}
 .cnt{position:absolute;right:112px;top:112px;z-index:3;font-family:"DejaVu Sans Mono",monospace;
      font-size:26px;letter-spacing:.2em;color:#7c9a91;will-change:opacity}
 /* one rule along the foot that fills as the register is walked */
 #bar{position:absolute;left:112px;right:112px;bottom:96px;height:2px;
      background:rgba(255,255,255,.16);z-index:4}
 #bar i{display:block;height:100%;background:#3fd3e0;width:0}
 .end{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;z-index:5;
   background:radial-gradient(110% 80% at 50% 12%,rgba(63,211,224,.13),rgba(63,211,224,0) 62%),
              radial-gradient(140% 130% at 50% 100%,#08110f,#0b1512 45%,#060f0e)}
 .mk{width:176px;height:176px;margin:0 auto 44px;display:block}
 .big{font-family:"Liberation Serif",Georgia,serif;font-size:128px;line-height:1}
 .st{font-family:"DejaVu Sans Mono",monospace;font-size:28px;letter-spacing:.28em;color:#6f8c83;margin-top:38px}
</style></head><body><div id="s"><div id="bar"><i></i></div></div>
<script src="photos.js"></script><script src="wide.js"></script></body></html>
