<meta property="og:title" content="BNB Bite"><meta property="og:description" content="Restaurant gift cards for crypto and a restaurant-paired launchpad on BNB Chain."><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image">

<style>
/* Layout: a marketplace home in the proportions of a food-delivery site at 1920px.
   64px top bar (menu, wordmark, mode pill, place pill, 48px search, wallet),
   240px sidebar, content column: category strip, filter pills, three promo
   banners, "Featured" row of four cards, "New today" row, then the full grid.
   A side sheet opens for the selected coin. Figtree stands in for the site's
   proprietary face. White ground, black text, one green. */
:root {
  --bg: #FFFFFF; --bg-alt: #FAFAFA; --card: #FFFFFF; --surface: #F3F3F3; --surface-hi: #E8E8E8; --tile: #F6F6F6;
  --ink: #000000; --muted: #545454; --dim: #8A8A8A; --prose: #333333;
  --line: #E6E6E6; --line-hi: #D4D4D4;
  --green: #F0B90B; --green-deep: #C99A00; --green-soft: #FFF6D8; --green-ink: #7A5A00; --salmon: #FFE7A3; --red: #E11900;
  --up: #05944F; --down: #E11900; --accent2: #FF5A1F;
  --font: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #121212; --bg-alt: #181818; --card: #1A1A1A; --surface: #262626; --surface-hi: #333333; --tile: #222222;
  --ink: #F5F5F5; --muted: #B0B0B0; --dim: #7A7A7A; --prose: #DDDDDD;
  --line: #2C2C2C; --line-hi: #3C3C3C;
  --green-soft: rgba(240,185,11,.16); --green-ink: #F5C84B; --up: #3DDC84; --down: #FF6B5E;
  color-scheme: dark;
}
:root[lang="zh"] { --up: #E11900; --down: #05944F; }
:root[data-theme="dark"][lang="zh"] { --up: #FF6B5E; --down: #3DDC84; }

* { box-sizing: border-box; }
/* ---- scroll-linked entrances: elements animate in when they reach the viewport ---- */
@keyframes rvin { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
@keyframes rvinx { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
@keyframes rvinl { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }
@keyframes rvinz { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.js-io .rv:not(.is-in) { opacity: 0; }
.js-io .rv.is-in { animation: rvin .65s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: var(--d, 0ms); }
.js-io .rail > .rv.is-in { animation-name: rvinx; }
.js-io .sec-h.rv.is-in, .js-io h2.rv.is-in { animation-name: rvinl; }
.js-io .gift.rv.is-in, .js-io .st-tile.rv.is-in { animation-name: rvinz; }
.js-io .rv.is-in .row-img, .js-io .rv.is-in .art { animation: rvimg .9s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: var(--d, 0ms); }
@keyframes rvimg { from { transform: scale(1.06); } to { transform: none; } }
.scrollbar { position: fixed; top: 0; left: 0; height: 2px; width: 100%; background: var(--green); transform-origin: left; transform: scaleX(0); z-index: 99; pointer-events: none; }
.totop { position: fixed; right: 20px; bottom: 76px; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; z-index: 48; box-shadow: 0 8px 24px rgba(0,0,0,.14); opacity: 0; transform: translateY(16px) scale(.9); pointer-events: none; transition: opacity .25s ease, transform .25s cubic-bezier(.2,.7,.2,1); }
.totop.is-on { opacity: 1; transform: none; pointer-events: auto; }
.totop:hover { transform: translateY(-3px); } .totop svg { width: 20px; height: 20px; }
@media (max-width: 1000px) { .totop { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); right: 14px; } }
.hdr .brand { transition: transform .25s cubic-bezier(.2,.7,.2,1); } .hdr.is-scrolled .brand { transform: scale(.94); }
@media (prefers-reduced-motion: reduce) { .js-io .rv:not(.is-in) { opacity: 1; } .totop { transition: none; } }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn:focus-visible, .pill:focus-visible { outline-offset: 3px; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
h2 { font-size: 24px; line-height: 32px; letter-spacing: -.02em; } h3 { font-size: 18px; line-height: 24px; letter-spacing: -.01em; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 500; font-size: 14px; border: 0; cursor: pointer; white-space: nowrap; }
.btn-ink { background: var(--green); color: #111; }
.btn-ink:hover { filter: brightness(.96); }
.btn-ink:disabled { opacity: .35; cursor: not-allowed; }
.btn-gray { background: var(--surface); color: var(--ink); }
.btn-gray:hover { background: var(--surface-hi); }
.btn-white { background: #fff; color: #000; }
.btn-block { width: 100%; }
.input, .select, .textarea { width: 100%; background: var(--surface); border: 2px solid transparent; border-radius: 8px; padding: 12px 14px; outline: 0; font-size: 16px; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--ink); background: var(--bg); }
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 4px; background: var(--surface); color: var(--ink); white-space: nowrap; }
.tag.live { background: var(--green-soft); color: var(--green-ink); }
.tag.ok { background: var(--green-soft); color: var(--green-ink); }
.tag.failed { background: rgba(225,25,0,.1); color: var(--down); }
.tag.red { background: var(--accent2); color: #fff; }
.bar { height: 4px; background: var(--surface-hi); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 2px; }
.bar.ok i { background: var(--green-deep); } .bar.failed i { background: var(--down); } .bar.soon i { background: var(--line-hi); }

/* ---- top bar: 64px ---- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
.hdr-in { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 16px 0 24px; }
.burger { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 999px; display: grid; place-items: center; cursor: pointer; margin-left: -8px; }
.burger:hover { background: var(--surface); }
.brand { font-weight: 800; font-size: 24px; letter-spacing: -.04em; white-space: nowrap; margin-right: 8px; }
.brand em { font-style: normal; }
.mode { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; height: 48px; }
.mode button { font-size: 14px; font-weight: 500; color: var(--ink); background: transparent; border: 0; padding: 0 16px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.mode button.is-on { background: var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,.14); }
.place { display: inline-flex; align-items: center; gap: 6px; height: 48px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; background: transparent; border: 0; cursor: pointer; }
.place:hover { background: var(--surface); }
.place .sep { color: var(--muted); font-weight: 400; }
.place select { appearance: none; -webkit-appearance: none; background: transparent; border: 0; outline: 0; font: inherit; font-weight: 500; color: inherit; cursor: pointer; padding: 0; }
.place select option { color: #000; }
@media (max-width: 1100px) { #refresh { display: none; } }
.search { flex: 1 1 60px; min-width: 0; display: flex; align-items: center; gap: 12px; height: 48px; background: var(--surface); border-radius: 999px; padding: 0 20px; color: var(--ink); }
.search input { background: transparent; border: 0; outline: 0; width: 100%; font-size: 16px; color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.hdr-right { display: flex; align-items: center; gap: 8px; flex: none; }
.cart { position: relative; width: 40px; height: 40px; border: 0; background: transparent; border-radius: 999px; display: grid; place-items: center; cursor: pointer; }
.cart:hover { background: var(--surface); }
.cart .n { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; border-radius: 999px; background: var(--green); color: #111; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.textbtn { height: 40px; padding: 0 12px; border: 0; background: transparent; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.textbtn:hover { background: var(--surface); }
.lang { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; }
.lang button { font-size: 12px; font-weight: 600; color: var(--muted); background: transparent; border: 0; padding: 5px 9px; border-radius: 999px; cursor: pointer; }
.lang button.is-on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.addr { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px; border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 500; }
.addr i { width: 10px; height: 10px; border-radius: 999px; background: var(--green); }
.addr b { font-family: var(--mono); font-weight: 500; }
@media (max-width: 1100px) { .place { display: none; } }
@media (max-width: 860px) { .mode, #theme, .hdr-right .btn-gray { display: none; } .brand { font-size: 18px; } .hdr-in { gap: 8px; padding: 0 12px; } }
@media (max-width: 600px) { .lang, #cartbtn { display: none; } #connect { padding: 0 8px; font-size: 13px; } .addr span { display: none; } .addr { padding: 0 10px 0 8px; } .search { padding: 0 12px; gap: 8px; } .brand em { display: none; } .hdr-in { padding: 0 10px; } }

/* ---- shell ---- */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); transition: grid-template-columns .28s cubic-bezier(.2,.7,.2,1); }
.shell.collapsed { grid-template-columns: 0px minmax(0, 1fr); }
.shell.collapsed .side { visibility: hidden; opacity: 0; padding-left: 0; padding-right: 0; overflow: hidden; }
.side { transition: opacity .2s ease, visibility .2s; }
.side-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 44; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.side-scrim.is-on { opacity: 1; pointer-events: auto; }
@keyframes sideIn { from { transform: translateX(-100%); } to { transform: none; } }
.side { padding: 12px 12px 24px; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 64px); overflow: auto; display: flex; flex-direction: column; gap: 2px; scrollbar-width: none; }
.side::-webkit-scrollbar { display: none; }
.side > * { flex: none; }
.side .grp { font-size: 13px; font-weight: 600; color: var(--muted); padding: 20px 12px 6px; }
.side a, .side button { display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 12px; border-radius: 12px; font-weight: 500; font-size: 16px; color: var(--ink); background: transparent; border: 0; cursor: pointer; text-align: left; white-space: nowrap; transition: background .12s ease; }
.side a:hover, .side button:hover { background: var(--surface); }
.side a:active, .side button:active { background: var(--surface-hi); }
.side .ico { width: 24px; height: 24px; display: grid; place-items: center; flex: none; color: var(--ink); background: transparent; }
.side .ico svg { width: 22px; height: 22px; }
.side .is-on { background: var(--surface); font-weight: 600; }
.side .is-on .ico { color: #C99A00; }
:root[data-theme="dark"] .side .is-on .ico { color: var(--green); }
.side .is-on:hover { background: var(--surface-hi); }
.side .n { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); }
.side .wallet-card { margin-top: auto; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.side .wallet-card .row1 { display: flex; align-items: center; gap: 10px; }
.side .wallet-card .av { width: 36px; height: 36px; border-radius: 999px; background: var(--green); flex: none; }
.side .wallet-card b { display: block; font-family: var(--mono); font-size: 13px; font-weight: 500; }
.side .wallet-card small { display: block; font-size: 12px; opacity: .8; }
.side .wallet-card .bal { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: -.01em; color: var(--green); }
.side .wallet-card .net { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; opacity: .9; }
.side .wallet-card .net i { width: 8px; height: 8px; border-radius: 999px; background: var(--green); }
.side .wallet-card .btn { height: 38px; font-size: 13px; font-weight: 600; }
.side .wallet-card .btn-white { background: var(--bg); color: var(--ink); }
.side .wallet-card p { font-size: 13px; line-height: 18px; opacity: .92; }
.side .wallet-card .usd { color: rgba(255,255,255,.8); }
@media (max-height: 760px) { .side .wallet-card { margin-top: 12px; } }
.content { padding: 8px 32px 80px 16px; min-width: 0; overflow-x: clip; }
@media (max-width: 1000px) { .banners-wrap .arrow { display: none; } .shell { grid-template-columns: minmax(0, 1fr); } .side { display: none; } .side.is-open { display: block; position: fixed; inset: calc(64px + env(safe-area-inset-top, 0px)) auto 0 0; width: 260px; background: var(--bg); z-index: 45; box-shadow: 8px 0 30px rgba(0,0,0,.12); animation: sideIn .25s cubic-bezier(.2,.7,.2,1) both; } .shell.collapsed { grid-template-columns: minmax(0, 1fr); } .shell.collapsed .side.is-open { visibility: visible; opacity: 1; padding: 12px 12px 24px; } .content { padding: 8px 16px 80px; } }

/* ---- category strip ---- */
.cats-wrap { position: relative; margin-bottom: 12px; }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 6px 48px 6px 0; scroll-behavior: smooth; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); cursor: pointer; font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1; white-space: nowrap; transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease; }
.cats button .ic { width: 20px; height: 20px; display: grid; place-items: center; color: var(--ink); }
.cats button .ic svg { width: 20px; height: 20px; display: block; }
.cats button:hover { border-color: var(--line-hi); background: var(--surface); }
.cats button.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cats button.is-on .ic { color: var(--bg); }
.arrow { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.arrow:hover { background: var(--surface-hi); }
.cats-wrap .arrow { position: absolute; right: 0; top: 6px; box-shadow: -12px 0 12px var(--bg); }

/* ---- filters ---- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--surface); border: 0; font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; white-space: nowrap; }
.pill:hover { background: var(--surface-hi); }
.pill.is-on { background: var(--green); color: #111; }
.pill select { background: transparent; border: 0; outline: 0; font-weight: 500; cursor: pointer; color: inherit; }
.pill select option { color: #000; }
.ranked { font-size: 14px; line-height: 20px; color: var(--muted); margin-bottom: 20px; }
.ranked a { text-decoration: underline; color: var(--ink); }
.rule { border: 0; border-top: 1px solid var(--line); margin: 0 0 24px; }

/* ---- banners ---- */
.banners-wrap { position: relative; margin-bottom: 36px; }
.banners { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 1200px) { .banners { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .banners { grid-template-columns: 1fr; } }
.banner { position: relative; overflow: hidden; border-radius: 16px; height: 216px; padding: 24px; color: #fff; display: grid; align-content: space-between; cursor: pointer; }
.banner.g1 { background: #F0B90B; color: #111; } .banner.g2 { background: #111; color: #fff; } .banner.g3 { background: var(--accent2); color: #fff; }
.banner h3 { font-size: 22px; line-height: 28px; font-weight: 700; max-width: 55%; color: inherit; }
.banner p { font-size: 14px; margin-top: 6px; max-width: 55%; opacity: .95; }
.banner .cta { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: #fff; color: #000; font-size: 14px; font-weight: 500; width: max-content; }
.banner .art { position: absolute; right: 0; top: 0; bottom: 0; width: 48%; display: grid; place-items: center; }
.banner .art::before { content: ''; position: absolute; inset: 10% -20% 10% 10%; border-radius: 999px; background: rgba(255,255,255,.22); }
.banner .art .logo { position: relative; width: 120px; height: 120px; border: 0; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.banner .art .big { position: relative; font-size: 96px; line-height: 1; }
.banners-wrap .arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.18); background: var(--bg); }
.banners-wrap .arrow.l { left: -20px; } .banners-wrap .arrow.r { right: -20px; }

/* ---- sections ---- */
.sec { margin-bottom: 36px; }
.sec-h { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.sec-h h2 { margin-right: auto; }
.sec-h .all { font-size: 16px; font-weight: 500; color: var(--green-ink); }
.sec-h .arrows { display: flex; gap: 8px; }
.sec-h .arrow:disabled { opacity: .35; cursor: default; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 1fr); gap: 16px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }
@media (min-width: 1500px) { .rail { grid-auto-columns: calc((100% - 48px) / 4); } }
@media (max-width: 1499px) and (min-width: 1100px) { .rail { grid-auto-columns: calc((100% - 32px) / 3); } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px 16px; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 8px 0 32px; }
.sec[hidden] + .divider { display: none; }

/* ---- coin card ---- */
.row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; cursor: pointer; min-width: 0; }
.row-img { position: relative; aspect-ratio: 375 / 133; border-radius: 8px; overflow: hidden; background: var(--tile); display: grid; place-items: center; }
.row-img .wash { position: absolute; inset: 0; opacity: .55; }
.row-img .logo { position: relative; width: 88px; height: 88px; border: 0; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.row-img .tag.red { position: absolute; left: 10px; top: 10px; }
.row-img .tag.live, .row-img .tag.ok, .row-img .tag.failed { position: absolute; left: 10px; top: 10px; }
.row-img .you { position: absolute; right: 10px; top: 10px; font-family: var(--mono); font-size: 11px; font-weight: 600; background: #fff; color: #000; padding: 3px 8px; border-radius: 4px; }
.row-img .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; border-radius: 0; background: rgba(0,0,0,.18); }
.row.is-open .row-img { box-shadow: 0 0 0 2px var(--ink); }
.rcard .row-img .tag { position: absolute; left: 10px; top: 10px; }
.rcard .row-name small .tk { font-family: var(--mono); color: var(--ink); font-weight: 500; }
.row-top { display: flex; align-items: flex-start; gap: 8px; }
.row-name { min-width: 0; flex: 1; }
.row-name b { display: block; font-size: 18px; line-height: 24px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-name b .tk { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: 8px; font-weight: 500; }
.row-name small { display: block; color: var(--muted); font-size: 14px; line-height: 20px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-name small .star { color: var(--ink); font-weight: 500; }
.row .heart { width: 32px; height: 32px; border-radius: 999px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.row .heart:hover { background: var(--surface); }
.row .heart.is-on { color: var(--red); }
.row .heart.is-on svg { animation: rise .25s both; }
.row .promo { display: inline-flex; font-size: 12px; font-weight: 500; padding: 3px 6px; border-radius: 4px; background: rgba(225,25,0,.1); color: var(--red); width: max-content; }

/* ---- side sheet ---- */
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--bg); z-index: 60; box-shadow: -12px 0 40px rgba(0,0,0,.18); padding: 20px 24px 32px; overflow: auto; display: grid; gap: 16px; align-content: start; transform: translateX(100%); transition: transform .34s cubic-bezier(.2,.8,.2,1); }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 55; opacity: 0; pointer-events: none; transition: opacity .22s ease; }

.buy { display: grid; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }

.buy .amt { position: relative; }
.buy .amt .input { padding-right: 80px; font-family: var(--mono); }
.buy .amt span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); font-weight: 600; }

.buy .err { font-size: 13px; color: var(--down); }
.get { font-size: 13px; color: var(--muted); }
.get a { text-decoration: underline; color: var(--ink); }

/* ---- create ---- */
.launch { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .launch { grid-template-columns: 1fr; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 16px; }

/* ---- docs ---- */
.docs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

.spec { margin-top: 16px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }

.spec-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

.spec-g b { display: block; font-size: 15px; line-height: 20px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }

.doc { background: var(--surface); border-radius: 16px; padding: 20px; }
.doc h3 { margin-bottom: 8px; }
.doc p { font-size: 15px; line-height: 22px; color: var(--prose); }
.rules { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 0 18px; }
.rules summary { cursor: pointer; font-weight: 600; font-size: 15px; padding: 14px 0; list-style: none; display: flex; }
.rules summary::after { content: '+'; margin-left: auto; color: var(--muted); font-size: 20px; }
.rules[open] summary::after { content: '–'; }
.rules .docs { padding: 0 0 18px; }
.rules h4 { margin: 0 0 8px; font-size: 14px; }
.rules li { font-size: 14px; line-height: 20px; color: var(--prose); }

.doc p, .doc li { font-size: 15px; color: var(--prose); line-height: 22px; }

/* ---- hero ---- */
.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; background: #111; color: #fff; border-radius: 20px; margin: 8px 0 28px; min-height: 380px; }

.hero-art { position: absolute; top: 0; right: 0; bottom: 0; width: 52%; background-size: cover; background-position: center; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28%); mask-image: linear-gradient(90deg, transparent 0, #000 28%); }
@media (max-width: 1100px) { .hero { grid-template-columns: 1fr; min-height: 0; } .hero-t { padding: 28px 24px 28px; } .hero-art { position: relative; width: auto; height: 200px; order: -1; -webkit-mask-image: none; mask-image: none; } .hero h1 { font-size: 34px; } }
@media (max-width: 600px) { .hero { border-radius: 16px; margin-top: 4px; } .hero-t { padding: 22px 18px 22px; } .hero-art { height: 170px; } .hero h1 { font-size: 30px; } .hero-stats { gap: 18px 24px; } .hero-stats b { font-size: 20px; } .hero-cta .btn { flex: 1; padding: 0 12px; } div.bottom { height: auto; min-height: 44px; padding-top: 8px; padding-bottom: 8px; font-size: 12px; line-height: 15px; } }
.rcard .px-chip, .px-chip { position: absolute; right: 10px; bottom: 14px; background: var(--bg); color: var(--ink); border-radius: 999px; padding: 4px 10px; font-family: var(--mono); font-size: 12px; font-weight: 600; box-shadow: 0 4px 12px rgba(0,0,0,.14); }

/* ---- views ---- */

/* ---- stock cards + price chart ---- */

@media (max-width: 1499px) and (min-width: 1100px) { .rail.stocks { grid-auto-columns: calc((100% - 48px) / 4); } }
.stk { border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 10px; cursor: pointer; display: grid; gap: 8px; background: var(--card); transition: transform .18s cubic-bezier(.2,.7,.2,1), box-shadow .18s ease; min-width: 0; }

.stk .top { display: flex; align-items: center; gap: 10px; }

.pxc svg { width: 100%; height: auto; display: block; }
.pxc .line { fill: none; stroke-width: 2; stroke-linejoin: round; } .pxc .line.up { stroke: var(--up); } .pxc .line.down { stroke: var(--down); }
.pxc .area.up { fill: var(--up); opacity: .10; } .pxc .area.down { fill: var(--down); opacity: .10; }

/* ---- faq / why ---- */
.why { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 1000px) { .why { grid-template-columns: 1fr; } }

/* ---- gift cards ---- */
.gift { position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; aspect-ratio: 1.586; min-height: 190px; border-radius: 16px; padding: 18px; color: #fff; overflow: hidden; cursor: pointer; background-size: cover; background-position: center; transition: transform .18s cubic-bezier(.2,.7,.2,1), box-shadow .18s ease; box-shadow: 0 2px 10px rgba(0,0,0,.08); }

      guides: {
        'buy-crypto': { title: 'How to buy crypto and set up a wallet', sub: 'MetaMask or Binance, BNB or USDT, in three steps.', lead: 'You need two things to use BNB Bite with a wallet: a wallet app and some BNB or USDT on BNB Chain. Both take about ten minutes.', body: ['## 1. Install a wallet', 'MetaMask (browser extension or mobile app) and Trust Wallet are the usual choices. Install it from the official site, create a wallet, and write the 12-word recovery phrase on paper. Whoever has that phrase has your money: never type it into a website, and BNB Bite will never ask for it.', '## 2. Add BNB Chain', 'MetaMask starts on Ethereum. Open the network menu and add "BNB Smart Chain" (chain id 56). The first time you connect on BNB Bite, the page offers to add it for you.', '## 3. Buy BNB or USDT', 'The simplest path is an exchange: Binance, Coinbase, Kraken or Bybit. Buy BNB (or USDT) with a card or bank transfer, then withdraw it to your wallet address choosing the BEP20 / BNB Smart Chain network. Withdrawals usually arrive in a minute. Keep a little BNB for gas: every transaction on BNB Chain costs a fraction of a cent.', '## Then', '- Gift cards: pay with BNB or USDT from the wallet, or with any other coin from the exchange itself through the "Any crypto" option.\n- Launchpad: coins paired with a stock token are paid in that token (MCDx, SBUXx…). You can get those on PancakeSwap or from the issuer.', 'If you only want a gift card, you do not need a wallet at all: choose "Any crypto" and send from the exchange, or pay by card.'], cta: ['Browse gift cards', '#gifts'] },
        'gift-card-usdt': { title: 'Buy a Starbucks gift card with USDT', sub: 'Choose, pay, receive the code by email. Five minutes.', lead: 'A gift card bought on BNB Bite is a real eGift card issued by Bitrefill, a licensed reseller, only after your payment is confirmed. Here is the whole flow.', body: ['## 1. Pick the card', 'Open Gift cards, choose the brand and the amount. Cards with fixed values show buttons; others accept any amount in the range. The total shows the card value, the service fee and the discount when paying with a BNB Chain wallet.', '## 2. Say who gets it', 'Enter the recipient email and an optional message, and choose when it is delivered: right now or at a date and time (a birthday morning, for example). Signed in with your wallet, you can also keep the card in your account without an email.', '## 3. Pay', '- BNB Chain wallet: pay BNB or USDT from the wallet you connected. The page checks the transaction on-chain.\n- Any crypto: you get an address and an exact amount for the coin you choose (Bitcoin, Ethereum, Solana, USDT on Tron and 300+ more). The order updates by itself once the network confirms.\n- Card: Stripe Checkout opens in a new tab.', '## 4. Receive', 'As soon as the card is issued the code appears on the order page, is emailed to the recipient and is saved in your account. Keep the email: gift cards are final and codes cannot be re-issued.', 'If anything fails after you paid, the order shows "failed" and we refund or re-issue it within five business days. Contact us from the Help page with the order id.'], cta: ['Buy a gift card', '#gifts'] },
        'tokenized-stocks': { title: 'What is a tokenized stock?', sub: 'MCDx, SBUXx and friends: who issues them and how they track the share.', lead: 'A tokenized stock is a token on a blockchain whose value follows a listed share. On BNB Chain, MCDx tracks McDonald\'s, SBUXx tracks Starbucks, MEITx tracks Meituan.', body: ['## Who issues them', 'Three issuers are live on BNB Chain today: xStocks by Backed Finance (Swiss, each token backed one-to-one by shares held with a custodian), bStocks by Binance (BTech Holdings), and Ondo Stocks. BNB Bite lists 18 restaurant tokens from them, each verified on-chain by name, symbol, decimals and supply.', '## How they track the price', 'The issuer holds the real shares and mints or burns tokens as people buy and redeem. Arbitrage keeps the token price close to the share price during market hours; outside market hours the token keeps trading on-chain and can drift. BNB Bite shows the live USD price of each token from public market data, plus the 24h change.', '## What you can do with them', '- Hold them in any BNB Chain wallet, like any token.\n- Trade them on PancakeSwap or on the issuer\'s venue.\n- Use them on BNB Bite: a coin paired with a restaurant is paid in that restaurant\'s stock token, and graduates to a PancakeSwap pool against it.', '## What they are not', 'You do not get voting rights, and depending on the issuer dividends may or may not be passed through. Availability depends on where you live: issuers restrict some countries. Read the issuer\'s terms; the links are on each restaurant page.'], cta: ['See the verified pairs', '#pairs'] },
        'paired-raise': { title: 'How a paired raise works', sub: 'Target, minimum, cap per wallet, graduation and refunds, with an example.', lead: 'Every coin on BNB Bite is created with a target in a restaurant\'s stock token. The contract holds what buyers put in until the raise closes, then either graduates the coin or refunds everyone.', body: ['## The numbers', 'Say someone creates ARCHES, paired with McDonald\'s, with a target of 1,000 MCDx over 72 hours. The contract fixes: supply 1,000,000,000; minimum to graduate 333 MCDx (a third of the target); cap per wallet 100 MCDx (a tenth). Everyone pays the same rate: tokens per MCDx are the same for the first and the last buyer.', '## Buying', 'You approve MCDx once, then buy. If your buy would exceed your cap or the target, the contract takes only what fits and returns the rest in the same transaction. Reaching the target closes the raise early.', '## Graduation', 'When the raise closes with at least the minimum, anyone can call finalize: 99% of the MCDx raised plus 20% of the supply go into a PancakeSwap pool, and the LP tokens are burned so the liquidity cannot be pulled. 1% of the raise is the platform fee. Buyers then claim the remaining 80% of the supply in proportion to what they put in.', '## Refund', 'If the raise closes below the minimum, finalize marks it failed and every buyer calls refund to get 100% of their MCDx back. No fee is taken.', '## What to check before buying', '- The paired token and its issuer on the coin page.\n- The target: too high and it may never reach the minimum, too low and the pool will be thin.\n- The creator: open their profile to see what else they launched.\n- The contracts are open source and unaudited. Start on BNB Testnet.'], cta: ['Create a coin', '#launch'] }

      'bottom.more': 'Risk notice',      'why.h2': 'Why BNB Bite', 'why.1h': 'Pay the way you want', 'why.1p': 'Gift cards can be paid with a BNB Chain wallet, with any of 300+ cryptocurrencies through our payment partner, or with a bank card. The card is emailed in minutes and stays in your account.', 'why.2h': 'Real stock tokens, real pools', 'why.2p': 'Launchpad coins are paired with tokenized restaurant stocks that exist on BNB Chain. The raise is paid in that token and the liquidity is burned at graduation, so nobody can pull it.', 'why.3h': 'Nothing hidden', 'why.3p': 'Open-source contracts, every parameter written in the contract, prices and 24h changes from public data, and clear notices about what is unaudited or not yet available.',
      'faq.h2': 'Questions', 'faqs': [['Is the gift card real?', 'Yes. Cards are issued by Bitrefill, a licensed gift card reseller, only after your payment is confirmed. We never generate codes ourselves. If supply is not configured on a deployment, the card is shown as unavailable instead.'], ['Which cryptocurrencies can I pay with?', 'BNB and USDT directly from your wallet on BNB Chain, or any coin supported by our payment partner: Bitcoin, Ethereum, Solana, USDT on several networks, XRP, Litecoin, Dogecoin, TON and more. You get an address and an exact amount; the order updates by itself once the network confirms.'], ['Can I pay by card?', 'Yes, through Stripe Checkout. Card details are entered on Stripe\'s page and never reach our server.'], ['How is the gift card delivered?', 'On the order page as soon as it is issued, by email to the recipient you entered, and in your account if you were signed in with your wallet.'], ['Can I get a refund?', 'Gift cards are final once issued. If a card could not be issued after you paid, we refund or re-issue it; see the refund policy.'], ['What is the launchpad?', 'A place to launch a coin paired with a real restaurant stock token. Buyers pay the raise in that token; at graduation the coin lists on PancakeSwap against it with the liquidity burned. The contracts are open source and unaudited: start on BNB Testnet.'], ['Are the restaurants partners?', 'No. Names, logos and photos identify the brand a gift card or a stock token refers to. No restaurant sponsors, endorses or issues anything here.']],
      'legal.refund': 'Refund policy', 'legal.cookies': 'Cookies', 'legal.refundB': ['<b>Gift cards are final.</b> A code is a bearer instrument: once it has been issued and shown or emailed, it cannot be cancelled or refunded, whatever the payment method.', '<b>If we could not issue the card</b> after your payment was confirmed (supplier error, out of stock), we refund the full amount to the wallet or card you paid with, or re-issue the card, within 5 business days. Contact support with your order id.', '<b>Crypto payments that arrive late, short or to the wrong network</b> cannot always be matched to an order. Send exactly the amount shown, on the network shown, before the timer expires. Partial or expired payments are refunded manually minus network fees when they can be identified.', '<b>Launchpad raises</b> are governed by the contract: refunds happen on-chain through the Refund button when a raise closes below its minimum. We cannot reverse on-chain transactions.'],
      'legal.cookiesB': ['This site sets no tracking cookies. It stores your language, theme, saved coins and the ids of your gift card orders in your browser\'s localStorage so you can find them again on this device.', 'Stripe sets its own cookies on its checkout page when you pay by card. Our payment partner and CoinGecko see your IP address when the page asks them for a price, under their own policies.', 'You can clear everything from your browser settings at any time. Orders remain reachable through the link in the email.'],

      'legal.risk': 'Risk disclosure', 'legal.terms': 'Terms of use', 'legal.privacy': 'Privacy', 'legal.photos': 'Photo credits', 'legal.photosP': 'Food and storefront photos come from Wikimedia Commons under the licenses listed here. They illustrate the cuisine or the brand and are not provided by the restaurants.',
      'legal.riskB': ['<b>You can lose everything you put in.</b> Coins are created by users through unaudited smart contracts. A raise can close below its minimum, a graduated coin can fall to zero, and nothing here guarantees any value.', '<b>The contracts hold the funds, not us.</b> Nobody, including the creator of a coin or the operators of this site, can withdraw from a raise before it finalizes. Refunds and claims are executed by the contract only.', '<b>Stock tokens are issued by third parties.</b> MCDx, SBUXx, MEITx and the rest are issued by Backed, Binance or Ondo. Their price, redemption and availability depend on those issuers, not on the restaurants and not on this site.', '<b>Restaurants are not involved.</b> Names and logos identify the stock token a coin is paired with. No restaurant sponsors, endorses or issues anything here.', '<b>Nothing here is advice.</b> This site shows on-chain data and lets you send transactions from your own wallet. It is not an offer, a solicitation or financial advice, and it may be unavailable to you under local law.'],
      'legal.termsB': ['This website is an interface to open-source smart contracts on BNB Chain. By using it you confirm that you are allowed to use crypto assets in your jurisdiction and that you act on your own account and at your own risk.', 'Every action (creating a coin, buying, finalizing, claiming, refunding) is a transaction signed in your wallet. We do not hold keys, funds or tokens and cannot reverse, cancel or recover transactions.', 'The contracts are provided as is, without warranty. They are unaudited; bugs may exist and may cause loss of funds. A 1% fee on graduated raises is paid to the platform address set in the factory.', 'Coin names, tickers and raises are created by users. We do not review them and we may hide any of them from this interface without notice. Hiding does not affect the contract.', 'Brands and logos belong to their owners and are used only to identify the stock token each coin is paired with.'],
      'legal.privacyB': ['This page stores only your language, theme and a short-lived price cache in your browser (localStorage). It sets no cookies and has no accounts.', 'Wallet addresses and transactions are public on BNB Chain. Reading the board uses your wallet\'s RPC or a public BNB Chain node; prices come from CoinGecko. Those services see your IP address under their own policies.', 'We do not run analytics or trackers on this page.'],

      'docs.h2': 'Cómo funciona el launchpad', 'docs.full': 'Reglas completas', 'docs.1s': 'Cada coin se empareja con un restaurante cuya acción existe como token en BNB Chain (MCDx, SBUXx, MEITx y más). La recaudación se paga en ese token.', 'docs.2s': 'Fija un objetivo y una duración. Todos pagan la misma tasa, cada wallet puede poner una décima parte del objetivo y el contrato guarda los fondos hasta que cierra la recaudación.', 'docs.3s': 'Al llegar a un tercio del objetivo la coin se gradúa: el 99% de los fondos y el 20% del suministro van a un pool de PancakeSwap con la liquidez quemada, y los compradores reclaman el otro 80%. Si no, todos recuperan el 100%.',
      'docs.1h': 'Emparejada con un token real de una acción', 'docs.1a': 'Cada coin se empareja con un restaurante cuya acción existe como token en BNB Chain: McDonald\'s es MCDx, Starbucks SBUXx, Meituan MEITx, Haidilao HAIDLx, Mixue MIXUx, Wendy\'s WENB, etc. (xStocks de Backed, bStocks de Binance, Ondo Stocks).', 'docs.1b': 'El emparejamiento no es una etiqueta: la recaudación se paga en ese token y la coin cotiza en un pool contra él.', 'docs.1c': 'Los restaurantes sin acción tokenizada en BNB Chain (Luckin, Chagee, Guming, KFC China…) aún no se pueden emparejar. Los añadimos cuando un emisor los lista.', 'docs.1d': 'El restaurante no participa. El token lo emite un tercero y sigue el precio de la acción.',
      'docs.2h': 'La recaudación', 'docs.2a': 'Crear una coin despliega su token (1.000.000.000) y un contrato de recaudación desde tu wallet. Tú fijas el objetivo en el token de la acción y la duración.', 'docs.2b': 'Los compradores aprueban el token y compran. Todos reciben la misma tasa: objetivo ÷ suministro. Cada wallet puede poner como máximo una décima parte del objetivo.', 'docs.2c': 'El contrato guarda los fondos. Nadie, ni el creador, puede retirar antes de finalizar.', 'docs.2d': 'Alcanzar el objetivo cierra la recaudación al instante; si no, cierra en la fecha límite.',
      'docs.3h': 'Graduación o reembolso', 'docs.3a': 'Una vez cerrada, cualquiera puede pulsar Finalizar. Si se recaudó al menos un tercio del objetivo, la coin se gradúa.', 'docs.3b': 'La graduación pone el 99% de los tokens de la acción y el 20% del suministro en un pool COIN/ACCIÓN de PancakeSwap v2 y quema los tokens de liquidez, así que nadie puede retirar el pool. El 1% va a la plataforma.', 'docs.3c': 'Los compradores reclaman después el otro 80% del suministro en proporción a lo que pagaron.', 'docs.3d': 'Si no se alcanzó el mínimo, cada comprador recupera el 100% con Reembolsar.',
      'docs.4h': 'Pares verificados en BNB Chain', 'docs.4p': 'Cada token de abajo se comprobó en cadena (nombre, símbolo, decimales, suministro) y es en lo que se paga una recaudación emparejada con ese restaurante. Abre una tarjeta para ver el token, su emisor y las coins ya emparejadas, o copia la dirección en el buscador. Los contratos de lanzamiento son de código abierto (contracts/BentoLaunch.sol) y no están auditados: prueba primero en BNB Testnet.',
      'bottom': 'Dinero real. Las coins son contratos sin auditar creados por usuarios; puedes perder todo lo que pongas.',

      'gd.h2': 'Guías', 'gd.p': 'Guías cortas y prácticas para quien llega nuevo a las cripto, las tarjetas regalo o los launchpads. Sin jerga y sin promesas.', 'gd.read': 'Leer', 'gd.back': '← Todas las guías', 'gd.more': 'Más guías', 'gd.disc': 'Nada de esto es asesoramiento financiero. Las coins son contratos sin auditar creados por usuarios; puedes perder todo lo que pongas.',
      guides: {
        'buy-crypto': { title: 'Cómo comprar cripto y crear una wallet', sub: 'MetaMask o Binance, BNB o USDT, en tres pasos.', lead: 'Para usar BNB Bite con wallet necesitas dos cosas: una app de wallet y algo de BNB o USDT en BNB Chain. Las dos se consiguen en unos diez minutos.', body: ['## 1. Instala una wallet', 'MetaMask (extensión del navegador o app móvil) y Trust Wallet son las habituales. Instálala desde la web oficial, crea una wallet y apunta en papel la frase de recuperación de 12 palabras. Quien tenga esa frase tiene tu dinero: no la escribas nunca en una web, y BNB Bite jamás te la pedirá.', '## 2. Añade BNB Chain', 'MetaMask arranca en Ethereum. Abre el menú de redes y añade «BNB Smart Chain» (chain id 56). La primera vez que conectes en BNB Bite, la página se ofrece a añadirla por ti.', '## 3. Compra BNB o USDT', 'Lo más sencillo es un exchange: Binance, Coinbase, Kraken o Bybit. Compra BNB (o USDT) con tarjeta o transferencia y retíralo a la dirección de tu wallet eligiendo la red BEP20 / BNB Smart Chain. Suele llegar en un minuto. Guarda un poco de BNB para el gas: cada transacción en BNB Chain cuesta una fracción de céntimo.', '## Después', '- Tarjetas regalo: paga con BNB o USDT desde la wallet, o con cualquier otra moneda desde el propio exchange con la opción «Cualquier cripto».\n- Launchpad: las coins emparejadas con un token de acción se pagan en ese token (MCDx, SBUXx…). Lo consigues en PancakeSwap o en el emisor.', 'Si solo quieres una tarjeta regalo no necesitas wallet: elige «Cualquier cripto» y envía desde el exchange, o paga con tarjeta.'], cta: ['Ver tarjetas regalo', '#gifts'] },
        'gift-card-usdt': { title: 'Comprar una tarjeta de Starbucks con USDT', sub: 'Elige, paga y recibe el código por email. Cinco minutos.', lead: 'Una tarjeta regalo comprada en BNB Bite es una tarjeta digital real emitida por Bitrefill, un revendedor autorizado, solo después de confirmarse tu pago. Este es el proceso completo.', body: ['## 1. Elige la tarjeta', 'Abre Tarjetas regalo, elige la marca y el importe. Las tarjetas con valores fijos muestran botones; las demás aceptan cualquier importe dentro del rango. El total muestra el valor de la tarjeta, la comisión de servicio y el descuento si pagas con una wallet de BNB Chain.', '## 2. Di quién la recibe', 'Escribe el email del destinatario y un mensaje opcional, y elige cuándo se entrega: ahora mismo o en una fecha y hora (la mañana de un cumpleaños, por ejemplo). Con sesión iniciada con tu wallet también puedes guardarla en tu cuenta sin email.', '## 3. Paga', '- Wallet de BNB Chain: paga BNB o USDT desde la wallet conectada. La página comprueba la transacción en cadena.\n- Cualquier cripto: recibes una dirección y un importe exacto en la moneda que elijas (Bitcoin, Ethereum, Solana, USDT en Tron y más de 300). El pedido se actualiza solo cuando la red confirma.\n- Tarjeta: Stripe Checkout se abre en otra pestaña.', '## 4. Recibe', 'En cuanto se emite la tarjeta, el código aparece en la página del pedido, se envía por email al destinatario y se guarda en tu cuenta. Conserva el email: las tarjetas no admiten devolución y los códigos no se pueden reemitir.', 'Si algo falla después de pagar, el pedido muestra «fallido» y reembolsamos o reemitimos en cinco días laborables. Escríbenos desde la página de Ayuda con el número de pedido.'], cta: ['Comprar una tarjeta regalo', '#gifts'] },
        'tokenized-stocks': { title: '¿Qué es una acción tokenizada?', sub: 'MCDx, SBUXx y compañía: quién las emite y cómo siguen la acción.', lead: 'Una acción tokenizada es un token en una blockchain cuyo valor sigue a una acción cotizada. En BNB Chain, MCDx sigue a McDonald\'s, SBUXx a Starbucks y MEITx a Meituan.', body: ['## Quién las emite', 'Hoy hay tres emisores en BNB Chain: xStocks de Backed Finance (suizo, cada token respaldado uno a uno por acciones en un custodio), bStocks de Binance (BTech Holdings) y Ondo Stocks. BNB Bite lista 18 tokens de restaurantes de ellos, cada uno verificado en cadena por nombre, símbolo, decimales y suministro.', '## Cómo siguen el precio', 'El emisor guarda las acciones reales y emite o quema tokens según la gente compra y canjea. El arbitraje mantiene el precio del token cerca del de la acción en horario de mercado; fuera de horario el token sigue cotizando en cadena y puede desviarse. BNB Bite muestra el precio en USD en vivo de cada token con datos públicos de mercado, más el cambio en 24h.', '## Qué puedes hacer con ellas', '- Guardarlas en cualquier wallet de BNB Chain, como cualquier token.\n- Cambiarlas en PancakeSwap o en la plataforma del emisor.\n- Usarlas en BNB Bite: una coin emparejada con un restaurante se paga en el token de ese restaurante y se gradúa en un pool de PancakeSwap contra él.', '## Qué no son', 'No dan derecho a voto y, según el emisor, los dividendos pueden pasarse o no. La disponibilidad depende de dónde vivas: los emisores restringen algunos países. Lee las condiciones del emisor; los enlaces están en cada página de restaurante.'], cta: ['Ver los pares verificados', '#pairs'] },
        'paired-raise': { title: 'Cómo funciona una recaudación emparejada', sub: 'Objetivo, mínimo, tope por wallet, graduación y reembolsos, con un ejemplo.', lead: 'Cada coin de BNB Bite se crea con un objetivo en el token de la acción de un restaurante. El contrato guarda lo que ponen los compradores hasta que cierra la recaudación y entonces gradúa la coin o devuelve el dinero a todos.', body: ['## Los números', 'Supón que alguien crea ARCHES, emparejada con McDonald\'s, con un objetivo de 1.000 MCDx en 72 horas. El contrato fija: suministro 1.000.000.000; mínimo para graduarse 333 MCDx (un tercio del objetivo); tope por wallet 100 MCDx (una décima parte). Todos pagan la misma tasa: los tokens por MCDx son los mismos para el primer y el último comprador.', '## Comprar', 'Apruebas MCDx una vez y compras. Si tu compra superara tu tope o el objetivo, el contrato toma solo lo que cabe y devuelve el resto en la misma transacción. Alcanzar el objetivo cierra la recaudación antes de tiempo.', '## Graduación', 'Cuando la recaudación cierra con al menos el mínimo, cualquiera puede llamar a finalize: el 99% de los MCDx recaudados más el 20% del suministro van a un pool de PancakeSwap y los tokens LP se queman, así que la liquidez no se puede retirar. El 1% de la recaudación es la comisión de la plataforma. Después los compradores reclaman el 80% restante del suministro en proporción a lo que pusieron.', '## Reembolso', 'Si la recaudación cierra por debajo del mínimo, finalize la marca como fallida y cada comprador llama a refund para recuperar el 100% de sus MCDx. No se cobra comisión.', '## Qué mirar antes de comprar', '- El token emparejado y su emisor en la página de la coin.\n- El objetivo: demasiado alto y quizá nunca llegue al mínimo; demasiado bajo y el pool será pequeño.\n- El creador: abre su perfil para ver qué más ha lanzado.\n- Los contratos son de código abierto y no están auditados. Empieza en BNB Testnet.'], cta: ['Crear una coin', '#launch'] }

      'bottom.more': 'Aviso de riesgo', 'why.h2': 'Por qué BNB Bite', 'why.1h': 'Paga como quieras', 'why.1p': 'Las tarjetas regalo se pagan con una wallet de BNB Chain, con cualquiera de más de 300 criptomonedas a través de nuestro socio de pagos, o con tarjeta bancaria. La tarjeta llega por email en minutos y se queda en tu cuenta.', 'why.2h': 'Tokens de acciones reales, pools reales', 'why.2p': 'Las coins del launchpad se emparejan con acciones tokenizadas de restaurantes que existen en BNB Chain. La recaudación se paga en ese token y la liquidez se quema al graduarse, así que nadie puede retirarla.', 'why.3h': 'Nada escondido', 'why.3p': 'Contratos de código abierto, cada parámetro escrito en el contrato, precios y cambios en 24h de datos públicos, y avisos claros de lo que no está auditado o aún no está disponible.',
      'faq.h2': 'Preguntas', 'faqs': [['¿La tarjeta regalo es real?', 'Sí. Las tarjetas las emite Bitrefill, un revendedor autorizado de tarjetas regalo, solo después de confirmarse tu pago. Nunca generamos códigos nosotros. Si el suministro no está configurado en un despliegue, la tarjeta aparece como no disponible.'], ['¿Con qué criptomonedas puedo pagar?', 'BNB y USDT directamente desde tu wallet en BNB Chain, o cualquier moneda que admita nuestro socio de pagos: Bitcoin, Ethereum, Solana, USDT en varias redes, XRP, Litecoin, Dogecoin, TON y más. Recibes una dirección y un importe exacto; el pedido se actualiza solo cuando la red confirma.'], ['¿Puedo pagar con tarjeta?', 'Sí, a través de Stripe Checkout. Los datos de la tarjeta se introducen en la página de Stripe y nunca llegan a nuestro servidor.'], ['¿Cómo se entrega la tarjeta regalo?', 'En la página del pedido en cuanto se emite, por email al destinatario que indicaste y en tu cuenta si tenías sesión iniciada con tu wallet.'], ['¿Puedo pedir un reembolso?', 'Las tarjetas regalo no admiten devolución una vez emitidas. Si no se pudo emitir una tarjeta después de pagar, la reembolsamos o la reemitimos; consulta la política de reembolsos.'], ['¿Qué es el launchpad?', 'Un lugar para lanzar una coin emparejada con el token real de la acción de un restaurante. Los compradores pagan la recaudación en ese token; al graduarse, la coin cotiza en PancakeSwap contra él con la liquidez quemada. Los contratos son de código abierto y no están auditados: empieza en BNB Testnet.'], ['¿Los restaurantes son socios?', 'No. Los nombres, logotipos y fotos identifican la marca a la que se refiere una tarjeta regalo o un token de acción. Ningún restaurante patrocina, respalda ni emite nada aquí.']],
      'legal.refund': 'Política de reembolsos', 'legal.cookies': 'Cookies', 'legal.refundB': ['<b>Las tarjetas regalo no admiten devolución.</b> Un código es un instrumento al portador: una vez emitido y mostrado o enviado por email no se puede cancelar ni reembolsar, sea cual sea el método de pago.', '<b>Si no pudimos emitir la tarjeta</b> después de confirmarse tu pago (error del proveedor, sin stock), reembolsamos el importe completo a la wallet o tarjeta con la que pagaste, o reemitimos la tarjeta, en 5 días laborables. Contacta con soporte con tu número de pedido.', '<b>Los pagos en cripto que llegan tarde, incompletos o por la red equivocada</b> no siempre se pueden asociar a un pedido. Envía exactamente el importe indicado, por la red indicada, antes de que expire el contador. Los pagos parciales o caducados se reembolsan manualmente menos las comisiones de red cuando se pueden identificar.', '<b>Las recaudaciones del launchpad</b> se rigen por el contrato: los reembolsos ocurren en cadena con el botón Reembolsar cuando una recaudación cierra por debajo de su mínimo. No podemos revertir transacciones en cadena.'],

      'legal.riskB': ['<b>Puedes perder todo lo que pongas.</b> Las coins las crean usuarios con contratos inteligentes sin auditar. Una recaudación puede cerrar por debajo de su mínimo, una coin graduada puede caer a cero y nada aquí garantiza ningún valor.', '<b>Los fondos los guardan los contratos, no nosotros.</b> Nadie, ni el creador de una coin ni los operadores de este sitio, puede retirar de una recaudación antes de que finalice. Los reembolsos y las reclamaciones solo los ejecuta el contrato.', '<b>Los tokens de acciones los emiten terceros.</b> MCDx, SBUXx, MEITx y el resto los emiten Backed, Binance u Ondo. Su precio, canje y disponibilidad dependen de esos emisores, no de los restaurantes ni de este sitio.', '<b>Los restaurantes no participan.</b> Los nombres y logotipos identifican el token de acción con el que se empareja una coin. Ningún restaurante patrocina, respalda ni emite nada aquí.', '<b>Nada de esto es asesoramiento.</b> Este sitio muestra datos en cadena y te permite enviar transacciones desde tu propia wallet. No es una oferta, una solicitud ni asesoramiento financiero, y puede no estar disponible para ti según la ley local.'],

      guides: {
        'buy-crypto': { title: '如何购买加密货币并创建钱包', sub: 'MetaMask 或币安，BNB 或 USDT，三步完成。', lead: '用钱包使用 BNB Bite 需要两样东西：一个钱包应用，以及 BNB 链上的一些 BNB 或 USDT。两者加起来大约十分钟。', body: ['## 1. 安装钱包', '常用的是 MetaMask（浏览器扩展或手机应用）和 Trust Wallet。从官网安装，创建钱包，把 12 个助记词抄在纸上。拿到助记词的人就拿到了你的钱：永远不要在网站里输入，BNB Bite 也永远不会索要。', '## 2. 添加 BNB 链', 'MetaMask 默认在以太坊。打开网络菜单添加「BNB Smart Chain」（链 ID 56）。第一次在 BNB Bite 连接钱包时，页面会主动帮你添加。', '## 3. 购买 BNB 或 USDT', '最简单的路径是交易所：币安、Coinbase、Kraken 或 Bybit。用银行卡或转账买入 BNB（或 USDT），然后提现到你的钱包地址，网络选 BEP20 / BNB Smart Chain。提现通常一分钟到账。留一点 BNB 作为手续费：BNB 链上每笔交易只要几分钱。', '## 然后', '- 礼品卡：用钱包里的 BNB 或 USDT 支付，或通过「任意加密货币」直接从交易所转账。\n- 发射台：与股票代币配对的代币用该代币（MCDx、SBUXx…）支付，可在 PancakeSwap 或发行方处获得。', '如果只想买礼品卡，根本不需要钱包：选「任意加密货币」从交易所转账，或者刷卡。'], cta: ['浏览礼品卡', '#gifts'] },
        'gift-card-usdt': { title: '用 USDT 买星巴克礼品卡', sub: '选卡、付款、邮件收码，五分钟。', lead: '在 BNB Bite 买到的礼品卡是持牌经销商 Bitrefill 在你付款确认后才发出的真实电子礼品卡。完整流程如下。', body: ['## 1. 选卡', '打开礼品卡，选品牌和面额。固定面额的卡显示按钮，其他的可在范围内任意输入。合计会显示卡面值、服务费，以及用 BNB 链钱包支付时的折扣。', '## 2. 填写收件人', '输入收件人邮箱和可选的留言，并选择送达时间：立即，或指定日期和时间（比如生日早上）。用钱包登录后也可以不填邮箱，把卡保存在账户里。', '## 3. 支付', '- BNB 链钱包：用已连接的钱包支付 BNB 或 USDT，页面会在链上核验交易。\n- 任意加密货币：你会得到所选币种的地址和精确金额（比特币、以太坊、Solana、波场 USDT 等 300 多种）。网络确认后订单自动更新。\n- 银行卡：在新标签页打开 Stripe Checkout。', '## 4. 收卡', '卡一发出，卡码就会显示在订单页、发送到收件人邮箱并保存在你的账户里。请保留邮件：礼品卡售出不退，卡码无法重发。', '如果付款后出现问题，订单会显示「失败」，我们会在五个工作日内退款或重新发卡。请通过帮助页联系我们并附上订单号。'], cta: ['购买礼品卡', '#gifts'] },
        'tokenized-stocks': { title: '什么是股票代币？', sub: 'MCDx、SBUXx 等：谁发行，如何跟踪股价。', lead: '股票代币是区块链上价值跟随上市公司股票的代币。在 BNB 链上，MCDx 跟踪麦当劳，SBUXx 跟踪星巴克，MEITx 跟踪美团。', body: ['## 谁在发行', 'BNB 链上目前有三家发行方：Backed Finance 的 xStocks（瑞士，每个代币由托管机构持有的股票一比一支持）、币安的 bStocks（BTech Holdings）和 Ondo Stocks。BNB Bite 收录了其中 18 个餐饮股票代币，每个都在链上核验了名称、代码、精度和供应量。', '## 如何跟踪价格', '发行方持有真实股票，随买入和赎回铸造或销毁代币。交易时段内套利使代币价格贴近股价；休市时代币仍在链上交易，可能出现偏离。BNB Bite 用公开行情显示每个代币的实时美元价格和 24 小时涨跌。', '## 能用来做什么', '- 像任何代币一样存在 BNB 链钱包里。\n- 在 PancakeSwap 或发行方平台交易。\n- 在 BNB Bite 使用：与某品牌配对的代币以该品牌的股票代币支付，毕业后在 PancakeSwap 与之配对上市。', '## 它不是什么', '你没有投票权，分红是否传递取决于发行方。可用性取决于你所在的国家：发行方限制部分地区。请阅读发行方条款，链接在每个品牌页。'], cta: ['查看已验证配对', '#pairs'] },
        'paired-raise': { title: '配对募集怎么运作', sub: '目标、最低线、每钱包上限、毕业与退款，附例子。', lead: 'BNB Bite 上的每个代币都以某餐饮品牌的股票代币设定目标。合约保管买家投入的资金直到募集结束，然后要么毕业，要么全额退款。', body: ['## 数字', '假设有人创建了与麦当劳配对的 ARCHES，目标 1,000 MCDx，时长 72 小时。合约固定：供应量 1,000,000,000；毕业最低线 333 MCDx（目标的三分之一）；每钱包上限 100 MCDx（十分之一）。所有人汇率相同：第一个和最后一个买家每 MCDx 得到的代币一样多。', '## 买入', '先授权一次 MCDx，然后买入。如果你的买入会超过上限或目标，合约只收下能容纳的部分，其余在同一笔交易中退回。达到目标即提前结束。', '## 毕业', '募集结束时达到最低线，任何人都可以调用 finalize：募得 MCDx 的 99% 加上 20% 的供应量进入 PancakeSwap 池，LP 代币销毁，流动性无法撤走。募集的 1% 是平台费。买家随后按投入比例领取剩余 80% 的供应量。', '## 退款', '如果结束时低于最低线，finalize 标记为失败，每位买家调用 refund 取回 100% 的 MCDx，不收任何费用。', '## 买之前看什么', '- 代币页上的配对代币和发行方。\n- 目标：太高可能永远达不到最低线，太低则池子太浅。\n- 创建者：打开其主页看看还发行过什么。\n- 合约开源但未经审计。请先在 BNB 测试网试。'], cta: ['创建代币', '#launch'] }

    await sendTx(async (s) => { const r = new E.Contract(addr, RAISE_ABI, s); return C.isBnb ? r.buy({ value: v }) : r.buyWith(v); });
  }

  let toastTimer;
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c); const ctx = c.getContext('2d'); const W = c.width = innerWidth, H = c.height = innerHeight;
    const cols = ['#F0B90B', '#FF5A1F', '#05944F', '#111111', '#FFFFFF', '#C99A00'];
    const P = Array.from({ length: 110 }, () => ({ x: W / 2 + (Math.random() - .5) * 240, y: H * .42, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5, r: 5 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * Math.PI, s: (Math.random() - .5) * .35 }));
    const t0 = performance.now();
    const tick = (now) => { const k = (now - t0) / 1800; ctx.clearRect(0, 0, W, H); for (const q of P) { q.x += q.vx; q.y += q.vy; q.vy += .32; q.vx *= .99; q.a += q.s; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.a); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, k - .5) * 2); ctx.fillStyle = q.c; ctx.fillRect(-q.r / 2, -q.r / 2, q.r, q.r * .6); ctx.restore(); } if (k < 1) requestAnimationFrame(tick); else c.remove(); };
    requestAnimationFrame(tick);
  }
  document.addEventListener('pointerdown', (e) => { const b = e.target.closest('.btn-ink'); if (!b) return; const r = b.getBoundingClientRect(); const sp = document.createElement('span'); sp.className = 'ripple'; sp.style.left = (e.clientX - r.left) + 'px'; sp.style.top = (e.clientY - r.top) + 'px'; b.appendChild(sp); setTimeout(() => sp.remove(), 700); });

    document.addEventListener('pointerout', (e) => { const c = e.target.closest(TILT); if (c && !c.contains(e.relatedTarget)) { c.classList.remove('tilt'); c.style.removeProperty('--rx'); c.style.removeProperty('--ry'); } });

  window.addEventListener('scroll', () => { const h = $('.hdr'); if (h) h.classList.toggle('is-scrolled', window.scrollY > 8); }, { passive: true });

  function setTab(tb) { state.tab = tb; $$('[data-tab]').forEach((b) => b.classList.toggle('is-on', b.dataset.tab === tb)); renderRows(); }

    const mb = e.target.closest('[data-mb]'); if (mb) { $$('.mbar button').forEach((x) => x.classList.toggle('is-on', x === mb)); const k = mb.dataset.mb; state.open = null; renderRows();

    const ap = e.target.closest('[data-approve]'); if (ap) { approve(ap.dataset.approve); return; }
    const b = e.target.closest('[data-buy]'); if (b) { buy(b.dataset.buy); return; }

    const fv = e.target.closest('[data-fav]'); if (fv) { const a = fv.dataset.fav; if (FAV.has(a)) FAV.delete(a); else FAV.add(a); saveFav(); toast(t(FAV.has(a) ? 'fav.on' : 'fav.off')); renderStats(); renderRows(); return; }

    const sh = e.target.closest('[data-share]'); if (sh) { const C = list().find((x) => x.addr === sh.dataset.share); if (C) shareCard(C); return; }
    const cpst = e.target.closest('[data-cpost]'); if (cpst) { postComment(cpst.dataset.cpost); return; }
    const al = e.target.closest('[data-alert]'); if (al) { subscribeAlert(al.dataset.alert); return; }
    const gw = e.target.closest('[data-gwhen]'); if (gw) { GS.when = gw.dataset.gwhen; GS.email = ($('#gemail') || {}).value || GS.email; GS.message = ($('#gmsg') || {}).value || GS.message; renderRows(); return; }

    if (e.target.closest('#install')) { installApp(); return; }
    if (e.target.closest('#totop')) { window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); return; }
    const open = e.target.closest('[data-open]'); if (open) { setOpen(open.dataset.open); return; }
    const rail = e.target.closest('[data-rail]'); if (rail) { const el = $('#' + rail.dataset.rail); el.scrollBy({ left: Number(rail.dataset.dir) * el.clientWidth * 0.8, behavior: 'smooth' }); return; }
    if (e.target.closest('#cartbtn')) { setTab('mine'); go('coins'); return; }
    const tab = e.target.closest('[data-tab]'); if (tab) { setTab(tab.dataset.tab); go('coins'); return; }
    if (e.target.closest('#burger')) { if (matchMedia('(max-width: 1000px)').matches) { const on = $('#side').classList.toggle('is-open'); $('#side-scrim').classList.toggle('is-on', on); $('#burger').setAttribute('aria-expanded', String(on)); } else { const c = $('.shell').classList.toggle('collapsed'); $('#burger').setAttribute('aria-expanded', String(!c)); try { localStorage.setItem('bento.side', c ? '0' : '1'); } catch {} } return; }
    if (e.target.closest('#side-scrim')) { $('#side').classList.remove('is-open'); $('#side-scrim').classList.remove('is-on'); return; }
    if (e.target.closest('#bottom-x')) { $('#bottom').hidden = true; return; }
    if (e.target.closest('.side a')) { $('#side').classList.remove('is-open'); $('#side-scrim').classList.remove('is-on'); }
    const cat = e.target.closest('[data-cat]'); if (cat) { state.cat = cat.dataset.cat; $$('[data-cat]').forEach((x) => x.classList.toggle('is-on', x.dataset.cat === state.cat)); renderRows(); go('coins'); }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'gcustom') { const v = Number(e.target.value); GS.custom = e.target.value; GS.email = ($('#gemail') || {}).value || GS.email; GS.message = ($('#gmsg') || {}).value || GS.message; if (v > 0) { GS.value = v; renderRows(); } } if (e.target.id === 'gcur') GS.currency = e.target.value; });
  document.addEventListener('input', (e) => { if (e.target.id === 'gemail') GS.email = e.target.value; if (e.target.id === 'gmsg') GS.message = e.target.value; if (e.target.id === 'gdate') GS.deliverAt = e.target.value; if (e.target.id === 'amt') { const C = list().find((x) => x.addr === state.open); const el = $('#sim'); if (C && el) el.textContent = simText(C, Number(e.target.value)); } });

  $('#q').addEventListener('input', (e) => { state.q = e.target.value; if (e.target.value && VIEW !== 'coins' && !/0x[0-9a-fA-F]{40}/.test(e.target.value)) go('coins'); renderRows(); addrSearch(e.target.value); });
  const onNav = () => { const r = route(); if (r === 'open') { if (!VIEW) setView('home'); renderRows(); } else if (r === 'net') { state.coins = []; state.loaded = false; render(); loadCoins(); } else if (r === null && !VIEW) setView('home'); }; window.addEventListener('hashchange', onNav); window.addEventListener('popstate', onNav);
  $('#sort')?.addEventListener('change', (e) => { state.sort = e.target.value; renderRows(); });
  $('#pay')?.addEventListener('change', (e) => { state.pay = e.target.value; renderRows(); });
  $('#launch-form').addEventListener('submit', launchCoin);
  ['c-name', 'c-tick', 'c-rest', 'c-goal', 'c-window'].forEach((id) => $('#' + id).addEventListener('input', renderPreview));
  document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if ($('#side').classList.contains('is-open')) { $('#side').classList.remove('is-open'); $('#side-scrim').classList.remove('is-on'); return; } if (!$('#modal').hidden) { $('#modal').hidden = true; return; } if (state.open) setOpen(null); });

    if (k === 'photos') $('#modal-b').innerHTML = `<p>${t('legal.photosP')}</p><div class="credits">${Object.entries(PHOTO_CREDITS).map(([id, c]) => `<div><img src="photos/${id}.webp" alt="" loading="lazy"><span><a href="${esc(c.page)}" target="_blank" rel="noopener">${esc(c.title.replace(/^File:/, ''))}</a><br>${esc(c.artist || 'Wikimedia Commons')} · ${esc(c.license)}</span></div>`).join('')}</div>`;
    else $('#modal-b').innerHTML = (T['legal.' + k + 'B'] || I18N.en['legal.' + k + 'B']).map((p) => `<p>${p}</p>`).join('');
    m.hidden = false; m.querySelector('.close').focus(); }
  $('#netsel').addEventListener('change', (e) => { state.chainId = Number(e.target.value); state.coins = []; state.loaded = false; state.loadError = null; state.open = null; state.buys = {}; chainRef.at = 0; render(); loadCoins(); loadPrices(); });

  const root = document.documentElement; const themeBtn = $('#theme');
  const prefersLight = () => matchMedia('(prefers-color-scheme: light)').matches;
  const THEME_ICON = { light: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>', dark: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' };
  function applyTheme(th) { root.dataset.theme = th; themeBtn.innerHTML = THEME_ICON[th] || THEME_ICON.light; try { localStorage.setItem('bento.theme', th); } catch {} }

  setInterval(() => { const now = Date.now(); $$('[data-countdown]').forEach((el) => { const C = list().find((x) => x.addr === el.dataset.countdown); if (C) el.textContent = closeText(C, now); }); }, 1000);
  setInterval(() => { if (state.loaded && !state.loadError && !state.busy) loadCoins(); }, 20000);

  (function start() {
    let lang = null; try { lang = localStorage.getItem('bento.lang'); } catch {}
    if (!lang || !I18N[lang]) lang = 'en';
