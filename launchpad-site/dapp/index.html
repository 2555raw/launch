<title>Bento Launchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: marketplace app in the Uber Eats mould. A 56px top bar with a wide
   search field, a left sidebar of destinations, and a content column: a row
   of category tiles, filter pills, three promo banners, then a grid of coin
   cards. A right-hand drawer opens for the selected coin. White ground,
   near-black text, one green. Light first; dark is what the toggle swaps to. */
:root {
  --bg: #FFFFFF; --bg-alt: #F7F7F7; --card: #FFFFFF; --card-hi: #F6F6F6; --surface: #EEEEEE; --tile: #F3F3F3;
  --ink: #141414; --muted: #6B6B6B; --dim: #9B9B9B; --prose: #333333;
  --line: #E8E8E8; --line-hi: #D6D6D6;
  --green: #06C167; --green-ink: #05944F; --green-soft: #E9F9F0; --green-deep: #0E8345; --on-green: #FFFFFF;
  --gold: #06C167; --gold-ink: #05944F; --gold-soft: #E9F9F0; --on-gold: #FFFFFF;
  --up: #05944F; --down: #E11900;
  --font: 'Plus Jakarta Sans', 'Noto Sans SC', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --bg-alt: #181818; --card: #1C1C1C; --card-hi: #242424; --surface: #2C2C2C; --tile: #262626;
    --ink: #F2F2F2; --muted: #A6A6A6; --dim: #777777; --prose: #D9D9D9;
    --line: #2A2A2A; --line-hi: #3A3A3A;
    --green: #06C167; --green-ink: #3DDC84; --green-soft: rgba(6,193,103,.14); --green-deep: #0E8345; --on-green: #FFFFFF;
    --gold: #06C167; --gold-ink: #3DDC84; --gold-soft: rgba(6,193,103,.14); --on-gold: #FFFFFF;
    --up: #3DDC84; --down: #FF6B5E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --bg-alt: #181818; --card: #1C1C1C; --card-hi: #242424; --surface: #2C2C2C; --tile: #262626;
  --ink: #F2F2F2; --muted: #A6A6A6; --dim: #777777; --prose: #D9D9D9;
  --line: #2A2A2A; --line-hi: #3A3A3A;
  --green: #06C167; --green-ink: #3DDC84; --green-soft: rgba(6,193,103,.14); --green-deep: #0E8345; --on-green: #FFFFFF;
  --gold: #06C167; --gold-ink: #3DDC84; --gold-soft: rgba(6,193,103,.14); --on-gold: #FFFFFF;
  --up: #3DDC84; --down: #FF6B5E;
  color-scheme: dark;
}
:root[lang="zh"] { --up: #E11900; --down: #05944F; }
@media (prefers-color-scheme: dark) { :root[lang="zh"]:not([data-theme="light"]) { --up: #FF6B5E; --down: #3DDC84; } }
:root[data-theme="dark"][lang="zh"] { --up: #FF6B5E; --down: #3DDC84; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
h1 { font-size: 24px; } h2 { font-size: 20px; } h3 { font-size: 15px; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; transition: filter .12s ease, background .12s ease; }
.btn:hover { filter: brightness(.97); }
.btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn-gold { background: var(--ink); color: var(--bg); }
.btn-gold:disabled { opacity: .4; cursor: not-allowed; }
.btn-green { background: var(--green); color: var(--on-green); }
.btn-ghost { background: var(--surface); color: var(--ink); }
.btn-danger { background: var(--down); color: #fff; }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.btn-block { width: 100%; }
.input, .select, .textarea { width: 100%; background: var(--card-hi); border: 1px solid transparent; border-radius: 8px; padding: 10px 12px; outline: 0; font-size: 14px; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--ink); background: var(--card); }
.textarea { resize: vertical; min-height: 64px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface); color: var(--muted); white-space: nowrap; }
.tag.live { background: var(--green-soft); color: var(--green-ink); }
.tag.ok { background: var(--green-soft); color: var(--green-ink); }
.tag.failed { background: rgba(225,25,0,.1); color: var(--down); }
.tag.soon { color: var(--ink); }
.bar { height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; transition: width .4s ease; }
.bar.ok i { background: var(--green-deep); } .bar.failed i { background: var(--down); } .bar.soon i { background: var(--line-hi); }

/* top bar */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); border-bottom: 1px solid var(--line); }
.hdr-in { display: flex; align-items: center; gap: 12px; height: 60px; padding-inline: 16px; min-width: 0; }
.hdr-right { flex: none; }
.burger { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 999px; display: grid; place-items: center; cursor: pointer; }
.burger:hover { background: var(--surface); }
.brand { display: inline-flex; align-items: center; gap: 2px; font-weight: 800; font-size: 20px; letter-spacing: -.02em; margin-right: 6px; white-space: nowrap; }
.brand em { font-style: normal; color: var(--green-ink); }
.pill-tabs { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; }
.pill-tabs button { font-size: 13px; font-weight: 600; color: var(--ink); background: transparent; border: 0; padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.pill-tabs button.is-on { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.where { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.where span { color: var(--muted); font-weight: 500; }
.search { flex: 1 1 80px; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 999px; padding: 0 14px; color: var(--muted); }
.search input { background: transparent; border: 0; outline: 0; padding: 11px 0; width: 100%; font-size: 14px; color: var(--ink); }
.hdr-right { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer; font-size: 14px; color: var(--ink); }
.lang { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; }
.lang button { font-size: 12px; font-weight: 700; color: var(--muted); background: transparent; border: 0; padding: 5px 9px; border-radius: 999px; cursor: pointer; }
.lang button.is-on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.player { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 4px; min-width: 0; }
.player .dot-ok { width: 10px; height: 10px; border-radius: 999px; background: var(--green); margin-left: 6px; flex: none; }
.player .nm { font-size: 13px; font-weight: 600; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .cash { font-family: var(--mono); font-size: 12.5px; color: var(--green-ink); font-weight: 600; white-space: nowrap; }
@media (max-width: 1100px) { .where { display: none; } }
@media (max-width: 860px) { .pill-tabs, .player .nm { display: none; } .brand { font-size: 18px; } }
@media (max-width: 640px) { .hdr-in { gap: 8px; padding-inline: 12px; } .hdr-right .btn-gold, .hdr-right #theme { display: none; } .player .cash { font-size: 12px; } .brand em { display: none; } }

/* shell: sidebar + content */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 60px); }
.side { border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 60px); overflow: auto; }
.side a, .side button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink); background: transparent; border: 0; cursor: pointer; text-align: left; }
.side a:hover, .side button:hover { background: var(--surface); }
.side .is-on { background: var(--surface); box-shadow: inset 3px 0 0 var(--ink); }
.side svg { width: 20px; height: 20px; flex: none; }
.side hr { border: 0; border-top: 1px solid var(--line); margin: 10px 6px; }
.side .stats { padding: 8px 12px; display: grid; gap: 6px; }
.side .stats div { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.side .stats b { font-family: var(--mono); color: var(--ink); font-weight: 600; }
.content { padding: 14px 24px 60px; min-width: 0; }
@media (max-width: 1000px) { .shell { grid-template-columns: minmax(0, 1fr); } .side { display: none; } .side.is-open { display: block; position: fixed; inset: calc(60px + env(safe-area-inset-top, 0px)) auto 0 0; width: 260px; background: var(--bg); z-index: 45; box-shadow: 8px 0 30px rgba(0,0,0,.12); } .content { padding: 12px 16px 60px; } }

/* category tiles */
.cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px 0 8px; margin-bottom: 6px; max-width: 100%; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; display: grid; justify-items: center; gap: 6px; width: 84px; padding: 8px 4px; border: 0; background: transparent; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink); }
.cats button:hover { background: var(--surface); }
.cats button.is-on { background: var(--surface); }
.cats .ic { width: 56px; height: 56px; border-radius: 999px; background: var(--tile); display: grid; place-items: center; font-size: 28px; line-height: 1; }
.cats button.is-on .ic { box-shadow: 0 0 0 2px var(--ink); }

/* filter pills */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 0; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; white-space: nowrap; }
.pill.is-on { background: var(--ink); color: var(--bg); }
.pill select { background: transparent; border: 0; outline: 0; font-weight: 600; cursor: pointer; }
.pill select option { color: #141414; }
.howto { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
.howto a { text-decoration: underline; }

/* promo banners */
.banners { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 26px; }
@media (max-width: 1100px) { .banners { grid-template-columns: 1fr 1fr; } }
@media (max-width: 700px) { .banners { grid-template-columns: 1fr; } }
.banner { position: relative; overflow: hidden; border-radius: 16px; background: var(--green); color: #fff; padding: 18px; min-height: 168px; display: grid; align-content: space-between; gap: 14px; cursor: pointer; }
.banner.dark { background: var(--green-deep); }
.banner.ink { background: var(--ink); color: var(--bg); }
.banner h3 { font-size: 19px; font-weight: 800; line-height: 1.2; max-width: 62%; color: inherit; }
.banner p { font-size: 13px; opacity: .92; max-width: 62%; }
.banner .cta { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #141414; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; width: max-content; }
.banner .art { position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 150px; height: 150px; border-radius: 999px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
.banner .art .logo { width: 84px; height: 84px; border: 0; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.banner .art .big { font-size: 64px; line-height: 1; }

/* section header + grid */
.sec-h { display: flex; align-items: baseline; gap: 12px; margin: 8px 0 12px; }
.sec-h h2 { margin-right: auto; }
.sec-h .more { font-size: 14px; font-weight: 600; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 18px 16px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; cursor: pointer; min-width: 0; }
.row-img { position: relative; aspect-ratio: 16 / 10; border-radius: 12px; background: var(--tile); display: grid; place-items: center; overflow: hidden; }
.row-img .logo { width: 72px; height: 72px; border: 0; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.row:hover .row-img .logo { transform: scale(1.04); transition: transform .15s ease; }
.row-img .tag { position: absolute; left: 10px; top: 10px; }
.row-img .you { position: absolute; right: 10px; top: 10px; font-family: var(--mono); font-size: 11px; font-weight: 700; background: #fff; color: var(--green-ink); padding: 3px 8px; border-radius: 999px; }
.row-img .bar { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 5px; background: rgba(0,0,0,.12); }
.row.is-open .row-img { box-shadow: 0 0 0 2px var(--ink); }
.row-top { display: flex; align-items: flex-start; gap: 8px; }
.row-name { min-width: 0; flex: 1; }
.row-name b { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-name b .tk { font-family: var(--mono); font-weight: 600; color: var(--muted); font-size: 13px; margin-left: 6px; }
.row-name small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-name .by { color: var(--green-ink); }
.row .act button { width: 34px; height: 34px; border-radius: 999px; border: 0; background: var(--surface); color: var(--ink); font-weight: 800; cursor: pointer; display: grid; place-items: center; font-size: 16px; }
.row .act button.gold { background: var(--ink); color: var(--bg); }
.prog { display: grid; gap: 4px; }
.prog small { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; min-width: 0; }
.prog small > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.prog small b { color: var(--ink); font-weight: 700; }
.prog small .star { color: var(--green-ink); font-weight: 700; }
.row-pair { display: none; }
.row-meta { display: none; }
.logo { width: 40px; height: 40px; border-radius: 999px; flex: none; display: grid; place-items: center; overflow: hidden; background: #FFFFFF; border: 1px solid var(--line); }
.logo img { width: 100%; height: 100%; object-fit: contain; padding: 14%; display: block; }
.logo.is-mono { background: var(--surface); color: var(--ink); font-weight: 800; }
.logo.is-mono::after { content: attr(data-m); }
.empty { padding: 36px; text-align: center; color: var(--muted); font-size: 14px; grid-column: 1 / -1; }
.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.app.has-drawer { grid-template-columns: minmax(0, 1fr) 380px; }
@media (max-width: 1200px) { .app.has-drawer { grid-template-columns: minmax(0, 1fr); } .drawer { position: fixed; inset: auto 0 0 0; max-height: 88vh; border-radius: 16px 16px 0 0; z-index: 50; box-shadow: 0 -8px 30px rgba(0,0,0,.18); } }

/* drawer */
.drawer { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; align-content: start; position: sticky; top: calc(72px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 90px); overflow: auto; }
.drawer-h { display: flex; align-items: center; gap: 10px; }
.drawer-h .logo { width: 48px; height: 48px; }
.drawer-h .who { min-width: 0; flex: 1; }
.drawer-h .who b { display: block; font-size: 17px; font-weight: 800; }
.drawer-h .who small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer .close { width: 30px; height: 30px; border-radius: 999px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 700; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv div { background: var(--card-hi); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.kv small { display: block; font-size: 11.5px; color: var(--muted); }
.kv b { display: block; margin-top: 2px; font-family: var(--mono); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blurb { font-size: 13.5px; color: var(--prose); line-height: 1.5; }
.buy { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.buy label { display: grid; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.buy .amt { position: relative; }
.buy .amt .input { padding-right: 52px; font-family: var(--mono); }
.buy .amt span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); font-weight: 700; }
.buy .quick { display: flex; gap: 6px; }
.buy .quick button { flex: 1; font-family: var(--mono); font-size: 12.5px; background: var(--surface); border: 0; color: var(--ink); border-radius: 999px; padding: 7px 0; cursor: pointer; font-weight: 600; }
.buy .note { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.buy .err { font-size: 12.5px; color: var(--down); }
.dl { display: grid; }
.dl .li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; min-width: 0; }
.dl .li:first-child { border-top: 0; }
.dl .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl .v { font-family: var(--mono); white-space: nowrap; }
.dl .d { font-family: var(--mono); white-space: nowrap; color: var(--muted); font-size: 11.5px; }
.h-sm { font-size: 12px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }

/* launch */
.launch { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .launch { grid-template-columns: 1fr; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
.panel label { display: grid; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.err { font-size: 12.5px; color: var(--down); }

/* tables */
.tbl { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.tbl .tr { display: grid; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13.5px; min-width: 0; }
.tbl .tr:first-child { border-top: 0; }
.tbl .th { font-size: 12px; color: var(--muted); font-weight: 700; background: var(--card-hi); }
.tbl .tr.me-row { background: var(--green-soft); }
.tbl .c { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl .r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tbl .logo { width: 28px; height: 28px; }
.tbl .av { width: 24px; height: 24px; border-radius: 999px; display: inline-block; vertical-align: middle; margin-right: 6px; }
.tbl .with { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tbl .with span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cols-pos { grid-template-columns: 2fr 1fr 1fr 1fr; }
.cols-lb { grid-template-columns: 30px 2fr 1fr 1fr; }
.cols-act { grid-template-columns: 2fr 1.4fr 1fr; }
.three { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 16px; }
@media (max-width: 1100px) { .three { grid-template-columns: 1fr 1fr; } .three > :first-child { grid-column: 1 / -1; } }
@media (max-width: 720px) { .three { grid-template-columns: 1fr; } }
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.summary div { background: var(--card-hi); border-radius: 10px; padding: 9px 11px; min-width: 0; }
.summary small { display: block; font-size: 11.5px; color: var(--muted); }
.summary b { display: block; margin-top: 2px; font-family: var(--mono); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 560px) { .summary { grid-template-columns: repeat(2, 1fr); } }

/* docs */

    if (e.target.closest('[data-connect], #connect')) { connect(); return; }
    if (e.target.closest('[data-switch]')) { ensureNetwork().then(render); return; }
    if (e.target.closest('#refresh')) { loadCoins(); return; }
    if (e.target.closest('[data-close]')) { state.open = null; renderRows(); return; }
    const chip = e.target.closest('[data-amt]'); if (chip) { const inp = $('#amt'); if (inp) inp.value = chip.dataset.amt; return; }
    const b = e.target.closest('[data-buy]'); if (b) { buy(b.dataset.buy); return; }
    const f = e.target.closest('[data-finalize]'); if (f) { sendTx(async (s) => new E.Contract(f.dataset.finalize, RAISE_ABI, s).finalize()); return; }
    const c = e.target.closest('[data-claim]'); if (c) { sendTx(async (s) => new E.Contract(c.dataset.claim, RAISE_ABI, s).claim()); return; }
    const r = e.target.closest('[data-refund]'); if (r) { sendTx(async (s) => new E.Contract(r.dataset.refund, RAISE_ABI, s).refund()); return; }
    const open = e.target.closest('[data-open]'); if (open) { state.open = open.dataset.open; renderRows(); return; }
    const tab = e.target.closest('[data-tab]'); if (tab) { setTab(tab.dataset.tab); $('#explore')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (e.target.closest('#pill-live')) { state.liveOnly = !state.liveOnly; $('#pill-live').classList.toggle('is-on', state.liveOnly); renderRows(); return; }
    if (e.target.closest('#pill-mine')) { setTab(state.tab === 'mine' ? 'trending' : 'mine'); return; }
    if (e.target.closest('#burger')) { $('#side').classList.toggle('is-open'); return; }
    if (e.target.closest('#bottom-x')) { $('#bottom').hidden = true; return; }
    if (e.target.closest('.side a')) { $('#side').classList.remove('is-open'); }
    const cat = e.target.closest('#cat button'); if (cat) { $$('#cat button').forEach((x) => x.classList.toggle('is-on', x === cat)); state.cat = cat.dataset.cat; renderRows(); }
  });
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; renderRows(); });
  $('#sort').addEventListener('change', (e) => { state.sort = e.target.value; renderRows(); });
  $('#launch-form').addEventListener('submit', launchCoin);
  ['c-name', 'c-tick', 'c-rest', 'c-goal', 'c-window'].forEach((id) => $('#' + id).addEventListener('input', renderPreview));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open) { state.open = null; renderRows(); } });

  const root = document.documentElement; const themeBtn = $('#theme');
  const prefersLight = () => matchMedia('(prefers-color-scheme: light)').matches;
  function applyTheme(th) { root.dataset.theme = th; themeBtn.textContent = th === 'light' ? '☾' : '☀'; try { localStorage.setItem('bento.theme', th); } catch {} }
  let savedTheme = null; try { savedTheme = localStorage.getItem('bento.theme'); } catch {}
  if (savedTheme) applyTheme(savedTheme); else themeBtn.textContent = prefersLight() ? '☾' : '☀';
  themeBtn.addEventListener('click', () => applyTheme((root.dataset.theme || (prefersLight() ? 'light' : 'dark')) === 'light' ? 'dark' : 'light'));
  $('#year').textContent = String(new Date().getFullYear());
  setInterval(() => { const now = Date.now(); $$('[data-countdown]').forEach((el) => { const C = list().find((x) => x.addr === el.dataset.countdown); if (C) el.textContent = closeText(C, now); }); }, 1000);
  setInterval(() => { if (state.loaded && !state.loadError && !state.busy) loadCoins(); }, 20000);

  /* ---------- boot ---------- */
  (function start() {
    let lang = null; try { lang = localStorage.getItem('bento.lang'); } catch {}
    if (!lang || !I18N[lang]) lang = 'en';
    const h = (location.hash || '').replace('#', ''); if (h === 'mainnet') state.chainId = 56; if (h === 'testnet') state.chainId = 97;
    setLang(lang);
    if (!E) { $('#rows').innerHTML = `<p class="empty">ethers.js failed to load.</p>`; return; }
    loadCoins();
  })();
})();
</script>
