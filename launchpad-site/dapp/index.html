<title>BNB Bite</title>
<meta name="description" content="BNB Bite: restaurant gift cards paid with any crypto or card, and a BNB Chain launchpad where every coin is paired with a real tokenized restaurant stock.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="BNB Bite"><meta property="og:description" content="Restaurant gift cards for crypto and a restaurant-paired launchpad on BNB Chain."><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a marketplace home in the proportions of a food-delivery site at 1920px.
   64px top bar (menu, wordmark, mode pill, place pill, 48px search, wallet),
   240px sidebar, content column: category strip, filter pills, three promo
   banners, "Featured" row of four cards, "New today" row, then the full grid.
   A side sheet opens for the selected coin. Figtree stands in for the site's
   proprietary face. White ground, black text, one green. */
:root {
  --bg: #FFFFFF; --bg-alt: #FAFAFA; --card: #FFFFFF; --surface: #F3F3F3; --surface-hi: #E8E8E8; --tile: #F6F6F6;
  --ink: #000000; --muted: #545454; --dim: #8A8A8A; --prose: #333333;
  --line: #E6E6E6; --line-hi: #D4D4D4;
  --green: #F0B90B; --green-deep: #C99A00; --green-soft: #FFF6D8; --green-ink: #7A5A00; --salmon: #FFE7A3; --red: #E11900;
  --up: #05944F; --down: #E11900; --accent2: #FF5A1F;
  --font: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #121212; --bg-alt: #181818; --card: #1A1A1A; --surface: #262626; --surface-hi: #333333; --tile: #222222;
  --ink: #F5F5F5; --muted: #B0B0B0; --dim: #7A7A7A; --prose: #DDDDDD;
  --line: #2C2C2C; --line-hi: #3C3C3C;
  --green-soft: rgba(240,185,11,.16); --green-ink: #F5C84B; --up: #3DDC84; --down: #FF6B5E;
  color-scheme: dark;
}
:root[lang="zh"] { --up: #E11900; --down: #05944F; }
:root[data-theme="dark"][lang="zh"] { --up: #FF6B5E; --down: #3DDC84; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn:focus-visible, .pill:focus-visible { outline-offset: 3px; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
h2 { font-size: 24px; line-height: 32px; letter-spacing: -.02em; } h3 { font-size: 18px; line-height: 24px; letter-spacing: -.01em; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 500; font-size: 14px; border: 0; cursor: pointer; white-space: nowrap; }
.btn-ink { background: var(--green); color: #111; }
.btn-ink:hover { filter: brightness(.96); }
.btn-ink:disabled { opacity: .35; cursor: not-allowed; }
.btn-gray { background: var(--surface); color: var(--ink); }
.btn-gray:hover { background: var(--surface-hi); }
.btn-white { background: #fff; color: #000; }
.btn-block { width: 100%; }
.input, .select, .textarea { width: 100%; background: var(--surface); border: 2px solid transparent; border-radius: 8px; padding: 12px 14px; outline: 0; font-size: 16px; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--ink); background: var(--bg); }
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 4px; background: var(--surface); color: var(--ink); white-space: nowrap; }
.tag.live { background: var(--green-soft); color: var(--green-ink); }
.tag.ok { background: var(--green-soft); color: var(--green-ink); }
.tag.failed { background: rgba(225,25,0,.1); color: var(--down); }
.tag.red { background: var(--accent2); color: #fff; }
.bar { height: 4px; background: var(--surface-hi); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 2px; }
.bar.ok i { background: var(--green-deep); } .bar.failed i { background: var(--down); } .bar.soon i { background: var(--line-hi); }

/* ---- top bar: 64px ---- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
.hdr-in { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 16px 0 24px; }
.burger { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 999px; display: grid; place-items: center; cursor: pointer; margin-left: -8px; }
.burger:hover { background: var(--surface); }
.brand { font-weight: 800; font-size: 24px; letter-spacing: -.04em; white-space: nowrap; margin-right: 8px; }
.brand em { font-style: normal; }
.mode { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; height: 48px; }
.mode button { font-size: 14px; font-weight: 500; color: var(--ink); background: transparent; border: 0; padding: 0 16px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.mode button.is-on { background: var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,.14); }
.place { display: inline-flex; align-items: center; gap: 6px; height: 48px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; background: transparent; border: 0; cursor: pointer; }
.place:hover { background: var(--surface); }
.place .sep { color: var(--muted); font-weight: 400; }
.place select { appearance: none; -webkit-appearance: none; background: transparent; border: 0; outline: 0; font: inherit; font-weight: 500; color: inherit; cursor: pointer; padding: 0; }
.place select option { color: #000; }
@media (max-width: 1100px) { #refresh { display: none; } }
.search { flex: 1 1 60px; min-width: 0; display: flex; align-items: center; gap: 12px; height: 48px; background: var(--surface); border-radius: 999px; padding: 0 20px; color: var(--ink); }
.search input { background: transparent; border: 0; outline: 0; width: 100%; font-size: 16px; color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.hdr-right { display: flex; align-items: center; gap: 8px; flex: none; }
.cart { position: relative; width: 40px; height: 40px; border: 0; background: transparent; border-radius: 999px; display: grid; place-items: center; cursor: pointer; }
.cart:hover { background: var(--surface); }
.cart .n { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; border-radius: 999px; background: var(--green); color: #111; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.textbtn { height: 40px; padding: 0 12px; border: 0; background: transparent; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.textbtn:hover { background: var(--surface); }
.lang { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; }
.lang button { font-size: 12px; font-weight: 600; color: var(--muted); background: transparent; border: 0; padding: 5px 9px; border-radius: 999px; cursor: pointer; }
.lang button.is-on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.addr { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px; border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 500; }
.addr i { width: 10px; height: 10px; border-radius: 999px; background: var(--green); }
.addr b { font-family: var(--mono); font-weight: 500; }
@media (max-width: 1100px) { .place { display: none; } }
@media (max-width: 860px) { .mode, #theme, .hdr-right .btn-gray { display: none; } .brand { font-size: 18px; } .hdr-in { gap: 8px; padding: 0 12px; } }
@media (max-width: 600px) { .lang, #cartbtn { display: none; } #connect { padding: 0 8px; font-size: 13px; } .addr span { display: none; } .addr { padding: 0 10px 0 8px; } .search { padding: 0 12px; gap: 8px; } .brand em { display: none; } .hdr-in { padding: 0 10px; } }

/* ---- shell ---- */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
.side { padding: 12px 12px 24px; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 64px); overflow: auto; display: flex; flex-direction: column; gap: 2px; scrollbar-width: none; }
.side::-webkit-scrollbar { display: none; }
.side > * { flex: none; }
.side .grp { font-size: 13px; font-weight: 600; color: var(--muted); padding: 20px 12px 6px; }
.side a, .side button { display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 12px; border-radius: 12px; font-weight: 500; font-size: 16px; color: var(--ink); background: transparent; border: 0; cursor: pointer; text-align: left; white-space: nowrap; transition: background .12s ease; }
.side a:hover, .side button:hover { background: var(--surface); }
.side a:active, .side button:active { background: var(--surface-hi); }
.side .ico { width: 24px; height: 24px; display: grid; place-items: center; flex: none; color: var(--ink); background: transparent; }
.side .ico svg { width: 22px; height: 22px; }
.side .is-on { background: var(--surface); font-weight: 600; }
.side .is-on .ico { color: #C99A00; }
:root[data-theme="dark"] .side .is-on .ico { color: var(--green); }
.side .is-on:hover { background: var(--surface-hi); }
.side .n { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); }
.side .wallet-card { margin-top: auto; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.side .wallet-card .row1 { display: flex; align-items: center; gap: 10px; }
.side .wallet-card .av { width: 36px; height: 36px; border-radius: 999px; background: var(--green); flex: none; }
.side .wallet-card b { display: block; font-family: var(--mono); font-size: 13px; font-weight: 500; }
.side .wallet-card small { display: block; font-size: 12px; opacity: .8; }
.side .wallet-card .bal { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: -.01em; color: var(--green); }
.side .wallet-card .net { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; opacity: .9; }
.side .wallet-card .net i { width: 8px; height: 8px; border-radius: 999px; background: var(--green); }
.side .wallet-card .btn { height: 38px; font-size: 13px; font-weight: 600; }
.side .wallet-card .btn-white { background: var(--bg); color: var(--ink); }
.side .wallet-card p { font-size: 13px; line-height: 18px; opacity: .92; }
.side .wallet-card .usd { color: rgba(255,255,255,.8); }
@media (max-height: 760px) { .side .wallet-card { margin-top: 12px; } }
.content { padding: 8px 32px 80px 16px; min-width: 0; overflow-x: clip; }
@media (max-width: 1000px) { .banners-wrap .arrow { display: none; } .shell { grid-template-columns: minmax(0, 1fr); } .side { display: none; } .side.is-open { display: block; position: fixed; inset: calc(64px + env(safe-area-inset-top, 0px)) auto 0 0; width: 260px; background: var(--bg); z-index: 45; box-shadow: 8px 0 30px rgba(0,0,0,.12); } .content { padding: 8px 16px 80px; } }

/* ---- category strip ---- */
.cats-wrap { position: relative; margin-bottom: 12px; }
.cats { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 8px 0 4px; scroll-behavior: smooth; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; display: grid; justify-items: center; gap: 8px; width: 90px; padding: 6px 0; border: 0; background: transparent; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--ink); line-height: 1.2; text-align: center; }
.cats button .ic { height: 64px; width: 64px; border-radius: 999px; overflow: hidden; background: var(--surface); }
.cats button .ic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cats button.is-on .ic { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--green); }
.cats button.is-on .ic { position: relative; }
.cats button.is-on span:last-child { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.cats button span:last-child { max-width: 84px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arrow { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.arrow:hover { background: var(--surface-hi); }
.cats-wrap .arrow { position: absolute; right: 0; top: 18px; }

/* ---- filters ---- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--surface); border: 0; font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; white-space: nowrap; }
.pill:hover { background: var(--surface-hi); }
.pill.is-on { background: var(--green); color: #111; }
.pill select { background: transparent; border: 0; outline: 0; font-weight: 500; cursor: pointer; color: inherit; }
.pill select option { color: #000; }
.ranked { font-size: 14px; line-height: 20px; color: var(--muted); margin-bottom: 20px; }
.ranked a { text-decoration: underline; color: var(--ink); }
.rule { border: 0; border-top: 1px solid var(--line); margin: 0 0 24px; }

/* ---- banners ---- */
.banners-wrap { position: relative; margin-bottom: 36px; }
.banners { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 1200px) { .banners { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .banners { grid-template-columns: 1fr; } }
.banner { position: relative; overflow: hidden; border-radius: 16px; height: 216px; padding: 24px; color: #fff; display: grid; align-content: space-between; cursor: pointer; }
.banner.g1 { background: #F0B90B; color: #111; } .banner.g2 { background: #111; color: #fff; } .banner.g3 { background: var(--accent2); color: #fff; }
.banner h3 { font-size: 22px; line-height: 28px; font-weight: 700; max-width: 55%; color: inherit; }
.banner p { font-size: 14px; margin-top: 6px; max-width: 55%; opacity: .95; }
.banner .cta { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: #fff; color: #000; font-size: 14px; font-weight: 500; width: max-content; }
.banner .art { position: absolute; right: 0; top: 0; bottom: 0; width: 48%; display: grid; place-items: center; }
.banner .art::before { content: ''; position: absolute; inset: 10% -20% 10% 10%; border-radius: 999px; background: rgba(255,255,255,.22); }
.banner .art .logo { position: relative; width: 120px; height: 120px; border: 0; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.banner .art .big { position: relative; font-size: 96px; line-height: 1; }
.banners-wrap .arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.18); background: var(--bg); }
.banners-wrap .arrow.l { left: -20px; } .banners-wrap .arrow.r { right: -20px; }

/* ---- sections ---- */
.sec { margin-bottom: 36px; }
.sec-h { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.sec-h h2 { margin-right: auto; }
.sec-h .all { font-size: 16px; font-weight: 500; color: var(--green-ink); }
.sec-h .arrows { display: flex; gap: 8px; }
.sec-h .arrow:disabled { opacity: .35; cursor: default; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 1fr); gap: 16px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }
@media (min-width: 1500px) { .rail { grid-auto-columns: calc((100% - 48px) / 4); } }
@media (max-width: 1499px) and (min-width: 1100px) { .rail { grid-auto-columns: calc((100% - 32px) / 3); } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px 16px; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 8px 0 32px; }
.sec[hidden] + .divider { display: none; }

/* ---- coin card ---- */
.row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; cursor: pointer; min-width: 0; }
.row-img { position: relative; aspect-ratio: 375 / 133; border-radius: 8px; overflow: hidden; background: var(--tile); display: grid; place-items: center; }
.row-img .wash { position: absolute; inset: 0; opacity: .55; }
.row-img .logo { position: relative; width: 88px; height: 88px; border: 0; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.row-img .tag.red { position: absolute; left: 10px; top: 10px; }
.row-img .tag.live, .row-img .tag.ok, .row-img .tag.failed { position: absolute; left: 10px; top: 10px; }
.row-img .you { position: absolute; right: 10px; top: 10px; font-family: var(--mono); font-size: 11px; font-weight: 600; background: #fff; color: #000; padding: 3px 8px; border-radius: 4px; }
.row-img .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; border-radius: 0; background: rgba(0,0,0,.18); }
.row.is-open .row-img { box-shadow: 0 0 0 2px var(--ink); }
.rcard .row-img .tag { position: absolute; left: 10px; top: 10px; }
.rcard .row-name small .tk { font-family: var(--mono); color: var(--ink); font-weight: 500; }
.row-top { display: flex; align-items: flex-start; gap: 8px; }
.row-name { min-width: 0; flex: 1; }
.row-name b { display: block; font-size: 18px; line-height: 24px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-name b .tk { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: 8px; font-weight: 500; }
.row-name small { display: block; color: var(--muted); font-size: 14px; line-height: 20px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-name small .star { color: var(--ink); font-weight: 500; }
.row .heart { width: 32px; height: 32px; border-radius: 999px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.row .heart:hover { background: var(--surface); }
.row .heart.is-on { color: var(--red); }
.row .heart.is-on svg { animation: rise .25s both; }
.row .promo { display: inline-flex; font-size: 12px; font-weight: 500; padding: 3px 6px; border-radius: 4px; background: rgba(225,25,0,.1); color: var(--red); width: max-content; }
.logo { width: 40px; height: 40px; border-radius: 999px; flex: none; display: grid; place-items: center; overflow: hidden; background: #FFFFFF; border: 1px solid var(--line); }
.logo img { width: 100%; height: 100%; object-fit: contain; padding: 14%; display: block; }
.logo.is-mono { background: var(--surface); color: var(--ink); font-weight: 700; }
.logo.is-mono::after { content: attr(data-m); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 16px; grid-column: 1 / -1; }
.empty-card { grid-column: 1 / -1; display: grid; justify-items: center; gap: 8px; text-align: center; padding: 48px 24px; border: 1px dashed var(--line-hi); border-radius: 16px; }
.empty-card b { font-size: 18px; font-weight: 500; }
.empty-card p { color: var(--muted); max-width: 520px; font-size: 14px; line-height: 20px; }
.empty-card .btn { margin-top: 8px; }

/* ---- side sheet ---- */
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--bg); z-index: 60; box-shadow: -12px 0 40px rgba(0,0,0,.18); padding: 20px 24px 32px; overflow: auto; display: grid; gap: 16px; align-content: start; transform: translateX(100%); transition: transform .22s ease; }
.sheet.is-open { transform: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 55; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
.scrim.is-open { opacity: 1; pointer-events: auto; }
.sheet-h { display: flex; align-items: center; gap: 12px; }
.sheet-h .logo { width: 56px; height: 56px; }
.sheet-h .who { min-width: 0; flex: 1; }
.sheet-h .who b { display: block; font-size: 22px; font-weight: 700; }
.sheet-h .who small { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet .close, .modal .close { width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--surface); cursor: pointer; font-size: 16px; color: var(--ink); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv div { background: var(--surface); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.kv small { display: block; font-size: 12px; color: var(--muted); }
.kv b { display: block; margin-top: 2px; font-family: var(--mono); font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv a { text-decoration: underline; }
.buy { display: grid; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.buy label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; }
.buy .amt { position: relative; }
.buy .amt .input { padding-right: 80px; font-family: var(--mono); }
.buy .amt span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); font-weight: 600; }
.buy .quick { display: flex; gap: 8px; }
.buy .quick button { flex: 1; height: 36px; font-family: var(--mono); font-size: 13px; background: var(--surface); border: 0; border-radius: 999px; cursor: pointer; }

/* ---- hero ---- */

@media (max-width: 1100px) { .hero { grid-template-columns: 1fr; min-height: 0; } .hero-t { padding: 28px 24px 28px; } .hero-art { position: relative; width: auto; height: 200px; order: -1; -webkit-mask-image: none; mask-image: none; } .hero h1 { font-size: 34px; } }

      'docs.h2': 'How the launchpad works', 'docs.full': 'Full rules', 'docs.1s': 'Every coin is paired with a restaurant whose stock exists as a token on BNB Chain (MCDx, SBUXx, MEITx and more). The raise is paid in that token.', 'docs.2s': 'Set a target and a duration. Everyone pays the same rate, each wallet can put in a tenth of the target, and the contract holds the funds until the raise closes.', 'docs.3s': 'Reach a third of the target and the coin graduates: 99% of the funds and 20% of the supply go to a PancakeSwap pool with the liquidity burned, and buyers claim the other 80%. Otherwise everyone gets 100% back.',
      'docs.1h': 'Paired with a real stock token', 'docs.1a': 'Every coin is paired with a restaurant whose stock exists as a token on BNB Chain: McDonald\'s is MCDx, Starbucks SBUXx, Meituan MEITx, Haidilao HAIDLx, Mixue MIXUx, Wendy\'s WENB and so on (xStocks by Backed, bStocks by Binance, Ondo Stocks).', 'docs.1b': 'The pairing is not a label: the raise is paid in that stock token and the coin lists in a pool against it.', 'docs.1c': 'Restaurants without a tokenized stock on BNB Chain (Luckin, Chagee, Guming, KFC China…) cannot be paired yet. We add them when an issuer lists them.', 'docs.1d': 'The restaurant itself does not take part. The stock token is issued by a third party and tracks the share price.',
      'docs.2h': 'The raise', 'docs.2a': 'Creating a coin deploys its token (1,000,000,000) and a raise contract from your wallet. You set the target in the stock token and the duration.', 'docs.2b': 'Buyers approve the stock token and buy. Everyone gets the same rate: target ÷ supply. Each wallet can put in at most one tenth of the target.', 'docs.2c': 'The contract keeps the funds. Nobody, including the creator, can withdraw before finalize.', 'docs.2d': 'Reaching the target closes the raise instantly; otherwise it closes at the deadline.',
      'docs.3h': 'Graduation or refund', 'docs.3a': 'Once closed, anyone can press Finalize. If at least one third of the target was raised, the coin graduates.', 'docs.3b': 'Graduation puts 99% of the stock tokens and 20% of the supply into a PancakeSwap v2 pool COIN/STOCK and burns the liquidity tokens, so the pool cannot be pulled. 1% goes to the platform.', 'docs.3c': 'Buyers then claim the other 80% of the supply in proportion to what they paid.', 'docs.3d': 'If the minimum was not reached, every buyer gets 100% back with Refund.',

      'bottom.more': 'Risk notice',      'why.h2': 'Why BNB Bite', 'why.1h': 'Pay the way you want', 'why.1p': 'Gift cards can be paid with a BNB Chain wallet, with any of 300+ cryptocurrencies through our payment partner, or with a bank card. The card is emailed in minutes and stays in your account.', 'why.2h': 'Real stock tokens, real pools', 'why.2p': 'Launchpad coins are paired with tokenized restaurant stocks that exist on BNB Chain. The raise is paid in that token and the liquidity is burned at graduation, so nobody can pull it.', 'why.3h': 'Nothing hidden', 'why.3p': 'Open-source contracts, every parameter written in the contract, prices and 24h changes from public data, and clear notices about what is unaudited or not yet available.',
      'faq.h2': 'Questions', 'faqs': [['Is the gift card real?', 'Yes. Cards are issued by Bitrefill, a licensed gift card reseller, only after your payment is confirmed. We never generate codes ourselves. If supply is not configured on a deployment, the card is shown as unavailable instead.'], ['Which cryptocurrencies can I pay with?', 'BNB and USDT directly from your wallet on BNB Chain, or any coin supported by our payment partner: Bitcoin, Ethereum, Solana, USDT on several networks, XRP, Litecoin, Dogecoin, TON and more. You get an address and an exact amount; the order updates by itself once the network confirms.'], ['Can I pay by card?', 'Yes, through Stripe Checkout. Card details are entered on Stripe\'s page and never reach our server.'], ['How is the gift card delivered?', 'On the order page as soon as it is issued, by email to the recipient you entered, and in your account if you were signed in with your wallet.'], ['Can I get a refund?', 'Gift cards are final once issued. If a card could not be issued after you paid, we refund or re-issue it; see the refund policy.'], ['What is the launchpad?', 'A place to launch a coin paired with a real restaurant stock token. Buyers pay the raise in that token; at graduation the coin lists on PancakeSwap against it with the liquidity burned. The contracts are open source and unaudited: start on BNB Testnet.'], ['Are the restaurants partners?', 'No. Names, logos and photos identify the brand a gift card or a stock token refers to. No restaurant sponsors, endorses or issues anything here.']],
      'legal.refund': 'Refund policy', 'legal.cookies': 'Cookies', 'legal.refundB': ['<b>Gift cards are final.</b> A code is a bearer instrument: once it has been issued and shown or emailed, it cannot be cancelled or refunded, whatever the payment method.', '<b>If we could not issue the card</b> after your payment was confirmed (supplier error, out of stock), we refund the full amount to the wallet or card you paid with, or re-issue the card, within 5 business days. Contact support with your order id.', '<b>Crypto payments that arrive late, short or to the wrong network</b> cannot always be matched to an order. Send exactly the amount shown, on the network shown, before the timer expires. Partial or expired payments are refunded manually minus network fees when they can be identified.', '<b>Launchpad raises</b> are governed by the contract: refunds happen on-chain through the Refund button when a raise closes below its minimum. We cannot reverse on-chain transactions.'],
      'legal.cookiesB': ['This site sets no tracking cookies. It stores your language, theme, saved coins and the ids of your gift card orders in your browser\'s localStorage so you can find them again on this device.', 'Stripe sets its own cookies on its checkout page when you pay by card. Our payment partner and CoinGecko see your IP address when the page asks them for a price, under their own policies.', 'You can clear everything from your browser settings at any time. Orders remain reachable through the link in the email.'],
      'bottom.more': 'Risk notice', 'empty.h': 'No coins on this network yet', 'empty.p': 'Pick one of the 18 restaurants with a tokenized stock on BNB Chain and launch the first coin paired with it.', 'nofactory.h': 'Not live on this network yet',

      'ft.tag': 'Restaurant gift cards paid with any crypto or card, and a BNB Chain launchpad where every coin is paired with a real restaurant stock.', 'ft.product': 'Product', 'ft.protocol': 'Protocol', 'ft.legal': 'Legal', 'ft.factory': 'Factory contract', 'ft.src': 'Source code', 'ft.unaudited': 'Unaudited contracts', 'ft.net': (n) => `Connected to ${n}`,
      'legal.risk': 'Risk disclosure', 'legal.terms': 'Terms of use', 'legal.privacy': 'Privacy', 'legal.photos': 'Photo credits', 'legal.photosP': 'Food and storefront photos come from Wikimedia Commons under the licenses listed here. They illustrate the cuisine or the brand and are not provided by the restaurants.',
      'legal.riskB': ['<b>You can lose everything you put in.</b> Coins are created by users through unaudited smart contracts. A raise can close below its minimum, a graduated coin can fall to zero, and nothing here guarantees any value.', '<b>The contracts hold the funds, not us.</b> Nobody, including the creator of a coin or the operators of this site, can withdraw from a raise before it finalizes. Refunds and claims are executed by the contract only.', '<b>Stock tokens are issued by third parties.</b> MCDx, SBUXx, MEITx and the rest are issued by Backed, Binance or Ondo. Their price, redemption and availability depend on those issuers, not on the restaurants and not on this site.', '<b>Restaurants are not involved.</b> Names and logos identify the stock token a coin is paired with. No restaurant sponsors, endorses or issues anything here.', '<b>Nothing here is advice.</b> This site shows on-chain data and lets you send transactions from your own wallet. It is not an offer, a solicitation or financial advice, and it may be unavailable to you under local law.'],
      'legal.termsB': ['This website is an interface to open-source smart contracts on BNB Chain. By using it you confirm that you are allowed to use crypto assets in your jurisdiction and that you act on your own account and at your own risk.', 'Every action (creating a coin, buying, finalizing, claiming, refunding) is a transaction signed in your wallet. We do not hold keys, funds or tokens and cannot reverse, cancel or recover transactions.', 'The contracts are provided as is, without warranty. They are unaudited; bugs may exist and may cause loss of funds. A 1% fee on graduated raises is paid to the platform address set in the factory.', 'Coin names, tickers and raises are created by users. We do not review them and we may hide any of them from this interface without notice. Hiding does not affect the contract.', 'Brands and logos belong to their owners and are used only to identify the stock token each coin is paired with.'],
      'legal.privacyB': ['This page stores only your language, theme and a short-lived price cache in your browser (localStorage). It sets no cookies and has no accounts.', 'Wallet addresses and transactions are public on BNB Chain. Reading the board uses your wallet\'s RPC or a public BNB Chain node; prices come from CoinGecko. Those services see your IP address under their own policies.', 'We do not run analytics or trackers on this page.'],

    const ap = e.target.closest('[data-approve]'); if (ap) { approve(ap.dataset.approve); return; }
    const b = e.target.closest('[data-buy]'); if (b) { buy(b.dataset.buy); return; }
    const f = e.target.closest('[data-finalize]'); if (f) { sendTx(async (s) => new E.Contract(f.dataset.finalize, RAISE_ABI, s).finalize()); return; }
    const c = e.target.closest('[data-claim]'); if (c) { sendTx(async (s) => new E.Contract(c.dataset.claim, RAISE_ABI, s).claim()); return; }
    const r = e.target.closest('[data-refund]'); if (r) { sendTx(async (s) => new E.Contract(r.dataset.refund, RAISE_ABI, s).refund()); return; }
    const cr = e.target.closest('[data-create]'); if (cr) { state.open = null; $('#c-rest').value = cr.dataset.create; renderPreview(); renderRows(); $('#launch')?.scrollIntoView({ behavior: 'smooth' }); $('#c-name').focus(); return; }
    const ga = e.target.closest('[data-gamt]'); if (ga) { GS.custom = ''; GS.value = Number(ga.dataset.gamt); GS.email = ($('#gemail') || {}).value || GS.email; GS.message = ($('#gmsg') || {}).value || GS.message; renderRows(); return; }
    const gm = e.target.closest('[data-gm]'); if (gm && !gm.disabled) { GS.method = gm.dataset.gm; GS.email = ($('#gemail') || {}).value || GS.email; GS.message = ($('#gmsg') || {}).value || GS.message; if (GS.method === 'crypto' && !GS.currencies) api('/api/gifts/currencies').then((j) => { GS.currencies = j.currencies; renderRows(); }).catch(() => {}); renderRows(); return; }
    if (e.target.closest('[data-gnext]')) { giftNext(); return; }
    if (e.target.closest('[data-gback]')) { GS.order = null; GS.err = null; renderRows(); return; }
    if (e.target.closest('[data-acct-sign]')) { accountSign(); return; }
    const gp = e.target.closest('[data-gpay]'); if (gp) { giftPay(gp.dataset.gpay); return; }
    const go = e.target.closest('[data-gorder]'); if (go) { giftOpenOrder(go.dataset.gorder); return; }
    const dd = e.target.closest('[data-days]'); if (dd) { chDays = Number(dd.dataset.days); clearTimeout(chTimer); chTimer = null; renderRows(); chartTick(); return; }
    const fv = e.target.closest('[data-fav]'); if (fv) { const a = fv.dataset.fav; if (FAV.has(a)) FAV.delete(a); else FAV.add(a); saveFav(); toast(t(FAV.has(a) ? 'fav.on' : 'fav.off')); renderStats(); renderRows(); return; }
    const open = e.target.closest('[data-open]'); if (open) { setOpen(open.dataset.open); return; }
    const rail = e.target.closest('[data-rail]'); if (rail) { const el = $('#' + rail.dataset.rail); el.scrollBy({ left: Number(rail.dataset.dir) * el.clientWidth * 0.8, behavior: 'smooth' }); return; }
    if (e.target.closest('#cats-r')) { $('#cat').scrollBy({ left: 300, behavior: 'smooth' }); return; }
    if (e.target.closest('#cartbtn')) { setTab('mine'); $('#all')?.scrollIntoView({ behavior: 'smooth' }); return; }
    const tab = e.target.closest('[data-tab]'); if (tab) { setTab(tab.dataset.tab); if (tab.closest('.side')) $('#all')?.scrollIntoView({ behavior: 'smooth' }); return; }
    if (e.target.closest('#burger')) { $('#side').classList.toggle('is-open'); return; }
    if (e.target.closest('#bottom-x')) { $('#bottom').hidden = true; return; }
    if (e.target.closest('.side a')) { $('#side').classList.remove('is-open'); }
    const cat = e.target.closest('[data-cat]'); if (cat) { state.cat = cat.dataset.cat; $$('[data-cat]').forEach((x) => x.classList.toggle('is-on', x.dataset.cat === state.cat)); renderRows(); $('#all')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'gcustom') { const v = Number(e.target.value); GS.custom = e.target.value; GS.email = ($('#gemail') || {}).value || GS.email; GS.message = ($('#gmsg') || {}).value || GS.message; if (v > 0) { GS.value = v; renderRows(); } } if (e.target.id === 'gcur') GS.currency = e.target.value; });
  document.addEventListener('input', (e) => { if (e.target.id === 'gemail') GS.email = e.target.value; if (e.target.id === 'gmsg') GS.message = e.target.value; });
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; renderRows(); addrSearch(e.target.value); });
  window.addEventListener('hashchange', () => { const r = route(); if (r === 'open') renderRows(); else if (r === 'net') { state.coins = []; state.loaded = false; render(); loadCoins(); } });
  $('#sort')?.addEventListener('change', (e) => { state.sort = e.target.value; renderRows(); });
  $('#pay')?.addEventListener('change', (e) => { state.pay = e.target.value; renderRows(); });
  $('#launch-form').addEventListener('submit', launchCoin);
  ['c-name', 'c-tick', 'c-rest', 'c-goal', 'c-window'].forEach((id) => $('#' + id).addEventListener('input', renderPreview));
  document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (!$('#modal').hidden) { $('#modal').hidden = true; return; } if (state.open) setOpen(null); });
  function openDoc(k) { const m = $('#modal'); $('#modal-h').textContent = t('legal.' + k);
    if (k === 'photos') $('#modal-b').innerHTML = `<p>${t('legal.photosP')}</p><div class="credits">${Object.entries(PHOTO_CREDITS).map(([id, c]) => `<div><img src="photos/${id}.jpg" alt="" loading="lazy"><span><a href="${esc(c.page)}" target="_blank" rel="noopener">${esc(c.title.replace(/^File:/, ''))}</a><br>${esc(c.artist || 'Wikimedia Commons')} · ${esc(c.license)}</span></div>`).join('')}</div>`;
    else $('#modal-b').innerHTML = (T['legal.' + k + 'B'] || I18N.en['legal.' + k + 'B']).map((p) => `<p>${p}</p>`).join('');
    m.hidden = false; m.querySelector('.close').focus(); }
  $('#netsel').addEventListener('change', (e) => { state.chainId = Number(e.target.value); state.coins = []; state.loaded = false; state.loadError = null; state.open = null; state.buys = {}; chainRef.at = 0; render(); loadCoins(); loadPrices(); });

  const root = document.documentElement; const themeBtn = $('#theme');
  const prefersLight = () => matchMedia('(prefers-color-scheme: light)').matches;
  const THEME_ICON = { light: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>', dark: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' };
  function applyTheme(th) { root.dataset.theme = th; themeBtn.innerHTML = THEME_ICON[th] || THEME_ICON.light; try { localStorage.setItem('bento.theme', th); } catch {} }
  let savedTheme = null; try { savedTheme = localStorage.getItem('bento.theme'); } catch {}
  if (savedTheme) applyTheme(savedTheme); else themeBtn.innerHTML = THEME_ICON.light;
  themeBtn.addEventListener('click', () => applyTheme((root.dataset.theme || 'light') === 'light' ? 'dark' : 'light'));
  $('#year').textContent = String(new Date().getFullYear());
  setInterval(() => { const now = Date.now(); $$('[data-countdown]').forEach((el) => { const C = list().find((x) => x.addr === el.dataset.countdown); if (C) el.textContent = closeText(C, now); }); }, 1000);
  setInterval(() => { if (state.loaded && !state.loadError && !state.busy) loadCoins(); }, 20000);

  (function start() {
    let lang = null; try { lang = localStorage.getItem('bento.lang'); } catch {}
    if (!lang || !I18N[lang]) lang = 'en';
    $$('.cats .ic[data-ic]').forEach((el) => { const k = el.dataset.ic; el.innerHTML = PHOTO_CREDITS[k] ? `<img src="photos/${k}.jpg" alt="" loading="lazy">` : (ICONS[k] || ''); });
    if (E) route();
    setLang(lang);
    if (!E) { $('#rows').innerHTML = `<p class="empty">ethers.js failed to load.</p>`; return; }
    const SOCIAL = { x: 'https://x.com/intent/post?text=' + encodeURIComponent('BNB Bite · restaurant gift cards for any crypto, launchpad on BNB Chain') + '&url=' + encodeURIComponent(location.origin + location.pathname) }; /* set x to your profile url once you have one, e.g. https://x.com/yourhandle */
    $$('#x-link, #x-link2').forEach((a) => { a.href = SOCIAL.x; });
    loadCoins(); loadPrices(); setInterval(loadPrices, 120000); loadGiftApi();
  })();
})();
</script>
