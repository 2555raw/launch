<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nebari — film</title>
<!-- A 30 second film about the site, 1920x1080. Every frame is a pure function of time:
     render(t) sets the whole picture for second t, and build.js captures it frame by frame. -->
<style>
  @font-face { font-family: 'Poppins'; font-weight: 400; src: url('../../assets/fonts/Poppins-Regular.ttf'); }
  @font-face { font-family: 'Poppins'; font-weight: 500; src: url('../../assets/fonts/Poppins-Medium.ttf'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url('../../assets/fonts/Poppins-SemiBold.ttf'); }
  :root { --bg: #0a0a0a; --panel: #141414; --line: #262626; --ink: #fff; --ink2: #b8b8b8; --acc: #c5394f; --acc2: #8c1f33; --accInk: #e8687f; }
  html, body { margin: 0; background: var(--bg); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: 'Poppins', sans-serif; color: var(--ink); }
  .scene { position: absolute; inset: 0; display: none; }
  .center { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; }
  .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
  .line { font-size: 76px; font-weight: 500; letter-spacing: -0.035em; }
  .caret { display: inline-block; width: 7px; height: 0.9em; background: linear-gradient(180deg, #ff8aa0, #c5394f); vertical-align: -0.08em; margin-left: 6px; border-radius: 2px; }

  /* 1: ruler with a playhead */
  .ruler { position: absolute; left: 0; right: 0; top: 0; height: 250px; }
  .ruler .ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; border-bottom: 2px solid #3a3a3a;
    background-image: repeating-linear-gradient(90deg, #3a3a3a 0 2px, transparent 2px 96px); background-size: 96px 18px; background-repeat: repeat-x; background-position: 0 100%; }
  .ruler .lab { position: absolute; bottom: 58px; font: 500 46px/1 ui-monospace, 'DejaVu Sans Mono', monospace; color: #7a7a7a; letter-spacing: .04em; }
  .ruler .guide { position: absolute; top: 250px; width: 2px; height: 830px; background: #262626; }
  .playhead { position: absolute; top: 150px; width: 0; }
  .playhead .knob { position: absolute; left: -22px; top: 0; width: 44px; height: 58px; border-radius: 12px; background: linear-gradient(180deg, #e0405e, #a3263d); box-shadow: 0 0 30px rgba(224,64,94,0.6); }
  .playhead .stem { position: absolute; left: -2px; top: 56px; width: 4px; height: 1000px; background: linear-gradient(180deg, #e0405e, rgba(224,64,94,0.1)); box-shadow: 0 0 16px rgba(224,64,94,0.7); }

  /* windows around real screenshots */
  .win { position: absolute; left: 50%; top: 50%; border-radius: 22px; overflow: hidden; background: #0b0b0b; box-shadow: 0 0 0 1.5px #2e2e2e, 0 60px 140px rgba(0,0,0,0.7), 0 0 120px rgba(140,31,51,0.25); transform-origin: 50% 50%; }
  .win .bar { height: 44px; background: #161616; border-bottom: 1px solid #262626; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  .win .bar i { width: 13px; height: 13px; border-radius: 50%; background: #3a3a3a; display: block; }
  .win .bar span { margin-left: 18px; font-size: 15px; color: #8a8a8a; background: #0f0f0f; border: 1px solid #262626; border-radius: 8px; padding: 5px 16px; }
  .win img { display: block; }
  .dither { position: absolute; pointer-events: none;
    background-image: radial-gradient(circle, rgba(224,64,94,0.95) 0 2.2px, transparent 2.6px); background-size: 9px 9px; }

  /* 3: asset chip */
  .chip { display: inline-flex; align-items: center; gap: 16px; padding: 10px 28px 10px 14px; border-radius: 999px; background: #161616; border: 1.5px solid #3a2127; box-shadow: 0 0 40px rgba(197,57,79,0.35); vertical-align: middle; font-size: 60px; font-weight: 600; letter-spacing: -0.02em; }
  .chip img { width: 62px; height: 62px; object-fit: contain; }

  /* 4: typing + launch card */
  .big { font-size: 190px; font-weight: 600; letter-spacing: -0.055em; line-height: 1; }
  .card { position: absolute; left: 50%; top: 50%; width: 1060px; border-radius: 30px; background: #121212; border: 1.5px solid #262626; padding: 44px 50px; box-shadow: 0 50px 140px rgba(0,0,0,0.7), 0 0 90px rgba(140,31,51,0.2); }
  .card .row { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; }
  .card .lbl { width: 190px; font-size: 22px; color: #8a8a8a; font-weight: 500; }
  .card .fld { flex: 1; height: 68px; border-radius: 16px; background: #0b0b0b; border: 1.5px solid #2c2c2c; display: flex; align-items: center; padding: 0 24px; font-size: 30px; font-weight: 500; }
  .card .fld.on { border-color: #c5394f; box-shadow: 0 0 0 5px rgba(197,57,79,0.18); }
  .card .fld img { width: 40px; height: 40px; margin-right: 14px; }
  .card .go { margin-top: 30px; display: flex; justify-content: space-between; align-items: center; }
  .card .go small { font-size: 22px; color: #8a8a8a; }
  .card .btn { font-size: 30px; font-weight: 600; color: #fff; padding: 20px 40px; border-radius: 999px; background: linear-gradient(180deg, #b82c46, #8c1f33); box-shadow: 0 12px 40px rgba(163,38,61,0.5); }

  /* 5: price floor chart */
  .chart { position: absolute; left: 50%; top: 56%; width: 1100px; height: 560px; transform: translate(-50%, -50%); }
  .chart .grid { position: absolute; inset: 0; border-radius: 18px; border: 1.5px solid #262626;
    background-image: linear-gradient(#1c1c1c 1.5px, transparent 1.5px), linear-gradient(90deg, #1c1c1c 1.5px, transparent 1.5px); background-size: 110px 112px; }
  .chart svg { position: absolute; inset: 0; overflow: visible; }
  .tag { position: absolute; font-size: 22px; font-weight: 600; padding: 8px 16px; border-radius: 999px; }

  /* 6: halftone word */
  .huge { font-size: 300px; font-weight: 600; letter-spacing: -0.06em; line-height: 1; position: relative; display: inline-block; }
  .huge .ht { position: absolute; inset: 0; color: transparent;
    background-image: radial-gradient(circle, #e0405e 0 3px, transparent 3.6px); background-size: 11px 11px; -webkit-background-clip: text; background-clip: text; }

  /* end card */
  .mark { width: 150px; height: 150px; display: block; margin: 0 auto 34px; filter: drop-shadow(0 0 30px rgba(224,64,94,0.55)); }
  .word { font-size: 74px; font-weight: 600; letter-spacing: 0.22em; margin-left: 0.22em; }
  .sub { margin-top: 18px; font-size: 30px; color: var(--ink2); font-weight: 400; }
  .glow { position: absolute; inset: 0; background: radial-gradient(40% 50% at 50% 50%, rgba(140,31,51,0.45), rgba(0,0,0,0) 70%); }
</style>
</head>
<body>
<div id="stage">

  <!-- 1 -->
  <div class="scene" id="s1">
    <div class="ruler" id="ruler"><div class="ticks"></div>
      <span class="lab" style="left:420px">block 0</span><span class="lab" style="left:1010px">block 1</span><span class="lab" style="left:1600px">block 2</span>
      <div class="guide" style="left:520px"></div><div class="guide" style="left:1110px"></div><div class="guide" style="left:1700px"></div>
    </div>
    <div class="playhead" id="ph"><div class="knob"></div><div class="stem"></div></div>
    <div class="center line" id="l1"></div>
  </div>

  <!-- 2 -->
  <div class="scene" id="s2">
    <div class="dither" id="d2a"></div><div class="dither" id="d2b"></div>
    <div class="win" id="w2" style="width:1900px"><div class="bar"><i></i><i></i><i></i><span>nebari · launchpad on Robinhood Chain</span></div><img src="shots/home.png" width="1900"></div>
  </div>

  <!-- 3 -->
  <div class="scene" id="s3"><div class="center line" id="l3"></div></div>

  <!-- 4 -->
  <div class="scene" id="s4" style="background:var(--panel)">
    <div class="center big" id="l4"></div>
    <div class="card" id="c4">
      <div class="row"><div class="lbl">Name</div><div class="fld" id="f1"></div></div>
      <div class="row"><div class="lbl">Root it to</div><div class="fld" id="f2"></div></div>
      <div class="row"><div class="lbl">Start price</div><div class="fld" id="f3"></div></div>
      <div class="go"><small>One signature · no launch fee · just gas</small><div class="btn" id="b4">Launch on Nebari ↗</div></div>
    </div>
  </div>

  <!-- 5 -->
  <div class="scene" id="s5">
    <div class="center line" id="l5" style="top:13%"></div>
    <div class="chart" id="ch">
      <div class="grid"></div>
      <svg viewBox="0 0 1100 560"><path id="floor" d="M 0 470 L 1100 470" stroke="#e0405e" stroke-width="3" stroke-dasharray="12 12" fill="none"/>
        <path id="curve" d="" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path id="curveGlow" d="" stroke="#e0405e" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.35" filter="blur(6px)"/>
        <circle id="dot" r="14" fill="#e0405e"/><circle id="dotRing" r="26" fill="none" stroke="#e0405e" stroke-width="3"/></svg>
      <span class="tag" id="tg1" style="left:24px; top:486px; color:#e8687f; background:rgba(197,57,79,0.12); border:1.5px solid rgba(197,57,79,0.5)">price floor · the launch price</span>
    </div>
  </div>

  <!-- 6 -->
  <div class="scene" id="s6"><div class="center line" id="l6a" style="top:24%"></div><div class="center" id="l6b"><span class="huge" id="hw">holders.<span class="ht">holders.</span></span></div></div>

  <!-- 7 -->
  <div class="scene" id="s7">
    <div class="dither" id="d7"></div>
    <div class="win" id="w7" style="width:1440px"><div class="bar"><i></i><i></i><i></i><span>nebari · Sakura Test (SKT)</span></div><img src="shots/token.png" width="1440"></div>
    <div class="center line" id="l7" style="top:90%; font-size:54px"></div>
  </div>

  <!-- 8 -->
  <div class="scene" id="s8"><div class="center"><span class="huge" id="rw" style="font-size:330px">rooted.<span class="ht">rooted.</span></span></div></div>

  <!-- 9 -->
  <div class="scene" id="s9"><div class="glow" id="g9"></div>
    <div class="center" id="e9">
      <svg class="mark" id="m9" viewBox="0 0 100 100" fill="#fff"><rect x="33" y="0" width="34" height="18" rx="9"/><rect x="33" y="82" width="34" height="18" rx="9"/><rect x="0" y="33" width="18" height="34" rx="9"/><rect x="82" y="33" width="18" height="34" rx="9"/><rect x="16.5" y="16.5" width="17" height="17" rx="4.5"/><rect x="66.5" y="16.5" width="17" height="17" rx="4.5"/><rect x="16.5" y="66.5" width="17" height="17" rx="4.5"/><rect x="66.5" y="66.5" width="17" height="17" rx="4.5"/></svg>
      <div class="word" id="n9">NEBARI</div>
      <div class="sub" id="t9">Every asset can grow a token · Robinhood Chain</div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => cl((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }; // a little overshoot
const LOGO = (f) => `../../assets/logos/bare/${f}`;
const ASSETS = [['TSLA','tsla.svg'],['NVDA','nvda.svg'],['ETH','eth.svg'],['USDG','usdg.svg'],['AAPL','aapl.svg'],['MSFT','msft.svg'],['GOOGL','googl.svg'],['META','meta.svg'],['AMZN','amzn.png'],['SPY','spy.png']];

// words that arrive one by one: blur, rise and fade in
function words(el, text, t, start, gap, opts = {}) {
  if (el._text !== text) { el.innerHTML = text.split(' ').map((w) => `<span class="w">${w}</span>`).join('<span class="w"> </span>'); el._text = text; }
  const ws = [...el.querySelectorAll('.w')].filter((w) => w.textContent.trim());
  ws.forEach((w, i) => {
    const k = eo(P(t, start + i * gap, start + i * gap + 0.45));
    w.style.opacity = k; w.style.filter = `blur(${(1 - k) * 14}px)`; w.style.transform = `translateY(${(1 - k) * 26}px)`;
    const hot = opts.hot && opts.hot.includes(i);
    if (hot) { const c = P(t, opts.coolFrom, opts.coolTo); w.style.color = `rgb(${232 + (255 - 232) * c}, ${104 + (255 - 104) * c}, ${127 + (255 - 127) * c})`; }
  });
}
function typed(text, t, start, cps) { return text.slice(0, Math.max(0, Math.floor((t - start) * cps))); }
function caretOn(t) { return Math.floor(t * 2.2) % 2 === 0; }

function scene(id, t, a, b) { const on = t >= a && t < b; $(id).style.display = on ? 'block' : 'none'; return on; }

function render(t) {
  // 1 · 0.0–4.1: the line arrives, a ruler drops in, a playhead scrubs across
  if (scene('s1', t, 0, 4.1)) {
    words($('l1'), 'Grow a token from any asset.', t, 0.25, 0.13, { hot: [4, 5], coolFrom: 1.5, coolTo: 2.3 });
    const r = eo(P(t, 1.6, 2.3));
    $('ruler').style.transform = `translateY(${(1 - r) * -260}px)`;
    const ph = eio(P(t, 2.3, 3.6));
    $('ph').style.left = (-60 + ph * 1100) + 'px'; $('ph').style.opacity = P(t, 2.25, 2.35);
    const out = P(t, 3.75, 4.1);
    $('s1').style.opacity = 1 - out; $('l1').style.transform = `translateY(calc(-50% - ${out * 40}px))`;
  }
  // 2 · 4.1–7.6: the real site, zooming in, with maroon halftone sweeping off the sides
  if (scene('s2', t, 4.1, 7.6)) {
    const k = eo(P(t, 4.1, 5.2)), z = eio(P(t, 5.0, 7.6));
    const s = 0.42 + k * 0.22 + z * 0.3;
    $('w2').style.transform = `translate(-50%, -50%) translateY(${(1 - k) * 80 + z * 120}px) scale(${s})`;
    $('w2').style.opacity = k * (1 - P(t, 7.35, 7.6));
    const d = eo(P(t, 4.2, 6.0));
    Object.assign($('d2a').style, { left: (-200 - d * 900) + 'px', top: '120px', width: '900px', height: '840px', opacity: 1 - d,
      webkitMaskImage: 'linear-gradient(90deg, transparent, #000 60%, transparent)' });
    Object.assign($('d2b').style, { left: (1220 + d * 900) + 'px', top: '120px', width: '900px', height: '840px', opacity: 1 - d,
      webkitMaskImage: 'linear-gradient(90deg, transparent, #000 40%, transparent)' });
  }
  // 3 · 7.6–11.0: "Root it to literally anything." — then "literally anything" becomes an asset chip that spins through the list
  if (scene('s3', t, 7.6, 11.0)) {
    const swap = t >= 8.9;
    if (!swap) { words($('l3'), 'Root it to literally anything.', t, 7.7, 0.12); $('l3')._chip = false; }
    else {
      if (!$('l3')._chip) { $('l3').innerHTML = '<span class="w" id="rt">Root it to </span><span class="chip" id="chip"><img id="ci" src=""><span id="cs"></span></span>'; $('l3')._chip = true; $('l3')._text = null; }
      const k = eb(P(t, 8.9, 9.35));
      $('chip').style.transform = `scale(${0.4 + 0.6 * k})`; $('chip').style.opacity = P(t, 8.9, 9.05);
      const spin = P(t, 9.0, 10.2);
      const idx = spin < 1 ? Math.floor(Math.pow(spin, 0.6) * 22) % ASSETS.length : 0;   // slows down, lands on TSLA
      const [sym, f] = ASSETS[idx];
      if ($('cs').textContent !== sym) { $('cs').textContent = sym; $('ci').src = LOGO(f); }
      if (t > 10.2) $('chip').style.boxShadow = `0 0 ${40 + 40 * Math.sin((t - 10.2) * 9) ** 2}px rgba(224,64,94,0.6)`;
    }
    $('s3').style.opacity = 1 - P(t, 10.75, 11.0);
  }
  // 4 · 11.0–15.4: "Plant a token" typed large, then the launch form fills itself in and the button is pressed
  if (scene('s4', t, 11.0, 15.4)) {
    const txt = typed('Plant a token', t, 11.15, 13);
    $('l4').innerHTML = txt + (caretOn(t) || t < 12.2 ? '<span class="caret"></span>' : '<span class="caret" style="opacity:0"></span>');
    const up = eio(P(t, 12.4, 13.0));
    $('l4').style.transform = `translateY(calc(-50% - ${up * 330}px)) scale(${1 - up * 0.55})`;
    const c = eo(P(t, 12.6, 13.2));
    $('c4').style.transform = `translate(-50%, -50%) translateY(${(1 - c) * 90 + 60}px)`; $('c4').style.opacity = c;
    $('f1').textContent = typed('Dollar Seed', t, 13.1, 26); $('f1').className = 'fld' + (t > 13.1 && t < 13.6 ? ' on' : '');
    const pairOn = t > 13.6;
    $('f2').innerHTML = pairOn ? `<img src="${LOGO('usdg.svg')}">USDG <span style="color:#8a8a8a;font-weight:400;margin-left:12px">Global Dollar</span>` : '';
    $('f2').className = 'fld' + (t > 13.6 && t < 13.95 ? ' on' : '');
    $('f3').textContent = typed('0.00001 USDG', t, 13.95, 30); $('f3').className = 'fld' + (t > 13.95 && t < 14.45 ? ' on' : '');
    const press = P(t, 14.55, 14.7) - P(t, 14.7, 14.9);
    $('b4').style.transform = `scale(${1 - press * 0.08})`;
    $('b4').style.boxShadow = t > 14.6 ? `0 0 0 ${P(t, 14.6, 15.2) * 40}px rgba(224,64,94,${0.35 * (1 - P(t, 14.6, 15.2))}), 0 12px 40px rgba(163,38,61,0.5)` : '';
    $('s4').style.opacity = 1 - P(t, 15.15, 15.4);
  }
  // 5 · 15.4–19.4: a price line that climbs and dips, but never below the floor
  if (scene('s5', t, 15.4, 19.4)) {
    words($('l5'), 'A floor that never breaks.', t, 15.5, 0.11, { hot: [1], coolFrom: 16.4, coolTo: 17.2 });
    $('ch').style.opacity = eo(P(t, 15.6, 16.1));
    const pts = []; const N = 120;
    for (let i = 0; i <= N; i++) { const x = i / N; const y = 470 - (Math.pow(x, 1.4) * 330 + Math.sin(x * 19) * 34 * x + Math.sin(x * 7.3) * 22 * x); pts.push([x * 1100, Math.min(468, y)]); }
    const upto = Math.floor(eio(P(t, 16.0, 18.9)) * N);
    const d = 'M ' + pts.slice(0, upto + 1).map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ');
    $('curve').setAttribute('d', upto > 0 ? d : ''); $('curveGlow').setAttribute('d', upto > 0 ? d : '');
    const [dx, dy] = pts[Math.max(0, upto)];
    $('dot').setAttribute('cx', dx); $('dot').setAttribute('cy', dy); $('dotRing').setAttribute('cx', dx); $('dotRing').setAttribute('cy', dy);
    $('dotRing').setAttribute('r', 22 + 10 * Math.abs(Math.sin(t * 5)));
    $('s5').style.opacity = 1 - P(t, 19.15, 19.4);
  }
  // 6 · 19.4–22.6: "Half of every fee goes to" … "holders." in halftone that settles to solid
  if (scene('s6', t, 19.4, 22.6)) {
    words($('l6a'), 'Half of every swap fee goes to', t, 19.5, 0.09);
    const k = eb(P(t, 20.35, 20.9));
    $('hw').style.transform = `scale(${0.7 + 0.3 * k})`; $('hw').style.opacity = P(t, 20.35, 20.5);
    const solid = P(t, 21.0, 21.9);
    $('hw').style.color = `rgba(255,255,255,${solid})`;
    $('hw').querySelector('.ht').style.opacity = 1 - solid * 0.85;
    $('hw').querySelector('.ht').style.backgroundPosition = `${t * 18}px 0`;
    $('s6').style.opacity = 1 - P(t, 22.35, 22.6);
  }
  // 7 · 22.6–26.0: a real token page, then the camera leans into "Your share"
  if (scene('s7', t, 22.6, 26.0)) {
    const k = eo(P(t, 22.6, 23.5)), z = eio(P(t, 23.8, 25.6));
    const s = 0.62 + k * 0.08 + z * 0.5;
    $('w7').style.transform = `translate(-50%, -50%) translate(${-z * 330}px, ${(1 - k) * 90 - z * 330}px) scale(${s})`;
    $('w7').style.opacity = k;
    Object.assign($('d7').style, { left: '0px', top: '0px', width: '1920px', height: '1080px', opacity: 0.35 * (1 - k),
      webkitMaskImage: 'radial-gradient(ellipse 50% 50% at 50% 50%, transparent 40%, #000 90%)' });
    words($('l7'), 'Launch. Trade. Claim.', t, 23.2, 0.28);
    $('l7').style.opacity = 1 - P(t, 25.3, 25.6);
    $('s7').style.opacity = 1 - P(t, 25.75, 26.0);
  }
  // 8 · 26.0–27.8: "rooted." lands in halftone, then solid
  if (scene('s8', t, 26.0, 27.8)) {
    const k = eb(P(t, 26.0, 26.5));
    $('rw').style.transform = `scale(${0.8 + 0.2 * k})`; $('rw').style.opacity = P(t, 26.0, 26.15);
    const solid = P(t, 26.6, 27.3);
    $('rw').style.color = `rgba(255,255,255,${solid})`;
    $('rw').querySelector('.ht').style.opacity = 1 - solid;
    $('rw').style.letterSpacing = `${-0.06 + solid * 0.02}em`;
    $('s8').style.opacity = 1 - P(t, 27.6, 27.8);
  }
  // 9 · 27.8–30.0: the mark and the name
  if (scene('s9', t, 27.8, 30.01)) {
    const m = eb(P(t, 27.85, 28.45));
    $('m9').style.transform = `scale(${0.5 + 0.5 * m}) rotate(${(1 - m) * -45}deg)`; $('m9').style.opacity = P(t, 27.85, 28.0);
    const n = eo(P(t, 28.3, 28.9));
    $('n9').style.opacity = n; $('n9').style.letterSpacing = `${0.5 - 0.28 * n}em`; $('n9').style.filter = `blur(${(1 - n) * 10}px)`;
    $('t9').style.opacity = eo(P(t, 28.8, 29.3));
    $('g9').style.opacity = eo(P(t, 27.8, 28.8));
  }
}

// preload every image so the first frame of each scene is complete
window.ready = Promise.all([...document.images, ...ASSETS.map(([, f]) => Object.assign(new Image(), { src: LOGO(f) }))].map((im) => im.decode ? im.decode().catch(() => {}) : null))
  .then(() => document.fonts.ready).then(() => { render(0); return true; });
window.render = render;
</script>
