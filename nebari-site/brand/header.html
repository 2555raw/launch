<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nebari — X header</title>
<!-- The X (Twitter) header, 1500x500. Rendered to header.png; edit here and re-render. -->
<style>
  @font-face { font-family: 'Poppins'; font-weight: 400; src: url('fonts/Poppins-Regular.ttf'); }
  @font-face { font-family: 'Poppins'; font-weight: 500; src: url('fonts/Poppins-Medium.ttf'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url('fonts/Poppins-SemiBold.ttf'); }
  html, body { margin: 0; }
  .hdr { position: relative; width: 1500px; height: 500px; overflow: hidden; background: #0b0b0b; font-family: 'Poppins', sans-serif; color: #fff; }
  .logo { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.14), 0 16px 40px rgba(0,0,0,0.6); overflow: hidden; background: #fff; }
  .logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .logo.dark { background: #1a1a1a; }
  .logo.dark img { object-fit: contain; padding: 18%; box-sizing: border-box; }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%); text-align: center; width: 640px; }
  .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 20px; letter-spacing: .04em; margin-bottom: 22px; }
  .brand svg { width: 30px; height: 30px; display: block; }
  h1 { margin: 0; font-weight: 400; font-size: 66px; line-height: 1.02; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: #c2586a; }
  .chip { display: inline-block; margin-top: 26px; font-size: 16px; font-weight: 500; color: #fff; background: #7a1a2c; padding: 9px 20px; border-radius: 999px; }
</style>
</head>
<body>
<div class="hdr">
  <!-- left side; the lower-left corner stays clear for the profile picture -->
  <span class="logo" style="left:120px; top:118px; width:88px; height:88px"><img src="../assets/logos/eth.png" alt=""></span>
  <span class="logo" style="left:292px; top:196px; width:66px; height:66px"><img src="../assets/logos/usdg.png" alt=""></span>
  <span class="logo" style="left:132px; top:282px; width:70px; height:70px"><img src="../assets/logos/tsla.png" alt=""></span>
  <span class="logo" style="left:440px; top:318px; width:78px; height:78px"><img src="../assets/logos/nvda.png" alt=""></span>
  <span class="logo dark" style="left:414px; top:104px; width:62px; height:62px"><img src="../assets/logos/aapl.png" alt=""></span>
  <!-- right side -->
  <span class="logo" style="left:1090px; top:108px; width:60px; height:60px"><img src="../assets/logos/msft.png" alt=""></span>
  <span class="logo dark" style="left:1238px; top:170px; width:86px; height:86px"><img src="../assets/logos/amzn.png" alt=""></span>
  <span class="logo" style="left:1398px; top:96px; width:66px; height:66px"><img src="../assets/logos/googl.png" alt=""></span>
  <span class="logo" style="left:1150px; top:336px; width:72px; height:72px"><img src="../assets/logos/meta.png" alt=""></span>
  <span class="logo" style="left:1372px; top:330px; width:90px; height:90px"><img src="../assets/logos/spy.png" alt=""></span>

  <div class="center">
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="#fff" aria-hidden="true"><rect x="33" y="0" width="34" height="18" rx="9"/><rect x="33" y="82" width="34" height="18" rx="9"/><rect x="0" y="33" width="18" height="34" rx="9"/><rect x="82" y="33" width="18" height="34" rx="9"/><rect x="16.5" y="16.5" width="17" height="17" rx="4.5"/><rect x="66.5" y="16.5" width="17" height="17" rx="4.5"/><rect x="16.5" y="66.5" width="17" height="17" rx="4.5"/><rect x="66.5" y="66.5" width="17" height="17" rx="4.5"/></svg>
      NEBARI
    </div>
    <h1>Every asset can<br>grow a <em>token</em>.</h1>
    <span class="chip">Launchpad on Robinhood Chain</span>
  </div>
</div>
</body>
</html>
