<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nebari — X header, horizon</title>
<style>
  @font-face { font-family: 'Poppins'; font-weight: 400; src: url('../fonts/Poppins-Regular.ttf'); }
  @font-face { font-family: 'Poppins'; font-weight: 500; src: url('../fonts/Poppins-Medium.ttf'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url('../fonts/Poppins-SemiBold.ttf'); }
  html, body { margin: 0; }
  .hdr { position: relative; width: 1500px; height: 500px; overflow: hidden; font-family: 'Poppins', sans-serif; color: #fff;
    background: linear-gradient(180deg, #070707 0%, #0d0709 52%, #1a070c 66%, #070707 100%); }
  .sky-glow { position: absolute; left: 50%; top: 330px; width: 1100px; height: 300px; transform: translate(-50%, -50%);
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(214,40,75,0.55) 0%, rgba(140,31,51,0.25) 40%, rgba(0,0,0,0) 72%); }
  .horizon { position: absolute; left: 0; right: 0; top: 330px; height: 1.5px;
    background: linear-gradient(90deg, rgba(255,80,110,0), rgba(255,120,145,1) 30%, #ffd6dd 50%, rgba(255,120,145,1) 70%, rgba(255,80,110,0));
    box-shadow: 0 0 10px #ff4b6b, 0 0 30px rgba(214,40,75,0.8); }
  .floor-wrap { position: absolute; left: 0; right: 0; top: 331px; height: 169px; perspective: 260px; perspective-origin: 50% 0%; overflow: hidden; }
  .floor { position: absolute; left: -60%; width: 220%; top: 0; height: 900px; transform-origin: 50% 0%; transform: rotateX(72deg);
    background-image: linear-gradient(rgba(255,70,100,0.55) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,70,100,0.55) 1.5px, transparent 1.5px);
    background-size: 70px 70px; background-position: center top;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, #000 60%); mask-image: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, #000 60%); }
  .stars { position: absolute; inset: 0 0 170px 0; background-image: radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.5), transparent), radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,.35), transparent), radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,.4), transparent), radial-gradient(1px 1px at 80% 40%, rgba(255,255,255,.35), transparent), radial-gradient(1px 1px at 92% 12%, rgba(255,255,255,.45), transparent), radial-gradient(1px 1px at 68% 62%, rgba(255,255,255,.3), transparent), radial-gradient(1px 1px at 20% 45%, rgba(255,255,255,.3), transparent); }
  .coin { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.14), rgba(255,255,255,0.02) 60%), #121012;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), inset 0 -8px 18px rgba(140,31,51,0.35), 0 0 0 1px rgba(255,90,116,0.35), 0 18px 40px rgba(0,0,0,0.7), 0 0 30px rgba(214,40,75,0.25); }
  .coin img { width: 56%; height: 56%; object-fit: contain; display: block; }
  .coin::after { content: ''; position: absolute; left: 50%; bottom: -26%; width: 70%; height: 10%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(255,70,100,0.35), transparent 70%); filter: blur(3px); }
  .center { position: absolute; left: 50%; top: 150px; transform: translate(-50%, -50%); text-align: center; width: 700px; }
  .brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 600; font-size: 14px; letter-spacing: .3em; margin-bottom: 14px; }
  .brand svg { width: 24px; height: 24px; }
  h1 { margin: 0; font-weight: 600; font-size: 58px; line-height: 1.02; letter-spacing: -0.04em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #ff7a90, #d9365a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 12px; font-size: 15px; color: #b5b5b5; }
</style>
</head>
<body>
<div class="hdr" id="hdr">
  <div class="stars"></div>
  <div class="sky-glow"></div>
  <div class="floor-wrap"><div class="floor"></div></div>
  <div class="horizon"></div>
  <div class="center">
    <div class="brand"><svg viewBox="0 0 100 100" fill="#fff"><rect x="33" y="0" width="34" height="18" rx="9"/><rect x="33" y="82" width="34" height="18" rx="9"/><rect x="0" y="33" width="18" height="34" rx="9"/><rect x="82" y="33" width="18" height="34" rx="9"/><rect x="16.5" y="16.5" width="17" height="17" rx="4.5"/><rect x="66.5" y="16.5" width="17" height="17" rx="4.5"/><rect x="16.5" y="66.5" width="17" height="17" rx="4.5"/><rect x="66.5" y="66.5" width="17" height="17" rx="4.5"/></svg>NEBARI</div>
    <h1>Every asset can<br>grow a <em>token</em>.</h1>
    <div class="sub">Stocks, ETH and stablecoins, on Robinhood Chain.</div>
  </div>
</div>
<script>
  // coins float above the horizon; bigger means nearer. Lower-left stays clear for the profile picture.
  const COINS = [
    ['eth','svg',   150, 118, 84], ['usdg','svg',  300, 215, 62], ['tsla','svg', 410, 100, 54],
    ['nvda','svg',  235, 292, 50], ['aapl','svg',  470, 262, 44],
    ['msft','svg', 1350, 118, 84], ['amzn','png', 1200, 215, 62], ['googl','svg',1090, 100, 54],
    ['meta','svg', 1265, 292, 50], ['spy','png',  1030, 262, 44],
  ];
  const hdr = document.getElementById('hdr');
  COINS.forEach(([f, ext, x, y, s]) => {
    const c = document.createElement('div'); c.className = 'coin';
    Object.assign(c.style, { left: x + 'px', top: y + 'px', width: s + 'px', height: s + 'px' });
    c.innerHTML = `<img src="../../assets/logos/bare/${f}.${ext}" alt="">`;
    hdr.appendChild(c);
  });
</script>
</body>
</html>
