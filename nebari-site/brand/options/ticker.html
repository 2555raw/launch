<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nebari — X header, ticker tape</title>
<style>
  @font-face { font-family: 'Poppins'; font-weight: 400; src: url('../fonts/Poppins-Regular.ttf'); }
  @font-face { font-family: 'Poppins'; font-weight: 500; src: url('../fonts/Poppins-Medium.ttf'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url('../fonts/Poppins-SemiBold.ttf'); }
  html, body { margin: 0; }
  .hdr { position: relative; width: 1500px; height: 500px; overflow: hidden; background: #0a0a0a; font-family: 'Poppins', sans-serif; color: #fff; }
  .bands { position: absolute; left: -200px; top: -120px; width: 1900px; height: 740px; transform: rotate(-7deg); display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .band { display: flex; gap: 46px; white-space: nowrap; align-items: center; height: 64px; padding-left: 40px; }
  .band .it { display: inline-flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .band .it img { width: 34px; height: 34px; object-fit: contain; }
  .band .it small { font-size: 15px; font-weight: 500; opacity: .6; }
  .band.dim .it { color: rgba(255,255,255,0.14); }
  .band.dim .it img { filter: grayscale(1) brightness(1.6); opacity: .14; }
  .band.hot { background: linear-gradient(90deg, #5b1321, #8c1f33 30%, #a3263d 50%, #8c1f33 70%, #5b1321); box-shadow: 0 0 40px rgba(163,38,61,0.5); }
  .band.hot .it { color: #fff; }
  .band.hot .it img { width: 38px; height: 38px; background: #0b0b0b; border-radius: 50%; padding: 7px; box-sizing: border-box; }
  .band.hot .sep { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.6); }
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse 34% 58% at 50% 42%, rgba(10,10,10,0.97) 0%, rgba(10,10,10,0.9) 45%, rgba(10,10,10,0) 100%); }
  .center { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; width: 720px; }
  .brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 600; font-size: 14px; letter-spacing: .3em; margin-bottom: 16px; }
  .brand svg { width: 24px; height: 24px; }
  h1 { margin: 0; font-weight: 600; font-size: 60px; line-height: 1.02; letter-spacing: -0.04em; }
  h1 em { font-style: normal; color: #e0667c; }
  .sub { margin-top: 14px; font-size: 16px; color: #a9a9a9; }
</style>
</head>
<body>
<div class="hdr">
  <div class="bands" id="bands"></div>
  <div class="shade"></div>
  <div class="center">
    <div class="brand"><svg viewBox="0 0 100 100" fill="#fff"><rect x="33" y="0" width="34" height="18" rx="9"/><rect x="33" y="82" width="34" height="18" rx="9"/><rect x="0" y="33" width="18" height="34" rx="9"/><rect x="82" y="33" width="18" height="34" rx="9"/><rect x="16.5" y="16.5" width="17" height="17" rx="4.5"/><rect x="66.5" y="16.5" width="17" height="17" rx="4.5"/><rect x="16.5" y="66.5" width="17" height="17" rx="4.5"/><rect x="66.5" y="66.5" width="17" height="17" rx="4.5"/></svg>NEBARI</div>
    <h1>Every asset can<br>grow a <em>token</em>.</h1>
    <div class="sub">Launch tokens paired with stocks, ETH and stablecoins on Robinhood Chain.</div>
  </div>
</div>
<script>
  const A = [['eth','svg','ETH','Ether'],['usdg','svg','USDG','Global Dollar'],['tsla','svg','TSLA','Tesla'],['nvda','svg','NVDA','NVIDIA'],['aapl','svg','AAPL','Apple'],
             ['msft','svg','MSFT','Microsoft'],['amzn','png','AMZN','Amazon'],['googl','svg','GOOGL','Alphabet'],['meta','svg','META','Meta'],['spy','png','SPY','S&P 500 ETF']];
  const rows = [['dim',0],['dim',3],['dim',6],['dim',2],['hot',5],['dim',8]];
  const box = document.getElementById('bands');
  rows.forEach(([kind, start]) => {
    const b = document.createElement('div'); b.className = 'band ' + kind;
    for (let i = 0; i < 16; i++) {
      const [f, ext, sym, name] = A[(start + i) % A.length];
      b.insertAdjacentHTML('beforeend', `<span class="it"><img src="../../assets/logos/bare/${f}.${ext}" alt="">${sym}${kind === 'hot' ? '' : ` <small>${name}</small>`}</span>` + (kind === 'hot' ? '<span class="sep"></span>' : ''));
    }
    box.appendChild(b);
  });
</script>
</body>
</html>
