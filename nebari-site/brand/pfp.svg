<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- black ground with a maroon glow, like the site's cards -->
    <radialGradient id="glow" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#8c1f33" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#4a0f1b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b0b0b" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="sheen" cx="78%" cy="14%" r="55%">
      <stop offset="0" stop-color="#c5394f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c5394f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#0b0b0b"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <rect width="1000" height="1000" fill="url(#sheen)"/>
  <!-- the thin rings from the site's hero card, kept inside the circular crop -->
  <circle cx="500" cy="500" r="395" fill="none" stroke="#c5394f" stroke-opacity="0.35" stroke-width="4"/>
  <!-- the logo, 520px wide, centred -->
  <g transform="translate(240 240) scale(5.2)" fill="#ffffff" filter="url(#shadow)">
    <rect x="33" y="0" width="34" height="18" rx="9"/>
    <rect x="33" y="82" width="34" height="18" rx="9"/>
    <rect x="0" y="33" width="18" height="34" rx="9"/>
    <rect x="82" y="33" width="18" height="34" rx="9"/>
    <rect x="16.5" y="16.5" width="17" height="17" rx="4.5"/>
    <rect x="66.5" y="16.5" width="17" height="17" rx="4.5"/>
    <rect x="16.5" y="66.5" width="17" height="17" rx="4.5"/>
    <rect x="66.5" y="66.5" width="17" height="17" rx="4.5"/>
  </g>
</svg>
