# The repository holds several projects; the deployed one is legalization-site,
# a single static page served by a small Node server. No build step is needed.
providers = ["node"]

[phases.install]
cmds = ["echo 'no dependencies to install'"]

[phases.build]
cmds = ["echo 'static page, nothing to build'"]

[start]
cmd = "node legalization-site/server.js"
