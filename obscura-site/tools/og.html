<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Obscura share cards</title>
<!--
  Source for assets/og-home.jpg and assets/og-verify.jpg, the 1200x630 images
  shown when a link is pasted into X, Telegram, WhatsApp or Discord.
  Rendered by tools/render-og.mjs. ?card=home or ?card=verify.
-->
<style>
  @font-face { font-family: "Host Grotesk"; font-weight: 300 800; src: url(../assets/fonts/host-grotesk-latin.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400 600; src: url(../assets/fonts/jetbrains-mono-latin.woff2) format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Host Grotesk", sans-serif; color: #0b0d12; background: #fff; display: grid; grid-template-columns: 1fr 480px; -webkit-font-smoothing: antialiased; }
  .copy { padding: 64px 56px 56px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
  .mark { width: 48px; height: 48px; border-radius: 14px; background: #0b0d12; color: #fff; display: grid; place-items: center; }
  .mark svg { width: 30px; height: 30px; }
  h1 { margin-top: auto; font-size: 78px; line-height: .98; font-weight: 580; letter-spacing: -.045em; }
  p { margin-top: 22px; font-size: 27px; line-height: 1.35; color: #555d6b; max-width: 26ch; }
  .chip { margin-top: 30px; display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: #edf2ff; color: #2458e8; font-size: 22px; font-weight: 560; }
  .chip svg { width: 22px; height: 22px; }
  .photo { position: relative; background: #e8eaef url(../assets/img/vault.svg) center 32% / cover; }
  .receipt { position: absolute; left: 28px; right: 28px; bottom: 32px; padding: 22px 24px; border-radius: 20px; background: rgba(255,255,255,.95); box-shadow: 0 30px 60px -30px rgba(11,13,18,.5); }
  .receipt b { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
  .receipt .hash { margin-top: 10px; font: 17px/1.5 "JetBrains Mono", monospace; color: #2458e8; word-break: break-all; }
  .receipt .ok { margin-top: 12px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 560; color: #0f8a43; }
  .receipt .ok svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M15.14 13.30L17.82 14.41 M13.30 15.14L14.41 17.82 M10.70 15.14L9.59 17.82 M8.86 13.30L6.18 14.41 M8.86 10.70L6.18 9.59 M10.70 8.86L9.59 6.18 M13.30 8.86L14.41 6.18 M15.14 10.70L17.82 9.59" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/></svg></span>Obscura</div>
    <h1 id="title"></h1>
    <p id="sub"></p>
    <span class="chip" id="chip"></span>
  </div>
  <div class="photo">
    <div class="receipt">
      <b id="amount"></b>
      <div class="hash">0x9f3c1ab47e20d58c6b11f0e2a7d94c3385e6b0f17a2c48d9e05b3f6a1c7d2e84</div>
      <div class="ok" id="ok"></div>
    </div>
  </div>
<script>
  const lock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const cards = {
    home: { title: "Prove one holding.<br>Hide the rest.", sub: "Seal an asset into one hash. Show it to one person, keep the rest of your wallet private.", chip: lock + "Runs in your browser", amount: "2.5 ETH", ok: lock + "Sealed locally" },
    verify: { title: "You've been sent a proof.", sub: "Open the link to check it. Your browser does the maths, nothing is uploaded.", chip: check + "One bond, one answer", amount: "at least 2.5 ETH", ok: check + "Proven on the blockchain" },
  };
  const c = cards[new URLSearchParams(location.search).get("card") || "home"];
  for (const k of ["title", "sub", "chip", "amount", "ok"]) document.getElementById(k).innerHTML = c[k];
  document.fonts.ready.then(() => { window.READY = true; });
</script>
</body>
</html>
