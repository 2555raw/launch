<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HeldAt share cards</title>
<!--
  Source for assets/og-home.jpg and assets/og-verify.jpg, the 1200x630 images
  shown when a link is pasted into X, Telegram, WhatsApp or Discord.
  Rendered by tools/render-og.mjs. ?card=home or ?card=verify.
-->
<style>
  @font-face { font-family: "Host Grotesk"; font-weight: 300 800; src: url(../assets/fonts/host-grotesk-latin.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400 600; src: url(../assets/fonts/jetbrains-mono-latin.woff2) format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: "Host Grotesk", sans-serif; color: #fff; background: #090b10; display: grid; grid-template-columns: 1fr 470px; -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; z-index: -1; }
  .copy { padding: 60px 40px 56px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
  .brand svg { width: 44px; height: 44px; }
  .chip { margin-top: auto; display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px; font: 19px "JetBrains Mono", monospace; color: #d7dce6; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  h1 { margin-top: 26px; font-size: 76px; line-height: .98; font-weight: 600; letter-spacing: -.045em; }
  h1 span { color: #7c8596; }
  p { margin-top: 22px; font-size: 26px; line-height: 1.35; color: #b4bccb; max-width: 27ch; }
  .side { display: grid; align-content: center; padding-right: 64px; }
  .card { padding: 22px 24px; border-radius: 22px; background: rgba(13,17,25,.82); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 60px -30px rgba(0,0,0,.8); }
  .k { display: flex; justify-content: space-between; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.1); font: 15px "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #8d97a8; }
  .card b { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .hash { margin-top: 12px; font: 17px/1.5 "JetBrains Mono", monospace; color: #9ec0ff; word-break: break-all; }
  .ok { margin-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 560; color: #9ec0ff; }
  .ok.proven { color: #4fd18e; }
  .ok svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <canvas id="field" width="1200" height="630"></canvas>
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M8 50H92M50 8.5V40M50 60V91.5M21.5 21L44 38.9M78.5 21L56 38.9M21.5 79L44 61.1M78.5 79L56 61.1" fill="none" stroke="#fff" stroke-width="5.6" stroke-linecap="round"/><path d="M42.4 40.4L48.5 48.4Q50 49.9 51.5 48.4L57.6 40.4L55.6 36.9C54.9 41.4 52.7 41.9 51.8 37.6L48.2 37.6C47.3 41.9 45.1 41.4 44.4 36.9ZM42.4 59.6L48.5 51.6Q50 50.1 51.5 51.6L57.6 59.6L55.6 63.1C54.9 58.6 52.7 58.1 51.8 62.4L48.2 62.4C47.3 58.1 45.1 58.6 44.4 63.1Z" fill="#fff"/></svg>HeldAt</div>
    <span class="chip" id="chip"></span>
    <h1 id="title"></h1>
    <p id="sub"></p>
  </div>
  <div class="side">
    <div class="card">
      <div class="k"><span id="k1"></span><span>SHA-256</span></div>
      <b id="amount"></b>
      <div class="hash">0x9f3c1ab47e20d58c6b11f0e2a7d94c3385e6b0f17a2c48d9e05b3f6a1c7d2e84</div>
      <div class="ok" id="ok"></div>
    </div>
  </div>
<script>
  const lock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const cards = {
    home: { title: "Prove one holding.<br><span>Hide the rest.</span>", sub: "Send one link. They see one holding, checked on the blockchain, and nothing else.", chip: "<i></i>Private proofs, sealed in your browser", k1: "Seal", amount: "2.5 ETH", ok: lock + "Sealed locally" },
    verify: { title: "You've been sent<br><span>a proof.</span>", sub: "Open the link to check it. Your browser does the maths, nothing is uploaded.", chip: "<i></i>One holding, one answer", k1: "Proof", amount: "At least 2.5 ETH", ok: check + "Proven on the blockchain" },
  };
  const c = cards[new URLSearchParams(location.search).get("card") || "home"];
  for (const k of ["title", "sub", "chip", "amount", "ok", "k1"]) document.getElementById(k).innerHTML = c[k];
  // the hero's dot rings, drawn once
  const ctx = document.getElementById("field").getContext("2d");
  const cx = 900, cy = 300;
  for (let y = 5; y < 630; y += 10) for (let x = 5; x < 1200; x += 10) {
    const r = Math.hypot(x - cx, y - cy), a = Math.atan2(y - cy, x - cx);
    const v = (0.5 + 0.5 * Math.sin(r * (1 + 0.05 * Math.cos(8 * a)) / 10)) ** 2 * Math.max(0, 1 - r / 720) * Math.min(1, Math.max(0.1, (x - 120) / 460));
    if (v < 0.05) continue;
    ctx.fillStyle = `rgba(214,222,236,${0.08 + v * 0.5})`; const s = 0.8 + 2.2 * v; ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  if (c === cards.verify) document.getElementById("ok").classList.add("proven");
  document.fonts.ready.then(() => { window.READY = true; });
</script>
</body>
</html>
