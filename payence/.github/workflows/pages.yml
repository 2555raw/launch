# Publishes the Payence site to GitHub Pages.
#
# Pages serves a project site from /<repo>, so the export is built with that
# prefix; without it every asset under _next/ would 404. The .nojekyll file
# matters for the same reason: Jekyll drops directories that start with an
# underscore, which is exactly where Next puts its assets.
name: Deploy Payence to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the static export
        run: npm run build:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
