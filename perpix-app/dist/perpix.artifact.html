<title>Perpix</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Perpix — design system.

   The ground is white and it stays white. On white, the only colour with weight
   is the brand's: each asset's real logo and its brand colour are what tell one
   row from another, so the rest of the interface gets out of the way. That is
   why surfaces are white or nearly, structure is a hairline, and semantic
   colour is reserved for the direction of a move and the side of a position.

   Numbers are always tabular monospace, so a column can be read top to bottom
   without the digits shifting. */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); }

/* ----------------------------------------------------------------------------
   The two themes.

   The light one is the original design: a white ground, on which the only
   colour with weight is the brand's, because each asset's real logo and its
   brand colour are what tell one row from another. The dark one keeps that
   idea rather than inverting it — the ground goes to a blue-biased near-black,
   the hairlines and the accent are lifted until they read on it, and the mark
   tile stays white, because most logos are drawn dark on nothing and a dark
   tile would swallow them.

   Every colour is a token declared on bare :root first, so a token can never
   exist only inside a media query. Four states, in cascade order:

     1. :root                       the complete light palette
     2. prefers-color-scheme: dark  the viewer's system, unless they chose light here
     3. [data-theme]                the host's own choice, where this page is embedded
     4. [data-px-theme]             the choice made in this application, which wins

   The attribute is data-px-theme and not data-theme on purpose: where this page
   is embedded, the host stamps data-theme itself, and two writers on one
   attribute fight. So this application reads the host's attribute and writes
   its own.
   ---------------------------------------------------------------------------- */

:root {
  color-scheme: light;
  /* ground: white, plus a barely perceptible grey to sink boxes into */
  --bg: #FFFFFF;
  --bg-blur: rgba(255, 255, 255, .86);
  --panel: #FFFFFF;
  --sunken: #F7F8FA;
  --sunken-2: #F1F3F6;
  /* ink */
  --ink: #0E1116;
  --ink-2: #303845;
  --muted: #5C6673;
  --dim: #98A1AE;
  /* structure */
  --line: #E6E9EE;
  --line-2: #D5DAE2;
  /* one functional accent: what can be pressed */
  --accent: #1F58F5;
  --accent-ink: #FFFFFF;
  --accent-soft: #EDF2FE;
  /* direction of a move and side of a position, never decoration */
  --up: #0E9F6E;
  --up-soft: #E6F6EF;
  --down: #D8342A;
  --down-soft: #FDECEB;
  --down-line: #F0C9C6;
  --warn: #B4690E;
  --warn-soft: #FDF3E4;
  --warn-ink: #6E4409;
  --warn-line: #F2DFC0;
  --risk-ink: #8A211A;
  --risk-line: #F5D2CF;
  /* "listed by you", which is neither a direction nor an action */
  --own: #6335D6;
  --own-soft: #F0EBFD;
  /* the tile a logo sits on: white in both themes, because a logo drawn dark
     on nothing disappears on anything else */
  --mark-bg: #FFFFFF;
  --mark-ring: rgba(16, 22, 32, .10);
  /* things that float above the page and set their own ground */
  --float-bg: #0E1116;
  --float-ink: #FFFFFF;
  --float-dim: #B9C0CC;
  --veil: rgba(14, 17, 22, .48);

  --r: 10px;
  --r-lg: 14px;
  --shadow: 0 1px 2px rgba(16,22,32,.04), 0 8px 24px -16px rgba(16,22,32,.16);
  --shadow-lift: 0 1px 2px rgba(16,22,32,.08);
  --shadow-pop: 0 6px 18px -8px rgba(16,22,32,.5);
  --shadow-panel: 0 24px 70px -30px rgba(16,22,32,.55);
  --shadow-bar: 0 18px 48px -22px rgba(16,22,32,.45);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* The dark palette, written once and pointed at from all three dark states. */
@media (prefers-color-scheme: dark) {
  :root:not([data-px-theme="light"]):not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0C0F14;
    --bg-blur: rgba(12, 15, 20, .82);
    --panel: #12161D;
    --sunken: #181D25;
    --sunken-2: #1F2630;
    --ink: #E8ECF3;
    --ink-2: #C1C9D6;
    --muted: #8B95A5;
    --dim: #667080;
    --line: #222A35;
    --line-2: #303945;
    --accent: #5B8CFF;
    --accent-ink: #08101F;
    --accent-soft: #17233C;
    --up: #21C68A;
    --up-soft: #0E2A20;
    --down: #F2564B;
    --down-soft: #2C1614;
    --down-line: #582924;
    --warn: #E3A33F;
    --warn-soft: #2A2114;
    --warn-ink: #E8C68A;
    --warn-line: #4A3A1E;
    --risk-ink: #F2A9A2;
    --risk-line: #552924;
    --own: #B69BFF;
    --own-soft: #221B3A;
    --mark-ring: rgba(255, 255, 255, .14);
    --float-bg: #262E3A;
    --float-ink: #F2F5FA;
    --float-dim: #99A3B3;
    --veil: rgba(4, 6, 10, .66);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.7);
    --shadow-lift: 0 1px 2px rgba(0,0,0,.5);
    --shadow-pop: 0 6px 18px -8px rgba(0,0,0,.8);
    --shadow-panel: 0 24px 70px -30px rgba(0,0,0,.9);
    --shadow-bar: 0 18px 48px -22px rgba(0,0,0,.85);
  }
}

/* The host's explicit dark choice, for a viewer who has not chosen here. */
:root[data-theme="dark"]:not([data-px-theme="light"]) {
  color-scheme: dark;
  --bg: #0C0F14;
  --bg-blur: rgba(12, 15, 20, .82);
  --panel: #12161D;
  --sunken: #181D25;
  --sunken-2: #1F2630;
  --ink: #E8ECF3;
  --ink-2: #C1C9D6;
  --muted: #8B95A5;
  --dim: #667080;
  --line: #222A35;
  --line-2: #303945;
  --accent: #5B8CFF;
  --accent-ink: #08101F;
  --accent-soft: #17233C;
  --up: #21C68A;
  --up-soft: #0E2A20;
  --down: #F2564B;
  --down-soft: #2C1614;
  --down-line: #582924;
  --warn: #E3A33F;
  --warn-soft: #2A2114;
  --warn-ink: #E8C68A;
  --warn-line: #4A3A1E;
  --risk-ink: #F2A9A2;
  --risk-line: #552924;
  --own: #B69BFF;
  --own-soft: #221B3A;
  --mark-ring: rgba(255, 255, 255, .14);
  --float-bg: #262E3A;
  --float-ink: #F2F5FA;
  --float-dim: #99A3B3;
  --veil: rgba(4, 6, 10, .66);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.7);
  --shadow-lift: 0 1px 2px rgba(0,0,0,.5);
  --shadow-pop: 0 6px 18px -8px rgba(0,0,0,.8);
  --shadow-panel: 0 24px 70px -30px rgba(0,0,0,.9);
  --shadow-bar: 0 18px 48px -22px rgba(0,0,0,.85);
}

/* The choice made here, which beats both of the above in either direction. */
:root[data-px-theme="dark"] {
  color-scheme: dark;
  --bg: #0C0F14;
  --bg-blur: rgba(12, 15, 20, .82);
  --panel: #12161D;
  --sunken: #181D25;
  --sunken-2: #1F2630;
  --ink: #E8ECF3;
  --ink-2: #C1C9D6;
  --muted: #8B95A5;
  --dim: #667080;
  --line: #222A35;
  --line-2: #303945;
  --accent: #5B8CFF;
  --accent-ink: #08101F;
  --accent-soft: #17233C;
  --up: #21C68A;
  --up-soft: #0E2A20;
  --down: #F2564B;
  --down-soft: #2C1614;
  --down-line: #582924;
  --warn: #E3A33F;
  --warn-soft: #2A2114;
  --warn-ink: #E8C68A;
  --warn-line: #4A3A1E;
  --risk-ink: #F2A9A2;
  --risk-line: #552924;
  --own: #B69BFF;
  --own-soft: #221B3A;
  --mark-ring: rgba(255, 255, 255, .14);
  --float-bg: #262E3A;
  --float-ink: #F2F5FA;
  --float-dim: #99A3B3;
  --veil: rgba(4, 6, 10, .66);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.7);
  --shadow-lift: 0 1px 2px rgba(0,0,0,.5);
  --shadow-pop: 0 6px 18px -8px rgba(0,0,0,.8);
  --shadow-panel: 0 24px 70px -30px rgba(0,0,0,.9);
  --shadow-bar: 0 18px 48px -22px rgba(0,0,0,.85);
}

.px {
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
/* hidden has to beat any display a component sets for itself. */
[hidden] { display: none !important; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.dim { color: var(--dim); } .muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------- sidebar ---------------- */
.px-side {
  border-right: 1px solid var(--line);
  padding: 16px 12px 14px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh;
  background: var(--bg);
}
.px-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.px-brand-mark { width: 28px; height: 28px; flex: none; }
.px-brand-name { font-weight: 650; font-size: 15.5px; letter-spacing: -.02em; }
.px-brand-sub { display: block; font-size: 11px; font-weight: 450; color: var(--dim); letter-spacing: 0; }

.px-nav { display: flex; flex-direction: column; gap: 2px; }
.px-nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  font-size: 13.5px; font-weight: 500; color: var(--muted);
  transition: background .14s, color .14s;
}
.px-nav a:hover { background: var(--sunken); color: var(--ink); }
.px-nav a.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.px-nav svg { width: 16px; height: 16px; flex: none; }
.px-nav-count {
  margin-left: auto; font-family: var(--mono); font-size: 11px;
  background: var(--sunken-2); color: var(--muted); border-radius: 20px; padding: 1px 7px;
}
.px-nav a.is-active .px-nav-count { background: var(--panel); color: var(--accent); }

.px-side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.px-equity {
  border: 1px solid var(--line); border-radius: var(--r); padding: 10px 11px;
  display: grid; gap: 2px;
}
.px-equity dt { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.px-equity dd { margin: 0; font-family: var(--mono); font-size: 15px; font-weight: 600; }
.px-equity-row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.px-side-links { display: flex; align-items: center; gap: 6px; }

/* The X mark, linking to @usePerpix. */
.px-x {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center; cursor: pointer;
  background: none; border: 1px solid var(--line); border-radius: 9px;
  color: var(--ink); transition: background .14s, border-color .14s;
}
.px-x:hover { background: var(--sunken); border-color: var(--line-2); }
.px-x svg { width: 15px; height: 15px; fill: currentColor; }
.px-ghost-btn {
  flex: 1; text-align: left; cursor: pointer; color: var(--muted); font-size: 12px;
  background: none; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px;
  transition: color .14s, border-color .14s;
}
.px-ghost-btn:hover { color: var(--ink); border-color: var(--line-2); }

/* ---------------- header ---------------- */
.px-main { display: flex; flex-direction: column; min-width: 0; }
.px-top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px;
  padding: 11px 24px;
  background: var(--bg-blur); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
/* min-width 0 so the search box yields width to the notice on its right rather
   than pushing the header off screen. */
.px-search { position: relative; flex: 1 1 0; min-width: 0; max-width: 540px; }
.px-search-box {
  display: flex; align-items: center; gap: 9px;
  background: var(--sunken); border: 1px solid transparent; border-radius: 9px; padding: 0 11px;
  transition: background .14s, border-color .14s;
}
.px-search-box:focus-within { background: var(--panel); border-color: var(--accent); }
.px-search-box svg { width: 15px; height: 15px; color: var(--dim); flex: none; }
.px-search input {
  flex: 1; min-width: 0; border: 0; background: none; outline: none;
  font: inherit; font-size: 13.5px; color: var(--ink); padding: 9px 0;
}
.px-search input::placeholder { color: var(--dim); }
.px-search kbd {
  font-family: var(--mono); font-size: 10.5px; color: var(--dim);
  border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 5px; background: var(--panel);
}
.px-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 50;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 5px; max-height: 62vh; overflow: auto;
}
.px-res {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 9px; border-radius: 8px; cursor: pointer;
  background: none; border: 0; text-align: left;
}
.px-res:hover, .px-res.is-on { background: var(--sunken); }
.px-res-label { font-size: 13.5px; font-weight: 550; }
.px-res-sub { font-size: 11.5px; color: var(--muted); }
.px-res-sym { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
.px-res-empty { padding: 14px 10px; font-size: 13px; color: var(--muted); }

.px-top-right { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; }
.px-clock {
  display: flex; align-items: baseline; gap: 6px;
  font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap;
}
.px-clock b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.px-theme {
  width: 32px; height: 32px; flex: none;
  display: grid; place-items: center; cursor: pointer;
  background: none; border: 1px solid var(--line); border-radius: 9px;
  color: var(--muted); transition: color .14s, border-color .14s, background .14s;
}
.px-theme:hover { color: var(--ink); border-color: var(--line-2); background: var(--sunken); }
.px-theme svg { width: 16px; height: 16px; display: block; }
.px-clock-zone { font-size: 10.5px; color: var(--dim); }

/* ---------------- view ---------------- */
.px-view { padding: 22px 24px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; }
.px-foot {
  padding: 14px 24px 22px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between;
  font-size: 11.5px; color: var(--dim);
}

.px-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 18px; }
.px-head > div { min-width: 0; }
.px-head h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.025em; }
.px-head p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); max-width: 64ch; }
.px-head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.px-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden;
}
.px-card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--line);
}
.px-card-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
.px-card-head .px-card-note { font-size: 11.5px; color: var(--dim); margin-left: auto; text-align: right; }
.px-card-head .px-ranges { margin-left: 10px; }
.px-card-body { padding: 16px; }
.px-card-body.tight { padding: 0; }
.px-card-foot { padding: 0 16px 16px; }

.px-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.px-grid > * { min-width: 0; }
/* min(Npx, 100%) rather than a bare Npx: on a screen narrower than the minimum
   column, auto-fit would honour it and overflow the page. */
.px-grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); }
.px-grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); }
.px-grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); }
.px-split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 336px; align-items: start; }

/* ---------------- figures ---------------- */
.px-stat { border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px; background: var(--panel); }
.px-stat dt { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 5px; }
.px-stat dd { margin: 0; font-family: var(--mono); font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.px-stat-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

.px-kv { display: grid; gap: 9px; }
.px-kv > div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 13px; }
.px-kv dt { color: var(--muted); }
.px-kv dd { margin: 0; font-family: var(--mono); font-weight: 550; text-align: right; }
.px-kv-line { border-top: 1px dashed var(--line-2); padding-top: 9px; margin-top: 1px; }

/* ---------------- the asset's mark ---------------- */
.px-mark {
  flex: none; display: grid; place-items: center; overflow: hidden;
  border-radius: 8px; background: var(--mark-bg);
  box-shadow: inset 0 0 0 1px var(--mark-ring);
  font-weight: 650; letter-spacing: -.02em; line-height: 1;
}
/* Monogram, embedded mark and fetched logo all share one cell, so replacing one
   with another costs no reflow. */
.px-mark > * { grid-area: 1 / 1; }
.px-mark-img { width: 100%; height: 100%; object-fit: contain; background: var(--mark-bg); }
.px-mark-txt { display: block; }
.px-mark-svg { width: 100%; height: 100%; display: block; }
.px-mark.is-svg, .px-mark.is-logo { box-shadow: inset 0 0 0 1px var(--mark-ring); background: var(--mark-bg); }
/* A symbol tile: a metal's chemical symbol, or the ticker of an asset whose
   logo cannot be embedded. Both are real identifiers, so both get the same
   treatment rather than one of them looking like a mark that failed to load. */
.px-mark.is-symbol {
  box-shadow: inset 0 0 0 1px var(--mark-ring);
  font-family: var(--font); font-weight: 650; letter-spacing: -.02em;
}
.px-stack { display: inline-flex; align-items: center; }
/* The ring that separates stacked marks is the ground behind them, not white. */
.px-stack .px-mark { box-shadow: inset 0 0 0 1px var(--mark-ring), 0 0 0 2px var(--panel); }

.px-ident { display: flex; align-items: center; gap: 10px; min-width: 0; }
.px-ident-text { min-width: 0; }
.px-ident-name { font-size: 13.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.px-ident-sub { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.px-sym {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  border-radius: 5px; padding: 1px 5px; letter-spacing: 0;
}

/* ---------------- pills ---------------- */
.px-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 550; border-radius: 20px; padding: 3px 9px;
  background: var(--sunken); color: var(--muted); white-space: nowrap;
}
.px-pill.up { background: var(--up-soft); color: var(--up); }
.px-pill.down { background: var(--down-soft); color: var(--down); }
.px-pill.accent { background: var(--accent-soft); color: var(--accent); }
.px-pill.warn { background: var(--warn-soft); color: var(--warn); }
.px-pill.own { background: var(--own-soft); color: var(--own); }

/* ---------------- buttons ---------------- */
.px-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 14px; border-radius: 9px; cursor: pointer;
  font-size: 13px; font-weight: 600; border: 1px solid transparent;
  background: var(--accent); color: var(--accent-ink);
  transition: filter .14s, background .14s, border-color .14s, color .14s;
}
.px-btn:hover:not(:disabled) { filter: brightness(1.08); }
.px-btn:disabled { opacity: .45; cursor: not-allowed; }
.px-btn.ghost { background: var(--panel); border-color: var(--line-2); color: var(--ink); }
.px-btn.ghost:hover:not(:disabled) { background: var(--sunken); filter: none; }
.px-btn.quiet { background: var(--sunken); color: var(--ink-2); }
.px-btn.quiet:hover:not(:disabled) { background: var(--sunken-2); filter: none; }
.px-btn.long { background: var(--up); }

/* Runtime configuration, and the market's parameters in one place so the
   interface and the engine cannot disagree about the rules. */

const VENUE = {
  name: 'Perpix',
  tagline: 'Index perpetuals',
  settle: 'USDG',
  /** A basket is fixed-weight and holds three to five legs: fewer is not an
   *  index, and more dilutes each weight until the basket says nothing. */
  minLegs: 3,
  maxLegs: 5,
  maxLeverage: 5,
  /** Fee on opening and on closing, charged on notional. */
  takerFee: 0.0005,
  /** Of the total fees a position pays, this share goes to the index's
   *  creator. The protocol keeps the rest. */
  creatorShare: 0.30,
  /** Maintenance margin: below this a position is liquidated. */
  maintenanceMargin: 0.005,
  /** Reference funding per 8 h, scaled by the imbalance between longs and
   *  shorts. */
  fundingBase: 0.0001,
  fundingCap: 0.00075,
  /** Paper balance a new account starts with. */
  openingBalance: 10000,
  minMargin: 10,
  /** An index starts at base 100 the day it lists, so its chart measures
   *  exactly what the basket has done since then. */
  indexBase: 100,
};

/* Official logos are resolved from each entity's own domain at runtime. No copy
   is kept in the repository, so a logo cannot go stale or diverge between
   screens. */
const KEY = 'perpix.config';
const LEGACY_KEY = 'warp.config';
const DEFAULTS = {
  logoTemplate: 'https://img.logo.dev/{domain}?token={logoToken}&size=128&format=png&retries=0',
  logoToken: '',
  /* Fallback resolvers, in order. None needs a key, so the app shows real logos
     with nothing configured; the paid one only improves coverage and resolution
     when a token is present. */
  logoFallbacks: [
    'https://icons.duckduckgo.com/ip3/{domain}.ico',
    'https://www.google.com/s2/favicons?domain={domain}&sz=128',
  ],
  /** Seed for the price simulator. Fixing it makes the market reproducible
   *  across reloads and across tabs. */
  seed: 20260910,
};

/* Read from the host if there is one and from the browser if there is one: the
   modules do not assume a browser exists, so the logic can run and be tested
   outside of one. */
const host = () => (typeof window === 'undefined' ? null : window.PERPIX_CONFIG);
function read() {
  let saved = {};
  // The old key is read once and moved across: the application was called Warp
  // before it was renamed, and a rename should not reset anyone's settings.
  try {
    const raw = localStorage.getItem(KEY) ?? localStorage.getItem(LEGACY_KEY);
    if (raw !== null && localStorage.getItem(KEY) === null) {
      localStorage.setItem(KEY, raw);
      localStorage.removeItem(LEGACY_KEY);
    }
    saved = JSON.parse(raw || '{}');
  } catch { saved = {}; }
  return { ...DEFAULTS, ...(host() || {}), ...saved };
}
const config = read();
function saveConfig(patch) {
  const next = { ...read(), ...patch };
  try { localStorage.setItem(KEY, JSON.stringify(next)); } catch {}
  Object.assign(config, next);
  return config;
}

Object.assign(exports, { VENUE, config, saveConfig });
});

/* GENERATED FILE — do not edit by hand.
   Rebuild with: node perpix-app/tools/build-marks.mjs

   The official mark of each asset, embedded so it shows with no network and
   inside a host that blocks external images. js/logos.js still prefers the
   full-colour logo resolved from the entity's own domain when that loads; this
   is the floor beneath it, not a replacement for it.

   Nothing here was drawn or approximated. Sources:
   @iconify-json/logos@1.2.14 (CC0-1.0)
   cryptocurrency-icons@0.18.1 (CC0-1.0)
   @iconify-json/cib@1.2.3 (CC0-1.0)
   simple-icons@16.30.0 (CC0-1.0)
   @iconify-json/arcticons@1.2.57 (CC-BY-SA-4.0)

   The @iconify-json/arcticons marks are CC BY-SA 4.0, which asks for
   attribution: it is given here, in the README, and in the application itself,
   on each asset's page and in the terms.

   Each entry records the set it came from, and `brand` names the brand a mark
   belongs to when that is not the listed entity itself. The marks remain the
   trademarks of their owners and are used only to identify the asset. Assets
   with no entry have no mark in any of these sets; they resolve at runtime or

__def("js/logos.js", function (exports, __req) {
/* The mark system.
   Rule: always the entity's real mark, never one drawn, generated or
   approximated.

   Three tiers, in this order:

   1. The full-colour logo resolved at runtime from the entity's own official
      domain. This is the entity's current mark, so when it loads it wins.
   2. The official mark embedded in js/marks.js, from published CC0 icon sets.
      This is what shows the instant the page opens, and what stays where tier 1
      cannot reach: a page opened from the filesystem with no connection, or a
      host that blocks external images.
   3. The asset's own official symbol on its brand colour, for the assets no set
      carries. Fourteen companies and funds have no logo published under a
      licence that allows embedding — in several cases because the owner had it
      removed from the sets that used to carry it — so what stands in is the
      ticker they actually trade under. That is a real identifier, not a drawing:
      never another entity's logo, and never an emoji.

   A metal skips all three: it is not a company and has no logo. Its mark is its
   official chemical symbol in the real colour of the metal, which is the
   notation the industry itself uses. Tier 3 is the same treatment applied to
   the same kind of fact, so the two read as one system rather than as a mark
   and a failure.

   Tier 2 paints first and tier 1 replaces it only if what arrives is big enough
   to be an improvement, so the slot is never blank and never gets worse.

   Every screen builds a mark by calling markEl(), and only that function. That
   is why an asset cannot show one mark in the search box and another in a
   basket. */

const { config } = __req("js/config.js");
const { MARKS } = __req("js/marks.js");

const failed = new Set();

function fill(template, domain) {
  return template
    .replace('{domain}', encodeURIComponent(domain))
    .replace('{logoToken}', encodeURIComponent(config.logoToken || ''));
}

function logoSources(domain) {
  if (!domain) return [];
  const out = [];
  if (config.logoTemplate && (config.logoToken || !config.logoTemplate.includes('{logoToken}'))) {
    out.push(fill(config.logoTemplate, domain));
  }
  for (const tpl of config.logoFallbacks || []) out.push(fill(tpl, domain));
  return out.filter(u => !failed.has(u));
}

function rgba(hex, a) {
  const m = String(hex || '#888').replace('#', '');
  const n = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
  const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
  if ([r, g, b].some(Number.isNaN)) return `rgba(136,136,136,${a})`;
  return `rgba(${r},${g},${b},${a})`;
}

/** Relative luminance, to pick legible ink over a brand colour instead of
 *  assuming white always works. */
function luminance(hex) {
  const m = String(hex || '#888').replace('#', '');
  const n = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
  const ch = [0, 2, 4].map(i => {
    const v = (parseInt(n.slice(i, i + 2), 16) || 0) / 255;
    return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
  });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
/* Ink over a brand colour. This used to be a luminance threshold, and a single
   threshold gets mid-tones wrong in either direction: gold sits just under it
   and took white ink at 2.1:1, which is unreadable. So both candidates are
   measured and the better one wins, which is the only rule that cannot be
   wrong at the boundary. */
const INK_DARK = '#111418';
const INK_LIGHT = '#FFFFFF';
const contrast = (a, b) => {
  const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
};
const inkOn = (hex) =>
  (contrast(hex, INK_DARK) >= contrast(hex, INK_LIGHT) ? INK_DARK : INK_LIGHT);

/** Symbol text sized to fit its tile: two characters can be large, five have to
 *  give way. Without this a five-letter ticker would either overflow or force
 *  every mark down to the size the longest one needs. */
function symbolType(text, size) {
  const n = Math.max(text.length, 1);
  const scale = n <= 2 ? 0.42 : n === 3 ? 0.32 : n === 4 ? 0.26 : 0.21;
  return Math.max(7, Math.round(size * scale));
}

/** A tile in the asset's own brand colour carrying its official symbol. The
 *  same construction serves a metal's chemical symbol and a company's ticker. */
function symbolTile(el, asset, text, size) {
  el.classList.add('is-symbol');
  el.style.background = asset.color;
  el.style.color = inkOn(asset.color);
  el.style.fontSize = symbolType(text, size) + 'px';
  el.append(Object.assign(document.createElement('span'), {
    className: 'px-mark-txt', textContent: text,
  }));
  return el;
}

/** Below this many pixels, a fetched image is a favicon rather than a logo and
 *  replacing a clean embedded mark with it would be a downgrade. */
const MIN_USEFUL = 32;

/** Builds the embedded official mark as inline SVG, or null if there is none.
 *  A monochrome set is drawn in the entity's own brand colour; a colour set is
 *  left exactly as published. */
function embeddedMark(asset) {
  const m = MARKS[asset?.id];
  if (!m) return null;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', m.box);
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');
  svg.classList.add('px-mark-svg');
  if (m.tint) svg.setAttribute('fill', m.tint);
  else if (m.mono) svg.setAttribute('color', asset.color);   // the set draws with currentColor
  svg.innerHTML = m.body;
  return svg;
}

/** What the interface can say about where an asset's mark came from. */
function markProvenance(asset) {
  if (asset?.class === 'metal') {
    return { kind: 'element', text: `Official chemical symbol, ${asset.element}, in the real colour of the metal` };
  }
  const m = MARKS[asset?.id];
  if (m) {
    const who = m.brand
      ? `Official mark of ${m.brand}, a brand of ${asset.short}`
      : 'Official mark';
    return {
      kind: 'embedded', set: m.set, brand: m.brand, licence: m.licence,
      text: `${who}, embedded from ${m.set} (${m.licence}), and resolved at runtime from ${asset.domain} when that loads`,
    };
  }
  return {
    kind: 'symbol',
    text: `No logo for ${asset?.short} is published under a licence that allows embedding, so its official ticker `
        + `${asset?.symbol} stands in${asset?.domain ? `; the real logo still resolves at runtime from ${asset.domain}` : ''}`,
  };
}

/** The asset's mark. Returns an element ready to insert. */
function markEl(asset, size = 36) {
  const el = document.createElement('span');
  el.className = 'px-mark';
  el.style.width = el.style.height = size + 'px';
  el.style.setProperty('--brand', asset?.color || '#8A94A6');
  el.title = asset?.name || '';

  // A metal carries its chemical symbol in its own colour, which is its real
  // notation, so none of the logo tiers apply.
  if (asset?.class === 'metal') {
    el.classList.add('is-element');
    return symbolTile(el, asset, asset.element || asset.symbol, size);
  }

  // Tier 2 first, because it needs nothing and is ready on this frame.
  const embedded = embeddedMark(asset);
  if (embedded) {
    el.classList.add('is-svg');
    el.style.padding = Math.max(1, Math.round(size * 0.11)) + 'px';
    el.append(embedded);
  } else {
    symbolTile(el, asset, asset.symbol || '?', size);
  }

  // Tier 1 on top, if it arrives and is worth the swap.
  const sources = logoSources(asset?.domain);
  if (!sources.length) return el;

  const img = document.createElement('img');
  img.className = 'px-mark-img';
  img.alt = `${asset?.name || ''} logo`;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.hidden = true;
  let i = 0;
  const tryNext = () => {
    if (i >= sources.length) { img.remove(); return; }   // what is already painted stays
    img.src = sources[i++];
  };
  img.addEventListener('load', () => {
    // A 16-pixel favicon is not an upgrade over an embedded vector mark.
    const floor = embedded ? MIN_USEFUL : 8;
    if (img.naturalWidth < floor) { failed.add(img.src); return tryNext(); }
    img.hidden = false;
    el.classList.remove('is-symbol', 'is-svg');
    el.classList.add('is-logo');
    el.style.padding = '0';
    // The tile's colour is a token, so it is left to the stylesheet: an inline
    // white here would stay white when the theme changed.
    el.style.background = '';
    el.querySelector('.px-mark-txt')?.remove();
    el.querySelector('.px-mark-svg')?.remove();
  });
  img.addEventListener('error', () => { failed.add(img.src); tryNext(); });
  el.append(img);
  tryNext();
  return el;
}

/** Overlapping stack of marks: how a basket reads at a glance. */
function markStack(assets, size = 28) {
  const el = document.createElement('span');
  el.className = 'px-stack';
  (assets || []).forEach((a, i) => {
    const m = markEl(a, size);
    m.style.zIndex = String(20 - i);
    m.style.marginLeft = i ? `-${Math.round(size * 0.24)}px` : '0';
    el.appendChild(m);
  });
  return el;
}

Object.assign(exports, { logoSources, rgba, luminance, inkOn, markProvenance, markEl, markStack });
});

__def("js/market.js", function (exports, __req) {
/* The price feed.

   NOTICE, AND IT GOVERNS THE WHOLE PROJECT: there is no real market data here.
   Perpix is a paper market and this simulator produces its prices. The reference
   levels below are orders of magnitude picked so the interface reads, not
   quotes. No number in this application describes the real market, and the
   interface says so in the header and the footer of every screen instead of
   leaving it in the small print.

   How it works: an asset's price at an instant is a sum of waves of different
   scales, with phase and amplitude seeded from the symbol. That gives three
   properties a random walk does not:
   - it is reproducible: the same seed gives the same market on every reload and
     in every tab, so a position opened yesterday still makes sense today;
   - it is continuous: there are no jumps between reloads;
   - it can be evaluated at any instant in constant time, so a chart's history
     does not have to be stored: it is computed.

   To plug in a real provider later, there is `setFeed()` at the end: the
   application only knows that interface, not this simulator. */

const { config } = __req("js/config.js");
const { getAsset } = __req("js/registry.js");

/* The simulator's reference levels. These are not quotes. */
const REF = {
  NVDA:180, AAPL:240, MSFT:500, GOOGL:240, AMZN:230, META:720, TSLA:400, AMD:165,
  INTC:35, AVGO:350, TSM:260, ASML:900, ORCL:240, CRM:260, ADBE:380, PLTR:160,
  NFLX:1200, SPOT:680, UBER:90, ABNB:130, SHOP:150, DIS:115, KO:70, PEP:145,
  MCD:300, SBUX:95, NKE:75, WMT:100, LLY:800, JNJ:175, BA:210, CAT:400, V:340,
  MA:570, JPM:290, GS:700, COIN:320, HOOD:110, MSTR:320, XOM:115,
  SAN:8, BBVA:15, ITX:48, IBE:15, MC:620, SAP:250, NOVO:60, FER:450,
  XAU:3400, XAG:40, XPT:1400, XPD:1200, XCU:9800, XAL:2600, XNI:15500,
  XZN:2900, XSN:33000, XPB:2000, XLI:11000, XCO:33000,
  BTC:95000, ETH:3300, SOL:180, XRP:2.4, DOGE:0.18, AVAX:28, LINK:20, ADA:0.7,
  SPY:640, QQQ:570, VOO:590, GLD:310, SLV:36,
  USDG:1,
};

/* How much each class moves, relative to a stock. */
const VOL = { stock:1, etf:0.55, metal:0.85, crypto:2.2, settle:0 };

const MIN = 60e3, HOUR = 3600e3, DAY = 24 * HOUR;
/* Wave scales, from the background trend to the flicker of a tick. */
const WAVES = [
  { period: 34 * DAY, amp: 0.150 },
  { period: 9 * DAY,  amp: 0.095 },
  { period: 2.4 * DAY, amp: 0.062 },
  { period: 7 * HOUR, amp: 0.032 },
  { period: 43 * MIN, amp: 0.013 },
  { period: 11 * MIN, amp: 0.0055 },
  { period: 2.2 * MIN, amp: 0.0022 },
];

function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const shapes = new Map();
function shape(id) {
  if (shapes.has(id)) return shapes.get(id);
  const asset = getAsset(id);
  const rnd = mulberry32(hash32(id + '|' + config.seed));
  const vol = VOL[asset?.class] ?? 1;
  const s = {
    base: REF[id] ?? 100,
    vol,
    // Each wave gets its own phase and its amplitude is roughed up a little, so
    // two assets of the same class do not move in lockstep.
    waves: WAVES.map(w => ({
      w: (2 * Math.PI) / w.period,
      phase: rnd() * Math.PI * 2,
      amp: w.amp * vol * (0.7 + rnd() * 0.6),
    })),
    // The asset's reference volume, also simulated.
    volBase: (0.4 + rnd() * 3.2) * 1e6,
  };
  shapes.set(id, s);
  return s;
}

/** The asset's price at an instant. Constant time and stateless. */
function spot(id, t = Date.now()) {
  const s = shape(id);
  if (!s.vol) return s.base;                     // USDG does not move
  let e = 0;
  for (const w of s.waves) e += w.amp * Math.sin(w.w * t + w.phase);
  return s.base * Math.exp(e);
}

/** The asset's percentage change over the last `hours` hours. */
function changePct(id, hours = 24, t = Date.now()) {
  const then = spot(id, t - hours * HOUR);
  if (!then) return 0;
  return ((spot(id, t) / then) - 1) * 100;

/** Time series for a chart. Not stored: evaluated. */
function series(id, from, to, points = 180) {
  const step = (to - from) / Math.max(points - 1, 1);
  const out = [];
  for (let i = 0; i < points; i++) {
    const t = from + i * step;
    out.push({ t, c: spot(id, t) });
  }
  return out;
}

function volume24h(id, t = Date.now()) {

   A fixed-weight index is worth, at base 100 from the day it listed:
       V(t) = 100 * sum_i  w_i * P_i(t) / P_i(t0)

  const refs = {};
  for (const leg of legs) refs[leg.id] = spot(leg.id, t);

   A real provider is plugged in by replacing them, and nothing else in the
   application changes. While the feed is the simulator, `isSimulated` is true
   and the interface announces it. */

__def("js/engine.js", function (exports, __req) {
/* The market's engine: list an index, open and close positions, charge fees,
   accrue funding and liquidate whatever runs out of margin.

   The rules live in VENUE (config.js), not scattered across the interface, so
   that what a trading panel says and what the engine does are the same rule.
   Every function returns { ok, error } instead of throwing: a form needs to
   explain why it cannot continue, not break. */

  if (rows.length > VENUE.maxLegs) errors.push(`An index holds at most ${VENUE.maxLegs} assets.`);

const indexLegs = (ix) => (ix?.legs || []).map(l => ({ ...l, asset: getAsset(l.id) }));

function openInterest(indexId) {

  const ix = getIndex(indexId);

  state.wallet.balance = round(state.wallet.balance - q.margin - q.fee, 8);
  ix.feesAccrued = round(ix.feesAccrued + q.creatorFee, 8);

    id: nextId('po'),

    margin: round(q.margin, 8),
    leverage: q.leverage,
    notional: round(q.notional, 8),
    entry: q.entry,
    openedAt: t,
    feesPaid: round(q.fee, 8),
    funding: 0,
    fundingAt: t,
  };

function markPosition(pos, t = Date.now()) {
  const ix = getIndex(pos.indexId);
  const mark = indexValue(ix, t);
  if (mark === null) return { mark: null };

 *  position's last settlement so the same stretch is never charged twice. */
function accruedFunding(pos, t) {
  const hours = Math.max(0, (t - (pos.fundingAt || pos.openedAt)) / HOUR);

  if (m.mark === null) return { ok: false, error: 'A position cannot be closed without an index value.' };

  const ix = getIndex(pos.indexId);
  // A liquidation takes the margin: it returns no remainder and charges no
  // closing fee.
  const returned = reason === 'liquidation' ? 0 : Math.max(0, m.net);
  const closeFee = reason === 'liquidation' ? 0 : m.closeFee;

  state.wallet.balance = round(state.wallet.balance + returned, 8);
  if (ix && closeFee) ix.feesAccrued = round(ix.feesAccrued + closeFee * VENUE.creatorShare, 8);

  state.positions.splice(i, 1);
  state.history.unshift({
    ...pos,
    closedAt: t, exit: m.mark, reason,
    pnl: round(m.pnl, 8),
    fundingTotal: round(m.funding, 8),
    feesTotal: round(pos.feesPaid + closeFee, 8),
    returned: round(returned, 8),
    roe: m.roe,

 *  so a liquidation happens by the rule and not because someone is watching. */
function liquidationSweep(t = Date.now()) {
  const dead = state.positions.filter(p => markPosition(p, t).liquidatable);
  dead.forEach(p => closePosition(p.id, 'liquidation'));
  return dead.length;

const pendingFees = (ix) => round((ix?.feesAccrued || 0) - (ix?.feesClaimed || 0), 8);

function claimFees(indexId) {
  const ix = getIndex(indexId);
  if (!ix) return { ok: false, error: 'That index does not exist.' };
  if (ix.creator !== 'me') return { ok: false, error: "Only an index's creator claims its fees." };
  const due = pendingFees(ix);
  if (due <= 0) return { ok: false, error: 'There are no fees pending on this index.' };
  ix.feesClaimed = round(ix.feesClaimed + due, 8);
  state.wallet.balance = round(state.wallet.balance + due, 8);
  commit();
  return { ok: true, claimed: due };
}

/* -------- the account -------- */

function accountSummary(t = Date.now()) {
  let marginUsed = 0, unrealised = 0;
  for (const p of state.positions) {
    const m = markPosition(p, t);
    marginUsed += p.margin;
    if (m.mark !== null) unrealised += m.pnl - m.funding;
  }
  const claimable = state.indices.reduce((s, ix) => s + (ix.creator === 'me' ? pendingFees(ix) : 0), 0);
  const realised = state.history.reduce((s, h) => s + (h.pnl || 0), 0);

    balance: state.wallet.balance,
    marginUsed,
    unrealised,
    equity: state.wallet.balance + marginUsed + unrealised,
    claimable,
    realised,

});

/* The search box. It tolerates typos, accents and the trade name, because
   someone searching "nickel" or "aluminium" should not have to remember that
   the symbol is XNI or XAL. It never invents a match: if nothing looks close,
   it says so. */

/** Bounded edit distance: all that matters is whether it differs by a letter
 *  or two, not how far apart any two strings are. */
function close(a, b, max = 1) {
  if (a === b) return 0;
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    for (let j = 1; j <= b.length; j++) {
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = row;
  }
  return prev[b.length];
}

function scoreAsset(asset, q) {
  const sym = fold(asset.symbol), name = fold(asset.name), short = fold(asset.short);
  const el = fold(asset.element || '');
  if (sym === q || el === q) return 100;
  if (short === q || name === q) return 96;
  if (sym.startsWith(q)) return 88;
  if (short.startsWith(q) || name.startsWith(q)) return 80;
  for (const a of asset.aliases || []) {
    const fa = fold(a);
    if (fa === q) return 90;
    if (fa.startsWith(q)) return 74;
    if (fa.includes(q)) return 58;
  }
  if (short.includes(q) || name.includes(q)) return 52;
  if (fold(asset.sector).includes(q)) return 34;
  if (q.length >= 4 && (close(sym, q) <= 1 || close(short.slice(0, q.length), q) <= 1)) return 30;
  return 0;
}

  const sym = fold(ix.symbol), name = fold(ix.name);
  if (sym === q) return 100;
  if (sym.startsWith(q) || name.startsWith(q)) return 84;
  if (sym.includes(q) || name.includes(q) || fold(ix.note).includes(q)) return 50;
  if (ix.legs.some(l => fold(l.id) === q)) return 44;
  return 0;

 *  in a market of indices, what you trade is the index. */

    const s = scoreIndex(ix, q);
    if (s) out.push({ kind: 'index', score: s + 6, index: ix, label: ix.name, sub: `Index · ${ix.legs.length} assets` });

/* The theme.

   Three modes, not two: light, dark, and following whatever the viewer's
   machine says. "System" is the default because it is the answer most people
   have already given somewhere else, and asking again is rude.

   The choice is written to data-px-theme on the root element, and deliberately
   not to data-theme: where this page is embedded, the host writes data-theme
   itself, and two writers on one attribute fight. So the stylesheet reads the
   host's attribute as a fallback and this module writes its own, which wins.

   Canvas does not participate in the cascade, so a theme change has to repaint
   the charts. That is what the listeners are for: a change of mode, a change of
   the system's preference, or the host changing its own attribute all end in
   the same redraw. */

const KEY = 'perpix.theme';
const MODES = ['system', 'dark', 'light'];

const root = () => document.documentElement;
const systemDark = () => window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;

function mode() {
  try {
    const saved = localStorage.getItem(KEY);
    if (MODES.includes(saved)) return saved;
  } catch {}
  return 'system';
}

/** What is actually on screen, which is what an icon should show. */
function resolved() {
  const m = mode();
  if (m !== 'system') return m;
  // Following the system means following the host too, when there is one that
  // has been told which theme to use.
  const host = root().getAttribute('data-theme');
  if (host === 'dark' || host === 'light') return host;
  return systemDark() ? 'dark' : 'light';
}

const listeners = new Set();
function onThemeChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
const announce = () => listeners.forEach(fn => { try { fn(resolved(), mode()); } catch {} });

function apply() {
  const m = mode();
  if (m === 'system') root().removeAttribute('data-px-theme');
  else root().setAttribute('data-px-theme', m);
  announce();
}

function setMode(next) {
  if (!MODES.includes(next)) return;
  try { localStorage.setItem(KEY, next); } catch {}
  apply();
}

/** system → dark → light → system. Every step changes something except the one
 *  that returns to a system already showing what you just chose, which is the
 *  price of fitting three states on one button. */
function cycleMode() {
  setMode(MODES[(MODES.indexOf(mode()) + 1) % MODES.length]);
}

const ICONS = {
  // A filled sun, a crescent, and a half-filled disc for "whatever the machine says".
  light: '<circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/></g>',

  system: '<circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.6a8.4 8.4 0 0 0 0 16.8Z" fill="currentColor"/>',
};
const LABEL = { light: 'Light', dark: 'Dark', system: 'System' };

/** Wires the button in the header and keeps it describing the real state. */
function mountThemeButton(button) {
  const paint = () => {
    const m = mode(), r = resolved();

   wrong theme on its way to the right one. */

__def("js/terms.js", function (exports, __req) {
/* The terms gate, and the storage notice that follows it.

   Nobody reads terms, which is exactly why these are short and say the things
   that actually matter about this application: that the money is not money,
   that the prices are not prices, that the data never leaves the browser, and
   that the logos belong to other people. Everything in them is true; there is
   no clause here padding the length.

   Acceptance is stored with the version it accepted, so changing the terms
   asks again rather than assuming an old yes still covers a new text. */

   does not make everyone accept the same terms twice. */
function carryOver(key, legacyKey) {

   make two walls to get through before seeing anything, and a notice about what

const STORAGE_KEY = 'perpix.storage.consent';
const STORAGE_DELAY = 30000;

function acceptance() {

    return raw && raw.version === TERMS_VERSION ? raw : null;
  } catch { return null; }
}

function record() {
  const entry = { version: TERMS_VERSION, acceptedAt: Date.now() };
  try { localStorage.setItem(KEY, JSON.stringify(entry)); } catch {}
  return entry;
}

/* The clauses. Kept as data so the same text serves the gate on entry and the
   copy reachable from the footer afterwards: one source, so they cannot drift. */
const CLAUSES = [
  {
    title: 'This is a paper market',
    body: `Perpix is for practice. Every price you see is produced by a simulator built into the page, `
        + `not by a market data provider, and no figure here describes the real market. The ${VENUE.settle} `
        + `balance is not money: it cannot be deposited, withdrawn or exchanged for anything. No order you `
        + `place reaches a real venue, and no asset is ever bought or sold.`,
  },
  {
    title: 'Nothing here is advice',
    body: `Nothing in Perpix is investment advice, a recommendation, an offer or a solicitation. An index `
        + `performing one way in the simulator says nothing about the assets it names. Leverage in this `
        + `application will lose you simulated money quickly, which is the one lesson it can honestly teach.`,
  },
  {
    title: 'Your data stays in your browser',
    body: `Your balance, positions, history and the indices you list are stored in this browser's local `
        + `storage and nowhere else. Nothing is sent to a server, because there is no server. That also `
        + `means nothing is backed up: clearing the site's data, using a different browser, or pressing `

  },
  {

        + `and it may stop working. Use it as a toy, which is what it is.`,

const clauseList = () => el('div', { class: 'px-terms-body' }, CLAUSES.map(c =>

/** Blocks the application until the terms are accepted, then calls `start`.

  const box = el('input', { type: 'checkbox', id: 'termsAgree', class: 'px-check' });

    // quietly ignored until the button is pressed again.
    panel.replaceChildren(
      brandMark(),
      el('h1', { text: 'Then Perpix stays closed' }),
      el('p', { class: 'px-terms-lead', text:
        'The terms are the whole basis on which this application can be used, so there is no version of it '
        + 'that runs without them. Nothing has been stored, and nothing has happened.' }),
      el('div', { class: 'px-terms-actions' }, [
        el('button', { class: 'px-btn ghost', type: 'button', text: 'Read them again', on: { click: () => { overlay.remove(); document.body.classList.remove('px-locked'); requireAcceptance(start); } } }),
      ]),
    );
  });

  const panel = el('div', { class: 'px-terms-panel', role: 'document' }, [
    brandMark(),
    el('h1', { text: 'Before you go in' }),
    el('p', { class: 'px-terms-lead', text:

    class: 'px-terms', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Terms of use',
  }, [panel]);

  document.body.append(overlay);
  document.body.classList.add('px-locked');
  // Focus lands on the checkbox, which is the only thing standing in the way.
  requestAnimationFrame(() => box.focus());

  // Tab must not escape the dialog while it is the only thing on screen.
  overlay.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Tab') return;
    const stops = [...overlay.querySelectorAll('input, button')].filter(n => !n.disabled);
    if (!stops.length) return;
    const first = stops[0], last = stops[stops.length - 1];
    if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }

/** The same text, reachable from the footer once you are inside. */
function openTerms() {
  const close = el('button', { class: 'px-btn ghost', type: 'button', text: 'Close' });
  const a = acceptance();
  const panel = el('div', { class: 'px-terms-panel', role: 'document' }, [
    brandMark(),
    el('h1', { text: 'Terms of use' }),
    a ? el('p', { class: 'px-terms-lead', text: `Accepted on ${new Date(a.acceptedAt).toLocaleString('en-GB')}.` }) : null,
    clauseList(),
    el('div', { class: 'px-terms-actions' }, [close]),
  ]);
  const overlay = el('div', { class: 'px-terms', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Terms of use' }, [panel]);
  const shut = () => { overlay.remove(); document.body.classList.remove('px-locked'); };
  close.addEventListener('click', shut);
  overlay.addEventListener('click', (ev) => { if (ev.target === overlay) shut(); });
  overlay.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') shut(); });

  document.body.classList.add('px-locked');

/* -------- the storage notice --------

   Perpix sets no cookies. Saying "we use cookies" would be the easy copy and it
   would be false, so this says what actually happens: the account lives in this
   browser's local storage, nothing is sent anywhere, and there is no third party
   and nothing to track. Which also means there is no non-essential category to
   turn off, and the notice says that too rather than offering a toggle that
   controls nothing. Both buttons record a choice; neither changes what is
   stored, because the only thing stored is the application itself. */

function storageChoice() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    return raw && raw.choice ? raw : null;
  } catch { return null; }
}

function recordStorageChoice(choice) {
  const entry = { choice, at: Date.now() };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entry)); } catch {}
  return entry;
}

function storageBar() {
  const bar = el('div', {
    class: 'px-cookie', role: 'region', 'aria-label': 'Cookies and storage',
  });
  const dismiss = (choice) => {
    recordStorageChoice(choice);
    bar.classList.add('is-going');
    setTimeout(() => bar.remove(), 220);
  };
  bar.append(
    el('div', { class: 'px-cookie-text' }, [
      el('strong', { text: 'Cookies and storage' }),
      el('p', { text:
        "Perpix sets no cookies and has no analytics, no third parties and nothing to track. Your balance, "
        + "positions and the indices you list are kept in this browser's local storage so the app can "
        + "remember them between visits, and that is the only thing stored. There is nothing "
        + "non-essential to switch off, so both buttons below record your answer and neither changes "
        + "what is kept." }),
    ]),
    el('div', { class: 'px-cookie-actions' }, [
      el('button', { class: 'px-btn sm', type: 'button', text: 'Accept', on: { click: () => dismiss('accepted') } }),
      el('button', { class: 'px-btn sm ghost', type: 'button', text: 'Essential only', on: { click: () => dismiss('essential') } }),
      el('button', { class: 'px-foot-link', type: 'button', text: 'Terms', on: { click: openTerms } }),
    ]),
  );
  return bar;
}

/** Shows the notice once, a while into the session, if it has not been answered. */
function scheduleStorageNotice() {
  if (storageChoice()) return;
  setTimeout(() => {
    if (storageChoice() || document.querySelector('.px-cookie')) return;
    document.body.append(storageBar());
  }, STORAGE_DELAY);
}

Object.assign(exports, { TERMS_VERSION, acceptance, hasAccepted, CLAUSES, requireAcceptance, openTerms, storageChoice, scheduleStorageNotice });
});

          text: `You can be the first to put ${a.short} in a basket.`,
          action: primaryBtn('Create an index with ' + a.short, () => go(`#/create?seed=${a.id}`), 'ghost'),
        }),
    }),
  ]);
}

function notFound(text) {
  return frag([
    head('Not found', null, null),
    card({ body: emptyState({ title: 'There is nothing here', text, action: primaryBtn('Back to the dashboard', () => go('#/'), 'ghost') }) }),
  ]);
}

/* ---- positions table, shared by the dashboard, the portfolio and the index ---- */

function positionsTable(t = Date.now(), { indexId = null, compact: small = false } = {}) {
  const rows = openPositions(indexId);
  if (!rows.length) return null;
  const cols = small
    ? ['Index', 'Side', 'Result', '']
    : ['Index', 'Side', 'Margin', 'Notional', 'Entry', 'Mark', 'Liquidation', 'Funding', 'Result', ''];

  return table(cols, rows.map(p => {
    const m = markPosition(p, t);
    const ix = getIndex(p.indexId);
    const legs = indexLegs(ix);
    const side = el('span', { class: `px-pill ${p.side === 'long' ? 'up' : 'down'}`, text: `${p.side === 'long' ? 'Long' : 'Short'} ${lev(p.leverage)}` });
    const result = el('td', {}, [
      el('div', { class: `num ${dir(m.pnl - m.funding)}`, text: usdg(m.pnl - m.funding, { sign: true }) }),
      el('div', { class: `px-ident-sub num ${dir(m.roe)}`, text: pct(m.roe) }),
    ]);
    const close = el('td', {}, [
      el('button', {
        class: 'px-btn sm ghost', type: 'button', text: 'Close',
        on: { click: (ev) => { ev.stopPropagation(); const r = closePosition(p.id); toast(r.ok ? `Position closed: ${usdg(r.closed.pnl, { sign: true })}` : r.error, r.ok ? (r.closed.pnl >= 0 ? 'good' : '') : 'bad'); } },
      }),
    ]);
    const cells = small
      ? [el('td', { class: 'wide' }, [indexIdent(ix, legs)]), el('td', {}, [side]), result, close]
      : [
          el('td', { class: 'wide' }, [indexIdent(ix, legs)]),
          el('td', {}, [side]),
          el('td', { class: 'num', text: usdg(p.margin) }),
          el('td', { class: 'num', text: usdg(p.notional) }),
          el('td', { class: 'num', text: auto(p.entry) }),
          el('td', { class: 'num', text: m.mark === null ? NA_TEXT : auto(m.mark) }),
          el('td', { class: 'num dim', text: auto(m.liq) }),
          el('td', { class: `num ${m.funding > 0 ? 'down' : m.funding < 0 ? 'up' : 'dim'}`, text: usdg(-m.funding, { sign: true }) }),
          result, close,
        ];
    return el('tr', { class: 'clickable', on: { click: () => go(`#/i/${p.indexId}`) } }, cells);
  }));
}

/* ============================ index page ============================ */

function indexView(id) {
  const ix = getIndex(id);
  if (!ix) return notFound('That index is not listed.');
  const t = Date.now();
  const legs = indexLegs(ix);
  const color = indexColor(legs);
  const value = indexValue(ix, t);
  const oi = openInterest(ix.id);
  const funding = fundingRate(ix.id);
  const ch24 = indexChange(ix, 24, t);

  const chart = chartBlock({
    load: (hours) => indexSeries(ix, hours),
    color, baseline: VENUE.indexBase, initial: '1M',
  });

  const legRows = legs.map(l => {
    const p = spot(l.asset.id, t);
    const ref = ix.refs[l.asset.id];
    const sinceList = ref ? (p / ref - 1) * 100 : null;
    // What the leg contributes to the basket's move since it listed.
    const contrib = sinceList === null ? null : sinceList * (l.weight / 100);
    return el('tr', { class: 'clickable', on: { click: () => go(`#/a/${l.asset.id}`) } }, [
      el('td', { class: 'wide' }, [assetIdent(l.asset, { size: 30 })]),
      el('td', { class: 'num', text: num(l.weight, 1) + '%' }),
      el('td', { class: 'num', text: auto(p) }),
      el('td', { class: 'num dim', text: ref ? auto(ref) : NA_TEXT }),
      el('td', {}, [changePill(changePct(l.asset.id, 24, t))]),
      el('td', { class: `num ${dir(contrib)}`, text: contrib === null ? NA_TEXT : pct(contrib) }),
    ]);
  });

  const left = el('div', { class: 'px-grid' }, [
    card({
      title: 'Index value',
      note: `Base ${VENUE.indexBase} the day it listed, ${ago(ix.listedAt)}`,
      actions: chart.ranges, body: chart.wrap,
    }),
    card({
      title: 'Composition',
      note: "Fixed weight: it never rebalances, so today's basket is the one that listed",
      body: el('div', { class: 'px-grid' }, [
        donut(legs, 128),
        note('The <strong>contribution</strong> column is how much of the index\'s change since it listed comes from each leg: its move times its weight.'),
      ]),
    }),
    card({
      title: 'Leg detail', tight: true,
      body: table(['Asset', 'Weight', 'Sim. price', 'At listing', '24 h', 'Contribution'], legRows),
    }),
    card({
      title: 'Your positions in this index', tight: true,
      body: positionsTable(t, { indexId: ix.id })
        || emptyState({ title: 'No position open here', text: 'Use the panel on the right to open one.' }),
    }),
  ]);

  const right = el('div', { class: 'px-grid' }, [
    tradePanel(ix, value),
    card({
      title: 'Market state',
      body: frag([
        kv([
          { k: 'Value', v: value === null ? NA_TEXT : auto(value) },
          { k: '24 h change', v: pct(ch24), cls: dir(ch24) },
          { k: '7 d change', v: pct(indexChange(ix, 24 * 7, t)), cls: dir(indexChange(ix, 24 * 7, t)) },
          { k: 'Sim. 24 h depth', v: compact(simulatedDepth(ix, t)), line: true },
          { k: 'Open interest', v: oi.total ? usdg(oi.total) : '—' },
          { k: 'Longs', v: oi.long ? usdg(oi.long) : '—', cls: 'up' },
          { k: 'Shorts', v: oi.short ? usdg(oi.short) : '—', cls: 'down' },
          { k: 'Funding 8 h', v: pct(funding * 100, { d: 4 }), cls: funding > 0 ? 'down' : funding < 0 ? 'up' : 'flat' },
        ]),
        el('div', { style: { marginTop: '12px' } }, [
          el('div', { class: 'px-weights', title: 'Split of open interest between longs and shorts' }, [
            el('span', { style: { width: `${oi.total ? (oi.long / oi.total) * 100 : 50}%`, background: 'var(--up)' } }),
            el('span', { style: { width: `${oi.total ? (oi.short / oi.total) * 100 : 50}%`, background: 'var(--down)' } }),
          ]),
          el('div', { class: 'px-hint', style: { marginTop: '6px' },
            text: funding > 0 ? 'More longs than shorts: the longs pay.'
                : funding < 0 ? 'More shorts than longs: the shorts pay.'
                : 'No imbalance: funding sits at its base rate.' }),
        ]),
      ]),
    }),
    card({
      title: 'Who listed it',
      body: frag([
        kv([
          { k: 'Symbol', v: ix.symbol },
          { k: 'Creator', v: ix.creator === 'me' ? 'You' : 'Perpix demo account' },
          { k: 'Listed', v: dateTime(ix.listedAt) },
          { k: 'Legs', v: String(legs.length) },
          { k: 'Fees generated', v: usdg(ix.feesAccrued), line: true },
        ]),
        ix.note ? el('p', { class: 'px-hint', style: { marginTop: '10px' }, text: ix.note }) : null,
        ix.creator === 'me'
          ? el('div', { style: { marginTop: '12px', display: 'grid', gap: '8px' } }, [
              el('button', {
                class: 'px-btn quiet block', type: 'button',
                text: `Claim ${usdg(pendingFees(ix))}`, disabled: pendingFees(ix) <= 0,
                on: { click: () => { const r = claimFees(ix.id); toast(r.ok ? `Claimed ${usdg(r.claimed)}` : r.error, r.ok ? 'good' : 'bad'); } },
              }),
              el('button', {
                class: 'px-btn danger block sm', type: 'button', text: 'Delist the index',
                on: { click: () => { const r = delistIndex(ix.id); if (r.ok) { toast('Index delisted'); go('#/creator'); } else toast(r.error, 'bad'); } },
              }),
            ])
          : null,
      ]),
    }),
  ]);

  return frag([
    el('div', { class: 'px-head' }, [
      el('div', {}, [
        indexIdent(ix, legs, { size: 34 }),
        ix.note ? el('p', { text: ix.note }) : null,
      ]),
      el('div', { class: 'px-head-actions' }, [
        el('span', { class: 'num', style: { fontSize: '24px', fontWeight: '650' }, text: value === null ? NA_TEXT : auto(value) }),
        changePill(ch24),
      ]),
    ]),
    el('div', { class: 'px-split' }, [left, right]),
  ]);
}

/* What the user has typed into the trading panel, per index. It lives outside
   the screen so the periodic price refresh does not wipe their side or a margin
   they are half way through typing. */
const tickets = new Map();
function ticket(indexId) {
  if (!tickets.has(indexId)) {
    tickets.set(indexId, {
      side: 'long',
      margin: Math.min(100, Math.max(VENUE.minMargin, Math.floor(state.wallet.balance * 0.1))),
      leverage: 2,
    });
  }
  return tickets.get(indexId);
}

/** The trading panel. Every figure it shows comes from quoteOrder(), the same
 *  function that validates the order on the way in: it cannot promise one
 *  liquidation and then apply another. */
function tradePanel(ix, value) {
  const tk = ticket(ix.id);

  const sideSeg = el('div', { class: 'px-seg side', style: { display: 'flex' } }, ['long', 'short'].map(s =>
    el('button', {
      type: 'button', data: { side: s }, style: { flex: '1' },
      text: s === 'long' ? 'Long' : 'Short',
      class: s === tk.side ? 'is-on' : '',
      on: { click: () => { tk.side = s; [...sideSeg.children].forEach(b => b.classList.toggle('is-on', b.dataset.side === s)); refresh(); } },
    })));

  const marginInput = el('input', {
    class: 'px-input num', type: 'number', min: VENUE.minMargin, step: '1', value: String(tk.margin),
    on: { input: () => { tk.margin = Number(marginInput.value); refresh(); } },
  });
  const levInput = el('input', {
    class: 'px-range', type: 'range', min: '1', max: String(VENUE.maxLeverage), step: '0.5', value: String(tk.leverage),
    on: { input: () => { tk.leverage = Number(levInput.value); refresh(); } },
  });
  const levLabel = el('span', { class: 'num', text: lev(tk.leverage) });

  const quick = el('div', { style: { display: 'flex', gap: '6px' } }, [0.25, 0.5, 1].map(f =>
    el('button', {
      class: 'px-btn sm quiet', type: 'button', style: { flex: '1' },
      text: f === 1 ? 'Max' : `${f * 100}%`,
      on: { click: () => { tk.margin = Math.max(VENUE.minMargin, Math.floor(state.wallet.balance * f * 100) / 100); marginInput.value = String(tk.margin); refresh(); } },
    })));

  const summary = el('div');
  const problem = el('div');
  const risk = el('div');
  const submit = el('button', { class: 'px-btn block', type: 'button' });

  function refresh() {
    levLabel.textContent = lev(tk.leverage);
    const q = quoteOrder({ indexId: ix.id, side: tk.side, margin: tk.margin, leverage: tk.leverage });
    summary.replaceChildren(kv([
      { k: 'Notional', v: usdg(q.notional) },
      { k: 'Entry', v: q.entry === null ? NA_TEXT : auto(q.entry) },
      { k: 'Liquidation', v: q.liq === null ? NA_TEXT : auto(q.liq), cls: 'down' },
      { k: `Fee ${pct(VENUE.takerFee * 100, { sign: false, d: 3 })}`, v: usdg(q.fee) },
      { k: 'Of it, to the creator', v: usdg(q.creatorFee), line: true },
      { k: 'Total to lock up', v: usdg(q.margin + q.fee) },
    ]));
    problem.replaceChildren(q.ok ? '' : el('div', { class: 'px-error', text: q.error }));
    // The warning speaks about the leverage selected right now, not the
    // maximum: a warning that does not describe your order warns of nothing.
    risk.replaceChildren(note(
      `At ${lev(tk.leverage)}, a <strong>${num(100 / tk.leverage, 1)}%</strong> move against you takes the whole margin. ` +
      `The engine applies the liquidation on its own; you do not need the screen open.`, 'risk'));
    submit.textContent = `${tk.side === 'long' ? 'Open long' : 'Open short'} ${lev(tk.leverage)}`;
    submit.className = `px-btn block ${tk.side === 'long' ? 'long' : 'short'}`;
    submit.disabled = !q.ok;
  }
  submit.addEventListener('click', () => {
    const r = openPosition({ indexId: ix.id, side: tk.side, margin: tk.margin, leverage: tk.leverage });
    toast(r.ok ? `${tk.side === 'long' ? 'Long' : 'Short'} opened on ${ix.symbol} for ${usdg(r.position.notional)}` : r.error, r.ok ? 'good' : 'bad');
  });
  refresh();

  return card({
    title: 'Trade', note: value === null ? 'No value' : `Mark ${auto(value)}`,
    body: el('div', { class: 'px-grid', style: { gap: '13px' } }, [
      sideSeg,
      el('div', { class: 'px-field' }, [
        el('label', { text: `Margin (${usdg(state.wallet.balance)} available)` }),
        el('div', { class: 'px-input-unit' }, [marginInput, el('span', { class: 'px-unit', text: VENUE.settle })]),
        quick,
      ]),
      el('div', { class: 'px-field' }, [
        el('label', {}, [el('span', { text: 'Leverage ' }), levLabel]),
        levInput,
        el('div', { class: 'px-range-marks' }, ['1x', '2x', '3x', '4x', '5x'].map(x => el('span', { text: x }))),
      ]),
      summary,
      problem,
      submit,
      risk,
    ]),
  });
}

/* ============================ create an index ============================ */

let draft = null;

function createView(seedId) {
  if (!draft) draft = { symbol: '', name: '', note: '', legs: [] };
  if (seedId && getAsset(seedId) && !draft.legs.some(l => l.id === seedId) && draft.legs.length < VENUE.maxLegs) {
    draft.legs.push({ id: seedId, weight: 0 });
    equalise();
  }

  const wrap = el('div', { class: 'px-grid' });
  const legsBox = el('div', { class: 'px-grid', style: { gap: '8px' } });
  const pickerBox = el('div', { class: 'px-picker' });
  const preview = el('div', { class: 'px-grid' });
  const totalLine = el('div', { class: 'px-hint' });
  let pickerTab = 'stock';
  let pickerQuery = '';

  function equalise() {
    const n = draft.legs.length;
    if (!n) return;
    const each = Math.floor((100 / n) * 10) / 10;
    draft.legs.forEach((l, i) => { l.weight = i === n - 1 ? Math.round((100 - each * (n - 1)) * 10) / 10 : each; });
  }
  const total = () => draft.legs.reduce((s, l) => s + (Number(l.weight) || 0), 0);

  function addLeg(id) {
    if (draft.legs.length >= VENUE.maxLegs) return toast(`An index holds at most ${VENUE.maxLegs} assets.`, 'bad');
    if (draft.legs.some(l => l.id === id)) return;
    draft.legs.push({ id, weight: 0 });
    equalise();
    renderAll();
  }
  function removeLeg(id) {
    draft.legs = draft.legs.filter(l => l.id !== id);
    equalise();
    renderAll();
  }

  const symbolInput = el('input', {
    class: 'px-input num', maxlength: '12', placeholder: 'MYBASKET', value: draft.symbol,
    on: { input: () => { draft.symbol = symbolInput.value = symbolInput.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); renderPreview(); } },
  });
  const nameInput = el('input', {
    class: 'px-input', maxlength: '48', placeholder: 'My metals basket', value: draft.name,
    on: { input: () => { draft.name = nameInput.value; renderPreview(); } },
  });
  const noteInput = el('input', {
    class: 'px-input', maxlength: '120', placeholder: 'What idea this basket expresses (optional)', value: draft.note,
    on: { input: () => { draft.note = noteInput.value; } },
  });

  function renderLegs() {
    legsBox.replaceChildren(...(draft.legs.length ? draft.legs.map(l => {
      const a = getAsset(l.id);
      const w = el('input', {
        class: 'px-input num px-leg-w', type: 'number', min: '0.1', max: '100', step: '0.1', value: String(l.weight),
        on: { input: () => { l.weight = Number(w.value); renderPreview(); } },
      });
      return el('div', { class: 'px-leg' }, [
        markEl(a, 30),
        el('div', { style: { flex: '1', minWidth: '0' } }, [
          el('div', { class: 'px-ident-name', text: a.short }),
          el('div', { class: 'px-ident-sub' }, [symPill(a), el('span', { text: CLASSES[a.class]?.label })]),
        ]),
        w,
        el('span', { class: 'dim', text: '%' }),
        el('button', { class: 'px-leg-x', type: 'button', text: '×', title: `Remove ${a.short}`, on: { click: () => removeLeg(l.id) } }),
      ]);
    }) : [note(`Pick between ${VENUE.minLegs} and ${VENUE.maxLegs} assets from the list below. You can mix stocks, metals, crypto and ETFs in the same basket.`)]));
    const tt = total();
    totalLine.className = `px-hint ${Math.abs(tt - 100) > 0.01 ? 'px-error' : ''}`;
    totalLine.textContent = `${draft.legs.length} of ${VENUE.maxLegs} assets · weights add up to ${num(tt, 1)}%` +
      (Math.abs(tt - 100) > 0.01 ? ', and they have to add up to 100%' : '');
  }

  function renderPicker() {
    const q = pickerQuery.trim().toLowerCase();
    const list = byClass(pickerTab).filter(a =>
      !q || a.short.toLowerCase().includes(q) || a.symbol.toLowerCase().includes(q) || (a.aliases || []).some(x => x.includes(q)));
    pickerBox.replaceChildren(...(list.length ? list.map(a => {
      const on = draft.legs.some(l => l.id === a.id);
      return el('button', {
        class: `px-chip ${on ? 'is-on' : ''}`, type: 'button',
        disabled: !on && draft.legs.length >= VENUE.maxLegs,
        on: { click: () => (on ? removeLeg(a.id) : addLeg(a.id)) },
      }, [markEl(a, 20), el('span', { text: a.short }), el('span', { class: 'dim num', style: { fontSize: '11px' }, text: a.symbol })]);
    }) : [el('span', { class: 'px-hint', text: 'Nothing matches that search in this class.' })]));
  }

  function renderPreview() {
    const check = validateBasket(draft);
    const legs = draft.legs.map(l => ({ ...l, asset: getAsset(l.id) })).filter(l => l.asset);
    const kids = [];

    if (legs.length >= 2 && Math.abs(total() - 100) < 0.01) {
      // Backcast: what this basket, at these weights, would have done had it
      // listed thirty days ago. The simulator says so, not the market.
      const from = Date.now() - 30 * DAY;
      const refs = {};
      legs.forEach(l => { refs[l.id] = spot(l.id, from); });
      const rows = basketSeries(legs, refs, from, Date.now(), 120, VENUE.indexBase);
      const last = rows[rows.length - 1]?.c;
      kids.push(
        donut(legs, 118),
        el('div', {}, [
          el('div', { style: { display: 'flex', alignItems: 'baseline', gap: '10px' } }, [
            el('span', { class: 'num', style: { fontSize: '22px', fontWeight: '650' }, text: auto(last) }),
            changePill(last ? last - VENUE.indexBase : 0),
            el('span', { class: 'px-hint', text: 'over 30 days, from base 100' }),
          ]),
        ]),
        el('div', { class: 'px-chart sm' }, [
          (() => {
            const c = el('canvas');
            requestAnimationFrame(() => sparkline(c, rows, indexColor(legs)));
            return c;
          })(),
        ]),
        note('This is a <strong>simulator backcast</strong>: what these weights would have done if the basket had existed for the last thirty days. It is not the index\'s history, because the index does not exist yet.'),
      );
    } else {
      kids.push(emptyState({ title: 'No basket to draw yet', text: `Add at least ${VENUE.minLegs} assets and leave the weights adding up to 100%.` }));
    }

    if (!check.ok && draft.legs.length) {
      kids.push(el('ul', { class: 'px-errors' }, check.errors.map(e => el('li', { text: e }))));
    }

    kids.push(el('button', {
      class: 'px-btn block', type: 'button', text: 'List the index', disabled: !check.ok,
      on: { click: () => {
        const r = listIndex(draft);
        if (!r.ok) return toast(r.error, 'bad');
        toast(`${r.index.symbol} listed`, 'good');
        draft = null;
        go(`#/i/${r.index.id}`);
      } },
    }));
    kids.push(note(`On listing, the basket freezes each leg's price as a reference and starts at base ${VENUE.indexBase}. From that moment you take <strong>${Math.round(VENUE.creatorShare * 100)}%</strong> of the fees every trade on it pays.`));

    preview.replaceChildren(...kids);
  }

  const renderAll = () => { renderLegs(); renderPicker(); renderPreview(); };

  const tabBar = el('div', { class: 'px-seg' }, ['stock', 'metal', 'crypto', 'etf'].map(id =>
    el('button', {
      type: 'button', text: CLASSES[id].plural, class: id === pickerTab ? 'is-on' : '',
      on: { click: (ev) => { pickerTab = id; [...tabBar.children].forEach(b => b.classList.remove('is-on')); ev.currentTarget.classList.add('is-on'); renderPicker(); } },
    })));
  const pickerSearch = el('input', {
    class: 'px-input', placeholder: 'Filter within this class', type: 'search',
    on: { input: () => { pickerQuery = pickerSearch.value; renderPicker(); } },
  });

  wrap.append(
    head('Create index', `A fixed-weight basket of ${VENUE.minLegs} to ${VENUE.maxLegs} assets. You list it, anyone can trade it, and you keep ${Math.round(VENUE.creatorShare * 100)}% of the fees.`, null),
    el('div', { class: 'px-split' }, [
      el('div', { class: 'px-grid' }, [
        card({
          title: "The index's identity",
          body: el('div', { class: 'px-grid cols-2', style: { gap: '13px' } }, [
            el('div', { class: 'px-field' }, [el('label', { text: 'Symbol' }), symbolInput, el('span', { class: 'px-hint', text: '3 to 12 letters or digits' })]),
            el('div', { class: 'px-field' }, [el('label', { text: 'Name' }), nameInput]),
            el('div', { class: 'px-field', style: { gridColumn: '1 / -1' } }, [el('label', { text: 'Description' }), noteInput]),
          ]),
        }),
        card({
          title: 'The basket',
          actions: el('button', { class: 'px-btn sm quiet', type: 'button', text: 'Equal weights', on: { click: () => { equalise(); renderAll(); } } }),
          body: el('div', { class: 'px-grid', style: { gap: '10px' } }, [legsBox, totalLine]),
        }),
        card({
          title: 'Add assets',
          note: 'Stocks, metals, crypto and ETFs in the same basket',
          body: el('div', { class: 'px-grid', style: { gap: '11px' } }, [tabBar, pickerSearch, pickerBox]),
        }),
      ]),
      card({ title: 'Preview', body: preview }),
    ]),
  );
  renderAll();
  return wrap;
}

/* ============================ portfolio ============================ */

function portfolioView() {
  const t = Date.now();
  const acc = accountSummary(t);

  const history = state.history.slice(0, 40).map(h => {
    const ix = getIndex(h.indexId);
    const legs = ix ? indexLegs(ix) : [];
