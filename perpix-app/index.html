<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perpix</title>
<meta name="description" content="A paper market for index perpetuals: bundle three to five assets, metals among them, into a fixed-weight basket, list it, and take a long or short side with up to 5x. Simulated prices.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F58F5'/%3E%3Cpath d='M10 24.5V13M16 24.5V8.5M22 24.5V17' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M6.5 19.5h19' stroke='%23FFC72C' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="px" id="root">

  <aside class="px-side">
    <a class="px-brand" href="#/" aria-label="Perpix, home">
      <!-- Three bars of unequal height, the smallest basket an index can be,
           cut by the line the perpetual marks against. -->
      <svg class="px-brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#1F58F5"/>
        <path d="M10 24.5V13M16 24.5V8.5M22 24.5V17" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M6.5 19.5h19" stroke="#FFC72C" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span>
        <span class="px-brand-name">Perpix</span>
        <span class="px-brand-sub">Index perpetuals</span>
      </span>
    </a>

    <nav class="px-nav" id="nav" aria-label="Sections">
      <a href="#/" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="#/market" data-route="market">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 18V9M9.5 18V5M15 18v-6M20.5 18v-9"/></svg>
        Market
      </a>
      <a href="#/create" data-route="create">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Create index
      </a>
      <a href="#/portfolio" data-route="portfolio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16.5 14.5h1.5"/></svg>
        Portfolio
        <span class="px-nav-count" id="navOpen" hidden></span>
      </a>
      <a href="#/creator" data-route="creator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></svg>
        My indices
      </a>
      <a href="#/assets" data-route="assets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5M3 17l9 5 9-5"/></svg>
        Assets
      </a>
    </nav>

    <div class="px-side-foot">
      <dl class="px-equity" id="sideEquity"></dl>
      <div class="px-side-links">
        <button class="px-ghost-btn" id="resetBtn" type="button">Reset account</button>
        <a class="px-x" href="https://x.com/usePerpix" target="_blank" rel="noopener noreferrer"
           title="@usePerpix on X" aria-label="Perpix on X, opens in a new tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
      </div>
    </div>
  </aside>

  <div class="px-main">
    <header class="px-top">
      <div class="px-search" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-owns="results">
        <div class="px-search-box">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.9"/>
            <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
          <input id="q" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Search an index, stock, metal or coin" aria-label="Search">
          <kbd>/</kbd>
        </div>
        <div class="px-results" id="results" role="listbox" hidden></div>
      </div>
      <div class="px-top-right">
        <!-- The market's clock is New York's, real time, and it ticks every second. -->
        <span class="px-clock" id="clock" title="Perpix's market clock, America/New_York"></span>
        <!-- Light, dark, or whatever the viewer's machine says. -->
        <button class="px-theme" id="themeBtn" type="button"></button>
      </div>
    </header>

    <main class="px-view" id="view"></main>

    <footer class="px-foot">
      <span>Perpix is a paper market. Its prices come from a simulator and do not describe the real market. None of this is investment advice.</span>
      <span class="px-foot-right">
        <button class="px-foot-link" id="termsBtn" type="button">Terms of use</button>
        <span id="stamp"></span>
      </span>
    </footer>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
