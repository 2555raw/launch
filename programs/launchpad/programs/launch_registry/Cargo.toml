[package]
name = "launch_registry"
version = "0.1.0"
description = "Optional on-chain registry of launches created through Launch"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "launch_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
