<!doctype html>
<!-- The X header: Europe on the left, the name on the right. Rendered to
     brand/header.png by scripts/header.js.

     X lays the avatar over the bottom-left corner, so the map is framed with
     its southernmost pin (Lisbon) clear of that circle, and the type sits in
     the right third where nothing covers it. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; background: #102A47; }
  .hd {
    position: relative; width: 1500px; height: 500px; overflow: hidden;
    background:
      radial-gradient(ellipse at 32% 42%, rgba(99,214,242,.15), transparent 58%),
      #102A47;
    font-family: "Space Grotesk", sans-serif; color: #F3F2EC;
  }

  /* Europe, framed on the eight cities and faded into the ground */
  /* the site's stylesheet clamps images to their container; here the map is
     deliberately wider than the banner, so opt out or the pins drift off it */
  .map { position: absolute; left: -57px; top: -265px; width: 1500px; height: 750px; max-width: none; }
  .pins { position: absolute; left: -57px; top: -265px; width: 1500px; height: 750px; max-width: none; }
  .map, .pins {
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 62%, transparent 86%),
                        linear-gradient(to bottom, transparent 1%, #000 14%, #000 84%, transparent 99%);
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
  .dot { fill: #6EA0FF; }
  .ring { fill: none; stroke: rgba(110,160,255,.55); stroke-width: 1.6; }

  /* the name, in the right third, away from the avatar and the phone crop */
  .right { position: absolute; right: 88px; top: 118px; text-align: right; }
  .name { font-size: 76px; font-weight: 700; letter-spacing: -.045em; line-height: 1; }
  .tag { margin: 30px 0 0; font-size: 32px; line-height: 1.24; letter-spacing: -.02em; color: #E8F1F8; }
  .tag b { color: #63D6F2; font-weight: 700; }
  .cities {
    margin: 30px 0 0; font-family: "JetBrains Mono", monospace; font-size: 13.5px;
    letter-spacing: .13em; color: #93B1CC; text-transform: uppercase; white-space: nowrap;
  }
</style></head>
<body><div class="hd">
  <img class="map" src="../map.svg" alt="">
  <svg class="pins" viewBox="0 0 1440 720"></svg>

  <div class="right">
    <div class="name">Propello</div>
    <p class="tag">Rental property,<br><b>without the property.</b></p>
    <p class="cities">Lisbon · Madrid · Barcelona · Turin · Leipzig · Rotterdam · Kraków</p>
  </div>
</div>

<script>
  /* the same coordinates the site's map uses, so the dots land on the cities */
  var HOLD = [[304.6,595.2],[384,558.1],[469.7,537],[550.3,456.7],[618.6,319.9],[503.4,307.2],[729.1,347.8]];
  var svg = document.querySelector('.pins');
  svg.innerHTML = HOLD.map(function (p) {
    return '<circle class="ring" cx="' + p[0] + '" cy="' + p[1] + '" r="9"/>' +
           '<circle class="dot" cx="' + p[0] + '" cy="' + p[1] + '" r="4.6"/>';
  }).join('');
</script>
</body></html>
