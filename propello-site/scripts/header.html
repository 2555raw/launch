<!doctype html>
<!-- The X header: the map on the right, the name on the left. Rendered to
     brand/header.png by scripts/header.js.

     X puts the avatar over the bottom-left corner and crops the top and
     bottom on phones, so everything that matters lives in the upper band and
     nothing sits below y=320 on the left third. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; background: #102A47; }
  .hd {
    position: relative; width: 1500px; height: 500px; overflow: hidden;
    background:
      radial-gradient(ellipse at 68% 40%, rgba(99,214,242,.15), transparent 58%),
      #102A47;
    font-family: "Space Grotesk", sans-serif; color: #F3F2EC;
  }

  /* Europe, framed on the eight cities and faded into the ground */
  /* the site's stylesheet clamps images to their container; here the map is
     deliberately wider than the banner, so opt out or the pins drift off it */
  .map { position: absolute; left: 378px; top: -360px; width: 1900px; height: 950px; max-width: none; }
  .pins { position: absolute; left: 378px; top: -360px; width: 1900px; height: 950px; max-width: none; }
  .map, .pins {
    -webkit-mask-image: linear-gradient(to right, transparent 2%, #000 26%, #000 88%, transparent 100%),
                        linear-gradient(to bottom, transparent 1%, #000 12%, #000 86%, transparent 99%);
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
  .dot { fill: #6EA0FF; }
  .ring { fill: none; stroke: rgba(110,160,255,.55); stroke-width: 1.6; }

  /* the name, clear of the avatar's corner */
  .left { position: absolute; left: 96px; top: 92px; width: 720px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 62px; height: 62px; color: #F3F2EC; }
  .brand span { font-size: 62px; font-weight: 700; letter-spacing: -.04em; }
  .tag { margin: 26px 0 0; font-size: 31px; line-height: 1.25; letter-spacing: -.02em; color: #E8F1F8; }
  .tag b { color: #63D6F2; font-weight: 700; }
  .cities {
    margin: 26px 0 0; font-family: "JetBrains Mono", monospace; font-size: 13.5px;
    letter-spacing: .13em; color: #93B1CC; text-transform: uppercase; white-space: nowrap;
  }
</style></head>
<body><div class="hd">
  <img class="map" src="../map.svg" alt="">
  <svg class="pins" viewBox="0 0 1440 720"></svg>

  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 2.4 28.4 10.6H3.6z"/><rect x="7" y="12.6" width="18" height="3.9" rx="1"/><rect x="6" y="18.5" width="20" height="3.9" rx="1"/><rect x="5" y="24.4" width="22" height="3.9" rx="1"/></svg>
      <span>Propello</span>
    </div>
    <p class="tag">Rental property,<br><b>without the property.</b></p>
    <p class="cities">Lisbon · Madrid · Barcelona · Turin · Leipzig · Rotterdam · Kraków</p>
  </div>
</div>

<script>
  /* the same coordinates the site's map uses, so the dots land on the cities */
  var HOLD = [[304.6,595.2],[384,558.1],[469.7,537],[550.3,456.7],[618.6,319.9],[503.4,307.2],[729.1,347.8]];
  var svg = document.querySelector('.pins');
  svg.innerHTML = HOLD.map(function (p) {
    return '<circle class="ring" cx="' + p[0] + '" cy="' + p[1] + '" r="9"/>' +
           '<circle class="dot" cx="' + p[0] + '" cy="' + p[1] + '" r="4.6"/>';
  }).join('');
</script>
</body></html>
