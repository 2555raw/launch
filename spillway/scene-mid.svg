<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="faceLit" x1="0.1" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#d6cdbd"/><stop offset="0.5" stop-color="#b6ab99"/><stop offset="1" stop-color="#8f8674"/>
  </linearGradient>
  <linearGradient id="faceShade" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#7d7466"/><stop offset="0.6" stop-color="#554e43"/><stop offset="1" stop-color="#3a352d"/>
  </linearGradient>
  <linearGradient id="chute" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#63787e"/><stop offset="1" stop-color="#36474e"/>
  </linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6f9dbe"/><stop offset="1" stop-color="#4f7fa4"/>
  </linearGradient>
  <linearGradient id="riverG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfe2e8"/><stop offset="1" stop-color="#7d99a4"/>
  </linearGradient>
  <linearGradient id="canyonG" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#3d6046"/><stop offset="0.6" stop-color="#284430"/><stop offset="1" stop-color="#18291d"/>
  </linearGradient>
  <filter id="concrete" x="-3%" y="-3%" width="106%" height="106%">
    <feTurbulence type="fractalNoise" baseFrequency="1.2 0.25" numOctaves="3" seed="61" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .30  0 0 0 0 .28  0 0 0 0 .24  0 0 0 .24 0" result="c"/>
    <feComposite in="c" in2="SourceGraphic" operator="in" result="tex"/>
    <feBlend in="SourceGraphic" in2="tex" mode="multiply"/>
  </filter>
  <filter id="scrubTex" x="-3%" y="-3%" width="106%" height="106%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09 0.17" numOctaves="5" seed="29" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .04  0 0 0 0 .12  0 0 0 0 .07  0 0 0 .78 0" result="c"/>
    <feComposite in="c" in2="SourceGraphic" operator="in" result="tex"/>
    <feBlend in="SourceGraphic" in2="tex" mode="multiply"/>
  </filter>
</defs>

