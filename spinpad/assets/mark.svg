  <circle cx="32" cy="49.5" r="9.5" fill="#2FA84F"/>
  <circle cx="14.5" cy="32" r="9.5" fill="#1B75BC"/>
  <circle cx="32" cy="32" r="10.5" fill="#101114"/>
</svg>
