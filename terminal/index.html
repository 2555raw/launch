<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tricker Terminal — análisis de mercados</title>
  <meta name="description" content="Plataforma de análisis de acciones, ETFs, índices, criptomonedas, materias primas y divisas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="tk" id="root">

  <aside class="tk-side">
    <a class="tk-brand" href="#/">
      <svg class="tk-mark" viewBox="0 0 40 28" aria-hidden="true"><path d="M13 3h8L11 25H3z"/><path d="M28 3h8L26 25h-8z"/></svg>
      <span>Terminal</span>
    </a>
    <nav class="tk-nav" id="nav">
      <a href="#/" data-route="dashboard"><span class="tk-nav-i">▦</span>Panel</a>
      <a href="#/markets/stocks" data-route="stocks"><span class="tk-nav-i">▤</span>Acciones</a>
      <a href="#/markets/etf" data-route="etf"><span class="tk-nav-i">▥</span>ETFs</a>
      <a href="#/markets/index" data-route="index"><span class="tk-nav-i">▣</span>Índices</a>
      <a href="#/markets/crypto" data-route="crypto"><span class="tk-nav-i">◈</span>Cripto</a>
      <a href="#/markets/commodity" data-route="commodity"><span class="tk-nav-i">◆</span>Materias primas</a>
      <a href="#/markets/fx" data-route="fx"><span class="tk-nav-i">⇄</span>Divisas</a>
      <a href="#/sectors" data-route="sectors"><span class="tk-nav-i">◫</span>Sectores</a>
      <a href="#/compare" data-route="compare"><span class="tk-nav-i">⇉</span>Comparador</a>
      <a href="#/news" data-route="news"><span class="tk-nav-i">≡</span>Noticias</a>
      <a href="#/economy" data-route="economy"><span class="tk-nav-i">◐</span>Economía</a>
    </nav>
    <div class="tk-side-foot">
      <button class="tk-side-btn" id="settingsBtn" type="button">Fuente de datos</button>
      <a class="tk-side-btn" href="https://x.com/MadeByTricker" target="_blank" rel="noopener noreferrer">@MadeByTricker</a>
    </div>
  </aside>

  <div class="tk-main">
    <header class="tk-top">
      <div class="tk-search" role="combobox" aria-expanded="false" aria-haspopup="listbox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Buscar empresa, ticker, ETF, índice, cripto o divisa" aria-label="Buscador global">
        <kbd>/</kbd>
        <div class="tk-results" id="results" role="listbox" hidden></div>
      </div>
      <div class="tk-top-right">
        <div class="tk-status" id="status" title="Estado de la fuente de datos"></div>
        <button class="tk-icon-btn" id="theme" type="button" aria-label="Cambiar tema"></button>
      </div>
    </header>

    <main class="tk-view" id="view"></main>

    <footer class="tk-foot">
      <span>Los datos de mercado proceden del proveedor configurado. El análisis es interpretación, no asesoramiento de inversión.</span>
      <span id="stamp"></span>
    </footer>
  </div>

  <div class="tk-modal" id="modal" hidden></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
