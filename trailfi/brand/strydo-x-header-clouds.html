<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SG;font-weight:500;src:url(../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:SG;font-weight:700;src:url(../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:JB;font-weight:500;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1500px;height:500px;overflow:hidden;background:#05070b;font-family:SG;color:#fff;position:relative}
/* The hero photo, cropped to the peaks and clouds */
.photo{position:absolute;inset:0;background:url(strydo-trail-cloud.jpg) no-repeat;background-size:2246px auto;background-position:0 -18px;filter:saturate(.55) brightness(.72)}
.shade{position:absolute;inset:0;background:
  linear-gradient(to bottom,rgba(5,7,11,.35),rgba(5,7,11,.05) 55%,rgba(5,7,11,.75)),
  linear-gradient(to left,rgba(5,7,11,.55),transparent 45%),
  radial-gradient(80% 90% at 45% 45%,transparent 50%,rgba(4,7,14,.6) 100%)}
.tint{position:absolute;inset:0;background:rgba(7,18,38,.22);mix-blend-mode:multiply}
/* The mark glowing faintly in the rock, under the clouds */


.glass{position:absolute;border-radius:24px;border:1px solid rgba(255,255,255,.12);background:rgba(9,12,18,.58);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 30px 60px -20px rgba(0,0,0,.7)}
.label{font-family:JB;font-weight:500;font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4d94ff;box-shadow:0 0 12px rgba(77,148,255,.8);margin-right:8px;vertical-align:1px}
/* Steps panel */
.steps{right:300px;top:96px;width:300px;padding:22px 24px}
.big{font-weight:700;font-size:54px;letter-spacing:-2px;line-height:1;margin-top:16px}
.unit{font-size:14px;color:rgba(255,255,255,.55);margin-top:6px;display:flex;align-items:center;gap:7px}
.bar{margin-top:18px;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#2f7bff,#9cc2ff);box-shadow:0 0 14px rgba(77,148,255,.6)}
.marks{display:flex;justify-content:space-between;margin-top:8px;font-family:JB;font-size:10px;color:rgba(255,255,255,.35)}
/* Week panel */
.week{right:56px;top:66px;width:220px;padding:20px 20px 16px}
.cols{display:flex;align-items:flex-end;gap:9px;height:112px;margin-top:16px}
.cols div{flex:1;border-radius:7px;background:rgba(77,148,255,.22)}
.cols div.on{background:linear-gradient(to top,#2f7bff,#9cc2ff);box-shadow:0 0 14px rgba(77,148,255,.45)}
.days{display:flex;gap:9px;margin-top:8px;font-family:JB;font-size:10px;color:rgba(255,255,255,.4)}
.days span{flex:1;text-align:center}
/* Payout panel */
.paid{right:56px;top:300px;width:310px;padding:16px 18px;display:flex;align-items:center;gap:14px;border-color:rgba(77,148,255,.35)}
.paid img{width:42px;height:42px;border-radius:50%}
.amt{font-weight:700;font-size:28px;letter-spacing:-.8px;color:#9cc2ff;line-height:1}
.amt small{font-size:15px;color:rgba(255,255,255,.7);font-weight:500;letter-spacing:0;margin-left:6px}
.sub{font-size:12.5px;color:rgba(255,255,255,.5);margin-top:5px}
.check{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#4d94ff;display:grid;place-items:center}
/* Verified chip */
.chip{right:386px;top:330px;padding:10px 14px 10px 10px;display:flex;align-items:center;gap:10px;border-radius:999px;font-size:13.5px;color:rgba(255,255,255,.85)}
.chip b{width:26px;height:26px;border-radius:50%;background:rgba(77,148,255,.15);display:grid;place-items:center}
</style></head><body>
<div class="photo"></div><div class="tint"></div><div class="shade"></div>

<div class="glass steps">
  <div class="label"><span class="dot"></span>Steps today</div>
  <div class="big">10,000</div>
  <div class="unit"><svg width="15" height="15" viewBox="0 0 514 514"><path fill="#4d94ff" d="M144 0L220 0A32 32 0 0 1 252 32L252 138A9 9 0 0 1 243 147L177 147A30 30 0 0 0 147 177L147 243A9 9 0 0 1 138 252L32 252A32 32 0 0 1 0 220L0 142A32 32 0 0 1 32 110L78 110A34 34 0 0 0 112 76L112 32A32 32 0 0 1 144 0ZM514 144L514 220A32 32 0 0 1 482 252L376 252A9 9 0 0 1 367 243L367 177A30 30 0 0 0 337 147L271 147A9 9 0 0 1 262 138L262 32A32 32 0 0 1 294 0L372 0A32 32 0 0 1 404 32L404 78A34 34 0 0 0 438 112L482 112A32 32 0 0 1 514 144ZM370 514L294 514A32 32 0 0 1 262 482L262 376A9 9 0 0 1 271 367L337 367A30 30 0 0 0 367 337L367 271A9 9 0 0 1 376 262L482 262A32 32 0 0 1 514 294L514 372A32 32 0 0 1 482 404L436 404A34 34 0 0 0 402 438L402 482A32 32 0 0 1 370 514ZM0 370L0 294A32 32 0 0 1 32 262L138 262A9 9 0 0 1 147 271L147 337A30 30 0 0 0 177 367L243 367A9 9 0 0 1 252 376L252 482A32 32 0 0 1 220 514L142 514A32 32 0 0 1 110 482L110 436A34 34 0 0 0 76 402L32 402A32 32 0 0 1 0 370Z"/></svg>Daily goal reached</div>
  <div class="bar"><i></i></div>
  <div class="marks"><span>0</span><span>5K</span><span>10K</span></div>
</div>

<div class="glass week">
  <div class="label">This week</div>
  <div class="cols"><div class="on" style="height:72%"></div><div class="on" style="height:55%"></div><div style="height:30%"></div><div class="on" style="height:88%"></div><div class="on" style="height:64%"></div><div class="on" style="height:100%"></div><div style="height:18%"></div></div>
  <div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
</div>

<div class="glass paid">
  <img src="../public/tokens/eth.svg" alt="">
  <div><div class="amt">+$5.00<small>in ETH</small></div><div class="sub">Paid on Robinhood Chain</div></div>
  <div class="check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#05070b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
</div>

<div class="glass chip"><b><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4d94ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></b>Screenshot verified</div>
</body></html>
