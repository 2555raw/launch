<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body{width:1600px;height:900px;position:relative}
.v{display:none;position:absolute;inset:0;overflow:hidden}
body[data-v="gym"] #gym,body[data-v="zero"] #zero,body[data-v="grass"] #grass{display:block}
.clouds{position:absolute;left:-80px;top:-80px;width:1760px;height:1060px;background:url(../../public/images/forest-stream.webp) 50% 55%/cover no-repeat;filter:saturate(.9) brightness(.7)}
.shade{position:absolute;inset:0;background:radial-gradient(80% 80% at 50% 45%,rgba(5,7,11,.2),rgba(5,7,11,.85))}
.big{font-weight:700;letter-spacing:-5px;line-height:1}
.label{font-family:JB;font-size:18px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.brand{position:absolute;display:flex;align-items:center;gap:14px;font-size:34px;font-weight:700}
.coin{border-radius:50%;box-shadow:0 0 50px rgba(77,148,255,.35)}
.fade{position:absolute;inset:0;background:#05070b;z-index:50}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc2ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient>
<path id="m" d="M144 0L220 0A32 32 0 0 1 252 32L252 138A9 9 0 0 1 243 147L177 147A30 30 0 0 0 147 177L147 243A9 9 0 0 1 138 252L32 252A32 32 0 0 1 0 220L0 142A32 32 0 0 1 32 110L78 110A34 34 0 0 0 112 76L112 32A32 32 0 0 1 144 0ZM514 144L514 220A32 32 0 0 1 482 252L376 252A9 9 0 0 1 367 243L367 177A30 30 0 0 0 337 147L271 147A9 9 0 0 1 262 138L262 32A32 32 0 0 1 294 0L372 0A32 32 0 0 1 404 32L404 78A34 34 0 0 0 438 112L482 112A32 32 0 0 1 514 144ZM370 514L294 514A32 32 0 0 1 262 482L262 376A9 9 0 0 1 271 367L337 367A30 30 0 0 0 367 337L367 271A9 9 0 0 1 376 262L482 262A32 32 0 0 1 514 294L514 372A32 32 0 0 1 482 404L436 404A34 34 0 0 0 402 438L402 482A32 32 0 0 1 370 514ZM0 370L0 294A32 32 0 0 1 32 262L138 262A9 9 0 0 1 147 271L147 337A30 30 0 0 0 177 367L243 367A9 9 0 0 1 252 376L252 482A32 32 0 0 1 220 514L142 514A32 32 0 0 1 110 482L110 436A34 34 0 0 0 76 402L32 402A32 32 0 0 1 0 370Z"/></defs></svg>

<!-- A · Gyms charge you. We pay you. -->
<div class="v" id="gym"><div class="clouds" id="g-sky"></div><div class="shade"></div>
  <div class="abs" style="left:0;right:0;top:250px;text-align:center">
    <div class="big" id="g1" style="font-size:130px">Gyms charge you</div>
    <div class="big" id="g1b" style="font-size:96px;margin-top:20px;color:rgba(255,255,255,.4)">to move.</div>
  </div>
  <div class="abs mono" id="gcost" style="left:0;right:0;top:560px;text-align:center;font-size:64px;color:#ff6b6b">−$40 / month</div>
  <div class="abs" style="left:0;right:0;top:250px;text-align:center">
    <div class="big accent" id="g2" style="font-size:170px">We pay you.</div>
  </div>
  <div class="abs" id="gcoins" style="inset:0"></div>
  <div class="abs" id="gend" style="left:0;right:0;top:520px;display:flex;flex-direction:column;align-items:center;gap:22px">
    <div style="font-size:40px;font-weight:700">Your steps, paid in <span class="accent">ETH</span>.</div>
    <div class="brand" style="position:static"><svg width="47" height="47" viewBox="0 0 514 514"><use href="#m" fill="url(#lg)"/></svg>Stry<span class="accent" style="margin-left:-14px">do</span></div>
  </div>
</div>

<!-- B · 6,000 steps, $0.00 -->
<div class="v" id="zero"><div class="clouds" id="z-sky" style="background-image:url(../../public/images/forest-river.jpg);background-position:75% 45%"></div><div class="shade"></div>
  <div class="abs" style="left:150px;top:110px;width:360px;height:680px;border-radius:60px;border:3px solid rgba(255,255,255,.16);background:#0a0c12;padding:13px">
    <div style="width:100%;height:100%;border-radius:48px;background:#000;padding:70px 34px 0;position:relative">
      <div style="position:absolute;left:50%;top:14px;width:110px;height:30px;margin-left:-55px;border-radius:18px;background:#111"></div>
      <div style="text-align:center;font-size:20px;font-weight:700">Today</div>
      <div id="zring" style="margin:34px auto 0;width:200px;height:200px;border-radius:50%;display:grid;place-items:center"><div style="width:128px;height:128px;border-radius:50%;background:#000"></div></div>
      <div style="margin-top:40px;font-size:20px">Steps</div>
      <div class="mono" id="zsteps" style="font-size:60px;letter-spacing:-2px">0</div>
      <div style="margin-top:22px;font-size:20px;color:rgba(255,255,255,.4)">Earned</div>
      <div class="mono" id="zearn" style="font-size:48px;color:rgba(255,255,255,.35)">$0.00</div><div id="zeth" style="font-size:18px;color:rgba(255,255,255,.45);opacity:0">paid in ETH</div>
    </div>
  </div>
  <div class="abs" style="left:620px;top:200px;right:70px">
    <div class="big" id="z1" style="font-size:88px;letter-spacing:-3px">You walked <span id="zn">6,000</span> steps today.</div>
    <div class="big" id="z2" style="font-size:88px;letter-spacing:-3px;color:rgba(255,255,255,.35);margin-top:16px">You got paid nothing.</div>
    <div id="z3" style="margin-top:50px;display:flex;align-items:center;gap:18px;font-size:50px;font-weight:700" class="accent"><img class="coin" src="../../public/tokens/eth.svg" style="width:66px;height:66px">That&#39;s about to change.</div>
  </div>
  <div class="brand" id="zbrand" style="right:80px;bottom:60px"><svg width="47" height="47" viewBox="0 0 514 514"><use href="#m" fill="url(#lg)"/></svg>Stry<span class="accent" style="margin-left:-14px">do</span></div>
</div>

<!-- C · Touch grass. Get paid. -->
<div class="v" id="grass">
  <div class="abs" id="photo" style="inset:-40px;background:url(../../public/images/forest-river.jpg) no-repeat;background-size:3000px auto;background-position:-200px -690px;filter:saturate(.85) brightness(.7)"></div>
  <div class="abs" style="inset:0;background:radial-gradient(30% 40% at 92% 14%,rgba(5,7,11,.75),transparent),linear-gradient(90deg,rgba(5,7,11,.9),rgba(5,7,11,.4) 55%,rgba(5,7,11,.05)),linear-gradient(0deg,rgba(5,7,11,.75),transparent 40%)"></div>
  <div class="abs" style="left:90px;top:230px">
    <div class="big" id="t1" style="font-size:160px">Touch grass.</div>
    <div class="big accent" id="t2" style="font-size:160px;margin-top:6px">Get paid.</div>
    <div id="t3" style="margin-top:40px;display:flex;align-items:center;gap:16px;font-size:36px;color:rgba(255,255,255,.8)"><img class="coin" src="../../public/tokens/eth.svg" style="width:50px;height:50px">Your steps, paid in ETH</div>
  </div>
  <div class="abs" id="tcount" style="right:90px;top:120px;text-align:right">
    <div class="label">Steps today</div>
    <div class="mono" id="tsteps" style="font-size:72px;color:#fff">0</div>
    <div class="mono accent" id="tusd" style="font-size:40px;margin-top:6px">$0.00</div><div class="label" style="margin-top:4px">paid in ETH</div>
  </div>
  <div class="brand" id="tbrand" style="left:90px;bottom:60px"><svg width="47" height="47" viewBox="0 0 514 514"><use href="#m" fill="url(#lg)"/></svg>Stry<span class="accent" style="margin-left:-14px">do</span></div>
</div>

<div class="fade" id="fade"></div>
<script src="_anim.js"></script><script>
const V = location.hash.slice(1) || "gym";
document.body.dataset.v = V;
window.DURATION = { gym: 7, zero: 8, grass: 7 }[V];
const coins = (host, n) => { let h = ""; for (let i = 0; i < n; i++) h += `<img class="coin abs gc" src="../../public/tokens/eth.svg" style="width:${40 + (i * 23) % 50}px">`; $(host).innerHTML = h; };
if (V === "gym") coins("gcoins", 18);
window.render = (t) => {
  const D = window.DURATION;
  set("fade", { opacity: String(t < 0.25 ? 1 - prog(t, 0, 0.25) : prog(t, D - 0.35, D)) });
  if (V === "gym") {
    set("g-sky", { transform: `translateX(${-8 * t}px)` });
    const a = prog(t, 0.2, 0.6), out1 = prog(t, 2.6, 2.9);
    set("g1", { opacity: a * (1 - out1), transform: `translateY(${(1 - a) * 30}px)` });
    set("g1b", { opacity: prog(t, 0.6, 0.9) * (1 - out1) });
    set("gcost", { opacity: prog(t, 1.2, 1.5) * (1 - out1), transform: `scale(${1 + 0.08 * Math.max(0, Math.sin((t - 1.2) * 6)) * (t < 2 ? 1 : 0)})` });
    const b = prog(t, 3.0, 3.35);
    set("g2", { opacity: b * (1 - prog(t, 5.0, 5.3)), transform: `scale(${1.3 - 0.3 * b})` });
    document.querySelectorAll("#gcoins .gc").forEach((el, i) => {
      const x = 80 + (i * 331) % 1440, y = 950 - (t - 3.0) * (180 + (i * 47) % 160) - (i * 97) % 300;
      el.style.left = x + "px"; el.style.top = y + "px"; el.style.opacity = String(prog(t, 3.0, 3.3) * 0.75);
      el.style.transform = `rotate(${t * (i % 2 ? 40 : -40)}deg)`;
    });
    set("gend", { opacity: prog(t, 5.2, 5.5), transform: `translateY(${(1 - prog(t, 5.2, 5.6)) * 20}px)` });
    set("g2", { top: "0px" });
  }
  if (V === "zero") {
    set("z-sky", { transform: `translateX(${-6 * t}px)` });
    const k = prog(t, 0.3, 2.2);
    $("zsteps").textContent = Math.round(6000 * k).toLocaleString("en-US");
    set("zring", { background: `conic-gradient(#fa114f ${k * 216}deg, rgba(250,17,79,.16) 0)` });
    set("z1", { opacity: prog(t, 0.6, 1.0) });
    set("z2", { opacity: prog(t, 2.5, 2.9) });
    const shake = t > 2.6 && t < 3.2 ? Math.sin(t * 60) * 6 : 0;
    set("zearn", { transform: `translateX(${shake}px)`, color: t > 2.6 && t < 3.2 ? "#ff6b6b" : "rgba(255,255,255,.35)" });
    const c = prog(t, 4.0, 4.4);
    set("z3", { opacity: c, transform: `translateY(${(1 - c) * 24}px)` });
    if (t > 4.6) { const e = prog(t, 4.6, 6.0); $("zearn").textContent = "$" + (5 * e).toFixed(2); set("zearn", { color: "#9cc2ff" }); } else if (t <= 2.6 || t >= 3.2) $("zearn").textContent = "$0.00";
    set("zeth", { opacity: prog(t, 4.6, 5.0) });
    set("zbrand", { opacity: prog(t, 5.6, 6.0) });
  }
  if (V === "grass") {
    set("photo", { transform: `scale(${1.04 + 0.05 * (t / D)}) translateX(${-10 * t}px)` });
    const a = prog(t, 0.3, 0.7), b = prog(t, 1.1, 1.5);
    set("t1", { opacity: a, transform: `translateY(${(1 - a) * 30}px)` });
    set("t2", { opacity: b, transform: `translateY(${(1 - b) * 30}px)` });
    set("t3", { opacity: prog(t, 2.0, 2.4) });
    const k = prog(t, 0.5, 4.5);
    $("tsteps").textContent = Math.round(10871 * k).toLocaleString("en-US");
    $("tusd").textContent = "$" + (5 * k).toFixed(2);
    set("tcount", { opacity: prog(t, 0.4, 0.8) });
    set("tbrand", { opacity: prog(t, 4.6, 5.0) });
  }
};
window.render(0);
</script></body></html>
