<script src="_anim.js"></script><script>
window.DURATION = 4;
window.render = (t) => {
  const k = prog(t, 0.15, 2.4);
  $("steps").textContent = Math.round(10871 * k).toLocaleString("en-US");
  set("ring", { background: `conic-gradient(#fa114f ${k * 360}deg, rgba(250,17,79,.16) 0)` });
  set("bar", { width: `${Math.min(100, k * 108.7)}%` });
  set("goal", { opacity: prog(t, 2.2, 2.45) });
  set("glow", { transform: `scale(${1 + 0.08 * prog(t, 2.3, 2.8)})` });
  const s = prog(t, 2.4, 2.85);
  set("word", { opacity: s, transform: `scale(${1.6 - 0.6 * s})` });
  set("tag", { opacity: prog(t, 2.7, 3.05) });
  // Fade out and back in so the loop restarts cleanly
  set("fade", { opacity: t > 3.7 ? prog(t, 3.7, 4.0) : 1 - prog(t, 0, 0.15) });
};
window.render(0);
