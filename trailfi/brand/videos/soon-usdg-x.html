<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body{width:1600px;height:900px}
/* Misty forest and river from the site header, graded dark, drifting slowly */
.sky{left:-60px;top:-60px;width:1720px;height:1020px;background:url(../../public/images/forest-river.jpg) 40% 70%/cover no-repeat;filter:saturate(.9) brightness(.74)}
.skyshade{inset:0;background:linear-gradient(90deg,transparent 35%,rgba(5,7,11,.55) 60%,rgba(5,7,11,.75)),radial-gradient(70% 70% at 50% 42%,rgba(5,7,11,.2) 30%,rgba(5,7,11,.8) 100%),rgba(7,18,38,.18)}
.glow{left:30%;top:50%;width:1000px;height:1000px;margin:-500px 0 0 -500px;border-radius:50%;background:radial-gradient(circle,rgba(77,148,255,.18),transparent 62%)}
.phone{left:30%;top:80px;width:380px;height:740px;margin-left:-190px;border-radius:66px;border:3px solid rgba(255,255,255,.16);background:#0a0c12;padding:14px;box-shadow:0 50px 120px -40px rgba(0,0,0,.95)}
.screen{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:#000}
.pane{position:absolute;inset:0;padding:84px 34px 0}
.notch{position:absolute;left:50%;top:14px;width:124px;height:34px;margin-left:-62px;border-radius:20px;background:#000;z-index:5}
.soon{left:800px;right:60px;top:300px;text-align:left}
.word{font-size:200px;font-weight:700;letter-spacing:-6px;line-height:1;color:#4d94ff;text-shadow:0 0 60px rgba(77,148,255,.35)}
.tag{margin-top:26px;display:flex;justify-content:flex-start;align-items:center;gap:14px;font-size:34px;font-weight:700}
.label{font-family:JB;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.45)}
.chip{position:absolute;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;background:rgba(8,11,18,.55);border:1px solid rgba(77,148,255,.28);font-family:JB;font-size:20px;color:#9cc2ff;white-space:nowrap}
.chip img{width:30px;height:30px;border-radius:50%}
.fcoin{position:absolute;border-radius:50%;box-shadow:0 0 30px rgba(77,148,255,.35)}
.fade{inset:0;background:#05070b}
</style></head><body>
<div class="abs sky" id="sky"></div><div class="abs skyshade"></div>
<div class="abs glow" id="glow"></div>
<div class="abs" id="float" style="inset:0;overflow:hidden"></div>
<div class="abs" id="tshade" style="left:700px;top:230px;width:820px;height:500px;border-radius:50%;background:radial-gradient(closest-side,rgba(5,7,11,.82),rgba(5,7,11,.5) 60%,transparent);opacity:0"></div>
<div class="abs phone" id="phone"><div class="screen">
  <div class="notch"></div>

  <!-- 1 · steps counting -->
  <div class="pane" id="p1" style="background:#000">
    <div style="text-align:center;font-size:20px;font-weight:700">Today</div>
    <div id="ring" style="margin:40px auto 0;width:210px;height:210px;border-radius:50%;display:grid;place-items:center"><div style="width:134px;height:134px;border-radius:50%;background:#000;display:grid;place-items:center">
      <svg width="46" height="46" viewBox="0 0 514 514"><path id="mk1" fill="#fa114f"/></svg>
    </div></div>
    <div style="margin-top:46px;font-size:20px">Steps</div>
    <div class="mono" id="steps" style="font-size:64px;letter-spacing:-2px;color:#fff">0</div>
    <div style="margin-top:20px;height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden"><div id="bar" style="height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#1f63e0,#4d94ff)"></div></div>
    <div style="margin-top:10px;display:flex;justify-content:space-between;font-size:16px;color:rgba(255,255,255,.4)"><span>0</span><span>goal 10,000</span></div>
  </div>

  <!-- 2 · Strydo upload -->
  <div class="pane" id="p2" style="background:#05070b">
    <div style="display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700"><svg width="27" height="27" viewBox="0 0 514 514"><path id="mk2" fill="url(#lg)"/></svg>Stry<span class="accent" style="margin-left:-10px">do</span></div>
    <div class="label" style="margin-top:34px">Upload steps</div>
    <div style="font-size:30px;font-weight:700;margin-top:8px">Log your day</div>
    <div class="mono" style="margin-top:22px;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 18px;font-size:28px">10,871</div>
    <div id="attach" style="margin-top:16px;border:1px solid rgba(77,148,255,.35);background:rgba(77,148,255,.06);border-radius:16px;padding:12px;display:flex;align-items:center;gap:14px">
      <div style="width:44px;height:64px;border-radius:8px;background:#000;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center"><div style="width:20px;height:20px;border-radius:50%;border:3px solid #fa114f"></div></div>
      <span style="font-size:17px;color:#9cc2ff">✓ Screenshot ready</span>
    </div>
    <div id="upbtn" style="margin-top:22px;height:62px;border-radius:16px;background:#4d94ff;color:#05070b;display:grid;place-items:center;font-size:20px;font-weight:700;overflow:hidden;position:relative">
      <div id="upfill" style="position:absolute;left:0;top:0;bottom:0;width:0;background:#9cc2ff"></div><span id="uplabel" style="position:relative">Upload steps</span></div>
    <div id="verified" style="margin-top:22px;text-align:center;font-family:JB;font-size:16px;letter-spacing:3px;color:#4d94ff">✓ VERIFIED</div>
  </div>

  <!-- 3 · paid in ETH -->
  <div class="pane" id="p3" style="background:#05070b;text-align:center">
    <div class="label" style="margin-top:40px">Paid to your wallet</div>
    <img id="coin" src="../../public/tokens/eth.svg" style="margin:46px auto 0;display:block;width:150px;height:150px;border-radius:50%;box-shadow:0 0 70px rgba(77,148,255,.35)">
    <div id="amt" style="margin-top:34px;font-size:64px;font-weight:700;letter-spacing:-2px;color:#9cc2ff">$0.00</div>
    <div style="font-size:24px;font-weight:700;margin-top:2px;color:rgba(255,255,255,.7)">paid in ETH</div>
    <div class="mono" style="margin-top:26px;font-size:15px;color:rgba(255,255,255,.45)">Robinhood Chain · tx ↗</div>
  </div>

  <div id="flash" class="abs" style="inset:0;background:#fff;opacity:0;z-index:4"></div>
</div></div>

<div class="abs soon" id="soon">
  <div class="word" id="word">SOON</div>
  <div id="sub" style="margin-top:14px;font-size:38px;font-weight:700;letter-spacing:-1px">Walk. Upload. <span class="accent">Get paid in ETH.</span></div>
  <div class="tag" id="tag"><svg width="37" height="37" viewBox="0 0 514 514"><path id="mk3" fill="url(#lg)"/></svg>Stry<span class="accent" style="margin-left:-14px">do</span></div>
</div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc2ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs></svg>
<div class="abs fade" id="fade"></div>
<script src="_anim.js"></script><script>
const MARK = "M144 0L220 0A32 32 0 0 1 252 32L252 138A9 9 0 0 1 243 147L177 147A30 30 0 0 0 147 177L147 243A9 9 0 0 1 138 252L32 252A32 32 0 0 1 0 220L0 142A32 32 0 0 1 32 110L78 110A34 34 0 0 0 112 76L112 32A32 32 0 0 1 144 0ZM514 144L514 220A32 32 0 0 1 482 252L376 252A9 9 0 0 1 367 243L367 177A30 30 0 0 0 337 147L271 147A9 9 0 0 1 262 138L262 32A32 32 0 0 1 294 0L372 0A32 32 0 0 1 404 32L404 78A34 34 0 0 0 438 112L482 112A32 32 0 0 1 514 144ZM370 514L294 514A32 32 0 0 1 262 482L262 376A9 9 0 0 1 271 367L337 367A30 30 0 0 0 367 337L367 271A9 9 0 0 1 376 262L482 262A32 32 0 0 1 514 294L514 372A32 32 0 0 1 482 404L436 404A34 34 0 0 0 402 438L402 482A32 32 0 0 1 370 514ZM0 370L0 294A32 32 0 0 1 32 262L138 262A9 9 0 0 1 147 271L147 337A30 30 0 0 0 177 367L243 367A9 9 0 0 1 252 376L252 482A32 32 0 0 1 220 514L142 514A32 32 0 0 1 110 482L110 436A34 34 0 0 0 76 402L32 402A32 32 0 0 1 0 370Z";
["mk1", "mk2", "mk3"].forEach((id) => $(id).setAttribute("d", MARK));

// Steps and ETH payouts floating up behind SOON
const FL = [];
(() => {
  const host = $("float");
  const kinds = ["coin", "steps", "coin", "pay", "coin", "steps", "coin", "pay"];
  const steps = ["10,871", "8,432", "12,050", "9,870", "7,215", "11,342", "6,104"];
  let html = "";
  for (let i = 0; i < 26; i++) {
    const k = kinds[i % kinds.length];
    const x = 40 + ((i * 397) % 1500), y0 = 260 + ((i * 263) % 960), sp = 120 + ((i * 53) % 110), sz = 34 + ((i * 29) % 56);
    const depth = 0.45 + ((i * 37) % 55) / 100;
    if (k === "coin") html += `<img class="fcoin fl" src="../../public/tokens/eth.svg" style="width:${sz}px;height:${sz}px">`;
    else if (k === "steps") html += `<div class="chip fl"><svg width="21" height="21" viewBox="0 0 514 514"><path d="${MARK}" fill="#4d94ff"/></svg>${steps[i % steps.length]} steps</div>`;
    else html += `<div class="chip fl"><img src="../../public/tokens/eth.svg">+$${(1 + (i % 5)).toFixed(2)} <span style="opacity:.6">in ETH</span></div>`;
    FL.push({ x, y0, sp, depth, sway: (i % 2 ? 1 : -1) * (10 + (i % 4) * 6), ph: i * 0.9 });
  }
  host.innerHTML = html;
})();
window.DURATION = 5.6;
window.render = (t) => {
  // floating layer appears with SOON
  const fa = prog(t, 3.4, 3.9) * (1 - prog(t, 5.25, 5.55));
  set("tshade", { opacity: String(fa) });
  document.querySelectorAll("#float .fl").forEach((el, i) => {
    const f = FL[i], dt = Math.max(0, t - 3.2);
    el.style.left = `${f.x + f.sway * Math.sin(t * 1.6 + f.ph)}px`;
    el.style.top = `${f.y0 - dt * f.sp * 1.3}px`;
    // fade items as they pass behind the SOON text so it stays clean
    const ex = f.x + f.sway * Math.sin(t * 1.6 + f.ph), ey = f.y0 - dt * f.sp * 1.3;
    const edge = Math.min(ex - 640, 1460 - ex, ey - 280, 690 - ey); // distance inside the text box
    const hide = clamp(edge / 70);
    el.style.opacity = String(fa * f.depth * 0.6 * (1 - 0.92 * hide));
    el.style.transform = `scale(${0.7 + f.depth * 0.5})`;
    el.style.filter = f.depth < 0.6 ? "blur(2px)" : "none";
  });
  // #gif keeps the photo still so the GIF only stores what changes
  if (location.hash === "#gif") set("sky", { transform: "translate(-15px, 0) scale(1.035)" });
  else set("sky", { transform: `translate(${-30 * (t / window.DURATION)}px, ${10 * Math.sin(t * 0.6)}px) scale(${1.02 + 0.03 * (t / window.DURATION)})` });
  // 1 · steps race up
  const k = prog(t, 0.1, 1.2);
  $("steps").textContent = Math.round(10871 * k).toLocaleString("en-US");
  set("ring", { background: `conic-gradient(#fa114f ${k * 360}deg, rgba(250,17,79,.16) 0)` });
  set("bar", { width: `${Math.min(100, k * 108.7)}%` });
  // screenshot flash, then the Strydo screen slides in
  set("flash", { opacity: t > 1.3 && t < 1.65 ? 0.9 * (1 - prog(t, 1.3, 1.65)) : 0 });
  const s2 = prog(t, 1.45, 1.75);
  set("p1", { transform: `translateX(${-40 * s2}%)`, opacity: 1 - s2 });
  set("p2", { transform: `translateX(${100 - 100 * s2}%)` });
  set("attach", { opacity: prog(t, 1.75, 1.95) });
  // tap upload, fill, verified
  set("upbtn", { transform: `scale(${t > 2.0 && t < 2.12 ? 0.95 : 1})` });
  set("upfill", { width: `${100 * prog(t, 2.1, 2.55)}%` });
  $("uplabel").textContent = t < 2.1 ? "Upload steps" : t < 2.55 ? "Uploading…" : "Sent";
  set("verified", { opacity: prog(t, 2.6, 2.75) });
  // 3 · ETH lands
  const s3 = prog(t, 2.9, 3.15);
  set("p2", { opacity: 1 - s3 });
  set("p3", { transform: `translateX(${100 - 100 * s3}%)` });
  const c = prog(t, 3.0, 3.35);
  set("coin", { transform: `scale(${0.3 + 0.7 * c}) rotate(${(1 - c) * -180}deg)`, opacity: c });
  $("amt").textContent = "$" + (5 * prog(t, 3.1, 3.6)).toFixed(2);
  // SOON
  set("glow", { transform: `scale(${1 + 0.1 * prog(t, 3.5, 4.0)})` });
  const w = prog(t, 3.55, 3.9);
  set("word", { opacity: w, transform: `scale(${1.6 - 0.6 * w})`, transformOrigin: "left center" });
  set("sub", { opacity: prog(t, 3.75, 4.0) });
  set("tag", { opacity: prog(t, 3.95, 4.25) });
  // fade out and back in so the loop restarts cleanly
  set("fade", { opacity: t > 5.3 ? prog(t, 5.3, 5.6) : 1 - prog(t, 0, 0.1) });
};
window.render(0);
</script></body></html>
