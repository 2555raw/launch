<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body{width:1080px;height:1080px}
.glow{left:50%;top:46%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,rgba(77,148,255,.20),transparent 62%)}
.grid{inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 25%,transparent 72%)}
.line{left:0;right:0;text-align:center;font-weight:700;letter-spacing:-3px;line-height:1.02}
.big{font-size:104px}
.huge{font-size:300px;letter-spacing:-14px}
.sub{font-size:34px;font-weight:500;color:rgba(255,255,255,.62);letter-spacing:0}
.foot{width:46px;height:46px}
.brand{left:0;right:0;display:flex;flex-direction:column;align-items:center}
.pill{display:inline-flex;align-items:center;gap:14px;border:2px solid rgba(77,148,255,.5);border-radius:999px;padding:16px 34px;font-size:36px;font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;background:#4d94ff}
.counter{font-family:JB;font-size:120px;font-weight:500;color:#4d94ff;letter-spacing:-4px}
</style></head><body>
<div class="abs glow" id="glow"></div><div class="abs grid"></div>
<div id="trail"></div>

<div class="abs line big" id="a" style="top:360px">You already walk<br><span class="accent">8,000 steps a day.</span></div>

<div class="abs line big" id="b1" style="top:300px">Your phone counts</div>
<div class="abs line" id="b2" style="top:430px"><span class="counter" id="count">0</span></div>
<div class="abs line big" id="b3" style="top:590px;font-size:64px;letter-spacing:-1px;color:rgba(255,255,255,.7)">every single one.</div>

<div class="abs line big" id="c" style="top:390px;font-size:150px;letter-spacing:-6px">Now they<br><span class="accent">pay you.</span></div>

<div class="abs line sub" id="d0" style="top:250px">up to</div>
<div class="abs line huge accent" id="d1" style="top:300px">$5</div>
<div class="abs line" id="d2" style="top:640px;font-size:56px;letter-spacing:-1px;display:flex;justify-content:center;align-items:center;gap:18px">a day, paid in <img src="../../public/tokens/eth.svg" style="width:64px;height:64px"> ETH</div>

<div class="abs brand" id="e" style="top:300px">
  <svg width="150" height="150" viewBox="0 0 32 32"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc2ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs><rect x=".5" y=".5" width="31" height="31" rx="9.5" fill="#071226" stroke="rgba(77,148,255,.35)"/><g transform="translate(4 4) scale(0.04669)"><path d="M144 0L220 0A32 32 0 0 1 252 32L252 138A9 9 0 0 1 243 147L177 147A30 30 0 0 0 147 177L147 243A9 9 0 0 1 138 252L32 252A32 32 0 0 1 0 220L0 142A32 32 0 0 1 32 110L78 110A34 34 0 0 0 112 76L112 32A32 32 0 0 1 144 0ZM514 144L514 220A32 32 0 0 1 482 252L376 252A9 9 0 0 1 367 243L367 177A30 30 0 0 0 337 147L271 147A9 9 0 0 1 262 138L262 32A32 32 0 0 1 294 0L372 0A32 32 0 0 1 404 32L404 78A34 34 0 0 0 438 112L482 112A32 32 0 0 1 514 144ZM370 514L294 514A32 32 0 0 1 262 482L262 376A9 9 0 0 1 271 367L337 367A30 30 0 0 0 367 337L367 271A9 9 0 0 1 376 262L482 262A32 32 0 0 1 514 294L514 372A32 32 0 0 1 482 404L436 404A34 34 0 0 0 402 438L402 482A32 32 0 0 1 370 514ZM0 370L0 294A32 32 0 0 1 32 262L138 262A9 9 0 0 1 147 271L147 337A30 30 0 0 0 177 367L243 367A9 9 0 0 1 252 376L252 482A32 32 0 0 1 220 514L142 514A32 32 0 0 1 110 482L110 436A34 34 0 0 0 76 402L32 402A32 32 0 0 1 0 370Z" fill="url(#mg)"/></g></svg>
  <div style="margin-top:28px;font-size:112px;font-weight:700;letter-spacing:-4px">Stry<span class="accent">do</span></div>
  <div class="sub" style="margin-top:10px">Walk. Upload. Get paid in ETH.</div>
  <div class="pill" style="margin-top:46px"><span class="dot"></span>strydo.xyz</div>
</div>

<script src="_anim.js"></script><script>
window.DURATION = 12;
// Footprints walking along the bottom, left then right
const trail = document.getElementById("trail");
const STEPS = 14;
for (let i = 0; i < STEPS; i++) {
  const left = i % 2 === 0;
  trail.insertAdjacentHTML("beforeend", `<svg class="abs foot" id="f${i}" viewBox="0 0 514 514" style="left:${60 + i * 70}px;top:${left ? 950 : 922}px"><path d="M144 0L220 0A32 32 0 0 1 252 32L252 138A9 9 0 0 1 243 147L177 147A30 30 0 0 0 147 177L147 243A9 9 0 0 1 138 252L32 252A32 32 0 0 1 0 220L0 142A32 32 0 0 1 32 110L78 110A34 34 0 0 0 112 76L112 32A32 32 0 0 1 144 0ZM514 144L514 220A32 32 0 0 1 482 252L376 252A9 9 0 0 1 367 243L367 177A30 30 0 0 0 337 147L271 147A9 9 0 0 1 262 138L262 32A32 32 0 0 1 294 0L372 0A32 32 0 0 1 404 32L404 78A34 34 0 0 0 438 112L482 112A32 32 0 0 1 514 144ZM370 514L294 514A32 32 0 0 1 262 482L262 376A9 9 0 0 1 271 367L337 367A30 30 0 0 0 367 337L367 271A9 9 0 0 1 376 262L482 262A32 32 0 0 1 514 294L514 372A32 32 0 0 1 482 404L436 404A34 34 0 0 0 402 438L402 482A32 32 0 0 1 370 514ZM0 370L0 294A32 32 0 0 1 32 262L138 262A9 9 0 0 1 147 271L147 337A30 30 0 0 0 177 367L243 367A9 9 0 0 1 252 376L252 482A32 32 0 0 1 220 514L142 514A32 32 0 0 1 110 482L110 436A34 34 0 0 0 76 402L32 402A32 32 0 0 1 0 370Z" fill="#4d94ff"/></svg>`);
}
window.render = (t) => {
  set("glow", { transform: `scale(${1 + 0.06 * Math.sin(t * 1.6)})` });
  for (let i = 0; i < STEPS; i++) {
    const at = 0.3 + i * 0.75;
    const o = t > 10 ? 0.12 * win(t, at, 11.7) : Math.max(0, 0.55 * win(t, at, at + 4, 0.25));
    set("f" + i, { opacity: o });
  }
  const up = (id, i, o, y = 40) => { const v = win(t, i, o); set(id, { opacity: v, transform: `translateY(${(1 - prog(t, i, i + 0.6)) * y}px)` }); };
  up("a", 0.2, 2.6);
  up("b1", 2.8, 5.2); up("b2", 3.0, 5.2); up("b3", 3.6, 5.2);
  $("count").textContent = Math.round(10871 * prog(t, 3.0, 4.8)).toLocaleString("en-US");
  const c = win(t, 5.4, 7.6); set("c", { opacity: c, transform: `scale(${0.9 + 0.1 * prog(t, 5.4, 6.1)})` });
  up("d0", 7.8, 10.1, 20);
  const d = win(t, 7.9, 10.1); set("d1", { opacity: d, transform: `scale(${0.6 + 0.4 * prog(t, 7.9, 8.5)})` });
  up("d2", 8.4, 10.1, 20);
  const e = win(t, 10.2, 12.4); set("e", { opacity: e, transform: `translateY(${(1 - prog(t, 10.2, 10.9)) * 30}px)` });
};
window.render(0);
</script></body></html>
