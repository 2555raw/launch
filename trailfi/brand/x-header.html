<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SG;src:url(../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2) format("woff2");font-weight:300 700}
@font-face{font-family:IN;src:url(../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:JB;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1500px;height:500px;background:#060807;overflow:hidden}
.wrap{position:relative;width:1500px;height:500px;overflow:hidden;background:#060807}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 70%)}
.glow{position:absolute;left:50%;top:-140px;width:900px;height:420px;transform:translateX(-50%);border-radius:50%;background:rgba(178,240,71,.13);filter:blur(90px)}
.art{position:absolute;left:-60px;right:-60px;bottom:-6px;height:330px;background:url(../public/images/footer-trail.svg) center bottom/cover no-repeat}
.fade{position:absolute;left:0;right:0;top:0;height:260px;background:linear-gradient(#060807 55%,transparent)}
.top{position:absolute;top:58px;left:0;right:0;text-align:center}
.brand{display:inline-flex;align-items:center;gap:12px;font-family:SG;font-weight:700;font-size:30px;color:#fff;letter-spacing:-.02em}
.brand b{color:#c4fb6d;font-weight:700}
h1{margin-top:22px;font-family:SG;font-weight:700;font-size:62px;line-height:1;letter-spacing:-.03em;color:#fff}
h1 span{background:linear-gradient(90deg,#d8ff9c,#c4fb6d,#5dff9d);-webkit-background-clip:text;color:transparent}
.sub{margin-top:18px;font-family:JB;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.sub i{font-style:normal;color:#c4fb6d}
.pill{position:absolute;right:44px;bottom:34px;display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(6,8,7,.82);border:1px solid rgba(196,251,109,.35);font-family:IN;font-weight:600;font-size:17px;color:#fff}
.dot{width:9px;height:9px;border-radius:50%;background:#5dff9d;box-shadow:0 0 14px rgba(93,255,157,.8)}
</style></head><body><div class="wrap">
<div class="grid"></div><div class="glow"></div>
<div class="art"></div><div class="fade"></div>

  <div class="brand"><svg width="40" height="40" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8ff9c"/><stop offset="1" stop-color="#5dff9d"/></linearGradient></defs><rect x=".5" y=".5" width="31" height="31" rx="9.5" fill="#071d14" stroke="rgba(196,251,109,.35)"/><g fill="url(#g)" opacity=".7"><ellipse cx="11" cy="20.3" rx="2.9" ry="4.3" transform="rotate(-12 11 20.3)"/><circle cx="9.1" cy="14.2" r="1.05"/><circle cx="11.1" cy="13.5" r="1.15"/><circle cx="13" cy="14.1" r=".95"/></g><g fill="url(#g)"><ellipse cx="20.8" cy="14.6" rx="2.9" ry="4.3" transform="rotate(12 20.8 14.6)"/><circle cx="19.3" cy="8.5" r="1.05"/><circle cx="21.3" cy="7.9" r="1.15"/><circle cx="23.2" cy="8.6" r=".95"/></g></svg><span>Step<b>it</b></span></div>
  <h1>YOUR STEPS. <span>YOUR REWARDS.</span></h1>
  <div class="sub">Walk <i>·</i> Upload <i>·</i> Earn <i>·</i> Built on Robinhood Chain</div>
</div>
<div class="pill"><span class="dot"></span>stepit.site</div>
</div></body></html>
