<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts.css">
<style>
  /* Captions for the film. Transparent background: the footage is underneath. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: transparent; }

  body {
    --turq:  #0f6f64;
    --ink:  #ffffff;
    font-family: "Familjen Grotesk", system-ui, sans-serif;
    display: flex;
    align-items: flex-end;
    padding: 0 0 64px 64px;
  }

  /* a tag sits on one line, in a block of the brand red */
  .tag {
    display: inline-block;
    background: var(--turq);
    color: var(--ink);
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 21px;
    letter-spacing: .06em;
    padding: 12px 18px 13px;
  }

  /* a punch gets two lines: the small one names the frame, the big one lands */
  .punch .over {
    display: inline-block;
    background: var(--turq);
    color: var(--ink);
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 15px;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: 8px 13px 9px;
    margin-bottom: 12px;
  }

  .punch .big {
    display: block;
    background: var(--turq);
    color: var(--ink);
    font-size: 62px;
    font-weight: 700;
    letter-spacing: -.03em;
    line-height: 1.02;
    padding: 14px 22px 20px;
    width: fit-content;
  }
</style>
</head>
<body>
  <div id="wrap"></div>
<script>
  const q = new URLSearchParams(location.hash.slice(1));
  const kind = q.get('kind') || 'tag';
  const text = q.get('text') || '';
  const tag  = q.get('tag') || '';
  document.getElementById('wrap').innerHTML = kind === 'punch'
    ? `<div class="punch">${tag ? `<span class="over">${tag}</span><br>` : ''}<span class="big">${text}</span></div>`
    : `<span class="tag">${text}</span>`;
</script>
</body>
</html>
