<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UnyHooks social card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&family=Geist+Mono:wght@400;500&family=Pirata+One&display=swap">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    /* 1200×630, the size X, Telegram and Discord use for link previews. The
       background is a still of the landing's 3D sea (hero.jpg). */
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #070B14; }
    .uh { width: 1200px; height: 630px; position: relative; overflow: hidden; box-sizing: border-box; padding: 0 0 0 76px; display: flex; align-items: center;
      background: url(../../hero.jpg) right center / cover no-repeat; }
    .uh::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7, 11, 20, .86) 0%, rgba(7, 11, 20, .6) 40%, rgba(7, 11, 20, 0) 64%); }
    .c-copy { position: relative; max-width: 600px; }
    .c-copy .uh-brand { font-size: 38px; gap: 12px; }
    .c-copy .uh-mark { width: 46px; height: 46px; }
    .c-copy h1 { margin: 34px 0 0; font: 600 66px/1.04 var(--font-display); font-variation-settings: 'opsz' 60; letter-spacing: -.022em; color: var(--ink); text-wrap: balance; }
    .c-copy p { margin: 22px 0 0; font-size: 21px; line-height: 1.5; color: var(--prose); max-width: 520px; }
    .c-meta { margin-top: 28px; font: 500 14px var(--font-mono); color: rgba(243, 234, 215, .6); letter-spacing: .02em; }
  </style>
</head>
<body>
<div class="uh">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- the mark: a pirate's hook on its cuff -->
      <linearGradient id="uh-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBE7B0"/><stop offset=".45" stop-color="#E8B04B"/><stop offset="1" stop-color="#A86F18"/></linearGradient>
      <linearGradient id="uh-cuff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98F2E"/><stop offset="1" stop-color="#7E5313"/></linearGradient>
      <symbol id="uh-mark" viewBox="0 0 64 80">
        <path d="M22.5 62V27A13.5 13.5 0 0 1 49.5 27C49.5 35.5 45.5 41 38.5 43.5C43 38.8 44.5 33.5 44.5 27A8.5 8.5 0 0 0 27.5 27V62Z" fill="url(#uh-gold)"/>
        <path d="M25 58V27A11 11 0 0 1 46.4 23.6" fill="none" stroke="#FFF4D6" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
        <rect x="19" y="58.5" width="12" height="4.5" rx="1.5" fill="url(#uh-cuff)"/>
        <path d="M18 63h14l6.2 12.6a1.6 1.6 0 0 1-1.4 2.4H13.2a1.6 1.6 0 0 1-1.4-2.4z" fill="url(#uh-cuff)"/>
        <path d="M15.6 70.5h18.8" stroke="#FBE7B0" stroke-opacity=".45" stroke-width="1.1"/>
      </symbol>
      <symbol id="uh-x" viewBox="0 0 24 24">
        <path fill="currentColor" d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.33l4.37 5.77L17.75 3zm-1.08 16.18h1.7L7.4 4.73H5.58l11.09 14.45z"/>
      </symbol>
      <!-- the ship's chest of icons: 24px line drawings in currentColor -->
      <symbol id="i-anchor" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.6" r="1.9"/><path d="M12 6.5V20.5M8 9.5h8M4.5 13c0 4.2 3.4 7.5 7.5 7.5s7.5-3.3 7.5-7.5M4.5 13 3 15M4.5 13l2 1.4M19.5 13l1.5 2M19.5 13l-2 1.4"/></g></symbol>
      <symbol id="i-skull" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3C8.3 3 5.6 5.6 5.6 9c0 2 .9 3.5 2.3 4.4V15.5h8.2v-2.1c1.4-.9 2.3-2.4 2.3-4.4C18.4 5.6 15.7 3 12 3z"/><path d="M10.3 15.5v-1.6M13.7 15.5v-1.6M4 18.5l16 3M20 18.5l-16 3"/></g><circle cx="9.7" cy="9.4" r="1.5" fill="currentColor"/><circle cx="14.3" cy="9.4" r="1.5" fill="currentColor"/></symbol>
      <symbol id="i-cannon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13.8 15.8 8.6l1.7 4L5.2 17.8z"/><path d="M17.5 8 19 11.6M20.5 9.8h1.5"/><circle cx="8.5" cy="18" r="2.6"/></g></symbol>
      <symbol id="i-chest" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11h17v9h-17zM3.5 11c0-3.4 3.8-5.8 8.5-5.8s8.5 2.4 8.5 5.8M3.5 14.5h17"/><rect x="10.6" y="13" width="2.8" height="3.2" rx=".6"/></g></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 11V8a4.5 4.5 0 0 1 9 0v3M5.5 11h13v9.5h-13z"/><path d="M12 14.5v2.5"/></g></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></g></symbol>
      <symbol id="i-swords" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l11 11M20 4 9 15M13 17l4-4M11 17l-4-4M16.5 16.5 20 20M7.5 16.5 4 20"/></g></symbol>
      <symbol id="i-ship" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16h18l-2.5 4h-13zM12 3v13M12 4.5c3 1.5 4.5 4 4.5 7.5H12M12 6c-2.6 1.3-4 3.4-4 6h4"/></g></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V3.5M5 4h13l-3 4.5 3 4.5H5"/></g></symbol>
      <symbol id="i-storm" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1-.4-8A5.5 5.5 0 0 1 17 8a3.5 3.5 0 0 1 0 7M12.5 12.5 10.5 16h3l-2 3.5"/></g></symbol>
      <symbol id="i-hourglass" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11M6.5 20.5h11M8 3.5c0 4 4 5 4 8.5S8 16.5 8 20.5M16 3.5c0 4-4 5-4 8.5s4 4.5 4 8.5"/></g></symbol>
      <symbol id="i-coin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5.2"/></g></symbol>
      <symbol id="i-scroll" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h11a2 2 0 0 1 2 2v1h-4M7 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7M9 9h6M9 12.5h6M9 16h4"/></g></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.5"/><path d="M11.2 11.2 20 20M16.5 16.5l2-2M18.5 18.5l2-2"/></g></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></g></symbol>
      <!-- the hero's metal -->
      <linearGradient id="hk-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6E460D"/><stop offset=".22" stop-color="#E2A946"/><stop offset=".42" stop-color="#FFF3CC"/><stop offset=".58" stop-color="#EDBB5C"/><stop offset=".85" stop-color="#9A6516"/><stop offset="1" stop-color="#5A390A"/></linearGradient>
      <linearGradient id="hk-cuff" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A2F0A"/><stop offset=".35" stop-color="#B57A1F"/><stop offset=".55" stop-color="#E8B04B"/><stop offset="1" stop-color="#4A2F0A"/></linearGradient>
      <radialGradient id="sea-sky" cx=".7" cy=".25" r=".9"><stop offset="0" stop-color="#1B2C49"/><stop offset=".55" stop-color="#0B1426"/><stop offset="1" stop-color="#060A13"/></radialGradient>
      <linearGradient id="sea-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11233D"/><stop offset="1" stop-color="#050A14"/></linearGradient>
      <radialGradient id="sea-moon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6DD"/><stop offset=".7" stop-color="#F1DDA8"/><stop offset="1" stop-color="#D9BC78"/></radialGradient>
      <radialGradient id="sea-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F3D58E" stop-opacity=".45"/><stop offset="1" stop-color="#F3D58E" stop-opacity="0"/></radialGradient>
      <clipPath id="sea-clip"><circle cx="300" cy="300" r="268"/></clipPath>
    </defs>
  </svg>
  <div class="c-copy">
    <span class="uh-brand"><svg class="uh-mark" aria-hidden="true"><use href="#uh-mark"/></svg><span>Uny<b>Hooks</b></span></span>
    <h1>Launch a token with the rules built in</h1>
    <p>Capped buys at launch and locked liquidity, set in one transaction. Nobody can change them after.</p>
    <div class="c-meta">Uniswap V4 · Robinhood Chain · unyhooks.xyz</div>
  </div>
</div>
</body>
</html>
