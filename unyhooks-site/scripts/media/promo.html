<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0}body{background:#000;width:1440px;height:1080px;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1440" height="1080"></canvas>
<script>
/* UnyHooks promo: a 20.5 s motion piece cut to a fixed soundtrack.
   draw(t) paints the frame at time t (seconds); render-promo.js steps it
   at 23.976 fps and muxes the frames with the audio. */
const W = 1440, H = 1080;
const C = document.getElementById('c');
let X = C.getContext('2d');
const NAVY = '#0B1222', NAVY_HI = '#1B2844', DEEP = '#04070E', SLATE = '#2E3A58';
const GOLD = '#E8B04B', PALE = '#F7D78C', CREAM = '#F3EAD7', BRONZE = '#A86F18';
const FONT = "'Geist', sans-serif";

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const eo = (u) => 1 - Math.pow(1 - clamp(u), 3);
const ei = (u) => Math.pow(clamp(u), 3);
const eio = (u) => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const prog = (lt, a, b) => clamp((lt - a) / (b - a));
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const off = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ---------- pixel icons ---------- */
const PAL = { k: '#05080F', y: GOLD, Y: PALE, o: BRONZE, w: CREAM, s: '#9AA6BC', S: '#DCE3EE', b: '#3E64B8', B: '#7FA2EE',
  p: '#8FA6D8', P: '#D2DDF5', q: '#4E5F92', G: '#5FD3A6', n: '#7A4E1E', r: '#F0715A' };
const ICONS = {
  coin: ['....kkkkkk....', '..kkYYYYYYkk..', '.kYYyyyyyyyok.', '.kYykkyykkyok.', 'kYyykyyyykyyok', 'kYyykyyyykyyok', 'kYyykyyyykyyok', 'kYyykyyyykyyok', 'kYyyykkkkyyyok', 'kYyyyyyyyyyook', '.kyyyyyyyyook.', '.kyoooooooook.', '..kkooooookk..', '....kkkkkk....'],
  lock: ['...kkkkkk...', '..kSSSSSSk..', '.kSkkkkkkSk.', '.kSk....kSk.', '.ksk....ksk.', 'kkkkkkkkkkkk', 'kYyyyyyyyyok', 'kYyyykkyyyok', 'kYyyykkyyyok', 'kYyyyykyyyok', 'kYyyyyyyyyok', 'kyoooooooook', 'kkkkkkkkkkkk'],
  shield: ['kkkkkkkkkkkk', 'kBBBBBBBBBbk', 'kBbbbbbbbwbk', 'kBbbbbbbwwbk', 'kBbbbbbwwbbk', 'kBwbbbwwbbbk', 'kBwwbwwbbbbk', 'kBbwwwbbbbbk', 'kBbbwbbbbbbk', '.kBbbbbbbbk.', '.kBbbbbbbbk.', '..kBbbbbbk..', '...kBbbbk...', '....kkkk....'],
  hook: ['...kkkk...', '..kSssSk..', '..ks..sk..', '..kSssSk..', '...kSk....', '...kSk....', '...kSk....', '...kSk....', '...kSk....', '...kSk..k.', '...kSk.kSk', '...kSk.kSk', '...kSkkSsk', '...kSSSsk.', '....kssk..', '.....kk...'],
  eth: ['....kk....', '...kPPk...', '...kPpk...', '..kPPppk..', '..kPpppk..', '.kPPppppk.', '.kPpppqqk.', 'kPppppqqqk', '.kkppqqkk.', 'kPPkkkkqqk', '.kPPppqqk.', '..kPpqqk..', '...kpqk...', '....kk....'],
  ship: ['......k.........', '.....kwk...k....', '.....kwwk.kwk...', '....kwwwk.kwwk..', '....kwwwwkkwwwk.', '...kwwwwwkkwwwk.', '...kkkkkkkkkkkk.', '......k...k.....', 'kkkkkkkkkkkkkkkk', 'knnnnnnnnnnnnnyk', '.knnnnnnnnnnnnk.', '..knnnnnnnnnnk..', '...kkkkkkkkkk...'],
  anchor: ['.....kkkk.....', '....kSssSk....', '....ks..sk....', '.....kSSk.....', '..kkkkSSkkkk..', '..kSSSSSSSSk..', '..kkkkSSkkkk..', '.....kSSk.....', '.....kSSk.....', '.....kSSk.....', 'kk...kSSk...kk', 'kSk..kSSk..kSk', '.kSk.kSSk.kSk.', '..kSkkSSkkSk..', '...kSSSSSSk...', '....kkkkkk....'],
  key: ['.kkkkk..........', 'kYyyyok.........', 'kyk.kyokkkkkkkk.', 'ky...yYyyyyyyyyk', 'kyk.kyokkkkykkyk', 'kYyyyok....k..k.', '.kkkkk..........'],
  chart: ['.........kkk..', '.........kGk..', '.........kGk..', '......kkkkGk..', '......kGkkGk..', '......kGkkGk..', '...kkkkGkkGk..', '...kGkkGkkGk..', '...kGkkGkkGk..', 'kkkkGkkGkkGk..', 'kGkkGkkGkkGk..', 'kkkkkkkkkkkk..'],
  wallet: ['..kkkkkkkkkk..', '.kwwwwwwwwwwk.', 'kkkkkkkkkkkkkk', 'koooooooookkkk', 'kooooooookyyyk', 'kooooooookyYyk', 'kooooooookyyyk', 'koooooooookkkk', 'kooooooooooook', 'kooooooooooook', 'kkkkkkkkkkkkkk'],
  moon: ['....kkkkk...', '..kkPPPk....', '.kPPPk......', '.kPPk.......', 'kPPk........', 'kPPk........', 'kPPk........', 'kPPPk......k', '.kPPPPkkkPk.', '..kPPPPPPPk.', '...kkPPPkk..', '.....kkk....'],
  badge: ['....kkkk....', '..kkyyyykk..', '.kyyyyyywyk.', '.kyyyyywwyk.', 'kyywyywwyyyk', 'kyywwwwyyyyk', 'kyyywwyyyyyk', 'kyyyyyyyyyok', '.kyyyyyyyok.', '.kyyyyyyook.', '..kkooookk..', '....kkkk....']
};
const RING = ['coin', 'lock', 'ship', 'chart', 'key', 'shield', 'moon', 'anchor', 'wallet', 'eth', 'hook', 'badge'];
const iconCache = {};
function icon(name, mode = 'color', tint) {
  const key = name + mode + (tint || '');
  if (iconCache[key]) return iconCache[key];
  const rows = ICONS[name], w = Math.max(...rows.map((r) => r.length)), h = rows.length;
  const c = off(w, h), g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => {
    if (ch === '.') return;
    let col = PAL[ch];
    if (mode === 'sil') col = tint || DEEP;
    if (mode === 'outline') { if (ch !== 'k') return; col = tint || CREAM; }
    if (mode === 'grey') { const v = parseInt(col.slice(1, 3), 16) * .3 + parseInt(col.slice(3, 5), 16) * .55 + parseInt(col.slice(5, 7), 16) * .15; const m = Math.round(70 + v * .35); col = `rgb(${m},${m + 4},${m + 14})`; }
    if (mode === 'flash') { col = ch === 'k' ? BRONZE : PALE; }
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }));
  return (iconCache[key] = c);
}
function drawIcon(name, cx, cy, px, rot = 0, mode, alpha = 1, sx = 1, tint) {
  const im = icon(name, mode, tint);
  X.save(); X.globalAlpha *= alpha; X.translate(cx, cy); X.rotate(rot); X.scale(sx, 1);
  X.imageSmoothingEnabled = false;
  X.drawImage(im, -im.width * px / 2, -im.height * px / 2, im.width * px, im.height * px);
  X.restore();
}

/* ---------- backgrounds, grain, text ---------- */
function bgPaper(light = 1) {
  X.fillStyle = NAVY; X.fillRect(0, 0, W, H);
  const g = X.createRadialGradient(W * .5, H * .45, 60, W * .5, H * .5, W * .75);
  g.addColorStop(0, `rgba(43,62,102,${.75 * light})`); g.addColorStop(1, 'rgba(11,18,34,0)');
  X.fillStyle = g; X.fillRect(0, 0, W, H);
}
function bgDeep(warm = 0) {
  X.fillStyle = DEEP; X.fillRect(0, 0, W, H);
  if (warm > 0) { X.fillStyle = `rgba(70,46,24,${warm})`; X.fillRect(0, 0, W, H); }
}
function vignette(a = .55, inner = .35) {
  const g = X.createRadialGradient(W / 2, H / 2, W * inner, W / 2, H / 2, W * .78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  X.fillStyle = g; X.fillRect(0, 0, W, H);
}
const GRAIN = [0, 1, 2, 3, 4, 5].map((i) => {
  const c = off(720, 540), g = c.getContext('2d'), d = g.createImageData(720, 540), r = rng(77 + i * 991);
  for (let k = 0; k < d.data.length; k += 4) { const v = r() * 255; d.data[k] = d.data[k + 1] = d.data[k + 2] = v; d.data[k + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
});
function grain(f, a = .07) { X.save(); X.globalAlpha = a; X.globalCompositeOperation = 'overlay'; X.drawImage(GRAIN[f % 6], 0, 0, W, H); X.restore(); }
function txt(s, x, y, size = 34, col = CREAM, opt = {}) {
  X.save(); X.font = `${opt.weight || 600} ${size}px ${FONT}`; X.textAlign = opt.align || 'left'; X.textBaseline = 'middle';
  X.globalAlpha *= opt.alpha == null ? 1 : opt.alpha; X.fillStyle = col;
  if (opt.ls) X.letterSpacing = opt.ls + 'px';
  X.fillText(s, x, y); X.restore();
  X.font = `${opt.weight || 600} ${size}px ${FONT}`; return X.measureText(s).width;
}
function cursor(x, y, lt, h = 40, col = CREAM) { if (Math.floor(lt * 3.2) % 2 === 0) { X.fillStyle = col; X.fillRect(x, y - h / 2, 5, h); } }
function blurred(px, fn) {
  if (px <= .2) return fn();
  const c = off(), g = c.getContext('2d'), keep = X; X = g; fn(); X = keep;
  X.save(); X.filter = `blur(${px}px)`; X.drawImage(c, 0, 0); X.restore();
}

/* ---------- shapes ---------- */
function star4(cx, cy, R, w, inner, outer, rot = 0, alpha = 1, sy = 1) {
  X.save(); X.translate(cx, cy); X.rotate(rot); X.scale(1, sy); X.globalAlpha *= alpha;
  const g = X.createRadialGradient(0, 0, 0, 0, 0, R); g.addColorStop(0, inner); g.addColorStop(1, outer);
  X.fillStyle = g; X.beginPath();
  X.moveTo(0, -R); X.quadraticCurveTo(w * .12, -w * .12, w, 0); X.quadraticCurveTo(w * .12, w * .12, 0, R);
  X.quadraticCurveTo(-w * .12, w * .12, -w, 0); X.quadraticCurveTo(-w * .12, -w * .12, 0, -R); X.fill(); X.restore();
}
const HOOK = new Path2D('M22.5 62V27A13.5 13.5 0 0 1 49.5 27C49.5 35.5 45.5 41 38.5 43.5C43 38.8 44.5 33.5 44.5 27A8.5 8.5 0 0 0 27.5 27V62Z M19 58.5h12v4.5H19z M18 63h14l6.2 12.6a1.6 1.6 0 0 1-1.4 2.4H13.2a1.6 1.6 0 0 1-1.4-2.4z');
// the hook as a glowing heat silhouette (the figure in the black scenes)
function hookGlow(cx, cy, s, rot = 0, mode = 'heat', alpha = 1) {
  X.save(); X.globalAlpha *= alpha; X.translate(cx, cy); X.rotate(rot); X.scale(s, s); X.translate(-32, -45);
  if (mode === 'heat') {
    const g = X.createLinearGradient(20, 5, 40, 80);
    g.addColorStop(0, '#B4461A'); g.addColorStop(.3, '#E8862C'); g.addColorStop(.6, GOLD); g.addColorStop(.85, PALE); g.addColorStop(1, '#FFF8E6');
    X.save(); X.filter = `blur(${Math.max(4, s * 1.4)}px)`; X.globalAlpha *= .55; X.fillStyle = '#E8862C'; X.fill(HOOK); X.restore();
    X.filter = `blur(${Math.max(1, s * .12)}px)`; X.fillStyle = g; X.fill(HOOK);
    const h = X.createRadialGradient(30, 30, 2, 30, 30, 30); h.addColorStop(0, 'rgba(255,240,200,.35)'); h.addColorStop(1, 'rgba(255,240,200,0)');
    X.fillStyle = h; X.fill(HOOK);
  } else {
    X.filter = `blur(${Math.max(1, s * .1)}px)`; X.fillStyle = '#060A14'; X.fill(HOOK);
    X.lineWidth = .9; X.strokeStyle = 'rgba(232,176,75,.55)'; X.stroke(HOOK);
  }
  X.restore();
}
function scribble(seed, x, y, w, h, p, col = CREAM, lw = 3, alpha = 1, pts = 9) {
  if (p <= 0) return;
  const r = rng(seed), P = [];
  for (let i = 0; i < pts; i++) P.push([x + (i / (pts - 1)) * w + (r() - .5) * w * .25, y + (r() - .5) * h]);
  X.save(); X.globalAlpha *= alpha; X.strokeStyle = col; X.lineWidth = lw; X.lineCap = 'round'; X.lineJoin = 'round'; X.beginPath();
  const n = Math.max(2, Math.floor(p * 60));
  for (let i = 0; i <= n; i++) {
    const u = (i / 60) * (pts - 1), k = Math.min(pts - 2, Math.floor(u)), f = u - k;
    const a = P[Math.max(0, k - 1)], b = P[k], c = P[k + 1], d = P[Math.min(pts - 1, k + 2)];
    const cr = (p0, p1, p2, p3) => .5 * ((2 * p1) + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (-p0 + 3 * p1 - 3 * p2 + p3) * f * f * f);
    const px = cr(a[0], b[0], c[0], d[0]), py = cr(a[1], b[1], c[1], d[1]);
    i ? X.lineTo(px, py) : X.moveTo(px, py);
  }
  X.stroke(); X.restore();
}
function blob(x, y, r, seed, col = '#010206', alpha = 1) {
  const R = rng(seed); X.save(); X.globalAlpha *= alpha; X.fillStyle = col; X.filter = 'blur(2px)'; X.beginPath();
  for (let i = 0; i <= 24; i++) { const a = i / 24 * Math.PI * 2, rr = r * (.82 + R() * .3); i ? X.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : X.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  X.fill(); X.restore();
}
function smear(pts, w, alpha = .8) {
  X.save(); X.lineCap = 'round'; X.filter = 'blur(3px)';
  for (let i = 1; i < pts.length; i++) { X.globalAlpha = alpha * (i / pts.length); X.strokeStyle = '#010206'; X.lineWidth = w * (i / pts.length); X.beginPath(); X.moveTo(...pts[i - 1]); X.lineTo(...pts[i]); X.stroke(); }
  X.restore();
}
function burst(x, y, p, size = 120) {
  if (p <= 0 || p >= 1) return;
  X.save(); const a = 1 - p;
  const g = X.createRadialGradient(x, y, 0, x, y, size * (.6 + p));
  g.addColorStop(0, `rgba(255,236,190,${.9 * a})`); g.addColorStop(.4, `rgba(232,150,60,${.6 * a})`); g.addColorStop(1, 'rgba(232,120,40,0)');
  X.fillStyle = g; X.fillRect(x - size * 2, y - size * 2, size * 4, size * 4);
  X.strokeStyle = `rgba(247,215,140,${a})`; X.lineWidth = 5; X.lineCap = 'round';
  for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2 + .3, r0 = size * (.5 + p * .8), r1 = r0 + size * .35; X.beginPath(); X.moveTo(x + Math.cos(an) * r0, y + Math.sin(an) * r0); X.lineTo(x + Math.cos(an) * r1, y + Math.sin(an) * r1); X.stroke(); }
  X.restore();
}
function streaks(seed, n, y0, y1, p, col = PALE, alpha = .7) {
  const r = rng(seed); X.save(); X.strokeStyle = col; X.lineCap = 'round';
  for (let i = 0; i < n; i++) { const y = lerp(y0, y1, r()), x = r() * W, l = 120 + r() * 380; X.globalAlpha = alpha * (1 - p) * (.4 + r() * .6); X.lineWidth = 2 + r() * 3; X.beginPath(); X.moveTo(x - p * 600, y); X.lineTo(x - p * 600 + l, y); X.stroke(); }
  X.restore();
}
// the ring of icons (the "everything" scenes)
function ring(lt, spin, zoom = 1, cx = W / 2, cy = H / 2, scatter = 0, px = 6, flashes = {}) {
  const items = RING.map((n, i) => {
    const a = i / RING.length * Math.PI * 2 + spin;
    const r = rng(i * 31 + 5), sx = (r() - .5) * 2, sy = (r() - .5) * 2;
    let x = cx + Math.cos(a) * W * .27 * zoom, y = cy + Math.sin(a) * H * .29 * zoom;
    x += sx * scatter * W * .45; y += sy * scatter * H * .4;
    return { n, x, y, rot: Math.sin(a * 2 + lt) * .12, i };
  }).sort((a, b) => a.y - b.y);
  for (const it of items) drawIcon(it.n, it.x, it.y, px * zoom * (1 - scatter * .35), it.rot, flashes[it.n] ? 'flash' : 'color');
  return items;
}

/* ---------- the cut ---------- */
const SENT = 'how do you launch a token people can trust?';
const S = [
  // 0: flash, the first word huge
  [0, .08, (lt) => {
    X.fillStyle = GOLD; X.fillRect(0, 0, W, H);
    X.save(); X.translate(150, H * 1.02); X.scale(1, 2.7); txt('how', 0, -150, 330, DEEP, { weight: 800 }); X.restore();
    X.setLineDash([22, 14]); X.strokeStyle = DEEP; X.lineWidth = 3; X.beginPath(); X.moveTo(0, H - 18); X.lineTo(W, H - 18); X.stroke(); X.setLineDash([]);
  }],
  // 1: the question slides through big, pixelates, breaks into dashes
  [.08, .72, (lt) => {
    bgPaper(.9);
    lt = Math.max(0, lt - .09);
    const x = 360 - ei(lt / .5) * 1900, y = H * .45;
    const draw = () => {
      X.setLineDash([22, 14]); X.strokeStyle = 'rgba(232,176,75,.7)'; X.lineWidth = 3;
      for (const yy of [y - 120, y + 95]) { X.beginPath(); X.moveTo(-40 + (x % 36), yy); X.lineTo(W, yy); X.stroke(); }
      X.setLineDash([]);
      const w1 = txt('how ', x, y, 200, CREAM, { weight: 700 });
      txt('do you launch a token', x + w1, y, 200, 'rgba(243,234,215,.55)', { weight: 700 });
    };
    if (lt < .3) draw();
    else if (lt < .45) { const c = off(W / 12, H / 12), g = c.getContext('2d'), keep = X; const big = off(); X = big.getContext('2d'); draw(); X = keep; g.drawImage(big, 0, 0, c.width, c.height); X.imageSmoothingEnabled = false; X.drawImage(c, 0, 0, W, H); X.imageSmoothingEnabled = true; }
    else blurred(4, () => { const r = rng(9); X.fillStyle = 'rgba(243,234,215,.7)'; for (let i = 0; i < 16; i++) { const xx = 300 + i * 52 + r() * 20; X.fillRect(xx, y - 4, 18 + r() * 40, 8); } X.fillRect(1010, y - 30, 8, 18); X.fillRect(1010, y + 4, 8, 22); });
    vignette(.5);
  }],
  // 2: the question typed small, with scribbles
  [.72, 2.0, (lt, t) => {
    bgPaper(1);
    const words = SENT.split(' '), times = [.11, .11, .11, .11, .45, .61, .78, .95, 1.12];
    let s = ''; words.forEach((w, i) => { if (lt >= times[i] && i < 8) s += (s ? ' ' : '') + w; });
    const x0 = lt < .28 ? W * .53 : 60, y0 = lt < .28 ? H * .3 : H * .5;
    txt(s, x0, y0, 42, CREAM);
    const sc = (a, b) => prog(lt, a, b);
    blurred(5, () => scribble(11, W * .62, H * .12, 380, 220, sc(.0, .2), CREAM, 7, (1 - sc(.25, .4)) * .5));
    scribble(12, W * .52, H * .55, 300, 160, sc(.08, .25), CREAM, 3, 1 - sc(.3, .38));
    scribble(13, 70, H * .62, 420, 120, sc(.28, .45), CREAM, 3, 1 - sc(.48, .55));
    scribble(14, 640, H * .48, 90, 120, sc(.45, .55), PALE, 3, 1 - sc(.6, .66));
    scribble(15, 760, H * .5, 220, 110, sc(.6, .75), CREAM, 3.5, 1 - sc(.8, .88), 7);
    if (lt > .78 && lt < 1.0) { X.fillStyle = CREAM; const p = prog(lt, .78, .88); X.fillRect(60, H * .5 - 280 * p, 4, 270 * p); }
    vignette(.45);
  }],
  // 3: flash with a star
  [2.0, 2.12, (lt) => blurred(7, () => {
    X.fillStyle = PALE; X.fillRect(0, 0, W, H);
    star4(W * .32, H * .5, 520, 260, '#FFFBEF', 'rgba(232,176,75,.2)', .1);
    X.strokeStyle = 'rgba(255,255,255,.7)'; X.lineWidth = 14; for (let i = 0; i < 6; i++) { X.beginPath(); X.moveTo(W * .1 + i * 90, H * .3 + i * 40); X.lineTo(W * .7 + i * 60, H * .15 + i * 50); X.stroke(); }
    txt(SENT, 40, H * .5, 30, 'rgba(11,18,34,.5)');
    drawIcon('lock', W * .44, H * .38, 4); drawIcon('ship', W * .7, H * .45, 4);
  })],
  // 4: the full question, a star at the edge, icons floating; the light closes in on "you"
  [2.12, 3.82, (lt) => {
    bgPaper(1);
    const sx = lerp(W * .25, W * .015, eo(lt / .25)), R = lerp(470, 600, eo(lt / .4));
    star4(sx, H * .5, R, 230, '#FFF6DC', 'rgba(232,176,75,.35)', 0, 1);
    const fade = 1 - prog(lt, 1.25, 1.45);
    const bob = (k) => Math.sin(lt * 3 + k) * 6;
    drawIcon('lock', W * .43, H * .3 + bob(1), 6, -.25, 'color', fade);
    drawIcon('chart', W * .6, H * .3 + bob(2), 6, .15, 'color', fade);
    drawIcon('coin', W * .56, H * .62 + bob(3), 6, 0, 'color', fade, Math.abs(Math.cos(lt * 4)) * .8 + .2);
    drawIcon('ship', W * .63, H * .78 + bob(4), 6, -.1, 'color', fade);
    if (lt < .15) { scribble(21, W * .3, H * .2, 500, 300, lt / .15, CREAM, 3, 1 - lt / .15); }
    const hl = lt > 1.3;
    const words = SENT.split(' '); let x = W * .5 - txt(SENT, -9999, 0, 42) / 2;
