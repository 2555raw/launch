<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
  /* X header: 1500 x 500.
     Two things drive the layout. The avatar sits over the bottom-left — a
     circle of about 180px hanging off the edge — so that corner is left empty
     on purpose. And narrow screens crop the header inward from both sides, so
     nothing that has to be read sits in the outer 260px. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1500px; height:500px; overflow:hidden;
         font-family:'Inter Tight',system-ui,sans-serif;
         background:#EBE7E8; position:relative; }

  /* the same graph paper the site sits on */
  .paper { position:absolute; inset:0;
    background-image:
      linear-gradient(to right, #E0DADC 0 1px, transparent 1px),
      linear-gradient(to bottom, #E0DADC 0 1px, transparent 1px);
    background-size:32px 32px; }

  /* the vesica: two circles of equal radius through each other's centre */
  .ground { position:absolute; right:250px; top:50%; transform:translateY(-50%);
             width:560px; height:560px; opacity:.85; }

  .mark { position:absolute; right:180px; top:50%; transform:translateY(-50%) rotate(-13deg);
           width:520px; height:520px;
           /* the blur closes the steps between layers where the mark's own
              spikes are thinner than the gap; the shadow sits it on the page */
           filter:blur(.7px) drop-shadow(0 18px 34px rgba(61,59,79,.16)); }

  .copy { position:absolute; left:104px; top:78px; }
  .lock { display:flex; align-items:center; gap:19px; }
  .lock .m { width:56px; height:56px; color:#2B1520; }
  .word { font-family:'Instrument Serif',Georgia,serif; font-size:82px; font-weight:400; letter-spacing:-.045em; color:#2B1520; line-height:1; }
  .line { font-family:'Instrument Serif',Georgia,serif; margin-top:26px; font-size:38px; font-weight:400; letter-spacing:-.028em;
           color:#2B1520; line-height:1.22; }
  .line em { font-style:normal; background:#F4DCE3; padding:0 8px; border-radius:4px; }
  .sub { margin-top:16px; font-family:'IBM Plex Mono',monospace; font-size:14.5px;
          letter-spacing:.17em; text-transform:uppercase; color:#5C4A50; }

  /* the strip along the bottom, clear of the avatar */
  /* Not bottom-left: that is the avatar's corner. X hangs a circle of about
     200px over it, half below the edge, so anything down there is covered on
     every profile that has a picture. The chips sit under the copy instead. */
  .strip { margin-top:22px; display:flex; gap:12px; }
  .chip { font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.1em;
           text-transform:uppercase; color:#2B1520;
           border:1px solid #1A0E14; border-radius:999px; padding:6px 15px; background:#EBE7E8; }
  .chip.fill { background:#F4DCE3; border-color:#E8C2CE; }
</style></head>
