<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vesica — X avatar</title>
<!-- 400 x 400, rendered at 3x. X crops a profile picture to a circle, so the
     mark sits well inside the inscribed circle and nothing but background
     reaches the corners. The mark itself is untouched: same path, same ink.
     Not linked from the site — it exists to be screenshotted. -->
<style>
  :root { --band:#3D3B4F; --bg:#EDEEF2; --grid:#E4E5EA; }
  * { box-sizing:border-box; margin:0; }
  body { width:400px; height:400px; overflow:hidden; }

  .pf {
    position:relative; width:400px; height:400px; overflow:hidden;
    background-color:var(--bg);
    background-image:
      linear-gradient(to right, var(--grid) 0 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px);
    background-size:26px 26px;
    perspective:700px; perspective-origin:50% 46%;
    transform-style:preserve-3d;
  }

  .glow { position:absolute; border-radius:50%; filter:blur(54px); pointer-events:none; }
  .g1 { width:320px; height:250px; left:40px;  top:60px;  background:rgba(255,238,168,.40); }
  .g2 { width:220px; height:180px; left:250px; top:-40px; background:rgba(206,196,255,.46); }
  .g3 { width:200px; height:160px; left:-60px; top:150px; background:rgba(255,255,255,.60); }
  .g4 { width:260px; height:140px; left:70px;  top:250px; background:rgba(198,220,255,.56); }
  .g5 { width:190px; height:190px; left:230px; top:220px; background:rgba(214,230,255,.42); }
  .g6 { width:170px; height:150px; left:-30px; top:-40px; background:rgba(218,206,255,.44); }

  /* the same glass scene as the header, at a quarter the size */
  .glass { position:absolute; inset:-70px; transform-style:preserve-3d; pointer-events:none; }
  .rb {
    position:absolute; display:block; border-radius:50%; border-style:solid;
    box-shadow:
      inset 0 0 36px rgba(255,255,255,.75),
      inset 0 0 0 2px rgba(255,255,255,.85),
      0 0 44px rgba(255,255,255,.45);
  }
  .ca {
    position:absolute; display:block; border-radius:999px;
    background:linear-gradient(90deg,
      rgba(255,255,255,0), rgba(232,242,255,.92) 26%,
      rgba(255,255,255,1) 52%, rgba(238,230,255,.88) 74%, rgba(255,255,255,0));
  }
  .bead {
    position:absolute; border-radius:50%; pointer-events:none;
    background:
      radial-gradient(circle at 36% 30%,
        rgba(255,255,255,.96) 0%, rgba(255,255,255,.34) 13%,
        rgba(255,255,255,.04) 34%, rgba(176,174,204,.08) 60%,
        rgba(226,238,255,.62) 86%, rgba(232,220,255,.36) 94%, rgba(255,255,255,.10) 100%),
      conic-gradient(from 210deg,
        rgba(214,228,255,.30), rgba(228,214,255,.18), rgba(255,244,196,.16),
        rgba(206,246,255,.14), rgba(214,228,255,.30));
    box-shadow:
      inset -2px -3px 10px rgba(116,114,152,.24),
      inset 2px 3px 9px rgba(255,255,255,.75),
      0 8px 16px rgba(61,59,79,.10);
    backdrop-filter:blur(5px) saturate(1.5) brightness(1.04);
  }

  /* ---- the mark in liquid crystal ----
     The same path, seven times, each copy masked to it and each doing one
     job a piece of glass does. Nothing here is a filter laid over a picture
     of the logo: the shape is cut out of the scene and the scene is what
     fills it.

       shade    the soft shadow the body casts
       focus    and the warm spot the light concentrates under it
       refract  what is behind, bent -- a backdrop blur, scaled a touch so it
                is displaced rather than merely softened
       body     the glass itself: cool, barely there, just enough that the
                silhouette still reads on a light ground
       disp     the rim, split into its colours by drop-shadows a pixel and a
                half either side, warm one way and cool the other
       spec     the sweep of the light across the face
       hot      and the point where it enters */

  .lg { position:absolute; left:50%; top:50%; width:228px; height:228px;
        transform:translate(-50%, -50%); }
  .lg i {
    position:absolute; inset:0; display:block;
    -webkit-mask:url(../mark.svg) center / contain no-repeat;
    mask:url(../mark.svg) center / contain no-repeat;
  }

  /* a thin glyph cannot take much offset: past four or five pixels the
     shadow stops being a shadow and becomes a second logo */
  .lg-shade {
    background:rgba(72,76,112,.40);
    transform:translate(1px, 5px) scale(1.01);
    filter:blur(9px);
  }
  .lg-focus {
    background:rgba(255,226,140,.70);
    transform:translate(-1px, 6px) scale(.99);
    filter:blur(11px);
    mix-blend-mode:multiply;
    opacity:.55;
  }
  .lg-refract {
    backdrop-filter:blur(7px) saturate(1.75) brightness(1.05);
    transform:scale(1.015);
  }
  .lg-body {
    background:linear-gradient(148deg,
      rgba(255,255,255,.34) 0%, rgba(198,214,248,.24) 30%,
      rgba(214,198,246,.22) 58%, rgba(226,240,255,.26) 82%, rgba(255,255,255,.32) 100%);
    box-shadow:none;
  }
  /* the silhouette has to survive a light ground, so a little of the ink
     stays in the glass rather than none of it */
  .lg-tint {
    background:linear-gradient(150deg,
      rgba(46,45,66,.93) 0%, rgba(56,56,84,.70) 34%,
      rgba(50,52,82,.76) 66%, rgba(42,42,64,.95) 100%);
  }
  .lg-disp {
    background:rgba(255,255,255,.02);
    filter:
      drop-shadow(2px 0 0 rgba(255,168,232,.95))
      drop-shadow(-2px 0 0 rgba(130,186,255,.95))
      drop-shadow(0 -1.8px 0 rgba(255,238,150,.90))
      drop-shadow(0 1.8px 0 rgba(168,210,255,.80));
  }
  .lg-rim {
    background:rgba(255,255,255,.04);
    filter:
      drop-shadow(0 -1.2px 0 rgba(255,255,255,1))
      drop-shadow(-1.2px 0 0 rgba(255,255,255,.95))
      drop-shadow(0 1.8px 1px rgba(70,74,112,.60));
  }
  .lg-spec {
    background:linear-gradient(124deg,
      rgba(255,255,255,.95) 0%, rgba(255,255,255,.30) 11%,
      rgba(255,255,255,0) 28%, rgba(255,255,255,0) 70%,
      rgba(255,255,255,.26) 86%, rgba(255,255,255,.80) 100%);
    mix-blend-mode:screen;
  }
  .lg-hot {
    background:radial-gradient(38% 34% at 33% 24%,
      rgba(255,255,255,1) 0%, rgba(255,255,255,.55) 38%, rgba(255,255,255,0) 72%);
    mix-blend-mode:screen;
  }
</style>
</head>
<body>
<div class="pf">
  <div class="glow g3"></div>
  <div class="glow g1"></div>
  <div class="glow g4"></div>
  <div class="glow g2"></div>
  <div class="glow g5"></div>
  <div class="glow g6"></div>

  <div class="glass">
      <i class="rb" style="left:-150px;top:-170px;width:560px;height:440px;border-width:44px;border-color:rgba(196,214,255,0.62);filter:blur(1px);transform:translateZ(-58px) rotateX(-52deg) rotateY(34deg) rotateZ(-18deg)"></i>
      <i class="rb" style="left:180px;top:-210px;width:600px;height:470px;border-width:52px;border-color:rgba(232,242,255,0.50);filter:blur(4px);transform:translateZ(-67px) rotateX(38deg) rotateY(-46deg) rotateZ(26deg)"></i>
      <i class="rb" style="left:-210px;top:70px;width:500px;height:380px;border-width:34px;border-color:rgba(212,196,255,0.44);filter:blur(7px);transform:translateZ(-184px) rotateX(26deg) rotateY(52deg) rotateZ(-40deg)"></i>
      <i class="rb" style="left:150px;top:110px;width:520px;height:400px;border-width:38px;border-color:rgba(224,236,255,0.52);filter:blur(2px);transform:translateZ(-40px) rotateX(-30deg) rotateY(-38deg) rotateZ(34deg)"></i>
      <i class="rb" style="left:40px;top:-90px;width:380px;height:320px;border-width:26px;border-color:rgba(255,238,186,0.38);filter:blur(9px);transform:translateZ(-187px) rotateX(44deg) rotateY(28deg) rotateZ(-62deg)"></i>
      <i class="rb" style="left:-80px;top:150px;width:560px;height:300px;border-width:32px;border-color:rgba(232,242,255,0.46);filter:blur(5px);transform:translateZ(-109px) rotateX(-20deg) rotateY(40deg) rotateZ(12deg)"></i>
      <i class="ca" style="left:116px;top:27px;width:310px;height:12px;opacity:0.61;filter:blur(2.4px);transform:rotate(38deg)"></i>
      <i class="ca" style="left:54px;top:325px;width:133px;height:4px;opacity:0.46;filter:blur(3.8px);transform:rotate(-40deg)"></i>
      <i class="ca" style="left:321px;top:287px;width:223px;height:4px;opacity:0.45;filter:blur(1.5px);transform:rotate(-9deg)"></i>
      <i class="ca" style="left:219px;top:-7px;width:131px;height:13px;opacity:0.35;filter:blur(4.8px);transform:rotate(-27deg)"></i>
      <i class="ca" style="left:146px;top:219px;width:276px;height:12px;opacity:0.31;filter:blur(5.5px);transform:rotate(41deg)"></i>
      <i class="ca" style="left:182px;top:8px;width:165px;height:15px;opacity:0.42;filter:blur(5.9px);transform:rotate(23deg)"></i>
      <i class="ca" style="left:-18px;top:293px;width:192px;height:5px;opacity:0.43;filter:blur(1.6px);transform:rotate(-31deg)"></i>
      <i class="ca" style="left:110px;top:109px;width:265px;height:13px;opacity:0.50;filter:blur(7.7px);transform:rotate(-57deg)"></i>
      <i class="ca" style="left:268px;top:132px;width:305px;height:4px;opacity:0.57;filter:blur(3.8px);transform:rotate(60deg)"></i>
      <i class="ca" style="left:152px;top:300px;width:125px;height:16px;opacity:0.48;filter:blur(5.4px);transform:rotate(-64deg)"></i>
  </div>

    <i class="bead" style="left:44px;top:58px;width:44px;height:44px;filter:blur(0px)"></i>
    <i class="bead" style="left:318px;top:96px;width:32px;height:32px;filter:blur(0.6px)"></i>
    <i class="bead" style="left:286px;top:308px;width:52px;height:52px;filter:blur(1.2px)"></i>
    <i class="bead" style="left:62px;top:300px;width:28px;height:28px;filter:blur(0.4px)"></i>
    <i class="bead" style="left:198px;top:16px;width:24px;height:24px;filter:blur(0px)"></i>

  <div class="lg" aria-hidden="true">
    <i class="lg-shade"></i>
    <i class="lg-focus"></i>
    <i class="lg-refract"></i>
    <i class="lg-body"></i>
    <i class="lg-tint"></i>
    <i class="lg-rim"></i>
    <i class="lg-disp"></i>
    <i class="lg-spec"></i>
    <i class="lg-hot"></i>
  </div>
</div>
</body>
</html>
