<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vesica — X avatar</title>
<!-- 400 x 400, rendered at 3x. X crops a profile picture to a circle, so the
     mark sits well inside the inscribed circle and nothing but background
     reaches the corners. The mark itself is untouched: same path, same ink.
     Not linked from the site — it exists to be screenshotted. -->
<style>
  :root { --band:#3D3B4F; --bg:#E9E9E9; --grid:#DEDEDE; }
  * { box-sizing:border-box; margin:0; }
  body { width:400px; height:400px; overflow:hidden; }

  .pf {
    position:relative; width:400px; height:400px; overflow:hidden;
    background-color:var(--bg);
    background-image:
      linear-gradient(to right, var(--grid) 0 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px);
    background-size:26px 26px;
    perspective:700px; perspective-origin:50% 46%;
    transform-style:preserve-3d;
  }

  .glow { position:absolute; border-radius:50%; filter:blur(54px); pointer-events:none; }
  .g1 { width:320px; height:250px; left:40px;  top:60px;  background:rgba(246,236,150,.62); }
  .g2 { width:220px; height:180px; left:250px; top:-40px; background:rgba(255,197,250,.36); }
  .g3 { width:200px; height:160px; left:-60px; top:150px; background:rgba(255,255,255,.60); }
  .g4 { width:260px; height:140px; left:70px;  top:250px; background:rgba(198,216,255,.44); }
  .g5 { width:190px; height:190px; left:230px; top:220px; background:rgba(186,255,226,.32); }
  .g6 { width:170px; height:150px; left:-30px; top:-40px; background:rgba(214,196,255,.32); }

  /* the same glass scene as the header, at a quarter the size */
  .glass { position:absolute; inset:-70px; transform-style:preserve-3d; pointer-events:none; }
  .rb {
    position:absolute; display:block; border-radius:50%; border-style:solid;
    box-shadow:
      inset 0 0 36px rgba(255,255,255,.75),
      inset 0 0 0 2px rgba(255,255,255,.85),
      0 0 44px rgba(255,255,255,.45);
  }
  .ca {
    position:absolute; display:block; border-radius:999px;
    background:linear-gradient(90deg,
      rgba(255,255,255,0), rgba(255,252,222,.95) 30%,
      rgba(255,255,255,1) 52%, rgba(255,232,250,.85) 74%, rgba(255,255,255,0));
  }
  .bead {
    position:absolute; border-radius:50%; pointer-events:none;
    background:
      radial-gradient(circle at 36% 30%,
        rgba(255,255,255,.96) 0%, rgba(255,255,255,.34) 13%,
        rgba(255,255,255,.04) 34%, rgba(176,174,204,.08) 60%,
        rgba(255,251,205,.62) 86%, rgba(255,214,246,.34) 94%, rgba(255,255,255,.10) 100%),
      conic-gradient(from 210deg,
        rgba(255,240,150,.30), rgba(255,208,244,.16), rgba(190,226,255,.18),
        rgba(198,255,228,.12), rgba(255,240,150,.30));
    box-shadow:
      inset -2px -3px 10px rgba(116,114,152,.24),
      inset 2px 3px 9px rgba(255,255,255,.75),
      0 8px 16px rgba(61,59,79,.10);
    backdrop-filter:blur(5px) saturate(1.5) brightness(1.04);
  }

  /* the mark, unchanged: 54% of the frame, centred, and well inside the
     circle X will crop this to */
  .mk {
    position:absolute; left:50%; top:50%; width:216px; height:216px;
    transform:translate(-50%, -50%);
    background:var(--band);
    -webkit-mask:url(../mark.svg) center / contain no-repeat;
    mask:url(../mark.svg) center / contain no-repeat;
    filter:drop-shadow(0 6px 18px rgba(61,59,79,.22));
  }
</style>
</head>
<body>
<div class="pf">
  <div class="glow g3"></div>
  <div class="glow g1"></div>
  <div class="glow g4"></div>
  <div class="glow g2"></div>
  <div class="glow g5"></div>
  <div class="glow g6"></div>

  <div class="glass">
      <i class="rb" style="left:-150px;top:-170px;width:560px;height:440px;border-width:44px;border-color:rgba(255,252,226,0.62);filter:blur(1px);transform:translateZ(-58px) rotateX(-52deg) rotateY(34deg) rotateZ(-18deg)"></i>
      <i class="rb" style="left:180px;top:-210px;width:600px;height:470px;border-width:52px;border-color:rgba(255,255,255,0.50);filter:blur(4px);transform:translateZ(-67px) rotateX(38deg) rotateY(-46deg) rotateZ(26deg)"></i>
      <i class="rb" style="left:-210px;top:70px;width:500px;height:380px;border-width:34px;border-color:rgba(255,240,250,0.44);filter:blur(7px);transform:translateZ(-184px) rotateX(26deg) rotateY(52deg) rotateZ(-40deg)"></i>
      <i class="rb" style="left:150px;top:110px;width:520px;height:400px;border-width:38px;border-color:rgba(250,252,255,0.52);filter:blur(2px);transform:translateZ(-40px) rotateX(-30deg) rotateY(-38deg) rotateZ(34deg)"></i>
      <i class="rb" style="left:40px;top:-90px;width:380px;height:320px;border-width:26px;border-color:rgba(255,250,214,0.38);filter:blur(9px);transform:translateZ(-187px) rotateX(44deg) rotateY(28deg) rotateZ(-62deg)"></i>
      <i class="rb" style="left:-80px;top:150px;width:560px;height:300px;border-width:32px;border-color:rgba(255,255,255,0.46);filter:blur(5px);transform:translateZ(-109px) rotateX(-20deg) rotateY(40deg) rotateZ(12deg)"></i>
      <i class="ca" style="left:116px;top:27px;width:310px;height:12px;opacity:0.61;filter:blur(2.4px);transform:rotate(38deg)"></i>
      <i class="ca" style="left:54px;top:325px;width:133px;height:4px;opacity:0.46;filter:blur(3.8px);transform:rotate(-40deg)"></i>
      <i class="ca" style="left:321px;top:287px;width:223px;height:4px;opacity:0.45;filter:blur(1.5px);transform:rotate(-9deg)"></i>
      <i class="ca" style="left:219px;top:-7px;width:131px;height:13px;opacity:0.35;filter:blur(4.8px);transform:rotate(-27deg)"></i>
      <i class="ca" style="left:146px;top:219px;width:276px;height:12px;opacity:0.31;filter:blur(5.5px);transform:rotate(41deg)"></i>
      <i class="ca" style="left:182px;top:8px;width:165px;height:15px;opacity:0.42;filter:blur(5.9px);transform:rotate(23deg)"></i>
      <i class="ca" style="left:-18px;top:293px;width:192px;height:5px;opacity:0.43;filter:blur(1.6px);transform:rotate(-31deg)"></i>
      <i class="ca" style="left:110px;top:109px;width:265px;height:13px;opacity:0.50;filter:blur(7.7px);transform:rotate(-57deg)"></i>
      <i class="ca" style="left:268px;top:132px;width:305px;height:4px;opacity:0.57;filter:blur(3.8px);transform:rotate(60deg)"></i>
      <i class="ca" style="left:152px;top:300px;width:125px;height:16px;opacity:0.48;filter:blur(5.4px);transform:rotate(-64deg)"></i>
  </div>

    <i class="bead" style="left:44px;top:58px;width:44px;height:44px;filter:blur(0px)"></i>
    <i class="bead" style="left:318px;top:96px;width:32px;height:32px;filter:blur(0.6px)"></i>
    <i class="bead" style="left:286px;top:308px;width:52px;height:52px;filter:blur(1.2px)"></i>
    <i class="bead" style="left:62px;top:300px;width:28px;height:28px;filter:blur(0.4px)"></i>
    <i class="bead" style="left:198px;top:16px;width:24px;height:24px;filter:blur(0px)"></i>

  <i class="mk"></i>
</div>
</body>
</html>
