<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
  /* A promo card, 1600x900. The rows are drawn from the site's own VAULTS
     table rather than retyped, so the figures here and the figures on the site
     cannot drift apart. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1600px; height:900px; overflow:hidden; position:relative;
         font-family:'Inter Tight',system-ui,sans-serif; background:#EBE7E8; }
  .paper { position:absolute; inset:0;
    background-image:
      linear-gradient(to right,#E0DADC 0 1px,transparent 1px),
      linear-gradient(to bottom,#E0DADC 0 1px,transparent 1px);
    background-size:32px 32px; }

  /* the mark, large and far back */
  /* Sized to the short side, not to taste. The canvas is 900 tall with overflow
   hidden, so anything larger than that is cropped top and bottom and all that
   survives is a vertical band through the middle — which reads as a smudge,
   not as the mark. 820 leaves the whole silhouette inside the frame. */
.bg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-8deg);
      width:820px; height:820px; opacity:1; filter:blur(.3px); }

  .wrap { position:absolute; inset:0; padding:54px 64px; display:flex; flex-direction:column; }

  .top { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:26px; }
  .lock { display:flex; align-items:center; gap:15px; }
  .lock svg { width:42px; height:42px; color:#2B1520; }
  .word { font-size:44px; font-weight:700; letter-spacing:-.04em; color:#2B1520; }
  .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.18em;
             text-transform:uppercase; color:#5C4A50; margin-top:7px; }
  .tag { font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.14em;
         text-transform:uppercase; color:#5C4A50;
         border:1px dashed #C7C6CF; border-radius:999px; padding:6px 14px; }

  .head { display:grid; grid-template-columns:300px 132px 132px 108px 1fr 128px;
          gap:18px; align-items:center; padding:0 22px 11px;
          font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
          text-transform:uppercase; color:#C9B8BE; }
  /* No backdrop blur. It was smearing the mark behind the table into nothing,
   which defeats the point of putting it there. The rows are translucent
   instead, and the mark is pale enough that the type still reads over it. */
  .rows { background:rgba(237,237,240,.58); border:1px solid #D9D8DE; border-radius:16px;
          overflow:hidden; }
  .row { display:grid; grid-template-columns:300px 132px 132px 108px 1fr 128px;
         gap:18px; align-items:center; padding:15px 22px; border-bottom:1px solid #E2E1E6; }
  .row:last-child { border-bottom:0; }

  .v { display:flex; align-items:center; gap:13px; min-width:0; }
  .ic { width:34px; height:34px; border-radius:9px; background:#EBE7E8; flex:none;
        display:grid; place-items:center; overflow:hidden; }
  .ic svg { width:19px; height:19px; }
  .nm b { display:block; font-size:15.5px; font-weight:600; color:#2B1520; letter-spacing:-.01em; }
  .nm span { display:block; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#5C4A50; margin-top:1px; }

  .pill { justify-self:start; display:inline-flex; align-items:center; gap:6px;
          font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em;
          text-transform:uppercase; padding:4px 11px; border-radius:999px;
          background:#F4DCE3; color:#6E1730; }
  .pill i { width:5px; height:5px; border-radius:50%; background:#8A1F3D; }
  .pill.paused { background:#EDEDF0; color:#5C4A50; }
  .pill.paused i { background:#C9B8BE; }

  .num { font-family:'IBM Plex Mono',monospace; font-size:15px; color:#2B1520; text-align:right; }
  .apr { font-size:16px; font-weight:600; color:#8A1F3D; text-align:right; letter-spacing:-.01em; }
  .apr.zero { color:#C9B8BE; font-weight:500; }

  .band { display:flex; align-items:center; gap:10px; }
  .band .lo, .band .hi { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#C9B8BE; flex:none; }
  .rail { position:relative; flex:1; height:4px; border-radius:999px; background:#E0DADC; }
  .rail i { position:absolute; top:50%; transform:translate(-50%,-50%);
            width:9px; height:9px; border-radius:50%; background:#2B1520; border:2px solid #F0EDEE; }

  .btn { justify-self:end; font-size:13.5px; font-weight:600; color:#EBE7E8;
         background:#2B1520; border-radius:999px; padding:9px 22px; }
  .btn.off { background:transparent; color:#C9B8BE; border:1px solid #DCD4D7; }

  .foot { margin-top:auto; padding-top:22px; display:flex; align-items:center;
          justify-content:space-between; }
  .foot .l { font-size:19px; font-weight:600; color:#2B1520; letter-spacing:-.02em; }
  .foot .r { font-family:'IBM Plex Mono',monospace; font-size:13px; color:#5C4A50; letter-spacing:.06em; }
</style></head>
<body>
  <div class="paper"></div>
  <svg class="bg" viewBox="-12 -12 124 124" aria-hidden="true">
    <defs>
      <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#B9B8C2"/>
        <stop offset="55%"  stop-color="#D2D1D9"/>
        <stop offset="100%" stop-color="#EFE28A"/>
      </linearGradient>
      <path id="vm" fill-rule="evenodd" d="M65.63 39.61 A40.00 26.50 0 1 1 34.37 39.61 L38.86 46.97 A28.50 18.50 0 1 0 61.14 46.97 Z M42.6 60.0 L50.0 7.0 L57.4 60.0 L50.0 66.5 Z M44.8 74.5 L55.2 74.5 L52.6 83.5 L47.4 83.5 Z"/>
    </defs>
    <use href="#vm" fill="url(#mg)"/>
  </svg>

  <div class="wrap">
    <div class="top">
      <div>
        <div class="lock">
          <svg viewBox="0 0 100 100" fill="currentColor"><use href="#vm"/></svg>
          <span class="word">Vesica</span>
        </div>
        <div class="eyebrow">20 vaults, one per stock</div>
      </div>
      <span class="tag">Preview · nothing deployed</span>
    </div>

    <div class="head">
      <span>Vault</span><span>State</span><span style="text-align:right">TVL</span>
      <span style="text-align:right">Fee APR</span><span>Position band</span><span></span>
    </div>
    <div class="rows" id="rows"></div>

    <div class="foot">
      <span class="l">One vault per stock. Fees split onchain.</span>
      <span class="r">vesica.site</span>
    </div>
  </div>

<script src="../logos.js"></script>
<script src="../vaults-data.js"></script>
<script>
  const usdM = n => '$' + (n/1e6).toFixed(2) + 'M';
  document.getElementById('rows').innerHTML = VAULTS.slice(0, 8).map(v => {
    const lo = v.price * (1 - v.band/100), hi = v.price * (1 + v.band/100);
    const at = 32 + (v.t.charCodeAt(0) % 5) * 9;          // where the price sits, deterministic
    const paused = v.state === 'paused';
    const mk = LOGOS[v.t];
    return `<div class="row">
      <div class="v">
        <span class="ic">${mk ? markSvg(mk) : ''}</span>
        <span class="nm"><b>${v.name}</b><span>${v.t} / USDG</span></span>
      </div>
      <span class="pill ${paused ? 'paused' : ''}"><i></i>${STATE_TEXT[v.state]}</span>
      <span class="num">${usdM(v.tvl)}</span>
      <span class="apr ${paused ? 'zero' : ''}">${paused ? '—' : v.apr.toFixed(1) + '%'}</span>
      <span class="band">
        <span class="lo">$${lo.toFixed(2)}</span>
        <span class="rail"><i style="left:${at}%"></i></span>
        <span class="hi">$${hi.toFixed(2)}</span>
      </span>
      <span class="btn ${paused ? 'off' : ''}">${paused ? 'Paused' : 'Deposit'}</span>
    </div>`;
  }).join('');
</script>
</body></html>
