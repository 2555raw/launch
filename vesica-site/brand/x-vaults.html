<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* A promo card, 1600x900. The rows are drawn from the site's own VAULTS
     table rather than retyped, so the figures here and the figures on the site
     cannot drift apart. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1600px; height:900px; overflow:hidden; position:relative;
         font-family:'Schibsted Grotesk',system-ui,sans-serif; background:#E9E9E9; }
  .paper { position:absolute; inset:0;
    background-image:
      linear-gradient(to right,#DEDEDE 0 1px,transparent 1px),
      linear-gradient(to bottom,#DEDEDE 0 1px,transparent 1px);
    background-size:32px 32px; }

  /* the mark, large and far back */
  /* Sized to the short side, not to taste. The canvas is 900 tall with overflow
   hidden, so anything larger than that is cropped top and bottom and all that
   survives is a vertical band through the middle — which reads as a smudge,
   not as the mark. 820 leaves the whole silhouette inside the frame. */
.bg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-8deg);
      width:820px; height:820px; opacity:1; filter:blur(.3px); }

  .wrap { position:absolute; inset:0; padding:54px 64px; display:flex; flex-direction:column; }

  .top { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:26px; }
  .lock { display:flex; align-items:center; gap:15px; }
  .lock svg { width:42px; height:42px; color:#3D3B4F; }
  .word { font-size:44px; font-weight:700; letter-spacing:-.04em; color:#3D3B4F; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:.18em;
             text-transform:uppercase; color:#82828D; margin-top:7px; }
  .tag { font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.14em;
         text-transform:uppercase; color:#82828D;
         border:1px dashed #C7C6CF; border-radius:999px; padding:6px 14px; }

  .head { display:grid; grid-template-columns:300px 132px 132px 108px 1fr 128px;
          gap:18px; align-items:center; padding:0 22px 11px;
          font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em;
          text-transform:uppercase; color:#A9A8AF; }
  /* No backdrop blur. It was smearing the mark behind the table into nothing,
   which defeats the point of putting it there. The rows are translucent
   instead, and the mark is pale enough that the type still reads over it. */
  .rows { background:rgba(237,237,240,.58); border:1px solid #D9D8DE; border-radius:16px;
          overflow:hidden; }
  .row { display:grid; grid-template-columns:300px 132px 132px 108px 1fr 128px;
         gap:18px; align-items:center; padding:15px 22px; border-bottom:1px solid #E2E1E6; }
  .row:last-child { border-bottom:0; }

  .v { display:flex; align-items:center; gap:13px; min-width:0; }
  .ic { width:34px; height:34px; border-radius:9px; background:#E9E9E9; flex:none;
        display:grid; place-items:center; overflow:hidden; }
  .ic svg { width:19px; height:19px; }
  .nm b { display:block; font-size:15.5px; font-weight:600; color:#3D3B4F; letter-spacing:-.01em; }
  .nm span { display:block; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#82828D; margin-top:1px; }

  .pill { justify-self:start; display:inline-flex; align-items:center; gap:6px;
          font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em;
          text-transform:uppercase; padding:4px 11px; border-radius:999px;
          background:#F2EAA0; color:#5C4E08; }
  .pill i { width:5px; height:5px; border-radius:50%; background:#6E5D0D; }
  .pill.paused { background:#EDEDF0; color:#82828D; }
  .pill.paused i { background:#A9A8AF; }

  .num { font-family:'JetBrains Mono',monospace; font-size:15px; color:#3D3B4F; text-align:right; }
  .apr { font-size:16px; font-weight:600; color:#6E5D0D; text-align:right; letter-spacing:-.01em; }
  .apr.zero { color:#A9A8AF; font-weight:500; }

  .band { display:flex; align-items:center; gap:10px; }
  .band .lo, .band .hi { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#A9A8AF; flex:none; }
  .rail { position:relative; flex:1; height:4px; border-radius:999px; background:#DEDEDE; }
  .rail i { position:absolute; top:50%; transform:translate(-50%,-50%);
            width:9px; height:9px; border-radius:50%; background:#3D3B4F; border:2px solid #EEEEEE; }

  .btn { justify-self:end; font-size:13.5px; font-weight:600; color:#E9E9E9;
         background:#3D3B4F; border-radius:999px; padding:9px 22px; }
  .btn.off { background:transparent; color:#A9A8AF; border:1px solid #D6D6D6; }

  .foot { margin-top:auto; padding-top:22px; display:flex; align-items:center;
          justify-content:space-between; }
  .foot .l { font-size:19px; font-weight:600; color:#3D3B4F; letter-spacing:-.02em; }
  .foot .r { font-family:'JetBrains Mono',monospace; font-size:13px; color:#82828D; letter-spacing:.06em; }
</style></head>

      <div>
        <div class="lock">

        </div>
        <div class="eyebrow">20 vaults, one per stock</div>
      </div>
      <span class="tag">Preview · nothing deployed</span>
    </div>

      <span>Vault</span><span>State</span><span style="text-align:right">TVL</span>

    </div>

<script src="../logos.js"></script>
<script src="../vaults-data.js"></script>
<script>
  const usdM = n => '$' + (n/1e6).toFixed(2) + 'M';
  document.getElementById('rows').innerHTML = VAULTS.slice(0, 8).map(v => {
    const lo = v.price * (1 - v.band/100), hi = v.price * (1 + v.band/100);
    const at = 32 + (v.t.charCodeAt(0) % 5) * 9;          // where the price sits, deterministic
    const paused = v.state === 'paused';
    const mk = LOGOS[v.t];
    return `<div class="row">
      <div class="v">
        <span class="ic">${mk ? markSvg(mk) : ''}</span>
        <span class="nm"><b>${v.name}</b><span>${v.t} / USDG</span></span>
      </div>
      <span class="pill ${paused ? 'paused' : ''}"><i></i>${STATE_TEXT[v.state]}</span>
      <span class="num">${usdM(v.tvl)}</span>
      <span class="apr ${paused ? 'zero' : ''}">${paused ? '—' : v.apr.toFixed(1) + '%'}</span>
      <span class="band">
        <span class="lo">$${lo.toFixed(2)}</span>
        <span class="rail"><i style="left:${at}%"></i></span>
        <span class="hi">$${hi.toFixed(2)}</span>
      </span>
      <span class="btn ${paused ? 'off' : ''}">${paused ? 'Paused' : 'Deposit'}</span>
    </div>`;
  }).join('');
</script>
</body></html>
