<!doctype html>
<!-- Warp, built into a single file by build.mjs. Edit the source in warp-app/, not this. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warp Index Perpetuals</title>
<meta name="description" content="A paper market for index perpetuals: bundle three to five assets, metals among them, into a fixed-weight basket, list it, and take a long or short side with up to 5x. Simulated prices.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Warp — design system.

   The ground is white and it stays white. On white, the only colour with weight
   is the brand's: each asset's real logo and its brand colour are what tell one
   row from another, so the rest of the interface gets out of the way. That is
   why surfaces are white or nearly, structure is a hairline, and semantic
   colour is reserved for the direction of a move and the side of a position.

   Numbers are always tabular monospace, so a column can be read top to bottom
   without the digits shifting. */

*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #FFFFFF; }

/* The tokens live on :root, not on .wp, because some pieces mount straight
   onto body (the floating notices) and have to be able to read them. */
:root {
  /* ground: white, plus a barely perceptible grey to sink boxes into */
  --bg: #FFFFFF;
  --panel: #FFFFFF;
  --sunken: #F7F8FA;
  --sunken-2: #F1F3F6;
  /* ink */
  --ink: #0E1116;
  --ink-2: #303845;
  --muted: #5C6673;
  --dim: #98A1AE;
  /* structure */
  --line: #E6E9EE;
  --line-2: #D5DAE2;
  /* one functional accent: what can be pressed */
  --accent: #1F58F5;
  --accent-ink: #FFFFFF;
  --accent-soft: #EDF2FE;
  /* direction of a move and side of a position, never decoration */
  --up: #0E9F6E;
  --up-soft: #E6F6EF;
  --down: #D8342A;
  --down-soft: #FDECEB;
  --warn: #B4690E;
  --warn-soft: #FDF3E4;

  --r: 10px;
  --r-lg: 14px;
  --shadow: 0 1px 2px rgba(16,22,32,.04), 0 8px 24px -16px rgba(16,22,32,.16);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

.wp {
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
/* hidden has to beat any display a component sets for itself. */
[hidden] { display: none !important; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.dim { color: var(--dim); } .muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------- sidebar ---------------- */
.wp-side {
  border-right: 1px solid var(--line);
  padding: 16px 12px 14px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh;
  background: var(--bg);
}
.wp-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.wp-brand-mark { width: 28px; height: 28px; flex: none; }
.wp-brand-name { font-weight: 650; font-size: 15.5px; letter-spacing: -.02em; }
.wp-brand-sub { display: block; font-size: 11px; font-weight: 450; color: var(--dim); letter-spacing: 0; }

.wp-nav { display: flex; flex-direction: column; gap: 2px; }
.wp-nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  font-size: 13.5px; font-weight: 500; color: var(--muted);
  transition: background .14s, color .14s;
}
.wp-nav a:hover { background: var(--sunken); color: var(--ink); }
.wp-nav a.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.wp-nav svg { width: 16px; height: 16px; flex: none; }
.wp-nav-count {
  margin-left: auto; font-family: var(--mono); font-size: 11px;
  background: var(--sunken-2); color: var(--muted); border-radius: 20px; padding: 1px 7px;
}
.wp-nav a.is-active .wp-nav-count { background: #fff; color: var(--accent); }

.wp-side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.wp-equity {
  border: 1px solid var(--line); border-radius: var(--r); padding: 10px 11px;
  display: grid; gap: 2px;
}
.wp-equity dt { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.wp-equity dd { margin: 0; font-family: var(--mono); font-size: 15px; font-weight: 600; }
.wp-equity-row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.wp-side-links { display: flex; align-items: center; gap: 6px; }

/* The X mark. It has no link yet, and that is exactly why it is not a link: it
   is a button that says there is no destination, rather than an anchor that
   goes nowhere. */
.wp-x {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center; cursor: pointer;
  background: none; border: 1px solid var(--line); border-radius: 9px;
  color: var(--ink); transition: background .14s, border-color .14s;
}
.wp-x:hover { background: var(--sunken); border-color: var(--line-2); }
.wp-x svg { width: 15px; height: 15px; fill: currentColor; }
.wp-ghost-btn {
  flex: 1; text-align: left; cursor: pointer; color: var(--muted); font-size: 12px;
  background: none; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px;
  transition: color .14s, border-color .14s;
}
.wp-ghost-btn:hover { color: var(--ink); border-color: var(--line-2); }

/* ---------------- header ---------------- */
.wp-main { display: flex; flex-direction: column; min-width: 0; }
.wp-top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px;
  padding: 11px 24px;
  background: rgba(255,255,255,.86); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
/* min-width 0 so the search box yields width to the notice on its right rather
   than pushing the header off screen. */
.wp-search { position: relative; flex: 1 1 0; min-width: 0; max-width: 540px; }
.wp-search-box {
  display: flex; align-items: center; gap: 9px;
  background: var(--sunken); border: 1px solid transparent; border-radius: 9px; padding: 0 11px;
  transition: background .14s, border-color .14s;
}
.wp-search-box:focus-within { background: #fff; border-color: var(--accent); }
.wp-search-box svg { width: 15px; height: 15px; color: var(--dim); flex: none; }
.wp-search input {
  flex: 1; min-width: 0; border: 0; background: none; outline: none;
  font: inherit; font-size: 13.5px; color: var(--ink); padding: 9px 0;
}
.wp-search input::placeholder { color: var(--dim); }
.wp-search kbd {
  font-family: var(--mono); font-size: 10.5px; color: var(--dim);
  border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 5px; background: #fff;
}
.wp-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 50;
  background: #fff; border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 5px; max-height: 62vh; overflow: auto;
}
.wp-res {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 9px; border-radius: 8px; cursor: pointer;
  background: none; border: 0; text-align: left;
}
.wp-res:hover, .wp-res.is-on { background: var(--sunken); }
.wp-res-label { font-size: 13.5px; font-weight: 550; }
.wp-res-sub { font-size: 11.5px; color: var(--muted); }
.wp-res-sym { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
.wp-res-empty { padding: 14px 10px; font-size: 13px; color: var(--muted); }

.wp-top-right { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; }
/* The notice that prices are simulated sits in the header of every screen, not
   in the small print. */
.wp-sim {
  display: flex; align-items: center; gap: 7px;
  font-size: 11.5px; font-weight: 550; color: var(--warn);
  background: var(--warn-soft); border: 1px solid #F2DFC0;
  border-radius: 20px; padding: 5px 11px;
}
.wp-sim-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex: none; }
.wp-sim-short { display: none; }
.wp-clock { font-family: var(--mono); font-size: 12px; color: var(--dim); }

/* ---------------- view ---------------- */
.wp-view { padding: 22px 24px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; }
.wp-foot {
  padding: 14px 24px 22px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between;
  font-size: 11.5px; color: var(--dim);
}

.wp-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 18px; }
.wp-head > div { min-width: 0; }
.wp-head h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.025em; }
.wp-head p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); max-width: 64ch; }
.wp-head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.wp-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden;
}
.wp-card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--line);
}
.wp-card-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
.wp-card-head .wp-card-note { font-size: 11.5px; color: var(--dim); margin-left: auto; text-align: right; }
.wp-card-head .wp-ranges { margin-left: 10px; }
.wp-card-body { padding: 16px; }
.wp-card-body.tight { padding: 0; }

.wp-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.wp-grid > * { min-width: 0; }
/* min(Npx, 100%) rather than a bare Npx: on a screen narrower than the minimum
   column, auto-fit would honour it and overflow the page. */
.wp-grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); }
.wp-grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); }
.wp-grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); }
.wp-split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 336px; align-items: start; }

/* ---------------- figures ---------------- */
.wp-stat { border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px; background: var(--panel); }
.wp-stat dt { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 5px; }
.wp-stat dd { margin: 0; font-family: var(--mono); font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.wp-stat-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

.wp-kv { display: grid; gap: 9px; }
.wp-kv > div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 13px; }
.wp-kv dt { color: var(--muted); }
.wp-kv dd { margin: 0; font-family: var(--mono); font-weight: 550; text-align: right; }
.wp-kv-line { border-top: 1px dashed var(--line-2); padding-top: 9px; margin-top: 1px; }

/* ---------------- the asset's mark ---------------- */
.wp-mark {
  flex: none; display: grid; place-items: center; overflow: hidden;
  border-radius: 8px; background: #fff;
  box-shadow: inset 0 0 0 1px rgba(16,22,32,.09);
  font-weight: 650; letter-spacing: -.02em; line-height: 1;
}
/* The monogram and the logo share a cell: one covers the other with no reflow. */
.wp-mark > * { grid-area: 1 / 1; }
.wp-mark-img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.wp-mark-txt { display: block; }
.wp-mark.is-element { box-shadow: inset 0 0 0 1px rgba(16,22,32,.14); font-family: var(--font); }
.wp-mark.is-monogram { box-shadow: inset 0 0 0 1px rgba(16,22,32,.07); }
.wp-stack { display: inline-flex; align-items: center; }
.wp-stack .wp-mark { box-shadow: inset 0 0 0 1px rgba(16,22,32,.09), 0 0 0 2px #fff; }

.wp-ident { display: flex; align-items: center; gap: 10px; min-width: 0; }
.wp-ident-text { min-width: 0; }
.wp-ident-name { font-size: 13.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wp-ident-sub { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.wp-sym {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  border-radius: 5px; padding: 1px 5px; letter-spacing: 0;
}

/* ---------------- pills ---------------- */
.wp-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 550; border-radius: 20px; padding: 3px 9px;
  background: var(--sunken); color: var(--muted); white-space: nowrap;
}
.wp-pill.up { background: var(--up-soft); color: var(--up); }
.wp-pill.down { background: var(--down-soft); color: var(--down); }
.wp-pill.accent { background: var(--accent-soft); color: var(--accent); }
.wp-pill.warn { background: var(--warn-soft); color: var(--warn); }
.wp-pill.own { background: #F0EBFD; color: #6335D6; }

/* ---------------- buttons ---------------- */
.wp-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 14px; border-radius: 9px; cursor: pointer;
  font-size: 13px; font-weight: 600; border: 1px solid transparent;
  background: var(--accent); color: var(--accent-ink);
  transition: filter .14s, background .14s, border-color .14s, color .14s;
}
.wp-btn:hover:not(:disabled) { filter: brightness(1.08); }
.wp-btn:disabled { opacity: .45; cursor: not-allowed; }
.wp-btn.ghost { background: #fff; border-color: var(--line-2); color: var(--ink); }
.wp-btn.ghost:hover:not(:disabled) { background: var(--sunken); filter: none; }
.wp-btn.quiet { background: var(--sunken); color: var(--ink-2); }
.wp-btn.quiet:hover:not(:disabled) { background: var(--sunken-2); filter: none; }
.wp-btn.long { background: var(--up); }
.wp-btn.short { background: var(--down); }
.wp-btn.danger { background: #fff; border-color: #F0C9C6; color: var(--down); }
.wp-btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.wp-btn.block { width: 100%; }
.wp-btn svg { width: 15px; height: 15px; }

/* A segmented control with many options scrolls instead of pushing the page:
   max-width and overflow live in the component, not at each use site. */
.wp-seg {
  display: inline-flex; background: var(--sunken); border-radius: 9px; padding: 3px; gap: 3px;
  max-width: 100%; overflow-x: auto; scrollbar-width: none;
}
.wp-seg::-webkit-scrollbar { display: none; }
.wp-seg button { flex: none; }
.wp-seg button {
  border: 0; background: none; cursor: pointer; border-radius: 7px;
  padding: 6px 11px; font-size: 12.5px; font-weight: 550; color: var(--muted);
}
.wp-seg button.is-on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(16,22,32,.08); }
.wp-seg.side button.is-on[data-side="long"] { color: var(--up); }
.wp-seg.side button.is-on[data-side="short"] { color: var(--down); }

/* ---------------- tables ---------------- */
.wp-scroll { overflow-x: auto; }
.wp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.wp-table th {
  text-align: right; font-size: 11px; font-weight: 600; color: var(--dim);
  text-transform: uppercase; letter-spacing: .06em;
  padding: 9px 11px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.wp-table th:first-child, .wp-table td:first-child { text-align: left; padding-left: 16px; }
.wp-table th:last-child, .wp-table td:last-child { padding-right: 16px; }
/* A figure never breaks across two lines: if it does not fit, the table scrolls
   (each one sits inside its own .wp-scroll). */
.wp-table td { text-align: right; padding: 11px 11px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.wp-table td.wide { white-space: normal; }
.wp-table tbody tr:last-child td { border-bottom: 0; }
.wp-table tbody tr.clickable { cursor: pointer; }
.wp-table tbody tr.clickable:hover { background: var(--sunken); }
.wp-table td.clickable { cursor: pointer; }
.wp-table td.wide { min-width: 220px; }
.wp-spark { width: 68px; height: 28px; display: block; margin-left: auto; }

.wp-empty { padding: 34px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }
.wp-empty strong { display: block; color: var(--ink); font-size: 15px; font-weight: 600; margin-bottom: 5px; }
.wp-empty .wp-btn { margin-top: 14px; }

/* ---------------- charts ---------------- */
.wp-chart { position: relative; height: 300px; }
.wp-chart canvas { width: 100%; height: 100%; display: block; touch-action: none; }
.wp-chart.sm { height: 180px; }
.wp-tip {
  position: absolute; pointer-events: none; z-index: 5;
  background: var(--ink); color: #fff; border-radius: 7px; padding: 6px 9px;
  font-size: 11.5px; display: grid; gap: 1px; white-space: nowrap;
  box-shadow: 0 6px 18px -8px rgba(16,22,32,.5);
}
.wp-tip b { font-family: var(--mono); font-size: 12.5px; }
.wp-tip span { color: #B9C0CC; }
.wp-ranges { display: flex; gap: 3px; margin-left: auto; }

/* weight bar: the basket in one line */
.wp-weights { display: flex; height: 8px; border-radius: 20px; overflow: hidden; background: var(--sunken-2); }
.wp-weights span { display: block; height: 100%; }
.wp-legend { display: grid; gap: 8px; }
.wp-legend-row { display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
.wp-legend-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.wp-legend-w { margin-left: auto; font-family: var(--mono); font-weight: 600; }
.wp-donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.wp-donut-wrap canvas { flex: none; }
.wp-donut-wrap .wp-legend { flex: 1; min-width: 180px; }

/* ---------------- forms ---------------- */
.wp-field { display: grid; gap: 6px; }
.wp-field > label { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.wp-input {
  width: 100%; font: inherit; font-size: 13.5px; color: var(--ink);
  background: #fff; border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 11px;
  transition: border-color .14s, box-shadow .14s;
}
.wp-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.wp-input.num { font-family: var(--mono); }
.wp-input-unit { position: relative; }
.wp-input-unit .wp-unit {
  position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: 11.5px; color: var(--dim); pointer-events: none;
}
.wp-input-unit .wp-input { padding-right: 58px; }
.wp-hint { font-size: 11.5px; color: var(--dim); }
.wp-error { font-size: 12.5px; color: var(--down); }
.wp-errors { display: grid; gap: 4px; margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--down); }

.wp-range { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: none; cursor: pointer; }
.wp-range::-webkit-slider-runnable-track { height: 5px; border-radius: 20px; background: var(--sunken-2); }
.wp-range::-moz-range-track { height: 5px; border-radius: 20px; background: var(--sunken-2); }
.wp-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -5.5px;
  border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(16,22,32,.2);
}
.wp-range::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(16,22,32,.2);
}
.wp-range-marks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--dim); }

/* the basket builder */
.wp-leg {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r); background: #fff;
}
.wp-leg-w { width: 88px; flex: none; }
.wp-leg-x {
  flex: none; width: 28px; height: 28px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--line); background: #fff; color: var(--muted); display: grid; place-items: center;
}
.wp-leg-x:hover { border-color: #F0C9C6; color: var(--down); }
.wp-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.wp-chip {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 20px; padding: 4px 11px 4px 5px;
  background: #fff; font-size: 12.5px; font-weight: 550; color: var(--ink-2);
  transition: border-color .14s, background .14s;
}
.wp-chip:hover:not(:disabled) { border-color: var(--line-2); background: var(--sunken); }
.wp-chip:disabled { opacity: .4; cursor: not-allowed; }
.wp-chip.is-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.wp-tabs { display: flex; flex-wrap: wrap; gap: 6px; max-width: 100%; overflow-x: auto; }

/* Formatting. One sentinel for "no data", so that in no screen can it be
   confused with a zero. */

const NA = Symbol('no data');
const isNA = (v) => v === NA || v === null || v === undefined
  || (typeof v === 'number' && !Number.isFinite(v));
const NA_TEXT = 'No data';

const nf = (min, max) => new Intl.NumberFormat('en-US', { minimumFractionDigits: min, maximumFractionDigits: max });

function num(v, d = 2) {
  if (isNA(v)) return NA_TEXT;
  return nf(d, d).format(v);
}
/** Decimals by magnitude: an index at 104.32 and a coin at 0.0842 need
 *  different precision to say the same thing. */
function auto(v) {
  if (isNA(v)) return NA_TEXT;
  const a = Math.abs(v);
  // An exact zero is written short: "0.000000" reads as precision that isn't
  // there, not as a zero.
  const d = a === 0 ? 2 : a >= 1 ? 2 : a >= 0.01 ? 4 : 6;
  return nf(d, d).format(v);
}
function usdg(v, { sign = false } = {}) {
  if (isNA(v)) return NA_TEXT;
  const s = auto(Math.abs(v));
  const mark = v < 0 ? '-' : sign && v > 0 ? '+' : '';
  return `${mark}${s} USDG`;
}

  if (isNA(v)) return NA_TEXT;
  const a = Math.abs(v);

  if (a >= 1e9) return unit(1e9, 'B');
  if (a >= 1e6) return unit(1e6, 'M');
  if (a >= 1e3) return unit(1e3, 'K');
  return nf(0, 0).format(v);
}
function pct(v, { sign = true, d = 2 } = {}) {
  if (isNA(v)) return NA_TEXT;
  return `${sign && v > 0 ? '+' : ''}${nf(d, d).format(v)}%`;
}
function lev(v) { return isNA(v) ? NA_TEXT : `${nf(0, 2).format(v)}x`; }

function ago(ts) {
  if (!ts) return NA_TEXT;
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return 'just now';
  const m = Math.round(s / 60);
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} h ago`;
  const d = Math.round(h / 24);

/* Runtime configuration, and the market's parameters in one place so the
   interface and the engine cannot disagree about the rules. */

const VENUE = {
  name: 'Warp',
  tagline: 'Index perpetuals',
  settle: 'USDG',
  /** A basket is fixed-weight and holds three to five legs: fewer is not an
   *  index, and more dilutes each weight until the basket says nothing. */
  minLegs: 3,
  maxLegs: 5,
  maxLeverage: 5,
  /** Fee on opening and on closing, charged on notional. */
  takerFee: 0.0005,
  /** Of the total fees a position pays, this share goes to the index's
   *  creator. The protocol keeps the rest. */
  creatorShare: 0.30,
  /** Maintenance margin: below this a position is liquidated. */
  maintenanceMargin: 0.005,
  /** Reference funding per 8 h, scaled by the imbalance between longs and
   *  shorts. */
  fundingBase: 0.0001,
  fundingCap: 0.00075,
  /** Paper balance a new account starts with. */
  openingBalance: 10000,
  minMargin: 10,
  /** An index starts at base 100 the day it lists, so its chart measures
   *  exactly what the basket has done since then. */
  indexBase: 100,
};

/* Official logos are resolved from each entity's own domain at runtime. No copy
   is kept in the repository, so a logo cannot go stale or diverge between
   screens. */
const KEY = 'warp.config';
const DEFAULTS = {
  logoTemplate: 'https://img.logo.dev/{domain}?token={logoToken}&size=128&format=png&retries=0',
  logoToken: '',
  /* Fallback resolvers, in order. None needs a key, so the app shows real logos
     with nothing configured; the paid one only improves coverage and resolution
     when a token is present. */
  logoFallbacks: [
    'https://icons.duckduckgo.com/ip3/{domain}.ico',
    'https://www.google.com/s2/favicons?domain={domain}&sz=128',
  ],
  /** Seed for the price simulator. Fixing it makes the market reproducible
   *  across reloads and across tabs. */
  seed: 20260910,
};

/* Read from the host if there is one and from the browser if there is one: the
   modules do not assume a browser exists, so the logic can run and be tested
   outside of one. */
const host = () => (typeof window === 'undefined' ? null : window.WARP_CONFIG);

Object.assign(exports, { VENUE, config, saveConfig });

__def("js/logos.js", function (exports, __req) {
/* The mark system.
   Rule: always the entity's real mark, never one drawn, generated or
   approximated.

   A company, an ETF or a coin has a logo of its own: it is resolved at runtime
   from the official domain the registry declares, with fallback resolvers
   behind it. Nothing is copied into the repository.

   A metal has no logo because it is not a company. Its mark is its official
   chemical symbol, written in the real colour of the metal. That is not a
   drawing: it is the notation the industry itself uses.

   If no resolver answers, what is left is the entity's monogram in its brand
   colour. Never another entity's logo, never an emoji.

   Every screen builds a mark by calling markEl(), and only that function. That
   is why an asset cannot show one mark in the search box and another in a
   basket. */

const { config } = __req("js/config.js");

const failed = new Set();

function fill(template, domain) {
  return template
    .replace('{domain}', encodeURIComponent(domain))
    .replace('{logoToken}', encodeURIComponent(config.logoToken || ''));
}

function logoSources(domain) {
  if (!domain) return [];
  const out = [];
  if (config.logoTemplate && (config.logoToken || !config.logoTemplate.includes('{logoToken}'))) {
    out.push(fill(config.logoTemplate, domain));
  }
  for (const tpl of config.logoFallbacks || []) out.push(fill(tpl, domain));
  return out.filter(u => !failed.has(u));
}

function rgba(hex, a) {
  const m = String(hex || '#888').replace('#', '');
  const n = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
  const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
  if ([r, g, b].some(Number.isNaN)) return `rgba(136,136,136,${a})`;
  return `rgba(${r},${g},${b},${a})`;
}

/** Relative luminance, to pick legible ink over a brand colour instead of
 *  assuming white always works. */
function luminance(hex) {
  const m = String(hex || '#888').replace('#', '');
  const n = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
  const ch = [0, 2, 4].map(i => {
    const v = (parseInt(n.slice(i, i + 2), 16) || 0) / 255;
    return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
  });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
const inkOn = (hex) => (luminance(hex) > 0.55 ? '#111418' : '#FFFFFF');

function monogram(asset) {
  const words = String(asset?.short || asset?.name || '?').replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/);
  return ((words[0]?.[0] || '') + (words[1]?.[0] || '')).toUpperCase() || '?';
}

/** The asset's mark. Returns an element ready to insert.

    The monogram paints on the first frame and the logo loads over it: the slot
    is never blank while the network answers, and if it never answers what is
    left is already in place. */
function markEl(asset, size = 36) {
  const el = document.createElement('span');
  el.className = 'wp-mark';
  el.style.width = el.style.height = size + 'px';
  el.style.setProperty('--brand', asset?.color || '#8A94A6');
  el.title = asset?.name || '';

  // A metal carries its chemical symbol in its own colour, which is its real notation.
  if (asset?.class === 'metal') {
    el.classList.add('is-element');
    el.style.background = asset.color;
    el.style.color = inkOn(asset.color);
    el.style.fontSize = Math.round(size * 0.42) + 'px';
    el.append(Object.assign(document.createElement('span'), {
      className: 'wp-mark-txt', textContent: asset.element || asset.symbol,
    }));
    return el;
  }

  el.classList.add('is-monogram');
  el.style.background = rgba(asset?.color, 0.12);
  el.style.color = asset?.color || '#5A6473';
  el.style.fontSize = Math.round(size * 0.36) + 'px';
  const label = Object.assign(document.createElement('span'), {
    className: 'wp-mark-txt', textContent: monogram(asset),
  });
  el.append(label);

  const sources = logoSources(asset?.domain);
  if (!sources.length) return el;

  const img = document.createElement('img');
  img.className = 'wp-mark-img';
  img.alt = `${asset?.name || ''} logo`;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.hidden = true;
  let i = 0;
  const tryNext = () => {
    if (i >= sources.length) { img.remove(); return; }   // the monogram stays
    img.src = sources[i++];
  };
  img.addEventListener('load', () => {
    // A one-pixel icon is not a logo: it is discarded as though it had failed.
    if (img.naturalWidth < 8) { failed.add(img.src); return tryNext(); }
    img.hidden = false;
    el.classList.remove('is-monogram');
    el.style.background = '#fff';
    label.hidden = true;
  });
  img.addEventListener('error', () => { failed.add(img.src); tryNext(); });
  el.append(img);
  tryNext();
  return el;
}

/** Overlapping stack of marks: how a basket reads at a glance. */
function markStack(assets, size = 28) {
  const el = document.createElement('span');
  el.className = 'wp-stack';
  (assets || []).forEach((a, i) => {
    const m = markEl(a, size);
    m.style.zIndex = String(20 - i);
    m.style.marginLeft = i ? `-${Math.round(size * 0.24)}px` : '0';
    el.appendChild(m);
  });
  return el;
}

Object.assign(exports, { logoSources, rgba, luminance, inkOn, markEl, markStack });
});

__def("js/market.js", function (exports, __req) {
/* The price feed.

   NOTICE, AND IT GOVERNS THE WHOLE PROJECT: there is no real market data here.
   Warp is a paper market and this simulator produces its prices. The reference
   levels below are orders of magnitude picked so the interface reads, not
   quotes. No number in this application describes the real market, and the
   interface says so in the header and the footer of every screen instead of
   leaving it in the small print.

   How it works: an asset's price at an instant is a sum of waves of different
   scales, with phase and amplitude seeded from the symbol. That gives three
   properties a random walk does not:
   - it is reproducible: the same seed gives the same market on every reload and
     in every tab, so a position opened yesterday still makes sense today;
   - it is continuous: there are no jumps between reloads;
   - it can be evaluated at any instant in constant time, so a chart's history
     does not have to be stored: it is computed.

   To plug in a real provider later, there is `setFeed()` at the end: the
   application only knows that interface, not this simulator. */

const { config } = __req("js/config.js");
const { getAsset } = __req("js/registry.js");

/* The simulator's reference levels. These are not quotes. */
const REF = {
  NVDA:180, AAPL:240, MSFT:500, GOOGL:240, AMZN:230, META:720, TSLA:400, AMD:165,
  INTC:35, AVGO:350, TSM:260, ASML:900, ORCL:240, CRM:260, ADBE:380, PLTR:160,
  NFLX:1200, SPOT:680, UBER:90, ABNB:130, SHOP:150, DIS:115, KO:70, PEP:145,
  MCD:300, SBUX:95, NKE:75, WMT:100, LLY:800, JNJ:175, BA:210, CAT:400, V:340,
  MA:570, JPM:290, GS:700, COIN:320, HOOD:110, MSTR:320, XOM:115,
  SAN:8, BBVA:15, ITX:48, IBE:15, MC:620, SAP:250, NOVO:60, FER:450,
  XAU:3400, XAG:40, XPT:1400, XPD:1200, XCU:9800, XAL:2600, XNI:15500,
  XZN:2900, XSN:33000, XPB:2000, XLI:11000, XCO:33000,
  BTC:95000, ETH:3300, SOL:180, XRP:2.4, DOGE:0.18, AVAX:28, LINK:20, ADA:0.7,
  SPY:640, QQQ:570, VOO:590, GLD:310, SLV:36,
  USDG:1,
};

/* How much each class moves, relative to a stock. */
const VOL = { stock:1, etf:0.55, metal:0.85, crypto:2.2, settle:0 };

const MIN = 60e3, HOUR = 3600e3, DAY = 24 * HOUR;
/* Wave scales, from the background trend to the flicker of a tick. */
const WAVES = [
  { period: 34 * DAY, amp: 0.150 },
  { period: 9 * DAY,  amp: 0.095 },
  { period: 2.4 * DAY, amp: 0.062 },
  { period: 7 * HOUR, amp: 0.032 },
  { period: 43 * MIN, amp: 0.013 },
  { period: 11 * MIN, amp: 0.0055 },
  { period: 2.2 * MIN, amp: 0.0022 },
];

function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const shapes = new Map();
function shape(id) {
  if (shapes.has(id)) return shapes.get(id);
  const asset = getAsset(id);
  const rnd = mulberry32(hash32(id + '|' + config.seed));
  const vol = VOL[asset?.class] ?? 1;
  const s = {
    base: REF[id] ?? 100,
    vol,
    // Each wave gets its own phase and its amplitude is roughed up a little, so
    // two assets of the same class do not move in lockstep.
    waves: WAVES.map(w => ({
      w: (2 * Math.PI) / w.period,
      phase: rnd() * Math.PI * 2,
      amp: w.amp * vol * (0.7 + rnd() * 0.6),
    })),
    // The asset's reference volume, also simulated.
    volBase: (0.4 + rnd() * 3.2) * 1e6,
  };
  shapes.set(id, s);
  return s;
}

/** The asset's price at an instant. Constant time and stateless. */
function spot(id, t = Date.now()) {
  const s = shape(id);
  if (!s.vol) return s.base;                     // USDG does not move
  let e = 0;
  for (const w of s.waves) e += w.amp * Math.sin(w.w * t + w.phase);
  return s.base * Math.exp(e);
}

/** The asset's percentage change over the last `hours` hours. */
function changePct(id, hours = 24, t = Date.now()) {
  const then = spot(id, t - hours * HOUR);
  if (!then) return 0;
  return ((spot(id, t) / then) - 1) * 100;
}

/** Time series for a chart. Not stored: evaluated. */
function series(id, from, to, points = 180) {
  const step = (to - from) / Math.max(points - 1, 1);
  const out = [];
  for (let i = 0; i < points; i++) {
    const t = from + i * step;
    out.push({ t, c: spot(id, t) });
  }
  return out;
}

/** The asset's simulated 24 h volume, in settlement units. */
function volume24h(id, t = Date.now()) {
  const s = shape(id);
  if (!s.vol) return 0;
  const heat = 1 + Math.abs(changePct(id, 24, t)) / 12;
  const wobble = 0.75 + 0.5 * (0.5 + 0.5 * Math.sin(shape(id).waves[3].w * t + 1.7));
  return s.base * s.volBase * heat * wobble / 1000;
}

/* -------- the basket --------
   A fixed-weight index is worth, at base 100 from the day it listed:
       V(t) = 100 * sum_i  w_i * P_i(t) / P_i(t0)
   The P_i(t0) are the references frozen when the index lists, and they live in
   the index itself. So its chart measures exactly what the basket has done
   since it existed, and listing a new one does not rewrite anyone's history. */

function basketValue(legs, refs, t = Date.now(), base = 100) {
  let v = 0;
  for (const leg of legs) {
    const ref = refs?.[leg.id];
    if (!ref) return null;                       // no reference, no index
    v += (leg.weight / 100) * (spot(leg.id, t) / ref);
  }
  return base * v;
}

function basketSeries(legs, refs, from, to, points = 180, base = 100) {
  const step = (to - from) / Math.max(points - 1, 1);
  const out = [];
  for (let i = 0; i < points; i++) {
    const t = from + i * step;
    const c = basketValue(legs, refs, t, base);
    if (c !== null) out.push({ t, c });
  }
  return out;
}

function basketChangePct(legs, refs, hours = 24, t = Date.now()) {
  const now = basketValue(legs, refs, t);
  const then = basketValue(legs, refs, t - hours * HOUR);
  if (now === null || then === null || !then) return null;
  return ((now / then) - 1) * 100;
}

/** Snapshot of a basket's references at the moment it lists. */
function snapshotRefs(legs, t = Date.now()) {
  const refs = {};
  for (const leg of legs) refs[leg.id] = spot(leg.id, t);
  return refs;
}

/* -------- extension point --------
   The application never calls the simulator directly: it calls these functions.
   A real provider is plugged in by replacing them, and nothing else in the
   application changes. While the feed is the simulator, `isSimulated` is true
   and the interface announces it. */
const feed = { spot, changePct, series, volume24h, isSimulated: true, label: 'Warp simulator' };
function setFeed(next) { Object.assign(feed, next); }

Object.assign(exports, { spot, changePct, series, volume24h, basketValue, basketSeries, basketChangePct, snapshotRefs, feed, setFeed });
});

   This part is real data, within the limits of the application: what is here
   happened because the user did it. The price is simulated, but an open
   position, a fee charged or an index listed are facts, and that is why they
   persist and can be audited.

   One object, one storage key and one change event, so no screen can paint a
   balance that no longer exists. */

const DAY = 86400e3;

/* Indices already listed when you arrive, so the market does not start empty.

/* The market's engine: list an index, open and close positions, charge fees,
   accrue funding and liquidate whatever runs out of margin.

   The rules live in VENUE (config.js), not scattered across the interface, so
   that what a trading panel says and what the engine does are the same rule.
   Every function returns { ok, error } instead of throwing: a form needs to
   explain why it cannot continue, not break. */

  if (!String(name || '').trim()) errors.push('The index needs a name.');

  const rows = (legs || []).filter(l => l && l.id);
  if (rows.length < VENUE.minLegs) errors.push(`An index holds at least ${VENUE.minLegs} assets.`);
  if (rows.length > VENUE.maxLegs) errors.push(`An index holds at most ${VENUE.maxLegs} assets.`);
  if (new Set(rows.map(l => l.id)).size !== rows.length) errors.push('An asset appears twice in the basket.');

  if (rows.some(l => !(l.weight > 0))) errors.push('Every weight has to be greater than zero.');

    creator: 'me',
    listedAt,
    feesAccrued: 0,
    feesClaimed: 0,

const indexChange = (ix, hours = 24, t) => (ix ? basketChangePct(ix.legs, ix.refs, hours, t) : null);
const indexLegs = (ix) => (ix?.legs || []).map(l => ({ ...l, asset: getAsset(l.id) }));

 *  the real liquidation come from here, so they cannot disagree. */
function liquidationPrice(entry, side, leverage) {

  return side === 'long' ? entry * (1 - room) : entry * (1 + room);

function openPosition({ indexId, side, margin, leverage }) {
  const t = Date.now();

  if (!q.ok) return { ok: false, error: q.error, errors: q.errors };
  const ix = getIndex(indexId);

  state.wallet.balance = round(state.wallet.balance - q.margin - q.fee, 8);
  ix.feesAccrued = round(ix.feesAccrued + q.creatorFee, 8);

  const pos = {
    id: nextId('po'),

    margin: round(q.margin, 8),
    leverage: q.leverage,
    notional: round(q.notional, 8),
    entry: q.entry,
    openedAt: t,
    feesPaid: round(q.fee, 8),
    funding: 0,
    fundingAt: t,
  };

function markPosition(pos, t = Date.now()) {
  const ix = getIndex(pos.indexId);
  const mark = indexValue(ix, t);

 *  position's last settlement so the same stretch is never charged twice. */
function accruedFunding(pos, t) {
  const hours = Math.max(0, (t - (pos.fundingAt || pos.openedAt)) / HOUR);

  // closing fee.

}

  if (ix.creator !== 'me') return { ok: false, error: "Only an index's creator claims its fees." };
  const due = pendingFees(ix);

  state.wallet.balance = round(state.wallet.balance + due, 8);

}

/* -------- the account -------- */

/* The search box. It tolerates typos, accents and the trade name, because
   someone searching "nickel" or "aluminium" should not have to remember that
   the symbol is XNI or XAL. It never invents a match: if nothing looks close,
   it says so. */

const { state } = __req("js/store.js");

const fold = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

/** Bounded edit distance: all that matters is whether it differs by a letter
 *  or two, not how far apart any two strings are. */
function close(a, b, max = 1) {
  if (a === b) return 0;
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    for (let j = 1; j <= b.length; j++) {
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = row;
  }
  return prev[b.length];
}

function scoreAsset(asset, q) {
  const sym = fold(asset.symbol), name = fold(asset.name), short = fold(asset.short);
  const el = fold(asset.element || '');
  if (sym === q || el === q) return 100;
  if (short === q || name === q) return 96;
  if (sym.startsWith(q)) return 88;
  if (short.startsWith(q) || name.startsWith(q)) return 80;
  for (const a of asset.aliases || []) {
    const fa = fold(a);
    if (fa === q) return 90;
    if (fa.startsWith(q)) return 74;
    if (fa.includes(q)) return 58;
  }
  if (short.includes(q) || name.includes(q)) return 52;
  if (fold(asset.sector).includes(q)) return 34;
  if (q.length >= 4 && (close(sym, q) <= 1 || close(short.slice(0, q.length), q) <= 1)) return 30;
  return 0;
}

function scoreIndex(ix, q) {
  const sym = fold(ix.symbol), name = fold(ix.name);
  if (sym === q) return 100;
  if (sym.startsWith(q) || name.startsWith(q)) return 84;
  if (sym.includes(q) || name.includes(q) || fold(ix.note).includes(q)) return 50;
  if (ix.legs.some(l => fold(l.id) === q)) return 44;
  return 0;
}

/** Searches listed indices and the asset universe, in that order of interest:
 *  in a market of indices, what you trade is the index. */
function search(query, limit = 9) {
  const q = fold(query).trim();
  if (q.length < 1) return [];
  const out = [];
  for (const ix of state.indices) {
    const s = scoreIndex(ix, q);
    if (s) out.push({ kind: 'index', score: s + 6, index: ix, label: ix.name, sub: `Index · ${ix.legs.length} assets` });
  }
  for (const a of tradableAssets()) {
    const s = scoreAsset(a, q);
    if (s) out.push({ kind: 'asset', score: s, asset: a, label: a.name, sub: `${CLASSES[a.class]?.label || ''} · ${a.sector}` });
  }
  return out.sort((x, y) => y.score - x.score || x.label.localeCompare(y.label, 'en')).slice(0, limit);
}

        ? "A metal has no logo because it is not a company: its mark is its official chemical symbol in the real colour of the metal, and the last column says where it is priced."
        : "Each asset's mark is its official logo, resolved at runtime from its own domain.",
      tight: true,
      body: table(
        ['Asset', 'Symbol', 'Sim. price', '24 h', '7 d', 'Shape', isMetal ? 'Market and unit' : 'Market'],
        list.map(a => el('tr', { class: 'clickable', on: { click: () => go(`#/a/${a.id}`) } }, [
          el('td', { class: 'wide' }, [assetIdent(a, { size: 34, sub: a.sector })]),
          el('td', {}, [symPill(a)]),
          el('td', { class: 'num', text: auto(spot(a.id, t)) }),
          el('td', {}, [changePill(changePct(a.id, 24, t))]),
          el('td', {}, [changePill(changePct(a.id, 24 * 7, t))]),
          el('td', {}, [spark(series(a.id, t - 30 * DAY, t, 40), a.color)]),
          el('td', { class: 'dim', text: isMetal ? `${a.venue} · ${a.unit}` : a.venue }),
        ]))
      ),
    }));
  }

  wrap.append(
    head('Assets', 'The universe a basket is built from. Every asset carries its symbol and its real mark, and that same pair is used on every screen.', null),
    tabBar, body,
  );
  render();
  return wrap;
}

/* ---- positions table, shared by the dashboard, the portfolio and the index ---- */

function positionsTable(t = Date.now(), { indexId = null, compact: small = false } = {}) {
  const rows = openPositions(indexId);
  if (!rows.length) return null;
  const cols = small
    ? ['Index', 'Side', 'Result', '']
    : ['Index', 'Side', 'Margin', 'Notional', 'Entry', 'Mark', 'Liquidation', 'Funding', 'Result', ''];

  return table(cols, rows.map(p => {
    const m = markPosition(p, t);
    const ix = getIndex(p.indexId);
    const legs = indexLegs(ix);
    const side = el('span', { class: `wp-pill ${p.side === 'long' ? 'up' : 'down'}`, text: `${p.side === 'long' ? 'Long' : 'Short'} ${lev(p.leverage)}` });
    const result = el('td', {}, [
      el('div', { class: `num ${dir(m.pnl - m.funding)}`, text: usdg(m.pnl - m.funding, { sign: true }) }),
      el('div', { class: `wp-ident-sub num ${dir(m.roe)}`, text: pct(m.roe) }),
    ]);
    const close = el('td', {}, [
      el('button', {
        class: 'wp-btn sm ghost', type: 'button', text: 'Close',
        on: { click: (ev) => { ev.stopPropagation(); const r = closePosition(p.id); toast(r.ok ? `Position closed: ${usdg(r.closed.pnl, { sign: true })}` : r.error, r.ok ? (r.closed.pnl >= 0 ? 'good' : '') : 'bad'); } },
      }),
    ]);
    const cells = small
      ? [el('td', { class: 'wide' }, [indexIdent(ix, legs)]), el('td', {}, [side]), result, close]
      : [
          el('td', { class: 'wide' }, [indexIdent(ix, legs)]),
          el('td', {}, [side]),
          el('td', { class: 'num', text: usdg(p.margin) }),
          el('td', { class: 'num', text: usdg(p.notional) }),
          el('td', { class: 'num', text: auto(p.entry) }),
          el('td', { class: 'num', text: m.mark === null ? NA_TEXT : auto(m.mark) }),
          el('td', { class: 'num dim', text: auto(m.liq) }),
          el('td', { class: `num ${m.funding > 0 ? 'down' : m.funding < 0 ? 'up' : 'dim'}`, text: usdg(-m.funding, { sign: true }) }),
          result, close,
        ];
    return el('tr', { class: 'clickable', on: { click: () => go(`#/i/${p.indexId}`) } }, cells);
  }));
}

/* ============================ index page ============================ */

function indexView(id) {
  const ix = getIndex(id);
  if (!ix) return notFound('That index is not listed.');
  const t = Date.now();
  const legs = indexLegs(ix);
  const color = indexColor(legs);
  const value = indexValue(ix, t);
  const oi = openInterest(ix.id);
  const funding = fundingRate(ix.id);
  const ch24 = indexChange(ix, 24, t);

  const chart = chartBlock({
    load: (hours) => indexSeries(ix, hours),
    color, baseline: VENUE.indexBase, initial: '1M',
  });

  const legRows = legs.map(l => {
    const p = spot(l.asset.id, t);
    const ref = ix.refs[l.asset.id];
    const sinceList = ref ? (p / ref - 1) * 100 : null;
    // What the leg contributes to the basket's move since it listed.
    const contrib = sinceList === null ? null : sinceList * (l.weight / 100);
    return el('tr', { class: 'clickable', on: { click: () => go(`#/a/${l.asset.id}`) } }, [

  const left = el('div', { class: 'wp-grid' }, [
    card({
      title: 'Index value',
      note: `Base ${VENUE.indexBase} the day it listed, ${ago(ix.listedAt)}`,
      actions: chart.ranges, body: chart.wrap,
    }),
    card({
      title: 'Composition',
      note: "Fixed weight: it never rebalances, so today's basket is the one that listed",
      body: el('div', { class: 'wp-grid' }, [
        donut(legs, 128),
        note('The <strong>contribution</strong> column is how much of the index\'s change since it listed comes from each leg: its move times its weight.'),

      title: 'Leg detail', tight: true,
      body: table(['Asset', 'Weight', 'Sim. price', 'At listing', '24 h', 'Contribution'], legRows),

    card({

  const right = el('div', { class: 'wp-grid' }, [
    tradePanel(ix, value),
    card({
      title: 'Market state',
      body: frag([
        kv([
          { k: 'Value', v: value === null ? NA_TEXT : auto(value) },
          { k: '24 h change', v: pct(ch24), cls: dir(ch24) },
          { k: '7 d change', v: pct(indexChange(ix, 24 * 7, t)), cls: dir(indexChange(ix, 24 * 7, t)) },
          { k: 'Sim. 24 h depth', v: compact(simulatedDepth(ix, t)), line: true },
          { k: 'Open interest', v: oi.total ? usdg(oi.total) : '—' },
          { k: 'Longs', v: oi.long ? usdg(oi.long) : '—', cls: 'up' },
          { k: 'Shorts', v: oi.short ? usdg(oi.short) : '—', cls: 'down' },
          { k: 'Funding 8 h', v: pct(funding * 100, { d: 4 }), cls: funding > 0 ? 'down' : funding < 0 ? 'up' : 'flat' },
        ]),
        el('div', { style: { marginTop: '12px' } }, [
          el('div', { class: 'wp-weights', title: 'Split of open interest between longs and shorts' }, [
            el('span', { style: { width: `${oi.total ? (oi.long / oi.total) * 100 : 50}%`, background: 'var(--up)' } }),
            el('span', { style: { width: `${oi.total ? (oi.short / oi.total) * 100 : 50}%`, background: 'var(--down)' } }),

          el('div', { class: 'wp-hint', style: { marginTop: '6px' },
            text: funding > 0 ? 'More longs than shorts: the longs pay.'

                : 'No imbalance: funding sits at its base rate.' }),
        ]),

      body: frag([
        kv([
          { k: 'Symbol', v: ix.symbol },
          { k: 'Creator', v: ix.creator === 'me' ? 'You' : 'Warp demo account' },
          { k: 'Listed', v: dateTime(ix.listedAt) },

/* What the user has typed into the trading panel, per index. It lives outside
   the screen so the periodic price refresh does not wipe their side or a margin
   they are half way through typing. */
const tickets = new Map();
function ticket(indexId) {
  if (!tickets.has(indexId)) {
    tickets.set(indexId, {
      side: 'long',
      margin: Math.min(100, Math.max(VENUE.minMargin, Math.floor(state.wallet.balance * 0.1))),
      leverage: 2,
    });
  }
  return tickets.get(indexId);
}

/** The trading panel. Every figure it shows comes from quoteOrder(), the same
 *  function that validates the order on the way in: it cannot promise one
 *  liquidation and then apply another. */
function tradePanel(ix, value) {
  const tk = ticket(ix.id);

  const sideSeg = el('div', { class: 'wp-seg side', style: { display: 'flex' } }, ['long', 'short'].map(s =>
    el('button', {
      type: 'button', data: { side: s }, style: { flex: '1' },
      text: s === 'long' ? 'Long' : 'Short',
      class: s === tk.side ? 'is-on' : '',
      on: { click: () => { tk.side = s; [...sideSeg.children].forEach(b => b.classList.toggle('is-on', b.dataset.side === s)); refresh(); } },
    })));

  const marginInput = el('input', {
    class: 'wp-input num', type: 'number', min: VENUE.minMargin, step: '1', value: String(tk.margin),
    on: { input: () => { tk.margin = Number(marginInput.value); refresh(); } },
  });
  const levInput = el('input', {
    class: 'wp-range', type: 'range', min: '1', max: String(VENUE.maxLeverage), step: '0.5', value: String(tk.leverage),
    on: { input: () => { tk.leverage = Number(levInput.value); refresh(); } },
  });
  const levLabel = el('span', { class: 'num', text: lev(tk.leverage) });

  const quick = el('div', { style: { display: 'flex', gap: '6px' } }, [0.25, 0.5, 1].map(f =>
    el('button', {
      class: 'wp-btn sm quiet', type: 'button', style: { flex: '1' },
      text: f === 1 ? 'Max' : `${f * 100}%`,
      on: { click: () => { tk.margin = Math.max(VENUE.minMargin, Math.floor(state.wallet.balance * f * 100) / 100); marginInput.value = String(tk.margin); refresh(); } },
    })));

  const summary = el('div');
  const problem = el('div');
  const risk = el('div');
  const submit = el('button', { class: 'wp-btn block', type: 'button' });

  function refresh() {
    levLabel.textContent = lev(tk.leverage);
    const q = quoteOrder({ indexId: ix.id, side: tk.side, margin: tk.margin, leverage: tk.leverage });
    summary.replaceChildren(kv([
      { k: 'Notional', v: usdg(q.notional) },
      { k: 'Entry', v: q.entry === null ? NA_TEXT : auto(q.entry) },
      { k: 'Liquidation', v: q.liq === null ? NA_TEXT : auto(q.liq), cls: 'down' },
      { k: `Fee ${pct(VENUE.takerFee * 100, { sign: false, d: 3 })}`, v: usdg(q.fee) },
      { k: 'Of it, to the creator', v: usdg(q.creatorFee), line: true },
      { k: 'Total to lock up', v: usdg(q.margin + q.fee) },
    ]));
    problem.replaceChildren(q.ok ? '' : el('div', { class: 'wp-error', text: q.error }));
    // The warning speaks about the leverage selected right now, not the
    // maximum: a warning that does not describe your order warns of nothing.
    risk.replaceChildren(note(
      `At ${lev(tk.leverage)}, a <strong>${num(100 / tk.leverage, 1)}%</strong> move against you takes the whole margin. ` +
      `The engine applies the liquidation on its own; you do not need the screen open.`, 'risk'));
    submit.textContent = `${tk.side === 'long' ? 'Open long' : 'Open short'} ${lev(tk.leverage)}`;
    submit.className = `wp-btn block ${tk.side === 'long' ? 'long' : 'short'}`;
    submit.disabled = !q.ok;
  }
  submit.addEventListener('click', () => {
    const r = openPosition({ indexId: ix.id, side: tk.side, margin: tk.margin, leverage: tk.leverage });
    toast(r.ok ? `${tk.side === 'long' ? 'Long' : 'Short'} opened on ${ix.symbol} for ${usdg(r.position.notional)}` : r.error, r.ok ? 'good' : 'bad');
  });
  refresh();

  return card({
    title: 'Trade', note: value === null ? 'No value' : `Mark ${auto(value)}`,
    body: el('div', { class: 'wp-grid', style: { gap: '13px' } }, [
      sideSeg,
      el('div', { class: 'wp-field' }, [
        el('label', { text: `Margin (${usdg(state.wallet.balance)} available)` }),
        el('div', { class: 'wp-input-unit' }, [marginInput, el('span', { class: 'wp-unit', text: VENUE.settle })]),
        quick,
      ]),
      el('div', { class: 'wp-field' }, [
        el('label', {}, [el('span', { text: 'Leverage ' }), levLabel]),
        levInput,
        el('div', { class: 'wp-range-marks' }, ['1x', '2x', '3x', '4x', '5x'].map(x => el('span', { text: x }))),
      ]),
      summary,
      problem,
      submit,
      risk,
    ]),
  });
}

/* ============================ create an index ============================ */

let draft = null;

function createView(seedId) {
  if (!draft) draft = { symbol: '', name: '', note: '', legs: [] };
  if (seedId && getAsset(seedId) && !draft.legs.some(l => l.id === seedId) && draft.legs.length < VENUE.maxLegs) {
    draft.legs.push({ id: seedId, weight: 0 });
    equalise();
  }

  const wrap = el('div', { class: 'wp-grid' });
  const legsBox = el('div', { class: 'wp-grid', style: { gap: '8px' } });
  const pickerBox = el('div', { class: 'wp-picker' });
  const preview = el('div', { class: 'wp-grid' });
  const totalLine = el('div', { class: 'wp-hint' });
  let pickerTab = 'stock';
  let pickerQuery = '';

  function equalise() {
    const n = draft.legs.length;
    if (!n) return;
    const each = Math.floor((100 / n) * 10) / 10;
    draft.legs.forEach((l, i) => { l.weight = i === n - 1 ? Math.round((100 - each * (n - 1)) * 10) / 10 : each; });
  }
  const total = () => draft.legs.reduce((s, l) => s + (Number(l.weight) || 0), 0);

  function addLeg(id) {
    if (draft.legs.length >= VENUE.maxLegs) return toast(`An index holds at most ${VENUE.maxLegs} assets.`, 'bad');
    if (draft.legs.some(l => l.id === id)) return;
    draft.legs.push({ id, weight: 0 });
    equalise();
    renderAll();
  }
  function removeLeg(id) {
    draft.legs = draft.legs.filter(l => l.id !== id);
    equalise();
    renderAll();
  }

  const symbolInput = el('input', {
    class: 'wp-input num', maxlength: '12', placeholder: 'MYBASKET', value: draft.symbol,
    on: { input: () => { draft.symbol = symbolInput.value = symbolInput.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); renderPreview(); } },
  });
  const nameInput = el('input', {
    class: 'wp-input', maxlength: '48', placeholder: 'My metals basket', value: draft.name,
    on: { input: () => { draft.name = nameInput.value; renderPreview(); } },
  });
  const noteInput = el('input', {
    class: 'wp-input', maxlength: '120', placeholder: 'What idea this basket expresses (optional)', value: draft.note,
    on: { input: () => { draft.note = noteInput.value; } },
  });

  function renderLegs() {
    legsBox.replaceChildren(...(draft.legs.length ? draft.legs.map(l => {
      const a = getAsset(l.id);
      const w = el('input', {
        class: 'wp-input num wp-leg-w', type: 'number', min: '0.1', max: '100', step: '0.1', value: String(l.weight),
        on: { input: () => { l.weight = Number(w.value); renderPreview(); } },
      });
      return el('div', { class: 'wp-leg' }, [
        markEl(a, 30),
        el('div', { style: { flex: '1', minWidth: '0' } }, [
          el('div', { class: 'wp-ident-name', text: a.short }),
          el('div', { class: 'wp-ident-sub' }, [symPill(a), el('span', { text: CLASSES[a.class]?.label })]),
        ]),
        w,
        el('span', { class: 'dim', text: '%' }),
        el('button', { class: 'wp-leg-x', type: 'button', text: '×', title: `Remove ${a.short}`, on: { click: () => removeLeg(l.id) } }),
      ]);
    }) : [note(`Pick between ${VENUE.minLegs} and ${VENUE.maxLegs} assets from the list below. You can mix stocks, metals, crypto and ETFs in the same basket.`)]));
    const tt = total();
    totalLine.className = `wp-hint ${Math.abs(tt - 100) > 0.01 ? 'wp-error' : ''}`;
    totalLine.textContent = `${draft.legs.length} of ${VENUE.maxLegs} assets · weights add up to ${num(tt, 1)}%` +
      (Math.abs(tt - 100) > 0.01 ? ', and they have to add up to 100%' : '');
  }

  function renderPicker() {
    const q = pickerQuery.trim().toLowerCase();
    const list = byClass(pickerTab).filter(a =>
      !q || a.short.toLowerCase().includes(q) || a.symbol.toLowerCase().includes(q) || (a.aliases || []).some(x => x.includes(q)));
    pickerBox.replaceChildren(...(list.length ? list.map(a => {
      const on = draft.legs.some(l => l.id === a.id);
      return el('button', {
        class: `wp-chip ${on ? 'is-on' : ''}`, type: 'button',
        disabled: !on && draft.legs.length >= VENUE.maxLegs,
        on: { click: () => (on ? removeLeg(a.id) : addLeg(a.id)) },
      }, [markEl(a, 20), el('span', { text: a.short }), el('span', { class: 'dim num', style: { fontSize: '11px' }, text: a.symbol })]);
    }) : [el('span', { class: 'wp-hint', text: 'Nothing matches that search in this class.' })]));
  }

  function renderPreview() {
    const check = validateBasket(draft);
    const legs = draft.legs.map(l => ({ ...l, asset: getAsset(l.id) })).filter(l => l.asset);
    const kids = [];

    if (legs.length >= 2 && Math.abs(total() - 100) < 0.01) {
      // Backcast: what this basket, at these weights, would have done had it
      // listed thirty days ago. The simulator says so, not the market.
      const from = Date.now() - 30 * DAY;
      const refs = {};

    } else {
      kids.push(emptyState({ title: 'No basket to draw yet', text: `Add at least ${VENUE.minLegs} assets and leave the weights adding up to 100%.` }));

/* ============================ portfolio ============================ */

function portfolioView() {
  const t = Date.now();
  const acc = accountSummary(t);

  const history = state.history.slice(0, 40).map(h => {
    const ix = getIndex(h.indexId);
    const legs = ix ? indexLegs(ix) : [];

      stat('Available', usdg(acc.balance)),
      stat('Committed margin', usdg(acc.marginUsed), { sub: `${acc.open} ${acc.open === 1 ? 'position' : 'positions'}` }),
      stat('Open result', usdg(acc.unrealised, { sign: true }), { cls: dir(acc.unrealised), sub: `Realised ${usdg(acc.realised, { sign: true })}` }),
    ]),
    card({
      title: 'Open positions', tight: true,
      note: 'Funding accrues over time and is already netted off the result',
      body: positionsTable(t) || emptyState({
        title: 'No open positions',
        text: "Open one from any index's page.",
        action: primaryBtn('Go to the market', () => go('#/market'), 'ghost'),

      title: 'History', tight: true, note: history.length ? `${state.history.length} closed ${state.history.length === 1 ? 'trade' : 'trades'}` : null,

/* ============================ my indices ============================ */

function creatorView() {
  const t = Date.now();
  const mine = myIndices();
  const totalPending = mine.reduce((s, ix) => s + pendingFees(ix), 0);
  const totalEarned = mine.reduce((s, ix) => s + ix.feesAccrued, 0);

  const rows = mine.map(ix => {
    const legs = indexLegs(ix);
    const oi = openInterest(ix.id);
    const due = pendingFees(ix);
    return el('tr', {}, [
      el('td', { class: 'wide clickable', on: { click: () => go(`#/i/${ix.id}`) } }, [indexIdent(ix, legs)]),
      el('td', { class: 'num', text: auto(indexValue(ix, t)) }),
      el('td', {}, [changePill(indexChange(ix, 24, t))]),
      el('td', { class: 'num', text: oi.total ? usdg(oi.total) : '—' }),
      el('td', { class: 'num', text: usdg(ix.feesAccrued) }),
      el('td', { class: `num ${due > 0 ? 'up' : 'dim'}`, text: usdg(due) }),
      el('td', { class: 'dim', text: ago(ix.listedAt) }),
      el('td', {}, [el('div', { style: { display: 'flex', gap: '6px', justifyContent: 'flex-end' } }, [

          class: 'wp-btn sm', type: 'button', text: 'Claim', disabled: due <= 0,
          on: { click: () => { const r = claimFees(ix.id); toast(r.ok ? `Claimed ${usdg(r.claimed)}` : r.error, r.ok ? 'good' : 'bad'); } },
        }),
        el('button', {
          class: 'wp-btn sm ghost', type: 'button', text: 'Delist',
          on: { click: () => { const r = delistIndex(ix.id); toast(r.ok ? 'Index delisted' : r.error, r.ok ? '' : 'bad'); } },
        }),
      ])]),
    ]);
  });

  return frag([
    head('My indices', `What you have listed yourself. Of every fee a trade on one of your indices pays, ${Math.round(VENUE.creatorShare * 100)}% accrues here until you claim it.`, [
      primaryBtn('Create index', () => go('#/create')),
    ]),
    el('div', { class: 'wp-grid cols-3' }, [
      stat('Indices listed', String(mine.length)),
      stat('Fees generated', usdg(totalEarned), { sub: `${Math.round(VENUE.creatorShare * 100)}% of every trade` }),
      stat('Pending to claim', usdg(totalPending), { cls: totalPending > 0 ? 'up' : '' }),
    ]),
    card({
      title: 'Your indices', tight: true,
      body: rows.length
        ? table(['Index', 'Value', '24 h', 'Open interest', 'Generated', 'Pending', 'Listed', ''], rows)
        : emptyState({
            title: 'You have not listed an index yet',
            text: `Bundle ${VENUE.minLegs} to ${VENUE.maxLegs} assets, give it a symbol and list it. From that moment you earn a share of everything traded on it.`,
            action: primaryBtn('Create my first index', () => go('#/create')),

    }),
    card({
      title: 'How a fee is split',
      body: kv([
        { k: 'Fee per trade', v: pct(VENUE.takerFee * 100, { sign: false, d: 3 }) + ' of notional' },
        { k: 'Charged', v: 'On opening and on closing' },
        { k: "To the index's creator", v: pct(VENUE.creatorShare * 100, { sign: false, d: 0 }) },
        { k: 'Kept by the protocol', v: pct((1 - VENUE.creatorShare) * 100, { sign: false, d: 0 }) },
        { k: 'On a liquidation', v: 'No closing fee', line: true },
      ]),
    }),
  ]);
}

/* ============================ account ============================ */

function confirmReset() {
  const acc = accountSummary();
  const ok = window.confirm(
    `Resetting the account deletes your positions, your history and the indices you have listed, ` +
    `and returns the balance to ${VENUE.openingBalance} ${VENUE.settle}.\n\n` +
    `Right now you have ${acc.open} open positions and ${usdg(acc.equity)} of equity.\n\nGo ahead?`);
  if (!ok) return;
  resetAll();
  toast('Account reset');
  go('#/');
}
