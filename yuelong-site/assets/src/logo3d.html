<!doctype html>
<html><head><meta charset="utf-8">
<!-- The Yuelong mark in 3D: a thick open ring of clear beige glass whose ends meet a smaller ring
     sitting in its opening, backlit by warm haze. Open over http; ?bg=none for a transparent
     background, ?w=&h= size, ?s= scale, ?ry=&rx=&rz= pose (the logo uses ry=0.5 rx=0.25 rz=-0.3).
     Screenshot once window.ready is true. -->
<style>
  html,body{margin:0;background:#000}
  #stage{position:relative;width:1024px;height:1024px;overflow:hidden;
    background:radial-gradient(ellipse 70% 65% at 50% 42%,#2a2a2a 0%,#141414 55%,#070707 100%)}
  canvas{position:absolute;inset:0}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
</head><body><div id="stage"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1024), H = +(P.get('h') || 1024);
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
if (P.get('bg') === 'none') { stage.style.background = 'transparent'; document.documentElement.style.background = document.body.style.background = 'transparent'; }
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.55;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, W / H, 1, 2000);
camera.position.set(0, 0, 560);

// Soft studio light plus a dark grey gradient backdrop that the glass refracts.
const room = new RoomEnvironment();
const bar = (w, h, x, y, z, ry, rx, k, col = 0xffffff) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0); room.add(m);
};
bar(0.35, 7, -4.5, 1, 2, Math.PI / 2, 0, 55);            // tall strip left: long white edge lines
bar(0.3, 7, 4.5, 1, -1, -Math.PI / 2, 0, 50, 0xffc98a);  // warm strip right
bar(7, 0.35, 0, 5, 1, 0, Math.PI / 2, 45);               // top bar
bar(6, 2, 0, -4.5, 0, 0, -Math.PI / 2, 18, 0xc27a34);
bar(2, 5, 0, 0, -4.5, 0, 0, 10, 0xb8753a);   // warm panel behind     // bronze bounce below
const envTex = pmrem.fromScene(room, 0.01).texture;
scene.environment = envTex;
const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
const g2 = cv.getContext('2d');
g2.fillStyle = '#000'; g2.fillRect(0, 0, 512, 512);
const blob = (x, y, r, stops) => { const g = g2.createRadialGradient(x, y, 0, x, y, r); stops.forEach(([o, c]) => g.addColorStop(o, c)); g2.fillStyle = g; g2.fillRect(0, 0, 512, 512); };
g2.globalCompositeOperation = 'lighter';
blob(60, 470, 420, [[0, '#f0d6aa'], [0.25, '#b08a5a'], [0.55, '#4a3824'], [1, 'rgba(0,0,0,0)']]);   // strong haze, lower left
blob(480, 420, 300, [[0, '#9c7c52'], [0.4, '#3a2c1c'], [1, 'rgba(0,0,0,0)']]);                     // softer haze, lower right
blob(40, 60, 200, [[0, '#3a2e20'], [1, 'rgba(0,0,0,0)']]);                                        // faint top left
const bgTex = new THREE.CanvasTexture(cv); bgTex.colorSpace = THREE.SRGBColorSpace;
const back = new THREE.Mesh(new THREE.PlaneGeometry(1500, 1500), new THREE.MeshBasicMaterial({ map: bgTex, toneMapped: false }));
back.position.z = -700;
if (P.get('bg') !== 'none') scene.add(back);
const warm = new THREE.DirectionalLight(0xffc98f, 3.2); warm.position.set(-300, 300, 200); scene.add(warm);
const cool = new THREE.DirectionalLight(0xffffff, 1.2); cool.position.set(300, -100, 300); scene.add(cool);
// The mark: two open glass rings, one inside the other, the pearl's orbit. Each is an annulus
// sector extruded with rounded edges; the outer opens to the right, the inner turns the other way.
const ring = (R, r, a0, a1, depth) => {
  const sh = new THREE.Shape();
  sh.absarc(0, 0, R, a0, a1, false);
  sh.absarc(0, 0, r, a1, a0, true);
  sh.closePath();
  return new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: 1.6, bevelSize: 1.4, bevelSegments: 6, curveSegments: 200 });
};
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xF7EBD8, metalness: 0, roughness: 0.06, transmission: 1, thickness: 30, ior: 1.46,
  clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 2.6, specularIntensity: 1, dispersion: 1.2, iridescence: 0.08,
  attenuationColor: new THREE.Color(0xDDBA86), attenuationDistance: 30, side: THREE.DoubleSide,
});
const D = Math.PI / 180;
// outer C: a thick band open to the right; its ends land on the inner ring
const outer = new THREE.Mesh(ring(112, 66, 58 * D, 302 * D, 34), glass);
// inner ring: sits in the opening, cut where the C meets it
const inner = new THREE.Mesh(ring(60, 36, 188 * D, 532 * D, 34), glass);
inner.position.set(62, 0, 0);
const mark = new THREE.Group(); mark.add(outer); mark.add(inner);
{ const bb = new THREE.Box3().setFromObject(mark), c = bb.getCenter(new THREE.Vector3()); mark.children.forEach((m) => m.position.sub(c)); }
scene.add(mark);
window.pose = (ry = -0.5, rx = 0.32, rz = 0.08, scale = 1) => {
  mark.rotation.set(rx, ry, rz); mark.scale.setScalar(scale); renderer.render(scene, camera); return true;
};
window.pose(+(P.get('ry') ?? -0.7), +(P.get('rx') ?? 0.45), +(P.get('rz') ?? 0.12), +(P.get('s') || 1));
window.ready = true;
</script></body></html>
