<!doctype html>
<!-- X profile pictures in the site's colours. Render: 1000x1000, ?v=serif|sans|ring -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<style>
  html, body { margin: 0; background: #000; }
  .p { position: relative; width: 1000px; height: 1000px; overflow: hidden; background:
       radial-gradient(circle at 50% 46%, #1c1812 0%, #0b0a08 45%, #000 75%); display: grid; place-items: center; }
  .p::before { content: ""; position: absolute; inset: 0; opacity: .5;
       background: radial-gradient(circle at 50% 110%, rgba(217,195,160,.22), rgba(0,0,0,0) 55%); }
  /* serif: an italic Y in beige with a soft glow */
  .serif { font: italic 400 700px/1 "Instrument Serif", serif; color: #EFE3CD; transform: translate(-8px, -18px); padding: 0 90px;
           background: linear-gradient(180deg, #F6EDDD 0%, #D9C3A0 55%, #A48B67 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
           filter: drop-shadow(0 0 40px rgba(217,195,160,.35)); }
  /* sans: the wordmark's Y, white, with the beige dot the site uses as its accent */
  .sans { position: relative; font: 600 640px/1 "Inter", sans-serif; letter-spacing: -0.06em; color: #fff; transform: translate(-6px, -24px); }
  .sans i { position: absolute; left: 50%; top: 13%; width: 70px; height: 70px; margin-left: -29px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #F6EDDD, #D9C3A0 55%, #A48B67); box-shadow: 0 0 40px rgba(217,195,160,.6); }
  /* ring: a thin beige orbit with the pearl on it, the Y inside */
  .ring { position: relative; width: 760px; height: 760px; border-radius: 50%; border: 6px solid rgba(217,195,160,.55); display: grid; place-items: center; }
  .ring b { font: italic 400 520px/1 "Instrument Serif", serif; color: #EFE3CD; transform: translate(-6px, -14px); font-weight: 400; }
  .ring i { position: absolute; left: 50%; top: -30px; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #FFF6E8, #D9C3A0 55%, #8C7654); box-shadow: 0 0 36px rgba(217,195,160,.7); }
</style></head>
<body><div class="p" id="p"></div>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'serif';
  document.getElementById('p').innerHTML = {
    serif: '<div class="serif">Y</div>',
    sans: '<div class="sans">Y<i></i></div>',
    ring: '<div class="ring"><b>Y</b><i></i></div>',
  }[v];
</script></body></html>
