<!doctype html>
<!-- The X (Twitter) header, 1500×500. Render: node assets/src/render-header.mjs
     Text stays in the middle band: X covers the bottom-left with the profile picture
     and crops the top and bottom on phones. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<style>
  html, body { margin: 0; }
  .h { position: relative; width: 1500px; height: 500px; overflow: hidden; background: #000; font-family: "Inter", sans-serif; }
  .h img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; }
  .h::before { content: ""; position: absolute; inset: 0; background:
    radial-gradient(ellipse 58% 70% at 50% 48%, rgba(0,0,0,.52), rgba(0,0,0,0) 72%),
    linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,0) 35%, rgba(0,0,0,0) 70%, rgba(0,0,0,.35)); }
  .c { position: absolute; left: 0; right: 0; top: 96px; display: flex; flex-direction: column; align-items: center; text-align: center; color: #fff; }
  .k { padding: 7px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.45); background: rgba(0,0,0,.28);
       font: 500 15px/1.2 "JetBrains Mono", monospace; letter-spacing: .04em; }
  .w { margin-top: 20px; font: 600 118px/0.95 "Inter", sans-serif; letter-spacing: -0.055em; text-shadow: 0 4px 40px rgba(0,0,0,.45); }
  .t { margin-top: 14px; font: 400 44px/1 "Instrument Serif", serif; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
  .t em { font-style: italic; color: #EFE3CD; }
  .u { position: absolute; right: 44px; bottom: 34px; font: 500 16px/1 "JetBrains Mono", monospace; color: rgba(255,255,255,.85); letter-spacing: .02em; }
  .u b { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #D9C3A0; margin-right: 9px; vertical-align: 2px; }
</style></head>
<body>
  <div class="h">
    <img src="../great-wall.webp" alt="">
    <div class="c">
      <span class="k">Launch coins paired with TAO · Bittensor EVM</span>
      <div class="w">Yuelong</div>
      <div class="t">Put a price on <em>conviction</em>.</div>
    </div>
    <div class="u"><b></b>yuelong.xyz</div>
  </div>
</body></html>
